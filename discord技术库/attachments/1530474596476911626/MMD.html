ext-align:center;color:#536270;background:linear-gradient(145deg,#f7f9fa,#e3e9ee)}.preview-lock strong{font-size:17px;color:#283746}.preview-lock span{margin-top:8px}.preview-lock-bar{width:min(240px,70vw);height:7px;margin:18px auto 0;overflow:hidden;border-radius:4px;background:#cbd4dc}.preview-lock-fill{height:100%;background:linear-gradient(90deg,#4f86b3,#8db8d9)}.preview-controls{align-self:center}.preview-name{font-size:17px;font-weight:750}.preview-stats{color:var(--muted);font-size:12px;margin-top:5px}.preview-nav{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}.preview-count{min-width:68px;text-align:center;color:var(--muted)}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:5px;background:#fff}

<style>

<body>
<header class="topbar">
  <div class="brand">MMD 状态栏图库编辑器</div><div class="save-state" id="saveState">已保存</div><div class="top-spacer"></div>
</header>
<nav class="tabs"><button class="tab active" data-view="status">状态栏设置</button><button class="tab" data-view="gallery">图片图库</button><button class="tab" data-view="preview">效果预览</button><button class="tab" data-view="export">导出</button></nav>
<main>
  <section class="view active" id="view-status"><div class="band"><div class="band-inner status-layout">
    <div class="field-panel"><div class="section-head"><div><h2>角色栏项目</h2><p class="section-copy">固定 13 项，只修改名称</p></div></div><div class="field-list" id="fieldList"></div></div>
    <div class="setting-panel">
      <div class="subhead">图鉴解锁</div><div class="field"><label for="galleryProgressField">图鉴解锁词条</label><select class="select" id="galleryProgressField"></select></div>
      <div class="subhead">侧栏按钮位置</div><div class="position-grid">
        <div class="position-card"><strong>美化设置</strong><div class="position-controls"><select class="select" id="beautifySide"><option value="left">左侧</option><option value="right">右侧</option></select><span class="position-label">高度</span><input class="range" id="beautifyTop" type="range" min="10" max="90"><output class="range-value" id="beautifyTopValue"></output></div></div>
        <div class="position-card"><strong>角色图鉴</strong><div class="position-controls"><select class="select" id="gallerySide"><option value="left">左侧</option><option value="right">右侧</option></select><span class="position-label">高度</span><input class="range" id="galleryTop" type="range" min="10" max="90"><output class="range-value" id="galleryTopValue"></output></div></div>
      </div>
    </div>
  </div></div></section>
  <section class="view" id="view-gallery"><div class="fallback-band"><div class="band-inner"><div class="fallback-head"><div><h2>备用角色图库</h2><p class="section-copy">备用图库中的图片不会显示在图鉴侧边栏。未录入图鉴的角色会从这里随机选取图片；备用图库为空时，会从所有角色当前已解锁的图鉴图片中随机选取一张。最多放置 10 张图片，使用 HTTP/HTTPS 图片 URL。</p></div><div class="pane-spacer"></div><span class="fallback-count" id="fallbackCount">0 / 10</span><button class="icon-btn" id="addFallbackImage" title="添加备用图片">＋</button></div><div class="fallback-list" id="fallbackList"></div></div></div><div class="gallery-layout"><aside class="role-rail"><div class="rail-tools"><div class="rail-title">角色图鉴<span>（侧边栏展示）</span></div><button class="icon-btn" id="addRole" title="新增角色">＋</button></div><div class="role-list" id="roleList"></div></aside><section class="editor-pane"><div id="roleEditor"></div></section></div></section>
  <section class="view" id="view-preview"><div class="band"><div class="effect-shell"><div class="preview-toolbar"><h2>MMD 效果预览</h2><span class="preview-state" id="previewState">正在准备</span><div class="pane-spacer"></div><button class="icon-btn" id="refreshPreview" title="立即刷新">↻</button></div><iframe class="effect-frame" id="previewFrame" title="MMD 正文、状态栏与双侧栏效果预览" sandbox="allow-scripts allow-same-origin" data-preview-revision="0"></iframe></div></div></section>
  <section class="view" id="view-export"><div class="band"><div class="band-inner"><div class="section-head"><h2>导出检查</h2></div><div class="metrics" id="metrics"></div></div></div><div class="band"><div class="band-inner"><div class="section-head"><h2>检查结果</h2></div><div class="audit" id="audit"></div></div></div><div class="band"><div class="band-inner"><div class="section-head"><h2>下载</h2></div><div class="export-actions"><button class="btn primary" id="exportRegex">下载 MMD 正则</button><button class="btn" id="exportWorldbook">下载 MMD 世界书</button><button class="btn" id="exportCard">下载 v2 角色卡 PNG</button></div></div></div></section>
</main>
<div class="toast hidden" id="toast"></div>

function embedV2Card(pngBytes,card){const signature=pngBytes.slice(0,8),parts=[signature],payload=new TextEncoder().encode('chara\0'+utf8b64(JSON.stringify(card))),textChunk=pngChunk('tEXt',payload);let offset=8,inserted=false;while(offset<pngBytes.length){const length=((pngBytes[offset]<<24)>>>0)+(pngBytes[offset+1]<<16)+(pngBytes[offset+2]<<8)+pngBytes[offset+3],type=String.fromCharCode(...pngBytes.slice(offset+4,offset+8)),end=offset+12+length,chunk=pngBytes.slice(offset,end),keyword=type==='tEXt'?new TextDecoder('latin1').decode(pngBytes.slice(offset+8,end-4)).split('\0',1)[0]:'';if(type==='tEXt'&&(keyword==='chara'||keyword==='ccv3')){offset=end;continue}if(type==='IDAT'&&!inserted){parts.push(textChunk);inserted=true}parts.push(chunk);offset=end}if(!inserted)throw new Error('PNG 缺少 IDAT 数据块');return new Blob(parts,{type:'image/png'})}
function makeCardCover(){return new Promise((resolve,reject)=>{const canvas=document.createElement('canvas');canvas.width=512;canvas.height=768;const ctx=canvas.getContext('2d');ctx.fillStyle='#f7f9fb';ctx.fillRect(0,0,512,768);ctx.fillStyle='#111827';ctx.fillRect(0,0,512,126);ctx.fillStyle='#2f7f84';ctx.fillRect(0,126,512,8);ctx.fillStyle='#b33a4a';ctx.fillRect(392,126,120,8);ctx.fillStyle='#ffffff';ctx.font='700 31px Microsoft YaHei, sans-serif';ctx.fillText('MMD 角色图库',38,64);ctx.fillStyle='#a9c7ca';ctx.font='600 15px Segoe UI, sans-serif';ctx.fillText('V2 CHARACTER CARD',40,94);ctx.strokeStyle='#d4dbe2';ctx.lineWidth=2;ctx.strokeRect(38,178,436,390);ctx.fillStyle='#e9eef2';for(let y=208;y<548;y+=42)ctx.fillRect(66,y,380,1);ctx.fillStyle='#111827';ctx.font='700 22px Microsoft YaHei, sans-serif';ctx.fillText('状态栏 · 美化 · 角色图鉴',64,230);ctx.fillStyle='#52616d';ctx.font='16px Microsoft YaHei, sans-serif';ctx.fillText(`图库角色  ${project.gallery.length}`,64,292);ctx.fillText('固定项目  13',64,338);ctx.fillText(`解锁词条  ${progressLabel()}`,64,384);ctx.fillText(`备用图片  ${project.fallbackGallery.filter(Boolean).length}`,64,430);const colors=['#2f7f84','#b33a4a','#344a5f'];colors.forEach((color,index)=>{ctx.fillStyle=color;ctx.fillRect(64+index*126,462,96,74);ctx.fillStyle='#ffffff';ctx.font='700 25px Segoe UI, sans-serif';ctx.fillText(String(index+1),102+index*126,508)});ctx.fillStyle='#52616d';ctx.font='14px Microsoft YaHei, sans-serif';ctx.fillText('内嵌世界书、正则与 URL 图库数据',64,618);ctx.fillStyle='#111827';ctx.fillRect(38,672,436,2);ctx.fillStyle='#2f7f84';ctx.font='700 15px Segoe UI, sans-serif';ctx.fillText('MMD STATUS GALLERY EDITOR',38,710);canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('无法生成角色卡图片')),'image/png')})}

function renderExport(){const pack=makeRegexPack(),rules=pack.regex_scripts,max=Math.max(...rules.map(rule=>rule.replaceString.length),0),names=project.gallery.map(role=>role.name.trim()),fields=project.status.roleFields,progressIndex=roleConfig().progressIndex,fallback=project.fallbackGallery.map(url=>url.trim()).filter(Boolean);document.getElementById('metrics').innerHTML=`<div class="metric"><strong>${project.gallery.length}</strong><span>图鉴角色</span></div><div class="metric"><strong>${fallback.length}</strong><span>备用图片</span></div><div class="metric"><strong>${fields.length}</strong><span>固定角色栏项目</span></div><div class="metric"><strong>${rules.length}</strong><span>MMD 正则</span></div><div class="metric"><strong>${max}</strong><span>最长替换字符</span></div>`;const checks=[['固定 13 个项目名称有效',fields.length===13&&fields.every(field=>field.label.trim())],['角色名固定第 1 项、解锁词条选择有效',fields[0]?.id==='name'&&progressIndex>0&&progressIndex<13],['角色名唯一且不为空',names.every(Boolean)&&new Set(names).size===names.length],['每名角色固定三图位',project.gallery.every(role=>role.images.length===2)],['图鉴图片使用 HTTP/HTTPS URL',project.gallery.every(role=>(!role.cover||/^https?:\/\//i.test(role.cover))&&role.images.every(item=>!item.url||/^https?:\/\//i.test(item.url)))],['备用图片不超过 10 张',project.fallbackGallery.length<=10],['备用图片使用 HTTP/HTTPS URL',fallback.every(url=>/^https?:\/\//i.test(url))],['正则条数 ≤ 130',rules.length<=130],['findRegex ≤ 1000',rules.every(rule=>rule.findRegex.length<=1000)],['replaceString ≤ 20000',rules.every(rule=>rule.replaceString.length<=20000)],['v2 角色卡格式',makeCard().spec==='chara_card_v2'&&!('group_only_greetings'in makeCard().data)]];document.getElementById('audit').innerHTML=checks.map(([name,ok])=>`<div class="audit-row"><b>${name}</b><span class="${ok?'ok':'warn'}">${ok?'通过':'需修正'}</span></div>`).join('')}
function compileFind(source){source=String(source||'');if(source.startsWith('/')){let end=-1;for(let i=source.length-1;i>0;i--){if(source[i]!=='/')continue;let slashes=0;for(let j=i-1;j>=0&&source[j]==='\\';j--)slashes+=1;if(slashes%2===0){end=i;break}}if(end>0)return new RegExp(source.slice(1,end),source.slice(end+1))}return new RegExp(source.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g')}

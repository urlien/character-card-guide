<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图按钮生成器 - 编辑器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #1a1a2e;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        #app {
            display: flex;
            height: 100vh;
        }

        /* ===== 左侧工具栏 ===== */
        .toolbar {
            width: 300px;
            min-width: 300px;
            background: #16213e;
            border-right: 1px solid #0f3460;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar-header {
            padding: 16px;
            background: #0f3460;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 2px;
        }

        .toolbar-section {
            padding: 12px 16px;
            border-bottom: 1px solid #0f3460;
        }

        .toolbar-section h3 {
            font-size: 13px;
            color: #a0a0c0;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            border: 1px solid #0f3460;
            border-radius: 6px;
            background: #1a1a2e;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn:hover { background: #0f3460; border-color: #e94560; }
        .btn.active { background: #e94560; border-color: #e94560; }

        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

        /* 热区列表 */
        .hotspot-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .hotspot-list::-webkit-scrollbar { width: 6px; }
        .hotspot-list::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }

        .hotspot-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            background: #1a1a2e;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            gap: 8px;
        }

        .hotspot-item:hover { border-color: #0f3460; }
        .hotspot-item.selected { border-color: #e94560; background: rgba(233, 69, 96, 0.1); }

        .hotspot-item .name {
            flex: 1;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .hotspot-item .coords {
            font-size: 11px;
            color: #666;
            white-space: nowrap;
        }

        .hotspot-item .delete-btn {
            width: 20px; height: 20px;
            border: none; background: transparent;
            color: #666; cursor: pointer; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; flex-shrink: 0;
        }

        .hotspot-item .delete-btn:hover { background: #e94560; color: white; }

        /* 属性面板 */
        .property-panel {
            padding: 12px 16px;
            border-top: 1px solid #0f3460;
            background: #0d1b36;
            display: none;
        }

        .property-panel.visible { display: block; }

        .property-panel h3 {
            font-size: 13px;
            color: #a0a0c0;
            margin-bottom: 10px;
        }

        .prop-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            gap: 8px;
        }

        .prop-row label {
            width: 50px;
            font-size: 12px;
            color: #888;
            flex-shrink: 0;
        }

        .prop-row input {
            flex: 1;
            padding: 6px 10px;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 13px;
            outline: none;
        }

        .prop-row input:focus { border-color: #e94560; }

        /* ===== 右侧地图区域 ===== */
        .map-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .map-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            gap: 12px;
            flex-wrap: wrap;
        }

        .map-topbar .info {
            font-size: 12px;
            color: #888;
        }

        .map-viewport {
            flex: 1;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .map-container {
            position: relative;
            display: inline-block;
            min-width: 600px;
            min-height: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
            background: #0d1b36;
        }

        .map-image {
            display: block;
            max-width: 100%;
            height: auto;
            user-select: none;
            -webkit-user-drag: none;
        }

        .map-image[src=""], .map-image:not([src]) {
            display: none;
        }

        /* 热区 */
        .hotspot {
            position: absolute;
            border: 2px dashed rgba(255, 215, 0, 0.6);
            background-color: rgba(255, 215, 0, 0.1);
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
            user-select: none;
            transition: background-color 0.15s, box-shadow 0.15s;
        }

        .hotspot:hover {
            background-color: rgba(255, 215, 0, 0.25);
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
        }

        .hotspot.selected {
            border-color: #e94560;
            background-color: rgba(233, 69, 96, 0.15);
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.4);
            z-index: 100 !important;
        }

        .hotspot-label {
            font-size: 12px;
            color: white;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            pointer-events: none;
            white-space: nowrap;
            padding: 2px 6px;
            background: rgba(0,0,0,0.4);
            border-radius: 3px;
        }

        /* 调整大小手柄 */
        .resize-handle {
            position: absolute;
            width: 10px; height: 10px;
            background: #e94560;
            border: 1px solid white;
            border-radius: 2px;
        }

        .resize-handle.tl { top: -5px; left: -5px; cursor: nwse-resize; }
        .resize-handle.tr { top: -5px; right: -5px; cursor: nesw-resize; }
        .resize-handle.bl { bottom: -5px; left: -5px; cursor: nesw-resize; }
        .resize-handle.br { bottom: -5px; right: -5px; cursor: nwse-resize; }

        /* 旋转手柄 */
        .rotate-handle {
            position: absolute;
            width: 14px; height: 14px;
            background: #4ecdc4;
            border: 2px solid white;
            border-radius: 50%;
            top: -30px; left: 50%;
            transform: translateX(-50%);
            cursor: grab;
            z-index: 11;
        }

        .rotate-handle:active { cursor: grabbing; }

        .rotate-line {
            position: absolute;
            width: 1px;
            height: 25px;
            background: rgba(78, 205, 196, 0.6);
            top: -25px; left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }

        /* ===== 热区按钮风格 ===== */

        /* 风格1: 毛玻璃药丸 (项目默认 choice-chip 风格) */
        .hotspot-btn.style-glass {
            background: rgba(192, 132, 252, 0.12);
            border: 1px solid rgba(192, 132, 252, 0.25);
            color: rgba(192, 132, 252, 0.9);
            border-radius: 50px;
            font-size: 13px;
            padding: 4px 14px;
            backdrop-filter: blur(8px);
            text-shadow: none;
            transition: all 0.15s;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
        }

        .hotspot-btn.style-glass:hover {
            background: rgba(192, 132, 252, 0.22);
            border-color: rgba(192, 132, 252, 0.4);
            color: #c084fc;
            transform: translateY(-1px);
        }

        /* 风格2: 渐变发光 (项目 send-btn / primary 风格) */
        .hotspot-btn.style-gradient {
            background: linear-gradient(135deg, #ff6b9d, #c084fc);
            border: none;
            color: #ffffff;
            border-radius: 50px;
            font-size: 13px;
            padding: 5px 16px;
            box-shadow: 0 4px 12px rgba(255, 107, 157, 0.3);
            text-shadow: none;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
        }

        .hotspot-btn.style-gradient:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
        }

        /* 风格3: 古典卷轴 */
        .hotspot-btn.style-scroll {
            background: linear-gradient(180deg, #f5e6c8 0%, #e8d5a8 100%);
            border: 2px solid #b8956a;
            color: #5a3e2b;
            border-radius: 4px;
            font-size: 13px;
            padding: 4px 14px;
            font-family: "KaiTi", "STKaiti", serif;
            text-shadow: 0 1px 0 rgba(255,255,255,0.3);
            box-shadow: 0 2px 8px rgba(90, 62, 43, 0.2), inset 0 1px 0 rgba(255,255,255,0.4);
            transition: all 0.15s;
            cursor: pointer;
            white-space: nowrap;
        }

        .hotspot-btn.style-scroll:hover {
            background: linear-gradient(180deg, #faecd2 0%, #f0deb5 100%);
            box-shadow: 0 3px 12px rgba(90, 62, 43, 0.3), inset 0 1px 0 rgba(255,255,255,0.5);
            transform: translateY(-1px);
        }

        /* 风格4: 暗黑哥特 */
        .hotspot-btn.style-gothic {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #ffd700;
            border-radius: 2px;
            font-size: 13px;
            padding: 4px 14px;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.1), inset 0 0 20px rgba(0,0,0,0.3);
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
            letter-spacing: 1px;
        }

        .hotspot-btn.style-gothic:hover {
            background: rgba(0, 0, 0, 0.75);
            border-color: rgba(255, 215, 0, 0.7);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.25), inset 0 0 20px rgba(0,0,0,0.3);
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.8);
        }

        /* 风格5: 透明悬浮 (原始隐藏风格 hover 才显示) */
        .hotspot-btn.style-hidden {
            background: transparent;
            border: none;
            color: transparent;
            border-radius: 4px;
            font-size: 13px;
            padding: 4px 14px;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
        }

        .hotspot-btn.style-hidden:hover {
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            border: 1px solid rgba(255, 215, 0, 0.8);
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* 风格6: 霓虹边框 */
        .hotspot-btn.style-neon {
            background: transparent;
            border: 2px solid #00ffff;
            color: #00ffff;
            border-radius: 4px;
            font-size: 13px;
            padding: 4px 14px;
            text-shadow: 0 0 8px #00ffff, 0 0 16px #00ffff;
            box-shadow: 0 0 8px rgba(0,255,255,0.3), inset 0 0 8px rgba(0,255,255,0.1);
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
            letter-spacing: 1px;
        }

        .hotspot-btn.style-neon:hover {
            background: rgba(0,255,255,0.1);
            box-shadow: 0 0 16px rgba(0,255,255,0.5), 0 0 32px rgba(0,255,255,0.2), inset 0 0 12px rgba(0,255,255,0.15);
            text-shadow: 0 0 12px #00ffff, 0 0 24px #00ffff;
            transform: translateY(-1px);
        }

        /* 风格7: 像素复古 */
        .hotspot-btn.style-pixel {
            background: #4a6fb5;
            border: 3px solid #2a2a4a;
            color: #fff;
            border-radius: 0;
            font-size: 12px;
            padding: 4px 12px;
            font-family: "Courier New", monospace;
            box-shadow: 3px 3px 0 #1a1a3a, inset -2px -2px 0 #3a5a9a, inset 2px 2px 0 #6a8fd5;
            transition: all 0.1s;
            cursor: pointer;
            white-space: nowrap;
            image-rendering: pixelated;
        }

        .hotspot-btn.style-pixel:hover {
            background: #5a7fc5;
            box-shadow: 2px 2px 0 #1a1a3a, inset -2px -2px 0 #4a6ab0, inset 2px 2px 0 #7a9fe5;
            transform: translate(1px, 1px);
        }

        /* 风格8: 水墨晕染 */
        .hotspot-btn.style-ink {
            background: rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.4);
            color: #2c2c2c;
            border-radius: 2px;
            font-size: 14px;
            padding: 4px 16px;
            font-family: "KaiTi", "STKaiti", "SimSun", serif;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.15);
            box-shadow: 2px 2px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            white-space: nowrap;
            border-left: 3px solid rgba(180,30,30,0.6);
        }

        .hotspot-btn.style-ink:hover {
            background: rgba(0,0,0,0.08);
            border-color: rgba(0,0,0,0.5);
            box-shadow: 3px 3px 10px rgba(0,0,0,0.2);
            border-left-color: rgba(180,30,30,0.9);
            transform: translateY(-1px);
        }

        /* 风格9: 冰晶寒霜 */
        .hotspot-btn.style-frost {
            background: linear-gradient(135deg, rgba(200,230,255,0.3), rgba(150,200,255,0.15));
            border: 1px solid rgba(180,220,255,0.5);
            color: #c8e6ff;
            border-radius: 8px;
            font-size: 13px;
            padding: 4px 14px;
            backdrop-filter: blur(6px);
            text-shadow: 0 0 6px rgba(200,230,255,0.5);
            box-shadow: 0 2px 12px rgba(150,200,255,0.15), inset 0 1px 0 rgba(255,255,255,0.2);
            transition: all 0.25s;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
        }

        .hotspot-btn.style-frost:hover {
            background: linear-gradient(135deg, rgba(200,230,255,0.45), rgba(150,200,255,0.25));
            border-color: rgba(180,220,255,0.7);
            box-shadow: 0 4px 20px rgba(150,200,255,0.25), inset 0 1px 0 rgba(255,255,255,0.3);
            text-shadow: 0 0 10px rgba(200,230,255,0.7);
            transform: translateY(-1px);
        }

        /* 风格10: 熔岩烈焰 */
        .hotspot-btn.style-lava {
            background: linear-gradient(180deg, #ff4500, #cc2200);
            border: 1px solid rgba(255,150,0,0.5);
            color: #fff;
            border-radius: 4px;
            font-size: 13px;
            padding: 4px 14px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5), 0 0 8px rgba(255,100,0,0.6);
            box-shadow: 0 2px 10px rgba(255,69,0,0.35), inset 0 1px 0 rgba(255,200,100,0.3);
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
        }

        .hotspot-btn.style-lava:hover {
            background: linear-gradient(180deg, #ff5a1a, #dd3300);
            box-shadow: 0 4px 18px rgba(255,69,0,0.5), 0 0 24px rgba(255,100,0,0.2), inset 0 1px 0 rgba(255,200,100,0.4);
            text-shadow: 0 1px 3px rgba(0,0,0,0.5), 0 0 14px rgba(255,100,0,0.8);
            transform: translateY(-1px);
        }

        /* 编辑模式覆盖：始终让按钮名字可见 */
        .hotspot .hotspot-btn.style-hidden {
            color: rgba(255,255,255,0.5);
            border: 1px dashed rgba(255,255,255,0.2);
        }

        /* 风格选择器 */
        .style-picker {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .style-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid transparent;
            background: #1a1a2e;
            cursor: pointer;
            transition: all 0.15s;
        }

        .style-option:hover { border-color: #0f3460; }
        .style-option.active { border-color: #e94560; background: rgba(233, 69, 96, 0.1); }

        .style-option input[type="radio"] { accent-color: #e94560; }

        .style-option .preview-chip {
            font-size: 11px;
            pointer-events: none;
            display: inline-block;
        }

        .style-option .style-name {
            font-size: 12px;
            color: #aaa;
            flex: 1;
        }

        /* 预览模式 */
        .preview-mode .hotspot {
            border: none !important;
            background-color: transparent !important;
            box-shadow: none !important;
            cursor: pointer;
        }

        .preview-mode .hotspot-label { display: none; }
        .preview-mode .resize-handle { display: none; }

        /* 弹窗 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 700px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .modal h2 { margin-bottom: 16px; font-size: 18px; }

        .modal textarea {
            flex: 1;
            min-height: 300px;
            padding: 12px;
            background: #0d1b36;
            border: 1px solid #0f3460;
            border-radius: 8px;
            color: #e0e0e0;
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 12px;
            resize: none;
            outline: none;
        }

        .modal textarea:focus { border-color: #e94560; }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }

        .image-url-input {
            display: flex;
            gap: 8px;
        }

        .image-url-input input {
            flex: 1;
            padding: 6px 10px;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 13px;
            outline: none;
        }

        .image-url-input input:focus { border-color: #e94560; }

        .toggle-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        .empty-hint {
            text-align: center;
            padding: 30px 20px;
            color: #555;
            font-size: 13px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app">
    <!-- 左侧工具栏 -->
    <div class="toolbar">
        <div class="toolbar-header">地图按钮生成器</div>

        <div class="toolbar-section">
            <h3>地图图片</h3>
            <div class="image-url-input">
                <input type="text" id="imageUrlInput" placeholder="输入图片URL">
                <button class="btn" id="btnLoadImage">加载</button>
            </div>
        </div>

        <div class="toolbar-section">
            <h3>操作</h3>
            <div class="btn-group">
                <button class="btn" id="btnAdd">+ 添加热区</button>
                <button class="btn" id="btnPreview">预览模式</button>
            </div>
            <div class="btn-group" style="margin-top: 8px;">
                <button class="btn" id="btnExport">导出代码</button>
                <button class="btn" id="btnImport">导入数据</button>
            </div>
        </div>

        <div class="toolbar-section">
            <h3>按钮风格</h3>
            <div class="style-picker" id="stylePicker">
                <label class="style-option active" data-style="glass">
                    <input type="radio" name="btnStyle" value="glass" checked>
                    <span class="style-name">毛玻璃药丸</span>
                </label>
                <label class="style-option" data-style="gradient">
                    <input type="radio" name="btnStyle" value="gradient">
                    <span class="style-name">渐变发光</span>
                </label>
                <label class="style-option" data-style="scroll">
                    <input type="radio" name="btnStyle" value="scroll">
                    <span class="style-name">古典卷轴</span>
                </label>
                <label class="style-option" data-style="gothic">
                    <input type="radio" name="btnStyle" value="gothic">
                    <span class="style-name">暗黑哥特</span>
                </label>
                <label class="style-option" data-style="hidden">
                    <input type="radio" name="btnStyle" value="hidden">
                    <span class="style-name">透明悬浮</span>
                </label>
                <label class="style-option" data-style="neon">
                    <input type="radio" name="btnStyle" value="neon">
                    <span class="style-name">霓虹边框</span>
                </label>
                <label class="style-option" data-style="pixel">
                    <input type="radio" name="btnStyle" value="pixel">
                    <span class="style-name">像素复古</span>
                </label>
                <label class="style-option" data-style="ink">
                    <input type="radio" name="btnStyle" value="ink">
                    <span class="style-name">水墨晕染</span>
                </label>
                <label class="style-option" data-style="frost">
                    <input type="radio" name="btnStyle" value="frost">
                    <span class="style-name">冰晶寒霜</span>
                </label>
                <label class="style-option" data-style="lava">
                    <input type="radio" name="btnStyle" value="lava">
                    <span class="style-name">熔岩烈焰</span>
                </label>
            </div>
        </div>

        <div class="toolbar-section" style="padding-bottom: 4px;">
            <h3>热区列表 (<span id="hotspotCount">0</span>)</h3>
        </div>

        <div class="hotspot-list" id="hotspotList">
            <div class="empty-hint" id="emptyHint">暂无热区<br>点击「添加热区」开始编辑</div>
        </div>

        <!-- 属性编辑面板 -->
        <div class="property-panel" id="propertyPanel">
            <h3>编辑热区</h3>
            <div class="prop-row">
                <label>名称</label>
                <input type="text" id="propName" placeholder="地点名称">
            </div>
            <div class="prop-row">
                <label>X %</label>
                <input type="number" id="propLeft" step="0.1" min="0" max="100">
            </div>
            <div class="prop-row">
                <label>Y %</label>
                <input type="number" id="propTop" step="0.1" min="0" max="100">
            </div>
            <div class="prop-row">
                <label>宽 %</label>
                <input type="number" id="propWidth" step="0.1" min="1" max="100">
            </div>
            <div class="prop-row">
                <label>高 %</label>
                <input type="number" id="propHeight" step="0.1" min="1" max="100">
            </div>
            <div class="prop-row">
                <label>旋转°</label>
                <input type="number" id="propRotation" step="1" min="-360" max="360">
            </div>
        </div>
    </div>

    <!-- 右侧地图区域 -->
    <div class="map-area">
        <div class="map-topbar">
            <span class="info" id="cursorInfo">鼠标位置: 0.0%, 0.0% | 图片尺寸: 0 × 0</span>
            <div class="btn-group">
                <label class="toggle-label">
                    <input type="checkbox" id="chkLabels" checked> 显示标签
                </label>
                <label class="toggle-label">
                    <input type="checkbox" id="chkSnap"> 网格吸附
                </label>
            </div>
        </div>

        <div class="map-viewport" id="mapViewport">
            <div class="map-container" id="mapContainer">
                <img id="mapImage" class="map-image" alt="地图" draggable="false"
                     src="">
                <!-- 热区会动态插入这里 -->
                <div id="emptyMapHint" style="display:flex;align-items:center;justify-content:center;min-height:400px;color:#555;font-size:15px;text-align:center;padding:40px;">
                    请在左侧「地图图片」处粘贴图片URL并加载
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 导出弹窗 -->
<div class="modal-overlay hidden" id="exportModal">
    <div class="modal">
        <h2>导出 HTML 代码</h2>
        <div style="display:flex;gap:8px;margin-bottom:12px;">
            <button class="btn active" id="btnExportMeimo">魅魔岛版本</button>
            <button class="btn" id="btnExportOCS">OCS版本</button>

        <p id="exportHint" style="font-size:12px;color:#888;margin-bottom:8px;">
            魅魔岛版本: 遵守平台限制，无script标签，使用时间戳ID，适合角色卡分享。默认不含地图图片。
        </p>

        <div class="modal-actions">

<!-- 导入弹窗 -->
<div class="modal-overlay hidden" id="importModal">
    <div class="modal">
        <h2>导入热区数据</h2>
        <p style="font-size: 13px; color: #888; margin-bottom: 12px;">
            粘贴之前导出的 JSON 数据（热区数组），将替换当前所有热区。
        </p>
        <textarea id="importCode" placeholder='[{"name":"大门","left":30,"top":80,"width":12,"height":6}, ...]'></textarea>
        <div class="modal-actions">
            <button class="btn" id="btnDoImport">导入</button>
            <button class="btn" id="btnCloseImport">取消</button>
        </div>
    </div>
</div>

<script>
window.onerror = function(msg, url, line, col, err) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:red;color:white;padding:12px;z-index:9999;font-size:14px;';
    d.textContent = 'JS Error [L' + line + ']: ' + msg;
    document.body.appendChild(d);
};

(function() {
    // ===== 状态 =====
    var idCounter = 0;
    var hotspots = [];
    var selectedId = null;
    var previewMode = false;
    var showLabels = true;
    var snapToGrid = false;
    var currentStyle = 'glass';

    // 拖拽状态
    var drag = null;

    // DOM 引用
    function getEl(id) { return document.getElementById(id); }
    var mapContainer = getEl('mapContainer');
    var mapImage = getEl('mapImage');
    var mapViewport = getEl('mapViewport');
    var hotspotList = getEl('hotspotList');
    var emptyHint = getEl('emptyHint');
    var propertyPanel = getEl('propertyPanel');
    var cursorInfo = getEl('cursorInfo');
    var hotspotCount = getEl('hotspotCount');

    // 初始化默认数据（空，用户自行添加）
    var defaultHotspots = [];

    // ===== 工具函数 =====
    function snap(val) {
        return snapToGrid ? Math.round(val / 0.5) * 0.5 : val;
    }

    function clamp(val, min, max) {
        return Math.max(min, Math.min(max, val));
    }

    function getPercentPos(e) {
        const rect = mapContainer.getBoundingClientRect();
        return {
            x: ((e.clientX - rect.left) / rect.width) * 100,
            y: ((e.clientY - rect.top) / rect.height) * 100
        };
    }

    function findHotspot(id) {
        return hotspots.find(h => h.id === id);
    }

    // ===== 渲染 =====
    function renderHotspots() {
        // 清除旧热区 DOM
        mapContainer.querySelectorAll('.hotspot').forEach(el => el.remove());

        for (var hi = 0; hi < hotspots.length; hi++) {
            var h = hotspots[hi];
            var div = document.createElement('div');
            div.className = 'hotspot' + (h.id === selectedId ? ' selected' : '');
            div.dataset.id = h.id;
            div.style.left = h.left + '%';
            div.style.top = h.top + '%';
            div.style.width = h.width + '%';
            div.style.height = h.height + '%';

            // 应用旋转（与 translate 合并）
            var rot = h.rotation || 0;
            div.style.transform = 'translate(-50%, -50%) rotate(' + rot + 'deg)';

            // 按钮
            var btnEl = document.createElement('button');
            btnEl.className = 'hotspot-btn style-' + currentStyle;
            btnEl.textContent = h.name || '未命名';
            btnEl.style.pointerEvents = 'none';
            div.appendChild(btnEl);

            // 选中时显示调整手柄和旋转手柄
            if (h.id === selectedId && !previewMode) {
                var corners = ['tl', 'tr', 'bl', 'br'];
                for (var ci = 0; ci < corners.length; ci++) {
                    var handle = document.createElement('div');
                    handle.className = 'resize-handle ' + corners[ci];
                    handle.dataset.handle = corners[ci];
                    div.appendChild(handle);
                }

                // 旋转连接线
                var rotLine = document.createElement('div');
                rotLine.className = 'rotate-line';
                div.appendChild(rotLine);

                // 旋转手柄
                var rotHandle = document.createElement('div');
                rotHandle.className = 'rotate-handle';
                rotHandle.dataset.rotate = 'true';
                div.appendChild(rotHandle);
            }

            mapContainer.appendChild(div);
        }
    }

    function renderList() {
        // 清除列表（保留 emptyHint）
        var items = hotspotList.querySelectorAll('.hotspot-item');
        for (var n = 0; n < items.length; n++) items[n].remove();
        hotspotCount.textContent = hotspots.length;
        emptyHint.style.display = hotspots.length === 0 ? 'block' : 'none';

        for (var i = 0; i < hotspots.length; i++) {
            var h = hotspots[i];
            var div = document.createElement('div');
            div.className = 'hotspot-item' + (h.id === selectedId ? ' selected' : '');
            div.dataset.id = h.id;

            var nameSpan = document.createElement('span');
            nameSpan.className = 'name';
            nameSpan.textContent = h.name || '未命名';
            div.appendChild(nameSpan);

            var coordsSpan = document.createElement('span');
            coordsSpan.className = 'coords';
            coordsSpan.textContent = h.left.toFixed(1) + '%, ' + h.top.toFixed(1) + '%';
            div.appendChild(coordsSpan);

            var delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.dataset.index = i;
            delBtn.title = '删除';
            delBtn.textContent = '\u00d7';
            div.appendChild(delBtn);

            hotspotList.appendChild(div);
        }
    }

    function renderPropertyPanel() {
        var h = findHotspot(selectedId);
        if (!h) {
            propertyPanel.classList.remove('visible');
            return;
        }
        propertyPanel.classList.add('visible');
        getEl('propName').value = h.name;
        getEl('propLeft').value = h.left.toFixed(1);
        getEl('propTop').value = h.top.toFixed(1);
        getEl('propWidth').value = h.width.toFixed(1);
        getEl('propHeight').value = h.height.toFixed(1);
        getEl('propRotation').value = Math.round(h.rotation || 0);
    }

    function renderAll() {
        renderHotspots();
        renderList();
        renderPropertyPanel();
        saveToLocal();
    }

    // ===== 选择 =====
    function select(id) {
        selectedId = id;
        renderAll();
    }

    // ===== 添加/删除 =====
    function addHotspot() {
        var h = {
            id: ++idCounter,
            name: '新地点',
            left: 50,
            top: 50,
            width: 10,
            height: 6,
            rotation: 0
        };
        hotspots.push(h);
        select(h.id);
    }

    function removeHotspot(index) {
        if (hotspots[index].id === selectedId) selectedId = null;
        hotspots.splice(index, 1);
        renderAll();
    }

    // ===== 获取热区中心的像素坐标 =====
    function getHotspotCenterPx(h) {
        var rect = mapContainer.getBoundingClientRect();
        return {
            x: rect.left + (h.left / 100) * rect.width,
            y: rect.top + (h.top / 100) * rect.height
        };
    }

    // ===== 拖拽 =====
    mapContainer.addEventListener('mousedown', function(e) {
        if (previewMode) {
            var hotspotEl = e.target.closest('.hotspot');
            if (hotspotEl) {
                var h = findHotspot(Number(hotspotEl.dataset.id));
                if (h) triggerAction(h.name);
            }
            return;
        }

        e.preventDefault();

        // 检查是否点击了旋转手柄
        var rotateEl = e.target.closest('.rotate-handle');
        if (rotateEl) {
            var hotspotEl2 = rotateEl.closest('.hotspot');
            var h2 = findHotspot(Number(hotspotEl2.dataset.id));
            if (!h2) return;
            var center = getHotspotCenterPx(h2);
            drag = {
                id: h2.id, type: 'rotate', handle: null,
                centerX: center.x, centerY: center.y,
                origRotation: h2.rotation || 0,
                startAngle: Math.atan2(e.clientY - center.y, e.clientX - center.x) * 180 / Math.PI
            };
            return;
        }

        // 检查是否点击了调整手柄
        var handleEl = e.target.closest('.resize-handle');
        if (handleEl) {
            var hotspotEl3 = handleEl.closest('.hotspot');
            var h3 = findHotspot(Number(hotspotEl3.dataset.id));
            if (!h3) return;
            var pos = getPercentPos(e);
            drag = {
                id: h3.id, type: 'resize', handle: handleEl.dataset.handle,
                startX: pos.x, startY: pos.y,
                origLeft: h3.left, origTop: h3.top, origWidth: h3.width, origHeight: h3.height
            };
            return;
        }

        // 检查是否点击了热区
        var hotspotEl4 = e.target.closest('.hotspot');
        if (hotspotEl4) {
            var h4 = findHotspot(Number(hotspotEl4.dataset.id));
            if (!h4) return;
            select(h4.id);
            var pos2 = getPercentPos(e);
            drag = {
                id: h4.id, type: 'move', handle: null,
                startX: pos2.x, startY: pos2.y,
                origLeft: h4.left, origTop: h4.top, origWidth: h4.width, origHeight: h4.height
            };
            return;
        }

        // 点击空白区域取消选择
        select(null);
    });

    mapViewport.addEventListener('mousemove', function(e) {
        var pos = getPercentPos(e);
        var cx = clamp(pos.x, 0, 100);
        var cy = clamp(pos.y, 0, 100);
        cursorInfo.textContent = '鼠标位置: ' + cx.toFixed(1) + '%, ' + cy.toFixed(1) + '% | 图片尺寸: ' + (mapImage.naturalWidth || 0) + ' \u00d7 ' + (mapImage.naturalHeight || 0);

        if (!drag) return;

        var h = findHotspot(drag.id);
        if (!h) { drag = null; return; }

        if (drag.type === 'rotate') {
            var currentAngle = Math.atan2(e.clientY - drag.centerY, e.clientX - drag.centerX) * 180 / Math.PI;
            var delta = currentAngle - drag.startAngle;
            var newRot = drag.origRotation + delta;
            // 按住 Shift 吸附到 15 度
            if (e.shiftKey) newRot = Math.round(newRot / 15) * 15;
            h.rotation = newRot;
            renderAll();
            return;
        }

        var dx = pos.x - drag.startX;
        var dy = pos.y - drag.startY;

        if (drag.type === 'move') {
            h.left = snap(clamp(drag.origLeft + dx, 0, 100));
            h.top = snap(clamp(drag.origTop + dy, 0, 100));
            renderAll();
        } else if (drag.type === 'resize') {
            var handle = drag.handle;
            var newLeft = drag.origLeft;
            var newTop = drag.origTop;
            var newWidth = drag.origWidth;
            var newHeight = drag.origHeight;

            if (handle.indexOf('r') !== -1) {
                newWidth = snap(Math.max(2, drag.origWidth + dx));
                newLeft = drag.origLeft + (newWidth - drag.origWidth) / 2;
            }
            if (handle.indexOf('l') !== -1) {
                newWidth = snap(Math.max(2, drag.origWidth - dx));
                newLeft = drag.origLeft - (newWidth - drag.origWidth) / 2;
            }
            if (handle.indexOf('b') !== -1) {
                newHeight = snap(Math.max(2, drag.origHeight + dy));
                newTop = drag.origTop + (newHeight - drag.origHeight) / 2;
            }
            if (handle.indexOf('t') !== -1) {
                newHeight = snap(Math.max(2, drag.origHeight - dy));
                newTop = drag.origTop - (newHeight - drag.origHeight) / 2;
            }

            h.left = newLeft;
            h.top = newTop;
            h.width = newWidth;
            h.height = newHeight;
            renderAll();
        }
    });

    function stopDrag() { drag = null; }
    mapViewport.addEventListener('mouseup', stopDrag);
    mapViewport.addEventListener('mouseleave', stopDrag);

    // ===== 列表点击事件（事件委托） =====
    hotspotList.addEventListener('click', function(e) {
        const delBtn = e.target.closest('.delete-btn');
        if (delBtn) {
            e.stopPropagation();
            removeHotspot(Number(delBtn.dataset.index));
            return;
        }

        const item = e.target.closest('.hotspot-item');
        if (item) {
            select(Number(item.dataset.id));
        }
    });

    // ===== 属性面板绑定 =====
    function bindPropInput(inputId, prop) {
        getEl(inputId).addEventListener('input', function() {
            var h = findHotspot(selectedId);
            if (!h) return;
            if (prop === 'name') {
                h.name = this.value;
            } else {
                h[prop] = parseFloat(this.value) || 0;
            }
            renderAll();
        });
    }

    bindPropInput('propName', 'name');
    bindPropInput('propLeft', 'left');
    bindPropInput('propTop', 'top');
    bindPropInput('propWidth', 'width');
    bindPropInput('propHeight', 'height');
    bindPropInput('propRotation', 'rotation');

    // ===== 按钮事件 =====
    getEl('btnAdd').addEventListener('click', addHotspot);

    getEl('btnPreview').addEventListener('click', function() {
        previewMode = !previewMode;
        this.textContent = previewMode ? '编辑模式' : '预览模式';
        this.classList.toggle('active', previewMode);
        mapViewport.classList.toggle('preview-mode', previewMode);
        renderAll();
    });

    function hideMapHint() {
        var hint = getEl('emptyMapHint');
        if (hint) hint.style.display = 'none';
    }

    function loadImageUrl(url) {
        if (!url) return;
        mapImage.src = url;
        getEl('imageUrlInput').value = url;
        hideMapHint();
    }

    mapImage.addEventListener('load', function() {
        if (mapImage.src && mapImage.naturalWidth > 0) hideMapHint();
    });

    getEl('btnLoadImage').addEventListener('click', function() {
        var url = getEl('imageUrlInput').value.trim();
        if (!url) return;
        loadImageUrl(url);
    });

    getEl('imageUrlInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            loadImageUrl(this.value.trim());
        }
    });

    getEl('chkLabels').addEventListener('change', function() {
        showLabels = this.checked;
        renderAll();
    });

    getEl('chkSnap').addEventListener('change', function() {
        snapToGrid = this.checked;
    });

    // ===== 按钮风格选择 =====
    getEl('stylePicker').addEventListener('change', function(e) {
        if (e.target.name === 'btnStyle') {
            currentStyle = e.target.value;
            // 更新选中状态
            var options = getEl('stylePicker').querySelectorAll('.style-option');
            for (var si = 0; si < options.length; si++) {
                options[si].classList.toggle('active', options[si].dataset.style === currentStyle);
            }
            renderAll();
        }
    });

    // ===== 键盘快捷键 =====
    document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId) {
            const idx = hotspots.findIndex(h => h.id === selectedId);
            if (idx !== -1) removeHotspot(idx);
        }

        if (e.key === 'Escape') select(null);

        if (selectedId && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
            e.preventDefault();
            const h = findHotspot(selectedId);
            if (!h) return;
            const step = e.shiftKey ? 0.1 : 0.5;
            if (e.key === 'ArrowUp') h.top = clamp(h.top - step, 0, 100);
            if (e.key === 'ArrowDown') h.top = clamp(h.top + step, 0, 100);
            if (e.key === 'ArrowLeft') h.left = clamp(h.left - step, 0, 100);
            if (e.key === 'ArrowRight') h.left = clamp(h.left + step, 0, 100);
            renderAll();
        }
    });

    // ===== 导出 =====
    var meimoHints = '魅魔岛版本: 遵守平台限制，无script标签，使用时间戳ID。默认不含地图图片，请在角色卡中自行设置图片URL。';
    var ocsHints = 'OCS/SceneAssistant版本: 完整HTML文件，通过 #msg-input 发送消息，兼容SillyTavern。';

    function updateExportTabs() {
        getEl('btnExportMeimo').classList.toggle('active', exportTarget === 'meimo');
        getEl('btnExportOCS').classList.toggle('active', exportTarget === 'ocs');
        getEl('exportHint').textContent = exportTarget === 'meimo' ? meimoHints : ocsHints;
        getEl('exportCode').value = generateExportCode();
    }

    getEl('btnExport').addEventListener('click', function() {
        getEl('exportModal').classList.remove('hidden');
        updateExportTabs();
    });

    getEl('btnExportMeimo').addEventListener('click', function() {
        exportTarget = 'meimo';
        updateExportTabs();
    });

    getEl('btnExportOCS').addEventListener('click', function() {
        exportTarget = 'ocs';
        updateExportTabs();
    });

    getEl('btnCloseExport').addEventListener('click', function() {
        getEl('exportModal').classList.add('hidden');
    });

    getEl('exportModal').addEventListener('click', function(e) {
        if (e.target === this) this.classList.add('hidden');
    });

    getEl('btnCopyExport').addEventListener('click', function() {
        var ta = getEl('exportCode');
        ta.select();
        document.execCommand('copy');
        var btn = getEl('btnCopyExport');
        var oldText = btn.textContent;
        btn.textContent = '已复制!';
        setTimeout(function() { btn.textContent = oldText; }, 1500);
    });

    // ===== 导入 =====
    getEl('btnImport').addEventListener('click', function() {
        getEl('importCode').value = '';
        getEl('importModal').classList.remove('hidden');
    });

    getEl('btnCloseImport').addEventListener('click', function() {
        getEl('importModal').classList.add('hidden');
    });

    getEl('importModal').addEventListener('click', function(e) {
        if (e.target === this) this.classList.add('hidden');
    });

    getEl('btnDoImport').addEventListener('click', function() {
        try {
            const data = JSON.parse(getEl('importCode').value);
            if (!Array.isArray(data)) throw new Error('数据格式错误');
            hotspots = data.map(function(h) { return {
                id: ++idCounter,
                name: h.name || '未命名',
                left: parseFloat(h.left) || 50,
                top: parseFloat(h.top) || 50,
                width: parseFloat(h.width) || 10,
                height: parseFloat(h.height) || 6,
                rotation: parseFloat(h.rotation) || 0
            }; });
            selectedId = null;
            getEl('importModal').classList.add('hidden');
            renderAll();
        } catch (e) {
            alert('导入失败: ' + e.message);
        }
    });

    // ===== 预览模式交互 =====
    function triggerAction(name) {
        var command = '我要前往' + name;
        try {
            // OCS / SceneAssistant
            var msgInput = document.querySelector('#msg-input');
            if (msgInput) {
                msgInput.textContent = command;
                msgInput.dispatchEvent(new Event('input', { bubbles: true }));
                msgInput.focus();
                return;
            }
            // SillyTavern
            var chatInput = window.parent.document.getElementById('send_textarea') ||
                              document.getElementById('send_textarea');
            if (chatInput) {
                chatInput.value = command;
                chatInput.dispatchEvent(new Event('input', { bubbles: true }));
                return;
            }
        } catch(e) {}
        alert('预览: 前往 ' + name + '\n(嵌入到平台后将自动填入聊天框)');
    }

    // ===== 按钮风格 CSS 模板 =====
    var styleCssMap = {
        glass: '\n        .hotspot-btn { background: rgba(192,132,252,0.12); border: 1px solid rgba(192,132,252,0.25); color: rgba(192,132,252,0.9); border-radius: 50px; font-size: 13px; padding: 4px 14px; backdrop-filter: blur(8px); transition: all 0.15s; cursor: pointer; white-space: nowrap; }\n        .hotspot-btn:hover { background: rgba(192,132,252,0.22); border-color: rgba(192,132,252,0.4); color: #c084fc; transform: translateY(-1px); }\n',

        scroll: '\n        .hotspot-btn { background: linear-gradient(180deg, #f5e6c8, #e8d5a8); border: 2px solid #b8956a; color: #5a3e2b; border-radius: 4px; font-size: 13px; padding: 4px 14px; font-family: "KaiTi","STKaiti",serif; text-shadow: 0 1px 0 rgba(255,255,255,0.3); box-shadow: 0 2px 8px rgba(90,62,43,0.2), inset 0 1px 0 rgba(255,255,255,0.4); transition: all 0.15s; cursor: pointer; white-space: nowrap; }\n        .hotspot-btn:hover { background: linear-gradient(180deg, #faecd2, #f0deb5); box-shadow: 0 3px 12px rgba(90,62,43,0.3), inset 0 1px 0 rgba(255,255,255,0.5); transform: translateY(-1px); }\n',
        gothic: '\n        .hotspot-btn { background: rgba(0,0,0,0.6); border: 1px solid rgba(255,215,0,0.4); color: #ffd700; border-radius: 2px; font-size: 13px; padding: 4px 14px; text-shadow: 0 0 8px rgba(255,215,0,0.5); box-shadow: 0 0 10px rgba(255,215,0,0.1), inset 0 0 20px rgba(0,0,0,0.3); transition: all 0.2s; cursor: pointer; white-space: nowrap; letter-spacing: 1px; }\n        .hotspot-btn:hover { background: rgba(0,0,0,0.75); border-color: rgba(255,215,0,0.7); box-shadow: 0 0 20px rgba(255,215,0,0.25), inset 0 0 20px rgba(0,0,0,0.3); text-shadow: 0 0 12px rgba(255,215,0,0.8); }\n',
        hidden: '\n        .hotspot-btn { background: transparent; border: none; color: transparent; border-radius: 4px; font-size: 13px; padding: 4px 14px; transition: all 0.2s; cursor: pointer; white-space: nowrap; }\n        .hotspot:hover .hotspot-btn { background: rgba(255,215,0,0.2); box-shadow: 0 0 10px rgba(255,215,0,0.5); border: 1px solid rgba(255,215,0,0.8); color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }\n',
        neon: '\n        .hotspot-btn { background: transparent; border: 2px solid #00ffff; color: #00ffff; border-radius: 4px; font-size: 13px; padding: 4px 14px; text-shadow: 0 0 8px #00ffff, 0 0 16px #00ffff; box-shadow: 0 0 8px rgba(0,255,255,0.3), inset 0 0 8px rgba(0,255,255,0.1); transition: all 0.2s; cursor: pointer; white-space: nowrap; letter-spacing: 1px; }\n        .hotspot-btn:hover { background: rgba(0,255,255,0.1); box-shadow: 0 0 16px rgba(0,255,255,0.5), 0 0 32px rgba(0,255,255,0.2), inset 0 0 12px rgba(0,255,255,0.15); text-shadow: 0 0 12px #00ffff, 0 0 24px #00ffff; transform: translateY(-1px); }\n',
        pixel: '\n        .hotspot-btn { background: #4a6fb5; border: 3px solid #2a2a4a; color: #fff; border-radius: 0; font-size: 12px; padding: 4px 12px; font-family: "Courier New", monospace; box-shadow: 3px 3px 0 #1a1a3a, inset -2px -2px 0 #3a5a9a, inset 2px 2px 0 #6a8fd5; transition: all 0.1s; cursor: pointer; white-space: nowrap; }\n        .hotspot-btn:hover { background: #5a7fc5; box-shadow: 2px 2px 0 #1a1a3a, inset -2px -2px 0 #4a6ab0, inset 2px 2px 0 #7a9fe5; transform: translate(1px, 1px); }\n',
        ink: '\n        .hotspot-btn { background: rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.4); border-left: 3px solid rgba(180,30,30,0.6); color: #2c2c2c; border-radius: 2px; font-size: 14px; padding: 4px 16px; font-family: "KaiTi","STKaiti","SimSun",serif; text-shadow: 1px 1px 2px rgba(0,0,0,0.15); box-shadow: 2px 2px 6px rgba(0,0,0,0.1); transition: all 0.3s ease; cursor: pointer; white-space: nowrap; }\n        .hotspot-btn:hover { background: rgba(0,0,0,0.08); border-color: rgba(0,0,0,0.5); border-left-color: rgba(180,30,30,0.9); box-shadow: 3px 3px 10px rgba(0,0,0,0.2); transform: translateY(-1px); }\n',
        frost: '\n        .hotspot-btn { background: linear-gradient(135deg, rgba(200,230,255,0.3), rgba(150,200,255,0.15)); border: 1px solid rgba(180,220,255,0.5); color: #c8e6ff; border-radius: 8px; font-size: 13px; padding: 4px 14px; backdrop-filter: blur(6px); text-shadow: 0 0 6px rgba(200,230,255,0.5); box-shadow: 0 2px 12px rgba(150,200,255,0.15), inset 0 1px 0 rgba(255,255,255,0.2); transition: all 0.25s; cursor: pointer; white-space: nowrap; }\n        .hotspot-btn:hover { background: linear-gradient(135deg, rgba(200,230,255,0.45), rgba(150,200,255,0.25)); border-color: rgba(180,220,255,0.7); box-shadow: 0 4px 20px rgba(150,200,255,0.25), inset 0 1px 0 rgba(255,255,255,0.3); text-shadow: 0 0 10px rgba(200,230,255,0.7); transform: translateY(-1px); }\n',
        lava: '\n        .hotspot-btn { background: linear-gradient(180deg, #ff4500, #cc2200); border: 1px solid rgba(255,150,0,0.5); color: #fff; border-radius: 4px; font-size: 13px; padding: 4px 14px; text-shadow: 0 1px 3px rgba(0,0,0,0.5), 0 0 8px rgba(255,100,0,0.6); box-shadow: 0 2px 10px rgba(255,69,0,0.35), inset 0 1px 0 rgba(255,200,100,0.3); transition: all 0.2s; cursor: pointer; white-space: nowrap; }\n        .hotspot-btn:hover { background: linear-gradient(180deg, #ff5a1a, #dd3300); box-shadow: 0 4px 18px rgba(255,69,0,0.5), 0 0 24px rgba(255,100,0,0.2), inset 0 1px 0 rgba(255,200,100,0.4); text-shadow: 0 1px 3px rgba(0,0,0,0.5), 0 0 14px rgba(255,100,0,0.8); transform: translateY(-1px); }\n'
    };

    // ===== 导出代码生成 =====
    var exportTarget = 'meimo'; // 'meimo' | 'ocs'

    // --- 魅魔岛版本 ---
    function generateMeimoCode() {
        var ts = Date.now();
        var imgSrc = getImageUrl();
        var btnCss = styleCssMap[currentStyle] || styleCssMap.glass;

        // 生成每个热区按钮的 HTML
        var lineArr = [];
        for (var i = 0; i < hotspots.length; i++) {
            var h = hotspots[i];
            var rot = h.rotation || 0;
            var transformVal = rot !== 0
                ? 'translate(-50%,-50%) rotate(' + rot.toFixed(1) + 'deg)'
                : 'translate(-50%,-50%)';
            // 魅魔岛: 不能用 <script>，用 onclick + eval(轻主板.dataset.s)
            var escapedName = h.name.replace(/'/g, "\\'");
            lineArr.push(
                '    <div class="hotspot" style="left:' + h.left.toFixed(1) + '%;top:' + h.top.toFixed(1) + '%;width:' + h.width.toFixed(1) + '%;height:' + h.height.toFixed(1) + '%;transform:' + transformVal + ';">' +
                '<button class="hotspot-btn" onclick="event.stopPropagation();var a=document.querySelector(\'.chat .chat-bottom .uni-textarea .chat-input-scope textarea\');if(a){a.value=\'我要前往' + escapedName + '\';a.dispatchEvent(new Event(\'input\'))}">' + h.name + '</button></div>'
            );
        }
        var lines = lineArr.join('\n');

        var code = '';
        code += '<div id="MAP_ROOT_' + ts + '" onclick="event.stopPropagation()" style="position:relative;width:100%;max-width:1200px;margin:0 auto;border-radius:8px;overflow:hidden;">\n';
        code += '<style>\n';
        code += '    #MAP_ROOT_' + ts + ' .map-image { width:100%;height:auto;display:block; }\n';
        code += '    #MAP_ROOT_' + ts + ' .hotspot { position:absolute;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center; }\n';
        // 按钮样式 - 用时间戳作用域
        var scopedBtnCss = btnCss.replace(/\.hotspot-btn/g, '#MAP_ROOT_' + ts + ' .hotspot-btn');
        scopedBtnCss = scopedBtnCss.replace(/\.hotspot:hover/g, '#MAP_ROOT_' + ts + ' .hotspot:hover');
        code += scopedBtnCss;
        code += '</style>\n';
        code += '    <img src="' + imgSrc + '" class="map-image" alt="交互地图">\n';
        code += lines + '\n';
        code += '</div>';

        return code;
    }

    // --- OCS / SceneAssistant 版本 ---
    function generateOCSCode() {
        var imgSrc = getImageUrl();
        var btnCss = styleCssMap[currentStyle] || styleCssMap.glass;

        var lineArr = [];
        for (var i = 0; i < hotspots.length; i++) {
            var h = hotspots[i];
            var rot = h.rotation || 0;
            var transformVal = rot !== 0
                ? 'translate(-50%, -50%) rotate(' + rot.toFixed(1) + 'deg)'
                : 'translate(-50%, -50%)';
            lineArr.push('        <div class="hotspot" style="left:' + h.left.toFixed(1) + '%;top:' + h.top.toFixed(1) + '%;width:' + h.width.toFixed(1) + '%;height:' + h.height.toFixed(1) + '%;transform:' + transformVal + ';" onclick="sendAction(\'' + h.name.replace(/'/g, "\\'") + '\')"><button class="hotspot-btn">' + h.name + '</button></div>');
        }
        var lines = lineArr.join('\n');

        var code = '';
        code += '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n';
        code += '    <meta charset="UTF-8">\n';
        code += '    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n';
        code += '    <title>交互地图</title>\n';
        code += '    <style>\n';
        code += '        body { margin:0; padding:0; background-color:#1a1a1a; display:flex; justify-content:center; align-items:center; min-height:100vh; }\n';
        code += '        .map-container { position:relative; width:100%; max-width:1200px; box-shadow:0 4px 15px rgba(0,0,0,0.5); border-radius:8px; overflow:hidden; }\n';
        code += '        .map-image { width:100%; height:auto; display:block; }\n';
        code += '        .hotspot { position:absolute; cursor:pointer; z-index:10; display:flex; align-items:center; justify-content:center; }\n';
        code += btnCss;
        code += '    </style>\n';
        code += '</head>\n<body>\n';
        code += '    <div class="map-container">\n';
        code += '        <img src="' + imgSrc + '" class="map-image" alt="交互地图">\n\n';
        code += lines + '\n\n';
        code += '    </div>\n\n';
        // OCS版本: 通过 #msg-input 填入消息
        code += '    <scr' + 'ipt>\n';
        code += '        function sendAction(name) {\n';
        code += '            var text = "我要前往" + name;\n';
        code += '            // OCS / SceneAssistant: 填入 #msg-input\n';
        code += '            var el = document.querySelector("#msg-input");\n';
        code += '            if (el) { el.textContent = text; el.dispatchEvent(new Event("input",{bubbles:true})); el.focus(); return; }\n';
        code += '            // SillyTavern 兼容\n';
        code += '            var st = window.parent && window.parent.document.getElementById("send_textarea");\n';
        code += '            if (!st) st = document.getElementById("send_textarea");\n';
        code += '            if (st) { st.value = text; st.dispatchEvent(new Event("input",{bubbles:true})); return; }\n';
        code += '            console.log("指令: " + text);\n';
        code += '        }\n';
        code += '    </scr' + 'ipt>\n';
        code += '</body>\n</html>';

        return code;
    }

    function generateExportCode() {
        return exportTarget === 'meimo' ? generateMeimoCode() : generateOCSCode();
    }

    // ===== 本地存储 =====
    function getImageUrl() {
        // img.src 为空字符串时浏览器会返回当前页面路径，需要过滤
        var s = mapImage.getAttribute('src') || '';
        if (!s || s === location.href) return '';
        return s;
    }

    function saveToLocal() {
        var data = { imageUrl: getImageUrl(), hotspots: hotspots, style: currentStyle };
        localStorage.setItem('map-generator-data', JSON.stringify(data));
    }

    function loadFromLocal() {
        try {
            const raw = localStorage.getItem('map-generator-data');
            if (!raw) return false;
            const data = JSON.parse(raw);
            if (data.imageUrl && typeof data.imageUrl === 'string') {
                mapImage.src = data.imageUrl;
                getEl('imageUrlInput').value = data.imageUrl;
                hideMapHint();
            }
            if (data.style) {
                currentStyle = data.style;
                var radio = document.querySelector('input[name="btnStyle"][value="' + data.style + '"]');
                if (radio) radio.checked = true;
                var options = getEl('stylePicker').querySelectorAll('.style-option');
                for (var oi = 0; oi < options.length; oi++) {
                    options[oi].classList.toggle('active', options[oi].dataset.style === currentStyle);
                }
            }
            if (Array.isArray(data.hotspots) && data.hotspots.length > 0) {
                // 强制提取纯数字，防止旧版数据格式不兼容
                hotspots = data.hotspots.map(function(h) {
                    var left = parseFloat(h.left);
                    var top = parseFloat(h.top);
                    var width = parseFloat(h.width);
                    var height = parseFloat(h.height);
                    if (isNaN(left) || isNaN(top) || isNaN(width) || isNaN(height)) return null;
                    return {
                        id: ++idCounter,
                        name: String(h.name || '未命名'),
                        left: left, top: top, width: width, height: height,
                        rotation: parseFloat(h.rotation) || 0
                    };
                }).filter(Boolean);
                if (hotspots.length > 0) return true;
            }
        } catch(e) {
            // 旧数据损坏，清除
            localStorage.removeItem('map-generator-data');
        }
        return false;
    }

    // ===== 初始化 =====
    if (!loadFromLocal()) {
        hotspots = defaultHotspots.map(function(h) { return { id: ++idCounter, name: h.name, left: h.left, top: h.top, width: h.width, height: h.height, rotation: h.rotation || 0 }; });
    }
    renderAll();

})();
</script>

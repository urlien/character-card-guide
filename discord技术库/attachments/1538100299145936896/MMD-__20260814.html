.effect-shell{width:100%;max-width:none;margin:0 auto}.effect-frame{display:block;width:100%;height:calc(100vh - 150px);min-height:720px;border:1px solid var(--line2);border-radius:6px;background:#eef2f6}.preview-state{font-size:12px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.metric{border-left:3px solid var(--accent);background:#fff;padding:12px}.metric strong{display:block;font-size:21px}.metric span{color:var(--muted);font-size:12px}.export-actions{display:flex;flex-wrap:wrap;gap:8px}.audit{display:grid;gap:5px}.audit-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);color:var(--muted)}.audit-row b{color:var(--text)}.ok{color:var(--success)!important}.warn{color:var(--warn)!important}.toast{position:fixed;right:16px;bottom:16px;z-index:50;background:#fff;border:1px solid var(--line2);border-radius:5px;padding:10px 13px;box-shadow:0 8px 24px rgba(20,35,50,.18);max-width:min(380px,calc(100vw - 32px))}
.relation-fields{display:grid;grid-template-columns:minmax(180px,1fr) minmax(260px,2fr);gap:10px;margin-top:12px}.relation-fields .relation-field{margin-top:0}.relation-fields textarea{min-height:84px;resize:vertical}
@media(max-width:900px){.status-layout{grid-template-columns:1fr}.gallery-preview{grid-template-columns:minmax(220px,310px) 1fr}.position-grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.relation-fields{grid-template-columns:1fr}}

<style>

<body>
<header class="topbar">
  <div class="brand">MMD 状态栏图库编辑器</div><div class="save-state" id="saveState">已保存</div><div class="top-spacer"></div>
</header>
<nav class="tabs"><button class="tab active" data-view="status">状态栏设置</button><button class="tab" data-view="gallery">图片图库</button><button class="tab" data-view="preview">效果预览</button><button class="tab" data-view="export">导出</button></nav>
<main>
  <section class="view active" id="view-status"><div class="band"><div class="band-inner status-layout">
    <div class="field-panel"><div class="section-head"><div><h2>角色栏项目</h2><p class="section-copy">固定 13 项，只修改名称</p></div></div><div class="field-list" id="fieldList"></div></div>
    <div class="setting-panel">
      <div class="subhead">图鉴解锁</div><div class="field"><label for="galleryProgressField">图鉴解锁词条</label><select class="select" id="galleryProgressField"></select></div>
      <div class="subhead">侧栏按钮位置</div><div class="position-grid">
        <div class="position-card"><strong>角色图鉴</strong><div class="position-controls"><select class="select" id="gallerySide"><option value="left">左侧</option><option value="right">右侧</option></select><span class="position-label">高度</span><input class="range" id="galleryTop" type="range" min="10" max="90"><output class="range-value" id="galleryTopValue"></output></div></div>
      </div>
    </div>
  </div></div></section>
  <section class="view" id="view-gallery"><div class="fallback-band"><div class="band-inner"><div class="fallback-head"><div><h2>备用角色图库</h2><p class="section-copy">备用图片不设上限。导出后仅在有图片时显示“备用”分栏；点击图片可输入自定义角色名并永久建立本地对应关系。</p></div><div class="pane-spacer"></div><span class="fallback-count" id="fallbackCount">0 张</span><button class="icon-btn" id="addFallbackImage" title="添加备用图片">＋</button></div><div class="fallback-import"><textarea class="input" id="fallbackImportInput" placeholder="每行一个图片 URL，不识别角色名&#10;https://example.com/fallback-1.png&#10;https://example.com/fallback-2.png"></textarea><button class="btn primary" id="fallbackImportButton">批量导入备用图片</button><span class="fallback-import-note">只导入 HTTP/HTTPS 图片链接；自动忽略空行、无效链接和重复链接。</span></div><div class="fallback-list" id="fallbackList"></div></div></div><div class="gallery-layout"><aside class="role-rail"><div class="rail-tools"><div class="rail-title">角色图鉴<span>（侧边栏展示）</span></div><button class="icon-btn" id="addRole" title="新增角色">＋</button></div><div class="role-list" id="roleList"></div></aside><section class="editor-pane"><div id="roleEditor"></div></section></div></section>
  <section class="view" id="view-preview"><div class="band"><div class="effect-shell"><div class="preview-toolbar"><h2>MMD 效果预览</h2><span class="preview-state" id="previewState">正在准备</span><div class="pane-spacer"></div><button class="icon-btn" id="refreshPreview" title="立即刷新">↻</button></div><iframe class="effect-frame" id="previewFrame" title="MMD 正文、状态栏与双侧栏效果预览" sandbox="allow-scripts allow-same-origin" data-preview-revision="0"></iframe></div></div></section>
  <section class="view" id="view-export"><div class="band"><div class="band-inner"><div class="section-head"><h2>导出检查</h2></div><div class="metrics" id="metrics"></div></div></div><div class="band"><div class="band-inner"><div class="section-head"><h2>检查结果</h2></div><div class="audit" id="audit"></div></div></div><div class="band"><div class="band-inner"><div class="section-head"><h2>下载</h2></div><div class="export-actions"><button class="btn primary" id="exportRegex">下载 MMD 正则</button><button class="btn" id="exportWorldbook">下载 MMD 世界书</button><button class="btn" id="exportCard">下载 v2 角色卡 PNG</button></div></div></div></section>
</main>
<div class="toast hidden" id="toast"></div>

<script>
/* 增强版：动态状态项目、可选解锁、无限图库、分栏、快捷导入与永久手动解锁 */
const FLEX_STORAGE_KEY='mmd-role-gallery-editor-flex-v1';
const FLEX_UNLOCK_KEY='mmd-role-gallery-manual-unlocks-v1';
const FLEX_BIND_KEY='mmd-role-gallery-fallback-bindings-v1';

function flexId(prefix='item'){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function flexNumber(value,fallback=0){const n=Number(value);return Number.isFinite(n)?n:fallback}
function flexBounds(){let min=flexNumber(project.status.rangeMin,0),max=flexNumber(project.status.rangeMax,100);if(min>max)[min,max]=[max,min];return{min,max}}
function flexClamp(value){const b=flexBounds();return Math.max(b.min,Math.min(b.max,flexNumber(value,b.min)))}

      .replace(/\u3010\u5168\u5c40\u7f8e\u5316[123]?\u3011/g, '')
      .replace(/\u3010\u56fe\u5e93(?:\u56fe\u7247\u4fee\u590d|\u5206\u680f\u5207\u6362\u4fee\u590d|\u56fe\u7247\u653e\u5927|\u5907\u7528\u7ed1\u5b9a\u4fee\u590d)\u3011/g, '');
    for (const rule of pack.regex_scripts) {
      const name = String(rule.scriptName || '');
      const find = String(rule.findRegex || '');
      if (name.includes('\u6570\u636e\u5206\u7247')) {
        rule.replaceString = String(rule.replaceString).replace(
          "window.__TPG_RAW=window.__TPG_RAW.concat(cs[k])})}catch",
          "window.__TPG_RAW=window.__TPG_RAW.concat(cs[k])});document.dispatchEvent(new Event('tpg-ready'))}catch"
        );
      }
      if (name.includes('\u52a8\u6001\u5206\u680f\u5f15\u64ce') || find.includes('\u56fe\u5e93\u5f15\u64ce')) {
        rule.replaceString = makeRestrictedGallery(rule.replaceString);
      }
      if (name.includes('\u52a8\u6001\u89d2\u8272\u680f')) {
        rule.replaceString = String(rule.replaceString)
          .replace("m[1].trim().split('|')", "m[1].trim().replace(/\uff5c/g,'|').split('|')")
          .replace(/manual=\{\};try\{manual=JSON\.parse\(localStorage\.getItem\('[^']+'\)\|\|'\{\}'\)\}catch\(e\)\{\}/, 'manual=window.__FG_MANUAL||{};')
          .replace(/binds=\{\};try\{binds=JSON\.parse\(localStorage\.getItem\('[^']+'\)\|\|'\{\}'\)\}catch\(e\)\{\}/, 'binds=window.__FG_BINDS||{};');
        rule.replaceString = makeDirectStatusImages(rule.replaceString);
        rule.replaceString = makeStatusReadRawData(rule.replaceString);
      }
      if (name.includes('\u9009\u9879\u680f')) rule.findRegex = String(rule.findRegex).split('\\|').join('[|\uff5c]');
      rule.replaceString = compact(rule.replaceString);
      if (rule.replaceString.length > 19800) throw new Error((rule.scriptName || '\u672a\u547d\u540d\u89c4\u5219') + ' \u8d85\u8fc7 19800 \u5b57\u7b26');
    }
    return pack;
  };

  try {
    renderExport();
    schedulePreview();
  } catch (_) {}
})();

</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能代码分段工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }
        .input-area, .setting-area, .result-area {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        h3 {
            margin-bottom: 10px;
            color: #333;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
            font-size: 14px;
        }
        .setting-area input {
            width: 100px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-right: 10px;
        }
        button {
            padding: 8px 20px;
            background-color: #409eff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #66b1ff;
        }
        .result-item {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        .result-item p {
            margin-bottom: 5px;
            color: #666;
            font-size: 13px;
        }
        .result-item textarea {
            height: 150px;
            margin-top: 5px;
        }
        .tip {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 文本输入区 -->
        <div class="input-area">
            <h3>1. 输入需要分段的代码/文本</h3>
            <textarea id="sourceText" placeholder="请粘贴需要分段的代码/文本（如3万字代码）..."></textarea>
        </div>

        <!-- 设置区 -->
        <div class="setting-area">
            <h3>2. 设置单段最大字数</h3>
            <input type="number" id="maxWordCount" value="9000" min="1" placeholder="单段最大字数">
            <button id="splitBtn">开始智能分段</button>
            <p class="tip">提示：优先在分号(;)处截断代码，避免语句被拆分，无分号则按字符数截断</p>
        </div>

        <!-- 结果展示区 -->
        <div class="result-area">
            <h3>3. 分段结果</h3>
            <div id="resultContainer"></div>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const sourceText = document.getElementById('sourceText');
        const maxWordCount = document.getElementById('maxWordCount');
        const splitBtn = document.getElementById('splitBtn');
        const resultContainer = document.getElementById('resultContainer');

        // 智能分段核心函数（优先分号截断）
        function smartSplitText(text, maxCount) {
            // 去除文本前后空格，避免空字符干扰
            text = text.trim();
            const result = [];
            let currentIndex = 0;
            const totalLength = text.length;

            // 循环截取文本，直到处理完所有内容
            while (currentIndex < totalLength) {
                // 计算本次初步截断位置（不超过总长度）
                let endIndex = Math.min(currentIndex + maxCount, totalLength);
                
                // 智能调整：向前查找最近的分号
                if (endIndex < totalLength) { // 不是最后一段才需要智能调整
                    // 从初步截断位置向前找分号，范围限定在当前段内（避免跨段找）
                    const semicolonIndex = text.lastIndexOf(';', endIndex);
                    
                    // 如果找到的分号在当前起始位置之后，就以分号+1作为截断点（包含分号）
                    if (semicolonIndex > currentIndex) {
                        endIndex = semicolonIndex + 1;
                    }
                }

                // 截取对应区间的文本
                const segment = text.substring(currentIndex, endIndex);
                result.push(segment);
                // 更新起始位置，处理下一段
                currentIndex = endIndex;
            }

            return result;
        }

        // 绑定按钮点击事件
        splitBtn.addEventListener('click', function() {
            // 验证输入
            const text = sourceText.value;
            const count = parseInt(maxWordCount.value);

            if (!text) {
                alert('请先输入需要分段的文本/代码！');
                return;
            }
            if (isNaN(count) || count < 1) {
                alert('请输入有效的单段最大字数（正整数）！');
                return;
            }

            // 执行智能分段
            const segments = smartSplitText(text, count);

            // 清空结果区，准备展示新结果
            resultContainer.innerHTML = '';

            // 渲染分段结果
            segments.forEach((segment, index) => {
                const segmentItem = document.createElement('div');
                segmentItem.className = 'result-item';
                // 展示段落序号、实际字数，以及分段后的文本
                segmentItem.innerHTML = `
                    <p>第 ${index + 1} 段（实际字数：${segment.length}）</p>
                    <textarea readonly>${segment}</textarea>
                `;
                resultContainer.appendChild(segmentItem);
            });

            // 提示分段完成
            alert(`智能分段完成！共分割为 ${segments.length} 段，优先在分号处截断`);
        });
    </script>
</body>
</html>

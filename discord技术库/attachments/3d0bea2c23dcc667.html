<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>角色创作工具箱 · Character Forge</title>
<style>
:root {
  --bg: #1a1a2e;
  --cardBg: #16213e;
  --accent: #e94560;
  --text: #e0e0e0;
  --text2: #a0a0b0;
  --border: #2a2a4a;
  --tagBg: #e9456020;
  --tagColor: #e94560;
  --radius: 12px;
  --transition: 0.2s ease;
}
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  display: flex;
  flex-direction: column;
}

/* ===== 顶部导航 ===== */
.cf-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--cardBg);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.cf-header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.cf-logo {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
}
.cf-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}
.cf-header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
.cf-style-select {
  background: var(--cardBg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 12px;
  border-radius: var(--radius);
  font-size: 13px;
  cursor: pointer;
  outline: none;
}

/* ===== 主布局 ===== */
.cf-main {
  display: flex;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

/* ===== 左侧模块选择面板 ===== */
.cf-sidebar {
  width: 340px;
  flex-shrink: 0;
  background: var(--cardBg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.cf-sidebar-section {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.cf-sidebar-section h3 {
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.cf-sidebar-section h3 .cat-icon {
  font-size: 16px;
}
/* ===== 模块标签卡片 ===== */
.cf-module-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  background: var(--tagBg);
  color: var(--tagColor);
  border-radius: 20px;
  font-size: 12px;
  line-height: 1.3;
  cursor: pointer;
  transition: var(--transition);
  border: 1px solid transparent;
  white-space: nowrap;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.cf-module-tag:hover {
  filter: brightness(1.2);
}
.cf-module-tag.selected {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
}
.cf-cat-badge {
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 10px;
  min-width: 20px;
  text-align: center;
}
.cf-module-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 6px;
}

/* ===== 右侧主面板 ===== */
.cf-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}

/* ===== 标签栏 ===== */
.cf-tabs {
  display: flex;
  background: var(--cardBg);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.cf-tab {
  padding: 10px 20px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text2);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: var(--transition);
  background: none;
  border: none;
  outline: none;
}
.cf-tab:hover {
  color: var(--text);
}
.cf-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* ===== 内容区 ===== */
.cf-content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px;
  min-height: 0;
}
.cf-tab-content {
  display: none;
}
.cf-tab-content.active {
  display: block;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  flex: 1;
  min-height: 0;
  padding: 16px;
}
/* 卡片生成 iframe 需要撑满不padding */
#tab-cardmaker {
  padding: 0;
}
#tab-cardmaker iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
  min-height: 400px;
}

/* ===== 设置区 ===== */
.cf-section {
  margin-bottom: 20px;
}

/* ===== 输入/文本区 ===== */
.cf-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.cf-field label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text2);
  min-width: 80px;
}
.cf-field input, .cf-field textarea, .cf-field select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  border-radius: var(--radius);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  width: 100%;
}
.cf-field textarea {
  min-height: 80px;
  resize: vertical;
}

/* ===== 按钮 ===== */
.cf-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 18px;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  border: 1px solid var(--border);
  background: var(--cardBg);
  color: var(--text);
  white-space: nowrap;
}
.cf-btn-primary {
  background: var(--accent);
  color: #fff;
  border: none;
}
.cf-btn-secondary {
  background: transparent;
  border: 1px solid var(--border);
}

/* ===== 预览区 ===== */
.cf-preview-area {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  min-height: 200px;
  overflow-x: auto;
}
.cf-preview-area pre {
  font-family: 'SF Mono', 'Monaco', 'Menlo', monospace;
  font-size: 13px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-all;
  color: var(--text);
  margin: 0;
}

/* ===== 底部操作栏 ===== */
.cf-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--cardBg);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  gap: 10px;
}
.cf-selected-count {
  font-size: 12px;
  color: var(--text2);
}

/* ===== 弹窗模态 ===== */
.cf-modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 1000;
  justify-content: center;
  align-items: center;
}
.cf-modal-overlay.show {
  display: flex;
}
.cf-modal {
  background: var(--cardBg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  max-width: 640px;
  width: 90vw;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
.cf-modal h3 {
  font-size: 16px;
  margin-bottom: 16px;
}
.cf-modal textarea {
  width: 100%;
  min-height: 120px;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px;
  font-family: monospace;
  font-size: 13px;
  resize: vertical;
}


/* ===== 卡片生成全屏模式 ===== */
body.cf-cardmaker-mode .cf-header,
body.cf-cardmaker-mode .cf-sidebar,
body.cf-cardmaker-mode .cf-footer {
  display: none !important;
}
body.cf-cardmaker-mode .cf-panel {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--bg);
}
body.cf-cardmaker-mode .cf-panel .cf-tabs {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 200;
  border-bottom: 1px solid var(--border);
  background: var(--cardBg);
}
body.cf-cardmaker-mode .cf-panel .cf-tabs .cf-tab {
  padding: 8px 14px;
  font-size: 13px;
}
body.cf-cardmaker-mode #tab-cardmaker {
  display: block;
  position: fixed;
  top: 38px;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 0;
  overflow: hidden;
  background: #0f1115;
}
body.cf-cardmaker-mode #tab-cardmaker iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* ===== 响应式：移动端 ===== */
@media (max-width: 768px) {
  .cf-sidebar {
    width: 100%;
    max-height: 45vh;
    border-right: none;
    border-bottom: 1px solid var(--border);
    flex-shrink: 1;
  }
  .cf-main {
    flex-direction: column;
  }
  .cf-header {
    padding: 8px 12px;
  }
  .cf-logo { font-size: 17px; }
  .cf-title { font-size: 13px; }
  .cf-module-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .cf-module-tag {
    padding: 7px 10px;
    font-size: 13px;
    justify-content: center;
  }
  .cf-sidebar-section {
    padding: 10px 12px;
  }
  .cf-sidebar-section h3 {
    font-size: 12px;
    margin-bottom: 8px;
  }
  .cf-tab {
    padding: 6px 10px;
    font-size: 12px;
  }
  .cf-footer {
    padding: 8px 12px;
    gap: 6px;
  }
  .cf-btn {
    padding: 8px 14px;
    font-size: 13px;
  }
  body.cf-cardmaker-mode .cf-panel .cf-tabs {
    padding: 0;
  }
  body.cf-cardmaker-mode .cf-panel .cf-tabs .cf-tab {
    padding: 6px 10px;
    font-size: 12px;
  }
}

</style>
</head>

 + 特殊台词\n- Lv.4 永恒：{bond_lv4_name} — 解锁终极羁绊技 + 专属剧情线\n羁绊值获取：\n- 共同战斗 +{battle_bond}\n- 对话选择 +{dialogue_bond}\n- 赠送礼物 +{gift_bond}\n- 关键剧情 +{story_bond}\n羁绊技能：每段羁绊解锁独特技能（战斗/辅助/剧情向）\n输出：每段羁绊的完整描述 + 技能树 + 解锁条件。",defaultFields:["羁绊等级","羁绊值获取","羁绊技能","解锁条件","专属剧情"]},"trust-system":{id:"trust-system",name:"信任系统",icon:"🛡️",category:"systems",categoryName:"数值系统",description:"角色间信任值的建立、破坏与修复",systemTags:["信任","背叛","修复"],promptTemplate:"【信任系统】\n为{name}建立信任机制：\n信任维度：\n- 能力信任(0~100)：相信对方能完成任务\n- 品格信任(0~100)：相信对方不会背叛\n- 信息信任(0~100)：愿意分享秘密的程度\n信任阶段：\n- 怀疑 0~20：验证每一句话\n- 观察 21~40：有限合作，保留底牌\n- 认可 41~60：正常合作，分享一般信息\n- 信赖 61~80：委托重要任务，分享个人秘密\n- 绝对信任 81~100：性命相托，全盘托出\n背叛机制：\n- 背叛导致信任暴跌（-30~70）\n- 背叛后进入\"信任废墟\"状态（上限锁定50%）\n- 修复需要连续正面行为积累（速度减半）\n- 二次背叛 → 永久锁定上限25%\n输出：三维信任矩阵 + 阶段描述 + 背叛/修复规则。",defaultFields:["信任维度","信任阶段","背叛机制","修复规则","信任矩阵"]}};

const OUTPUT_MODES=[{id:"role-prompt",name:"角色创建提示词",icon:"✨",desc:"AI可直接执行的完整角色创建prompt"},{id:"card-v2",name:"角色卡 JSON (v2/MMD)",icon:"🃏",desc:"chara_card_v2格式，兼容MMD平台"},{id:"card-v3",name:"角色卡 JSON (v3/酒馆)",icon:"🎴",desc:"chara_card_v3格式，兼容SillyTavern"},{id:"worldbook",name:"世界书条目",icon:"📚",desc:"结构化世界书条目JSON"},{id:"statusbar",name:"状态栏规则",icon:"📊",desc:"含渲染正则+生成规则的完整状态栏"},{id:"full-package",name:"完整套件",icon:"📦",desc:"角色卡+世界书+状态栏+正则 一键打包"}];
const STYLE_PRESETS=[{id:"dark-game",name:"暗色游戏风",bg:"#1a1a2e",cardBg:"#16213e",accent:"#e94560",text:"#e0e0e0",textSecondary:"#a0a0b0",border:"#2a2a4a",tagBg:"#e9456020",tagColor:"#e94560"},{id:"soft-ui",name:"柔和UI风",bg:"#f8fafc",cardBg:"#ffffff",accent:"#6366f1",text:"#1e293b",textSecondary:"#64748b",border:"#e2e8f0",tagBg:"#6366f110",tagColor:"#6366f1"},{id:"cyberpunk",name:"赛博朋克",bg:"#0a0a0a",cardBg:"#111111",accent:"#00ff88",text:"#cccccc",textSecondary:"#666666",border:"#00ff8830",tagBg:"#00ff8815",tagColor:"#00ff88"},{id:"ancient-chinese",name:"拟物古风",bg:"#f5e6d3",cardBg:"#faf3e6",accent:"#8b4513",text:"#3c2415",textSecondary:"#8b7355",border:"#d4c4a8",tagBg:"#8b451310",tagColor:"#8b4513"},{id:"neon-glow",name:"霓虹发光",bg:"#0d0221",cardBg:"#150530",accent:"#ff2d95",text:"#e0d0ff",textSecondary:"#8060c0",border:"#ff2d9530",tagBg:"#ff2d9515",tagColor:"#ff2d95",extraCSS:"text-shadow: 0 0 10px var(--accent);"}];

<script>
// ===== 运行时状态 =====
const state = {
  selectedModules: new Set(),
  charName: '新角色',
  activeTab: 'settings',
  stylePreset: 'dark-game',
  moduleConfigs: {}
};

// ===== 初始化 =====
function init() {
  renderModuleSections();
  switchTab('settings');
  applyStylePreset('dark-game');
  updateSelectedCount();
}

// ===== 渲染模块选择区（可折叠分类） =====
function renderModuleSections() {
  const container = document.getElementById('moduleSections');
  let html = '';

  CATEGORIES.forEach((cat, i) => {
    var isOpen = state.sectionOpen[cat.id] !== false;
    // 首次渲染时默认只开第一个
    if (state.sectionOpen[cat.id] === undefined) {
      isOpen = (i === 0);
      state.sectionOpen[cat.id] = isOpen;
    }
    var activeCountInCat = cat.modules.filter(function(id){ return state.selectedModules.has(id); }).length;

    html += '<div class="cf-sidebar-section">';
    html += '<h3 class="cf-cat-header" onclick="toggleCategory(\'' + cat.id + '\')" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;">';
    html += '<span><span class="cat-icon">' + cat.icon + '</span> ' + cat.name + '</span>';
    html += '<span style="display:flex;align-items:center;gap:8px;">';
    if (activeCountInCat > 0) {
      html += '<span class="cf-cat-badge">' + activeCountInCat + '</span>';
    }
    html += '<span class="cf-cat-arrow" id="catArrow_' + cat.id + '" style="font-size:12px;transition:0.2s;color:var(--text2);">' + (isOpen ? '▲' : '▼') + '</span>';
    html += '</span></h3>';
    html += '<div class="cf-module-grid" id="catGrid_' + cat.id + '" style="display:' + (isOpen ? 'grid' : 'none') + ';">';

    cat.modules.forEach(function(modId) {
      var mod = ALL_MODULES[modId];
      if (!mod) return;
      html += '<span class="cf-module-tag" data-module="' + mod.id + '" onclick="toggleModule(this)" title="' + mod.description.replace(/"/g, '&quot;') + '">';
      html += mod.icon + ' ' + mod.name;
      html += '</span>';
    });

    html += '</div></div>';
  });

  container.innerHTML = html;
}

// ===== 状态：分类折叠 =====
if (!state.sectionOpen) state.sectionOpen = {};

// ===== 切换分类折叠 =====
function toggleCategory(catId) {
  state.sectionOpen[catId] = !state.sectionOpen[catId];
  var grid = document.getElementById('catGrid_' + catId);
  var arrow = document.getElementById('catArrow_' + catId);
  if (grid) grid.style.display = state.sectionOpen[catId] ? 'grid' : 'none';
  if (arrow) arrow.textContent = state.sectionOpen[catId] ? '▲' : '▼';
}

// ===== 切换模块选择 =====
function toggleModule(el) {
  const modId = el.dataset.module;
  if (state.selectedModules.has(modId)) {
    state.selectedModules.delete(modId);
    el.classList.remove('selected');
  } else {
    state.selectedModules.add(modId);
    el.classList.add('selected');
  }
  updateSelectedCount();
  updatePreview();
  // 如果在设置标签页，刷新配置卡片
  if (state.activeTab === 'settings') renderSettings();
}

// ===== 更新选中计数 =====
function updateSelectedCount() {
  document.getElementById('selectedCount').textContent =
    `已选 ${state.selectedModules.size} 个模块`;
}

// ===== 全部重置 =====
function resetAllModules() {
  state.selectedModules.clear();
  state.moduleConfigs = {};
  document.querySelectorAll('.cf-module-tag.selected').forEach(el => el.classList.remove('selected'));
  updateSelectedCount();
  updatePreview();
  if (state.activeTab === 'settings') renderSettings();
}

// ===== 应用风格预设 =====
function applyStylePreset(presetId) {
  const preset = STYLE_PRESETS.find(p => p.id === presetId);
  if (!preset) return;

  state.stylePreset = presetId;
  const root = document.documentElement;

  // CSS变量
  root.style.setProperty('--bg', preset.bg);
  root.style.setProperty('--cardBg', preset.cardBg);
  root.style.setProperty('--accent', preset.accent);
  root.style.setProperty('--text', preset.text);
  root.style.setProperty('--text2', preset.textSecondary);
  root.style.setProperty('--border', preset.border);
  root.style.setProperty('--tagBg', preset.tagBg);
  root.style.setProperty('--tagColor', preset.tagColor);

  // 处理extraCSS
  const existingExtra = document.getElementById('preset-extra-css');
  if (existingExtra) existingExtra.remove();
  if (preset.extraCSS) {
    const styleEl = document.createElement('style');
    styleEl.id = 'preset-extra-css';
    styleEl.textContent = `.cf-module-tag.selected { ${preset.extraCSS} }`;
    document.head.appendChild(styleEl);
  }
}

// ===== 切换标签页 =====
function switchTab(tabName) {
  state.activeTab = tabName;

  // 更新标签样式
  document.querySelectorAll('.cf-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tabName);
  });

  // 更新内容区
  document.querySelectorAll('.cf-tab-content').forEach(c => {
    c.classList.toggle('active', c.id === `tab-${tabName}`);
  });

  // 卡片生成模式：全屏
  var isCardmaker = tabName === 'cardmaker';
  document.body.classList.toggle('cf-cardmaker-mode', isCardmaker);
  // 隐藏其他标签内容
  if (isCardmaker) {
    document.getElementById('tab-settings').classList.remove('active');
    document.getElementById('tab-preview').classList.remove('active');
    document.getElementById('tab-cardmaker').classList.add('active');
    var f = document.getElementById('cardmakerFrame');
    if (f && !f.src) loadCardmakerFrame();
  }

  if (tabName === 'settings') {
    renderSettings();
  } else if (tabName === 'preview') {
    updatePreview();
  } else if (isCardmaker) {
    // 确保 iframe 已加载（首次切换到卡片生成时 blob URL 已就绪）
    var f = document.getElementById('cardmakerFrame');
    if (f && !f.src) {
      loadCardmakerFrame();
    }
  }
}

// ===== 渲染设置面板 =====
function renderSettings() {
  const container = document.getElementById('settingsContent');
  let html = '';

  // 输出形态
  html += `<div class="cf-section">`;
  html += `<h3>📦 输出形态</h3>`;
  html += `<div class="cf-module-grid" style="margin-bottom:16px;">`;
  OUTPUT_MODES.forEach(mode => {
    html += `<span class="cf-module-tag" data-mode="${mode.id}" onclick="selectOutputMode(this)" title="${mode.desc}">`;
    html += `${mode.icon} ${mode.name}`;
    html += `</span>`;
  });
  html += `</div></div>`;

  // 角色名
  html += `<div class="cf-section">`;
  html += `<h3>👤 角色名称</h3>`;
  html += `<div class="cf-field">`;
  html += `<input type="text" id="charNameSetting" placeholder="输入角色名（如：白羽、Saber）" value="${state.charName}" onchange="updateCharName(this.value)">`;
  html += `</div></div>`;

  // ---- 已选模块配置区 ----
  const selectedIds = Array.from(state.selectedModules);
  if (selectedIds.length > 0) {
    html += `<div class="cf-section">`;
    html += `<h3>🔧 已选模块配置</h3>`;
    html += `<div style="display:flex;flex-direction:column;gap:10px;">`;

    selectedIds.forEach(modId => {
      const mod = ALL_MODULES[modId];
      if (!mod) return;
      const modState = state.moduleConfigs[modId] || {};

      html += `<div class="cf-module-config-card" style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;" onclick="toggleModuleConfig('${modId}')">`;
      html += `<div style="display:flex;align-items:center;justify-content:space-between;">`;
      html += `<span style="font-weight:600;font-size:14px;">${mod.icon} ${mod.name}</span>`;
      html += `<span style="font-size:18px;color:var(--text2);transform:${modState._expanded ? 'rotate(180deg)' : 'rotate(0deg)'};transition:0.2s;" id="modArrow_${modId}">▼</span>`;
      html += `</div>`;
      html += `<div style="font-size:12px;color:var(--text2);margin-top:4px;">${mod.description}</div>`;

      // 展开的配置项
      html += `<div id="modConfig_${modId}" style="display:${modState._expanded ? 'block' : 'none'};margin-top:12px;">`;

      // 根据模块类型生成配置项
      if (mod.defaultFields) {
        mod.defaultFields.forEach(field => {
          const fieldKey = field.replace(/\s+/g, '_');
          const val = modState[fieldKey] || '';
          html += `<div class="cf-field" style="margin-bottom:8px;" onclick="event.stopPropagation()">`;
          html += `<label>${field}</label>`;
          html += `<input type="text" placeholder="${field}" value="${escapeAttr(val)}" onchange="updateModuleConfig('${modId}','${fieldKey}',this.value)">`;
          html += `</div>`;
        });
      }

      // 通用开关：是否在此模块中启用tavern-mmd规范
      html += `<div class="cf-field" style="margin-bottom:8px;" onclick="event.stopPropagation()">`;
      html += `<label>附加 tavern-mmd 规范</label>`;
      html += `<select onchange="updateModuleConfig('${modId}','tavernCompat',this.value)" style="width:auto;">`;
      html += `<option value="none" ${modState.tavernCompat === 'none' ? 'selected' : ''}>不附加</option>`;
      html += `<option value="lite" ${modState.tavernCompat === 'lite' ? 'selected' : ''}>轻量（绝对零度+具体性）</option>`;
      html += `<option value="full" ${modState.tavernCompat === 'full' ? 'selected' : ''}>完整（含八股检查+输出规范）</option>`;
      html += `</select></div>`;

      html += `</div>`; // modConfig
      html += `</div>`; // mod-config-card
    });

    html += `</div></div>`;
  }

  // 附加要求
  html += `<div class="cf-section">`;
  html += `<h3>📝 附加要求</h3>`;
  html += `<div class="cf-field">`;
  html += `<textarea id="extraReqSetting" placeholder="额外的自定义指令（可选），将追加到提示词末尾&#10;如：使用ES6箭头函数、禁止主观评价、启用具体性检查...">`;
  html += `</textarea></div></div>`;

  container.innerHTML = html;
}

// ===== 模块配置展开/折叠 =====
function toggleModuleConfig(modId) {
  if (!state.moduleConfigs[modId]) {
    state.moduleConfigs[modId] = {};
  }
  state.moduleConfigs[modId]._expanded = !state.moduleConfigs[modId]._expanded;

  const configDiv = document.getElementById('modConfig_' + modId);
  const arrow = document.getElementById('modArrow_' + modId);
  if (configDiv) {
    configDiv.style.display = state.moduleConfigs[modId]._expanded ? 'block' : 'none';
  }
  if (arrow) {
    arrow.style.transform = state.moduleConfigs[modId]._expanded ? 'rotate(180deg)' : 'rotate(0deg)';
  }
}

// ===== 更新模块配置值 =====
function updateModuleConfig(modId, fieldKey, value) {
  if (!state.moduleConfigs[modId]) {
    state.moduleConfigs[modId] = {};
  }
  state.moduleConfigs[modId][fieldKey] = value;
  updatePreview();
}

// ===== HTML属性转义 =====
function escapeAttr(str) {
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ===== 选择输出形态 =====
function selectOutputMode(el) {
  const modeId = el.dataset.mode;
  // 单选逻辑：取消其他，选中当前
  document.querySelectorAll('.cf-module-tag[data-mode]').forEach(t => {
    if (t.dataset.mode === modeId) {
      t.classList.add('selected');
    } else {
      t.classList.remove('selected');
    }
  });
  updatePreview();
}

// ===== 更新角色名 =====
function updateCharName(name) {
  state.charName = name || '新角色';
  updatePreview();
}

// ===== 更新预览区 =====
function updatePreview() {
  const previewEl = document.getElementById('previewContent');
  const selectedIds = Array.from(state.selectedModules);

  if (selectedIds.length === 0) {
    previewEl.innerHTML = '<pre>请在左侧选择模块，勾选后在此处预览生成的提示词。</pre>';
    return;
  }

  // 获取选中的模块
  const selectedMods = selectedIds.map(id => ALL_MODULES[id]).filter(Boolean);

  // 获取角色名
  const charName = state.charName || '新角色';

  // 获取输出形态
  const outputModeEl = document.querySelector('.cf-module-tag.selected[data-mode]');
  const outputMode = outputModeEl ? outputModeEl.dataset.mode : 'role-prompt';

  // 获取额外要求
  const extraReq = document.getElementById('extraReqSetting')?.value || '';

  // 获取风格
  const stylePreset = state.stylePreset;

  // 生成提示词
  const prompt = buildPrompt(selectedMods, charName, outputMode, extraReq, stylePreset);

  previewEl.innerHTML = `<pre>${escapeHtml(prompt)}</pre>`;
}

// ===== 构建提示词 =====
function buildPrompt(modules, charName, outputMode, extraReq, stylePreset) {
  const lines = [];

  lines.push(`你是一个专业的角色创建助手。请根据以下模块要求，为「${charName}」生成完整的角色设定。`);
  lines.push('');

  // ---- 全局 tavern-mmd 创作规范 ----
  const hasTavernCompat = Object.values(state.moduleConfigs).some(c => c.tavernCompat === 'full' || c.tavernCompat === 'lite');
  if (hasTavernCompat) {
    lines.push('【创作规范】');
    lines.push('请严格遵循以下规则编写所有内容：');
    lines.push('- 绝对零度原则：删除主观评价和判断、陈旧比喻、堆砌形容词');
    lines.push('- 具体性检查：抽象→具体行为，标签→行为展现');
    lines.push('- 无八股：禁止模糊词（似乎/仿佛/宛如）、八股微表情（嘴角微微上扬/眼中闪过一丝）');
    lines.push('- 全文简体中文，禁止占位符（"某城市""某组织"等）');
    lines.push('- 数据库格式优先：列表和键值对，不用散文段落');
    lines.push('');
  }

  lines.push('---');

  // ===== 按类别分组，杂揉拼接 =====
  const grouped = {};
  modules.forEach(mod => {
    const cat = mod.categoryName;
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(mod);
  });

  // 输出每个类别
  for (const [catName, catMods] of Object.entries(grouped)) {
    lines.push('');
    lines.push(`## ${catName}`);
    lines.push(`> 以下${catMods.length}个模块已杂揉为一个协调整体。各模块互相补充、避免重复。`);

    // 准备变量替换表
    const configs = {};
    catMods.forEach(mod => {
      configs[mod.id] = state.moduleConfigs[mod.id] || {};
    });

    catMods.forEach(mod => {
      lines.push('');
      lines.push(`### ${mod.name}`);

      // 替换模板变量
      let tpl = mod.promptTemplate;
      tpl = tpl.replace(/\{name\}/g, charName);
      tpl = tpl.replace(/\{seed\}/g, Math.random().toString(36).substring(2, 8));
      tpl = tpl.replace(/\{template\}/g, '标准角色模板');
      tpl = tpl.replace(/\{count\}/g, '3');
      tpl = tpl.replace(/\{constraints\}/g, '无特殊限制');

      // 用配置字段替换模板
      const modCfg = configs[mod.id] || {};
      if (mod.defaultFields) {
        mod.defaultFields.forEach(field => {
          const fieldKey = field.replace(/\s+/g, '_');
          const val = modCfg[fieldKey];
          if (val) {
            const pattern = new RegExp(
              '\\{' + field.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\}', 'gi'
            );
            tpl = tpl.replace(pattern, val);
          }
        });
      }

      // tavern兼容模式：追加规范提醒
      if (modCfg.tavernCompat === 'full') {
        tpl += '\n\n（以上内容需遵循 tavern-mmd 创作规范：绝对零度+具体性+无八股+简体中文+数据库格式。）';
      } else if (modCfg.tavernCompat === 'lite') {
        tpl += '\n\n（以上内容需遵循：无主观评价、无模糊词、具体行为展现。）';
      }

      lines.push('');
      lines.push(tpl);
    });

    // 该类别内的交叉融合指令
    if (catMods.length > 1) {
      lines.push('');
      lines.push(`### 内部融合`);
      lines.push('请将上述模块输出内容进行交叉融合：');
      lines.push('- 共享字段统一（如「角色数据库」和「角色档案」中的基础信息保持一致）');
      lines.push('- 互补内容补充（如「关系图谱」的节点作为「人物关系网」的矩阵输入）');
      lines.push('- 去除重复条目，保留最完整版本');
    }
  }

  // ===== 跨板块融合 =====
  const allCategories = Object.keys(grouped);
  if (allCategories.length > 1) {
    lines.push('');
    lines.push('---');
    lines.push('');
    lines.push('## 跨板块全局融合');
    lines.push('以下板块之间存在交叉依赖，请确保数据一致性：');
    if (allCategories.includes('角色数据库') && allCategories.includes('关系网络')) {
      lines.push('- 「角色数据库」中的角色节点应为「关系网络」中各图谱的基础节点');
    }
    if (allCategories.includes('角色数据库') && allCategories.includes('数值系统')) {
      lines.push('- 「角色数据库」中的角色ID应与「数值系统」（好感度/羁绊/信任）中的角色引用一致');
    }
    if (allCategories.includes('关系网络') && allCategories.includes('数值系统')) {
      lines.push('- 「关系网络」中的关系强度应映射到「数值系统」中的具体数值范围');
    }
  }

  // ===== 输出形态处理 =====
  if (outputMode === 'card-v2' || outputMode === 'card-v3') {
    lines.push('');
    lines.push('---');
    lines.push('');
    lines.push('【输出格式要求】');
    lines.push(`请以 chara_card_${outputMode === 'card-v2' ? 'v2' : 'v3'} 格式输出完整的角色卡JSON。`);
    lines.push('包含字段：name, description, personality, scenario, first_mes');
    if (outputMode === 'card-v2') {
      lines.push('v2格式说明：spec设为chara_card_v2，spec_version设为2.0，不包含group_only_greetings字段。');
    }
  } else if (outputMode === 'worldbook') {
    lines.push('');
    lines.push('---');
    lines.push('');
    lines.push('【输出格式要求】');
    lines.push('请输出结构化的世界书条目JSON数组。');
    lines.push('每条目包含：id, keys, comment, content, constant, selective, position, insertion_order');
    lines.push('条目规则：蓝灯(constant=true)用于常驻规则，绿灯(constant=false)用于关键词触发。');
  } else if (outputMode === 'statusbar') {
    lines.push('');
    lines.push('---');
    lines.push('');
    lines.push('【输出格式要求】');
    lines.push('请输出状态栏的完整方案：');
    lines.push('1. 渲染正则（findRegex + replaceString，MMD 4字段格式）');
    lines.push('2. 生成规则（模型侧协议：要求AI每轮在正文末尾输出<status>数据块）');
    lines.push('3. 手填清单（Markdown格式备选）');
    lines.push('4. 生成规则必须放进世界书（constant=true蓝灯）');
  } else if (outputMode === 'full-package') {
    lines.push('');
    lines.push('---');
    lines.push('');
    lines.push('【输出格式要求】');
    lines.push('请输出完整套件（一体打包）：');
    lines.push('1. chara_card_v2 角色卡JSON（含内嵌character_book世界书条目）');
    lines.push('2. 状态栏正则JSON（data.extensions.regex_scripts数组，MMD 4字段格式）');
    lines.push('3. 状态栏生成规则（放入世界书第1条，constant=true蓝灯）');
    lines.push('4. 所有数值系统规则封装为世界书条目');
    lines.push('请完整打包，确保一次导入即可使用。');
  }

  // 附加要求
  if (extraReq) {
    lines.push('');
    lines.push('---');
    lines.push('');
    lines.push('【附加要求】');
    lines.push(extraReq);
  }

  // 风格说明
  const preset = STYLE_PRESETS.find(p => p.id === stylePreset);
  if (preset && preset.id !== 'dark-game') {
    lines.push('');
    lines.push('---');
    lines.push('');
    lines.push('【风格参考】');
    lines.push(`采用「${preset.name}」风格关键字：${preset.id}。角色设定与视觉描述请体现对应的风格特征。`);
  }

  return lines.join('\n');
}

// ===== HTML转义 =====
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== 生成提示词 =====
function generatePrompt() {
  if (state.selectedModules.size === 0) {
    showToast('请先在左侧选择至少一个模块');
    return;
  }

  // 检查是否需要角色名
  const needsCharName = ['card-v2', 'card-v3', 'worldbook', 'statusbar', 'full-package'].includes(
    document.querySelector('.cf-module-tag.selected[data-mode]')?.dataset?.mode
  );

  if (needsCharName && !state.charName) {
    document.getElementById('modalCharName').classList.add('show');
    document.getElementById('charNameInput').focus();
    return;
  }

  doGenerate();
}

function doGenerate() {
  const selectedIds = Array.from(state.selectedModules);
  const selectedMods = selectedIds.map(id => ALL_MODULES[id]).filter(Boolean);
  const charName = state.charName || '新角色';
  const outputModeEl = document.querySelector('.cf-module-tag.selected[data-mode]');
  const outputMode = outputModeEl ? outputModeEl.dataset.mode : 'role-prompt';
  const extraReq = document.getElementById('extraReqSetting')?.value || '';
  const stylePreset = state.stylePreset;

  const prompt = buildPrompt(selectedMods, charName, outputMode, extraReq, stylePreset);

  // 显示成功弹窗
  document.getElementById('successPreview').innerHTML = `<pre>${escapeHtml(prompt)}</pre>`;
  document.getElementById('modalSuccess').classList.add('show');
}

// ===== 复制提示词 =====
function copyPrompt() {
  if (state.selectedModules.size === 0) {
    showToast('请先在左侧选择至少一个模块');
    return;
  }
  generatePrompt();
  const text = document.querySelector('#successPreview pre')?.textContent;
  if (text) {
    copyToClipboard(text);
    showToast('✅ 已复制到剪贴板');
  }
}

function copyFromSuccess() {
  const text = document.querySelector('#successPreview pre')?.textContent;
  if (text) {
    copyToClipboard(text);
    showToast('✅ 已复制到剪贴板');
  }
}

// ===== 导出JSON =====
function exportJSON() {
  if (state.selectedModules.size === 0) {
    showToast('请先在左侧选择至少一个模块');
    return;
  }
  showToast('JSON导出功能开发中...');
}

// ===== 确认角色名 =====
function confirmCharName() {
  const input = document.getElementById('charNameInput');
  const name = input.value.trim();
  if (!name) {
    showToast('请输入角色名');
    return;
  }
  state.charName = name;
  document.getElementById('modalCharName').classList.remove('show');
  generatePrompt();
  document.getElementById('modalSuccess').classList.add('show');
}

// ===== 关闭弹窗 =====
function closeModal(modalId) {
  document.getElementById(modalId).classList.remove('show');
}

function closeCharNameModal() { closeModal('modalCharName'); }
function closeSuccessModal() { closeModal('modalSuccess'); }

// ===== 复制到剪贴板 =====
function copyToClipboard(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
}

// ===== Toast提示 =====
function showToast(msg) {
  const toast = document.createElement('div');
  toast.style.cssText = `
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #fff;
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 9999;
    pointer-events: none;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s;
  `;
  toast.textContent = msg;
  document.body.appendChild(toast);
  requestAnimationFrame(() => {
    toast.style.opacity = '1';
    toast.style.transition = 'opacity 0.3s';
  });
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => document.body.removeChild(toast), 300);
  }, 2000);
}

// ===== 页面加载 =====
window.addEventListener('DOMContentLoaded', init);

// ===== 点击弹窗外关闭 =====
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('cf-modal-overlay')) {
    // 获取显示的模态
    const visibleModal = document.querySelector('.cf-modal-overlay.show');
    if (visibleModal && e.target === visibleModal) {
      // 检查是否来自关闭按钮
      const closeBtn = e.target.closest('.cf-btn-secondary');
      if (!closeBtn && !e.target.closest('.cf-modal')) {
        visibleModal.classList.remove('show');
      }
    }
  }
});

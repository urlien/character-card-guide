<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>彗星桌面精灵正式版</title>
<style>
*{box-sizing:border-box}:root{--line:rgba(148,163,184,.22);--text:#eef6ff;--muted:#9fb0c7}body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% 18%,rgba(244,114,182,.2),transparent 30%),radial-gradient(circle at 18% 12%,rgba(168,85,247,.2),transparent 30%),linear-gradient(135deg,#120b1d,#0f172a);color:var(--text);font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif}button,input,select,textarea{font-family:inherit}.app{display:grid;grid-template-columns:minmax(360px,1fr) 470px;gap:16px;padding:16px;min-height:100vh}.preview{position:relative;min-height:calc(100vh - 32px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.015)),repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 1px,transparent 1px 18px);box-shadow:0 22px 60px rgba(0,0,0,.38);overflow:hidden}.preview:before{content:"彗星桌面精灵预览：点击弹气泡 / 拖动移动 / 不展开菜单";position:absolute;left:20px;top:16px;color:rgba(226,232,240,.45);font-size:13px;letter-spacing:2px}.preview-note{position:absolute;left:18px;right:18px;bottom:18px;padding:12px 14px;border:1px solid rgba(148,163,184,.18);border-radius:16px;background:rgba(15,23,42,.55);color:#cbd5e1;font-size:12px;line-height:1.7}.editor{height:calc(100vh - 32px);overflow:auto;border:1px solid var(--line);border-radius:24px;background:rgba(15,23,42,.88);box-shadow:0 22px 60px rgba(0,0,0,.42)}.head{position:sticky;top:0;z-index:5;padding:16px;background:rgba(15,23,42,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}.title{font-size:20px;font-weight:900}.sub{margin-top:6px;color:var(--muted);font-size:12px;line-height:1.6}.tabs{display:flex;gap:7px;overflow:auto;padding-top:12px}.tab{white-space:nowrap;border:1px solid rgba(148,163,184,.22);background:rgba(30,41,59,.65);color:#dbeafe;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800;cursor:pointer}.tab.active{background:linear-gradient(135deg,#db2777,#7c3aed);color:white}.panel{display:none}.panel.active{display:block}.group{margin:13px;padding:14px;border:1px solid rgba(148,163,184,.18);border-radius:17px;background:rgba(30,41,59,.55)}.group h2{margin:0 0 12px;font-size:15px}.hint{margin:-4px 0 12px;color:#9fb0c7;font-size:12px;line-height:1.65}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.inline{display:flex;align-items:center;gap:8px;min-height:38px}label{font-size:12px;color:#cbd5e1}.desc{font-size:11px;color:#94a3b8;line-height:1.45}input,select,textarea{width:100%;border:1px solid rgba(148,163,184,.25);border-radius:11px;background:rgba(2,6,23,.42);color:#eef6ff;padding:9px 10px;outline:none}textarea{min-height:84px;resize:vertical;line-height:1.5}input[type=color]{height:38px;padding:3px}input[type=checkbox]{width:auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:12px;padding:10px 12px;background:linear-gradient(135deg,#db2777,#7c3aed);color:white;font-weight:900;cursor:pointer}.btn.gray{background:#334155}.export{height:240px;font-family:Consolas,monospace;font-size:12px;white-space:pre;overflow:auto}@keyframes pet-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes pet-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes pet-swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes pet-jelly{0%,100%{transform:scale(1)}30%{transform:scale(1.12,.88)}55%{transform:scale(.94,1.08)}}@keyframes pet-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@media(max-width:900px){.app{grid-template-columns:1fr;padding:10px}.preview{min-height:580px}.editor{height:auto}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><section class="preview" id="preview"><div class="preview-note">独立桌面精灵：没有菜单、没有功能按钮，只负责拖动、状态图、随机飘动、气泡。</div></section><aside class="editor"><div class="head"><div class="title">彗星桌面精灵正式版</div><div class="sub">保留状态图片、随机换人、纯图片、气泡、动画、拖动、导出；桌面精灵正式版，保留待机随机屏幕移动、状态图片、气泡、拖动和导出。</div><div class="tabs"><button class="tab active" data-tab="base">基础</button><button class="tab" data-tab="images">状态图片</button><button class="tab" data-tab="bubble">气泡</button><button class="tab" data-tab="behavior">行为</button><button class="tab" data-tab="anim">动画</button><button class="tab" data-tab="export">导出</button></div></div>
<div class="panel active" data-panel="base"><div class="group"><h2>基础</h2><div class="grid"><div class="field"><label>精灵尺寸</label><input id="petSize" type="number" value="100"></div><div class="field inline"><input id="pureImageMode" type="checkbox" checked><label>纯图片模式</label><div class="desc">背景、边框、阴影透明，只显示图片 URL。</div></div><div class="field"><label>默认停靠</label><select id="dockSide"><option value="right">右侧</option><option value="left">左侧</option></select></div><div class="field"><label>X距离</label><input id="posX" type="number" value="100"></div><div class="field"><label>Y百分比</label><input id="posY" type="number" value="50"></div><div class="field"><label>层级</label><input id="zIndex" type="number" value="99999"></div></div></div></div>
<div class="panel" data-panel="images"><div class="group"><h2>状态图片 URL</h2><div class="grid"><div class="field"><label>待机图片</label><input id="idleImage" value=""></div><div class="field"><label>悬停图片</label><input id="hoverImage" value=""></div><div class="field"><label>点击图片</label><input id="clickImage" value=""></div><div class="field"><label>拖动图片</label><input id="dragImage" value=""></div><div class="field"><label>睡觉图片</label><input id="sleepImage" value=""></div><div class="field"><label>随机状态图片，一行一个</label><textarea id="randomImages"></textarea></div><div class="field"><label>无图片背景1</label><input id="bg1" type="color" value="#f9a8d4"></div><div class="field"><label>无图片背景2</label><input id="bg2" type="color" value="#c084fc"></div></div></div></div>
<div class="panel" data-panel="bubble"><div class="group"><h2>气泡内容</h2><div class="grid"><div class="field"><label>点击气泡</label><input id="clickMsg" value="别戳啦。"></div><div class="field"><label>悬停气泡</label><input id="hoverMsg" value="我在这里。"></div><div class="field"><label>拖动气泡</label><input id="dragMsg" value="要带我去哪？"></div><div class="field"><label>睡觉气泡</label><input id="sleepMsg" value="有点困了……"></div><div class="field"><label>随机气泡，一行一句</label><textarea id="randomMsgs">今天也要加油。
我会在这里陪着你。
记得保存配置哦。</textarea></div><div class="field"><label>气泡图片 URL</label><input id="bubbleImage" value=""></div></div></div><div class="group"><h2>气泡样式</h2><div class="grid"><div class="field"><label>位置</label><select id="bubblePos"><option value="top">上方</option><option value="bottom">下方</option><option value="left">左侧</option><option value="right">右侧</option></select></div><div class="field"><label>宽度</label><input id="bubbleWidth" type="number" value="210"></div><div class="field"><label>背景</label><input id="bubbleBg" type="color" value="#ffffff"></div><div class="field"><label>文字色</label><input id="bubbleColor" type="color" value="#334155"></div><div class="field"><label>边框</label><input id="bubbleBorder" type="color" value="#fbcfe8"></div><div class="field"><label>显示秒数</label><input id="bubbleDuration" type="number" step="0.5" value="3"></div></div></div></div>
<div class="panel" data-panel="behavior"><div class="group"><h2>行为</h2><div class="hint">“待机随机移动”是真正换位置：精灵不操作时会在预览区域/屏幕内随机移动，不是只在原地飘一下。</div><div class="grid"><div class="field inline"><input id="draggable" type="checkbox" checked><label>允许拖动</label></div><div class="field inline"><input id="idleDrift" type="checkbox" checked><label>保留原地待机动画</label></div><div class="field inline"><input id="idleRoam" type="checkbox" checked><label>待机随机移动</label></div><div class="field"><label>随机移动范围</label><select id="roamMode"><option value="full">屏幕内随机移动</option><option value="local">当前位置附近移动</option></select></div><div class="field"><label>当前位置附近范围/px</label><input id="roamRange" type="number" value="180"></div><div class="field"><label>移动间隔/秒</label><input id="roamInterval" type="number" step="0.5" value="5"></div><div class="field"><label>移动耗时/秒</label><input id="roamDuration" type="number" step="0.1" value="1.4"></div><div class="field inline"><input id="pauseRoamOnHover" type="checkbox" checked><label>鼠标悬停时暂停移动</label></div><div class="field inline"><input id="randomSwitch" type="checkbox" checked><label>随机换状态/换人</label></div><div class="field inline"><input id="clickChange" type="checkbox" checked><label>点击切换点击图</label></div><div class="field inline"><input id="hoverChange" type="checkbox" checked><label>悬停切换悬停图</label></div><div class="field inline"><input id="dragChange" type="checkbox" checked><label>拖动切换拖动图</label></div><div class="field"><label>随机换状态间隔/秒</label><input id="changeInterval" type="number" step="0.5" value="5"></div></div></div></div>
<div class="panel" data-panel="anim"><div class="group"><h2>动画</h2><div class="grid"><div class="field"><label>待机动画</label><select id="idleAnim"><option value="float">漂浮</option><option value="pulse">心跳</option><option value="swing">摆动</option><option value="jelly">果冻</option><option value="bounce">弹跳</option><option value="none">无</option></select></div><div class="field"><label>速度</label><input id="animSpeed" type="number" step="0.1" value="2.8"></div><div class="field"><label>悬停放大</label><input id="hoverScale" type="number" step="0.01" value="1.06"></div></div></div></div>
<div class="panel" data-panel="export"><div class="group"><h2>导出</h2><div class="actions"><button class="btn" id="copyCode">复制导出代码</button><button class="btn gray" id="downloadCode">下载导出 HTML</button><button class="btn" id="saveConfig">保存配置</button><button class="btn gray" id="resetConfig">恢复默认</button></div><br><textarea id="exportCode" class="export" spellcheck="false"></textarea></div></div></aside></div>
<script>
const $=id=>document.getElementById(id);
const ids=["petSize","pureImageMode","dockSide","posX","posY","zIndex","idleImage","hoverImage","clickImage","dragImage","sleepImage","randomImages","bg1","bg2","clickMsg","hoverMsg","dragMsg","sleepMsg","randomMsgs","bubbleImage","bubblePos","bubbleWidth","bubbleBg","bubbleColor","bubbleBorder","bubbleDuration","draggable","idleDrift","idleRoam","roamMode","roamRange","roamInterval","roamDuration","pauseRoamOnHover","randomSwitch","clickChange","hoverChange","dragChange","changeInterval","idleAnim","animSpeed","hoverScale"];
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function url(u){return String(u||"").replace(/'/g,"%27").replace(/\)/g,"%29")}
function val(id){const e=$(id);if(!e)return "";return e.type==="checkbox"?e.checked:e.value}
function cfg(){let c={};ids.forEach(id=>c[id]=val(id));return c}
function lines(v){return String(v||"").split(/\n+/).map(x=>x.trim()).filter(Boolean)}
function animCss(a,s){const m={float:"pet-float",pulse:"pet-pulse",swing:"pet-swing",jelly:"pet-jelly",bounce:"pet-bounce"};return a==="none"?"":`animation:${m[a]||"pet-float"} ${s||2.8}s ease-in-out infinite;`}
function setTabs(){document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelector('[data-panel="'+b.dataset.tab+'"]').classList.add("active")})}
function buildPreview(){const c=cfg(),area=$("preview");area.querySelectorAll(".pet-root").forEach(x=>x.remove());const root=document.createElement("div");root.className="pet-root";root.style.cssText="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:50;user-select:none;";const pet=document.createElement("div");const size=+c.petSize||100;pet.style.cssText=`width:${size}px;height:${size}px;background:${c.idleImage?`url('${url(c.idleImage)}') center/contain no-repeat`:`linear-gradient(135deg,${c.bg1},${c.bg2})`};border:${c.pureImageMode?0:2}px solid ${c.bg1};border-radius:${c.pureImageMode?0:18}px;box-shadow:${c.pureImageMode?"none":"0 12px 28px rgba(0,0,0,.28)"};cursor:grab;transition:transform .2s;${animCss(c.idleAnim,c.animSpeed)}`;const bubble=document.createElement("div");bubble.style.cssText=`display:none;position:absolute;width:min(${c.bubbleWidth}px,82vw);padding:10px 12px;background:${c.bubbleBg};color:${c.bubbleColor};border:1px solid ${c.bubbleBorder};border-radius:16px;box-shadow:0 10px 26px rgba(0,0,0,.25);font-size:13px;line-height:1.55;white-space:pre-wrap;z-index:80;`;root.appendChild(pet);root.appendChild(bubble);area.appendChild(root);function posBubble(){bubble.style.left=bubble.style.right=bubble.style.top=bubble.style.bottom=bubble.style.transform="";if(c.bubblePos==="bottom"){bubble.style.top="calc(100% + 12px)";bubble.style.left="50%";bubble.style.transform="translateX(-50%)"}else if(c.bubblePos==="left"){bubble.style.right="calc(100% + 12px)";bubble.style.top="50%";bubble.style.transform="translateY(-50%)"}else if(c.bubblePos==="right"){bubble.style.left="calc(100% + 12px)";bubble.style.top="50%";bubble.style.transform="translateY(-50%)"}else{bubble.style.bottom="calc(100% + 12px)";bubble.style.left="50%";bubble.style.transform="translateX(-50%)"}}let timer;function say(t,img){clearTimeout(timer);bubble.innerHTML=(img?`<img src="${esc(img)}" style="width:100%;max-height:120px;object-fit:contain;margin-bottom:6px;">`:"")+esc(t||"");posBubble();bubble.style.display="block";timer=setTimeout(()=>bubble.style.display="none",(+c.bubbleDuration||3)*1000)}function setImg(u){if(u)pet.style.background=`url('${url(u)}') center/contain no-repeat`}pet.onclick=e=>{e.stopPropagation();if(c.clickChange)setImg(c.clickImage);say(c.clickMsg,c.bubbleImage)};pet.onmouseenter=()=>{hover=true;pet.style.transform=`scale(${c.hoverScale})`;if(c.hoverChange)setImg(c.hoverImage);if(c.hoverMsg)say(c.hoverMsg,"")};pet.onmouseleave=()=>{hover=false;pet.style.transform="scale(1)";setImg(c.idleImage)};let drag=false,hover=false,dx=0,dy=0;pet.onmousedown=e=>{if(!c.draggable)return;drag=true;pet.style.cursor="grabbing";const r=root.getBoundingClientRect(),ar=area.getBoundingClientRect();root.style.transform="none";root.style.left=r.left-ar.left+"px";root.style.top=r.top-ar.top+"px";dx=e.clientX-r.left;dy=e.clientY-r.top;if(c.dragChange)setImg(c.dragImage);say(c.dragMsg,"");e.stopPropagation()};document.onmousemove=e=>{if(!drag)return;const ar=area.getBoundingClientRect();root.style.transition="none";root.style.left=e.clientX-ar.left-dx+"px";root.style.top=e.clientY-ar.top-dy+"px"};document.onmouseup=()=>{if(drag){drag=false;pet.style.cursor="grab";setImg(c.idleImage)}};function ensurePx(){const r=root.getBoundingClientRect(),ar=area.getBoundingClientRect();root.style.transform="none";root.style.left=r.left-ar.left+"px";root.style.top=r.top-ar.top+"px"}function roam(){if(!root.isConnected)return;if(!c.idleRoam||drag||(hover&&c.pauseRoamOnHover))return;ensurePx();const pad=10,range=+c.roamRange||180,dur=Math.max(.1,+c.roamDuration||1.4),ar=area.getBoundingClientRect(),rw=root.offsetWidth||size,rh=root.offsetHeight||size,curX=parseFloat(root.style.left)||0,curY=parseFloat(root.style.top)||0;let nx,ny;if(c.roamMode==="local"){nx=curX+(Math.random()*2-1)*range;ny=curY+(Math.random()*2-1)*range}else{nx=pad+Math.random()*Math.max(1,area.clientWidth-rw-pad*2);ny=pad+Math.random()*Math.max(1,area.clientHeight-rh-pad*2)}nx=Math.max(pad,Math.min(area.clientWidth-rw-pad,nx));ny=Math.max(pad,Math.min(area.clientHeight-rh-pad,ny));root.style.transition=`left ${dur}s ease-in-out, top ${dur}s ease-in-out`;root.style.left=nx+"px";root.style.top=ny+"px"}if(c.idleRoam){setTimeout(roam,500);setInterval(roam,Math.max(1000,(+c.roamInterval||5)*1000))}}
function generateExport(c){return `<div id="adv-pet-root" style="position:fixed;${c.dockSide==="left"?`left:${c.posX}px;`:`right:${c.posX}px;`}top:${c.posY}%;transform:translateY(-50%);z-index:${c.zIndex};user-select:none;" onmousedown="event.stopPropagation();var el=this,r=el.getBoundingClientRect();el.style.transform='none';el.style.right='';el.style.left=r.left+'px';el.style.top=r.top+'px';el.dataset.d='true';el.dataset.x=event.clientX-r.left;el.dataset.y=event.clientY-r.top;petSet('${url(c.dragImage)}');petSay('${esc(c.dragMsg)}','');" onmousemove="var el=this;if(el.dataset.d=='true'){el.style.transition='none';el.style.left=(event.clientX-parseFloat(el.dataset.x))+'px';el.style.top=(event.clientY-parseFloat(el.dataset.y))+'px';}" onmouseup="this.dataset.d='false';petSet('${url(c.idleImage)}');" onmouseleave="this.dataset.d='false';petSet('${url(c.idleImage)}');"><style>@keyframes pet-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes pet-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes pet-swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes pet-jelly{0%,100%{transform:scale(1)}30%{transform:scale(1.12,.88)}55%{transform:scale(.94,1.08)}}@keyframes pet-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}</style><div id="adv-pet-img" style="width:${c.petSize}px;height:${c.petSize}px;background:${c.idleImage?`url('${url(c.idleImage)}') center/contain no-repeat`:`linear-gradient(135deg,${c.bg1},${c.bg2})`};border:${c.pureImageMode?0:2}px solid ${c.bg1};border-radius:${c.pureImageMode?0:18}px;box-shadow:${c.pureImageMode?"none":"0 12px 28px rgba(0,0,0,.28)"};cursor:grab;${animCss(c.idleAnim,c.animSpeed)}" onclick="event.stopPropagation();petSet('${url(c.clickImage)}');petSay('${esc(c.clickMsg)}','${url(c.bubbleImage)}');"></div><div id="adv-pet-bubble" style="display:none;position:absolute;width:${c.bubbleWidth}px;padding:10px 12px;background:${c.bubbleBg};color:${c.bubbleColor};border:1px solid ${c.bubbleBorder};border-radius:16px;box-shadow:0 10px 26px rgba(0,0,0,.25);font-size:13px;line-height:1.55;white-space:pre-wrap;${c.bubblePos==="bottom"?"top:calc(100% + 12px);left:50%;transform:translateX(-50%);":c.bubblePos==="left"?"right:calc(100% + 12px);top:50%;transform:translateY(-50%);":c.bubblePos==="right"?"left:calc(100% + 12px);top:50%;transform:translateY(-50%);":"bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);" }"></div><script>function petSet(u){if(u)document.getElementById('adv-pet-img').style.background="url('"+u+"') center/contain no-repeat"}var petTimer;function petSay(t,img){clearTimeout(petTimer);var b=document.getElementById('adv-pet-bubble');b.innerHTML=(img?'<img src="'+img+'" style="width:100%;max-height:120px;object-fit:contain;margin-bottom:6px;">':'')+(t||'');b.style.display='block';petTimer=setTimeout(function(){b.style.display='none'},${(+c.bubbleDuration||3)*1000})}(function(){var root=document.getElementById('adv-pet-root'),imgs=${JSON.stringify(lines(c.randomImages))},msgs=${JSON.stringify(lines(c.randomMsgs))};${c.randomSwitch?`setInterval(function(){if(root.dataset.d==='true')return;if(imgs.length)petSet(imgs[Math.floor(Math.random()*imgs.length)]);if(msgs.length)petSay(msgs[Math.floor(Math.random()*msgs.length)],'')},${Math.max(2000,(+c.changeInterval||5)*1000)});`:""}${c.idleRoam?`function petRoam(){if(root.dataset.d==='true')return;var pad=10,range=${Number(c.roamRange||180)},dur=${Math.max(.1,Number(c.roamDuration||1.4))},r=root.getBoundingClientRect(),w=root.offsetWidth||${Number(c.petSize||100)},h=root.offsetHeight||${Number(c.petSize||100)};root.style.transform='none';root.style.right='';root.style.transition='left '+dur+'s ease-in-out, top '+dur+'s ease-in-out';var curX=r.left,curY=r.top,nx,ny;if('${c.roamMode||"full"}'==='local'){nx=curX+(Math.random()*2-1)*range;ny=curY+(Math.random()*2-1)*range}else{nx=pad+Math.random()*Math.max(1,window.innerWidth-w-pad*2);ny=pad+Math.random()*Math.max(1,window.innerHeight-h-pad*2)}nx=Math.max(pad,Math.min(window.innerWidth-w-pad,nx));ny=Math.max(pad,Math.min(window.innerHeight-h-pad,ny));root.style.left=nx+'px';root.style.top=ny+'px'}setTimeout(petRoam,800);setInterval(petRoam,${Math.max(1000,Number(c.roamInterval||5)*1000)});`:""}})();<\/script></div>`}
function update(){buildPreview();$("exportCode").value=generateExport(cfg())}

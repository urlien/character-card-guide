  let lastReport = { errors: [], warns: [] };

  // ---------------------------------------------------------------- 颜色工具
  function normHex(h) {
    let s = String(h == null ? '' : h).trim();
    if (/^#[0-9a-f]{3}$/i.test(s)) s = '#' + s[1] + s[1] + s[2] + s[2] + s[3] + s[3];
    return /^#[0-9a-f]{6}$/i.test(s) ? s.toLowerCase() : '#000000';
  }
  function rgbOf(h) {
    const s = normHex(h);
    return [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)];
  }
  function rgba(h, a) { const c = rgbOf(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function mix(h1, h2, t) {
    const a = rgbOf(h1), b = rgbOf(h2);
    return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * t))
      .map((v) => ('0' + Math.max(0, Math.min(255, v)).toString(16)).slice(-2)).join('');
  }
  function relLum(h) {
    const c = rgbOf(h).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  /** WCAG 对比度，1~21 */
  function contrast(h1, h2) {
    const l1 = relLum(h1), l2 = relLum(h2);
    const hi = Math.max(l1, l2), lo = Math.min(l1, l2);
    return (hi + 0.05) / (lo + 0.05);
  }
  function bestTextOn(h) { return contrast(h, '#ffffff') >= contrast(h, '#111111') ? '#ffffff' : '#111111'; }
  function escCssStr(s) { return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/"/g, '\\"'); }

  // ---------------------------------------------------------------- 颜色进阶
  /* 9 个键就是平台公开的 9 个颜色变量，1:1 对应的 */
  const PAL_KEYS = ['bg', 'surface', 'text', 'muted', 'border', 'accent', 'bubbleUser', 'bubbleAi', 'bubbleText'];
  const LADDER_DARK = { bg: 9, surface: 15, text: 94, muted: 68, border: 25, accent: 66, bubbleUser: 26, bubbleAi: 15, bubbleText: 95 };
  const LADDER_LIGHT = { bg: 97, surface: 100, text: 14, muted: 45, border: 88, accent: 42, bubbleUser: 91, bubbleAi: 100, bubbleText: 16 };

  function rgbToHex(r, g, b) {
    return '#' + [r, g, b].map((v) => ('0' + Math.max(0, Math.min(255, Math.round(v))).toString(16)).slice(-2)).join('');
  }
  function hexToHsl(hex) {
    const c = rgbOf(hex).map((v) => v / 255);
    const max = Math.max.apply(null, c), min = Math.min.apply(null, c);
    const l = (max + min) / 2;
    let h = 0, s = 0;
    if (max !== min) {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === c[0]) h = (c[1] - c[2]) / d + (c[1] < c[2] ? 6 : 0);
      else if (max === c[1]) h = (c[2] - c[0]) / d + 2;
      else h = (c[0] - c[1]) / d + 4;
      h *= 60;
    }
    return { h: h, s: s, l: l };
  }

  /** 拿一套颜色里的色相 + 饱和度，配指定明度阶梯重建出一整块色板 */
  function rebuildThemeFromLadder(src, ladder) {
    const seed = hexToHsl((src && (src.accent || src.bg)) || '#7cc0ff');
    const out = {};
    PAL_KEYS.forEach((k) => {
      const s = src && src[k] ? hexToHsl(src[k]) : null;
      let sat = (s ? s.s : seed.s) * 100;
      if (k === 'bg' || k === 'surface' || k === 'bubbleAi') sat = clamp(sat, 6, 42);
      else if (k === 'accent') sat = clamp(sat, 35, 92);
      else sat = clamp(sat, 8, 60);
      out[k] = hslHex(s ? s.h : seed.h, sat, ladder[k]);
    });
    return out;
  }

  /** 重建补齐：已有的键保留原样（保真），缺的键才用阶梯补 */
  function completeTheme(partial, ladder) {
    const src = {};
    PAL_KEYS.forEach((k) => { if (partial && partial[k]) src[k] = partial[k]; });
    const out = clone(rebuildThemeFromLadder(src, ladder));
    PAL_KEYS.forEach((k) => { if (partial && partial[k]) out[k] = normHex(partial[k]); });
    return out;
  }

  /** 保持色相，只把明度往「离背景更远」的方向推，直到对比度达标 */
  function pushContrast(fg, bg, target) {
    if (contrast(fg, bg) >= target) return fg;
    const hsl = hexToHsl(fg);
    const bgIsDark = relLum(bg) < 0.5;
    let best = fg, bestRatio = contrast(fg, bg);
    for (let i = 1; i <= 100; i += 1) {
      const l = bgIsDark ? hsl.l + i / 100 : hsl.l - i / 100;
      if (l < 0 || l > 1) break;
      const cand = hslHex(hsl.h, hsl.s * 100, l * 100);
      const r = contrast(cand, bg);
      if (r > bestRatio) { best = cand; bestRatio = r; }
      if (r >= target) return cand;
    }
    return best;
  }

  /** 给一整块色板做对比度修正，返回 {colors, changes} */
  function fixThemeContrast(c) {
    const out = clone(c);
    const changes = [];
    const jobs = [
      { key: 'text', bgKey: 'bg', target: 7.0, label: '正文' },
      { key: 'muted', bgKey: 'bg', target: 4.5, label: '次要文字' },
      { key: 'bubbleText', bgKey: 'bubbleAi', target: 5.0, label: '气泡字/AI 气泡' },
      { key: 'bubbleText', bgKey: 'bubbleUser', target: 4.5, label: '气泡字/我的气泡' },
      { key: 'accent', bgKey: 'bg', target: 3.0, label: '强调色' },
    ];
    jobs.forEach((job) => {
      const before = contrast(out[job.key], out[job.bgKey]);
      if (before >= job.target) return;
      const next = pushContrast(out[job.key], out[job.bgKey], job.target);
      const after = contrast(next, out[job.bgKey]);
      if (next.toLowerCase() === normHex(out[job.key])) return;
      changes.push({ key: job.key, label: job.label, from: out[job.key], to: next, before: before, after: after });
      out[job.key] = next;
    });
    /* 次要文字别和正文一样亮，否则层级没了 */
    if (normHex(out.muted) === normHex(out.text)) {
      const dim = pushContrast(mix(out.muted, out.bg, 0.2), out.bg, 4.5);
      if (contrast(dim, out.bg) >= 4.5 && normHex(dim) !== normHex(out.text)) {
        changes.push({ key: 'muted', label: '次要文字（拉开层级）', from: out.muted, to: dim, before: contrast(out.muted, out.bg), after: contrast(dim, out.bg) });
        out.muted = dim;
      }
    }
    return { colors: out, changes: changes };
  }

  // ---------------------------------------------------------------- CSS 瘦身与拆条
  /** 保守压缩：只去注释、换行与行首缩进，绝不动一行之内的空格（calc 里的空格是语法要求） */
  function minifyCss(cssText) {
    return String(cssText)
      .replace(/\/\*[\s\S]*?\*\//g, '')
      .replace(/[ \t]*\r?\n[ \t]*/g, '')
      .replace(/;\s*}/g, '}')
      .trim();
  }

  /** 按花括号深度安全拆条：只在深度 0（也就是规则之间）下刀，绝不切进 @media 或规则内部 */
  function splitCss(cssText, budget) {
    const lines = String(cssText).split('\n');
    const chunks = [];
    let cur = [];
    let len = 0;
    let depth = 0;
    lines.forEach((line) => {
      const lineLen = line.length + 1;
      if (cur.length && depth === 0 && len + lineLen > budget) {
        chunks.push(cur.join('\n'));
        cur = [];
        len = 0;
      }
      cur.push(line);
      len += lineLen;
      for (let i = 0; i < line.length; i += 1) {
        if (line[i] === '{') depth += 1;
        else if (line[i] === '}') depth = Math.max(0, depth - 1);
      }
    });
    if (cur.length) chunks.push(cur.join('\n'));
    return chunks.length ? chunks : [''];
  }

  // ---------------------------------------------------------------- 配色提取 / 图片取色
  const CHAT_TO_KEY = {
    'chat-bg': 'bg', 'chat-surface': 'surface', 'chat-text': 'text', 'chat-text-muted': 'muted',
    'chat-border': 'border', 'chat-accent': 'accent', 'chat-bubble-user-bg': 'bubbleUser',
    'chat-bubble-ai-bg': 'bubbleAi', 'chat-bubble-text': 'bubbleText',
  };
  
  /**
   * 从任意 CSS 里抓 --chat-* 颜色。关键是**按块解析**：
   * 一个块里的变量天然属于同一套色板，所以把「块」本身记下来当配对证据，
   * 比事后按明度排序猜日夜靠谱得多（暗色主题的强调色经常比亮色主题的还亮）。
   */
  function extractPaletteVars(text) {
    const src = String(text == null ? '' : text).replace(/<script[\s\S]*?<\/script>/gi, '');
    const byTheme = { dark: {}, light: {}, shared: {}, blocks: [] };
    const blockRe = /([^{}]*)\{([^{}]*)\}/g;
    const varRe = /--(chat-[a-z0-9-]+)\s*:\s*(#[0-9a-f]{3}|#[0-9a-f]{6})\b/gi;
    let m;
    while ((m = blockRe.exec(src)) !== null) {
      const sel = m[1].toLowerCase();
      const body = m[2];
      const hasDark = /data-theme\s*=\s*["']?dark/.test(sel);
      const hasLight = /data-theme\s*=\s*["']?light/.test(sel);
      const slot = hasDark && !hasLight ? 'dark' : (hasLight && !hasDark ? 'light' : 'shared');
      const counts = {};
      let mm;
      varRe.lastIndex = 0;
      while ((mm = varRe.exec(body)) !== null) {
        const name = mm[1].toLowerCase();
        const value = normHex(mm[2]);
        counts[name] = counts[name] || {};
        counts[name][value] = (counts[name][value] || 0) + 1;
      }
      if (!Object.keys(counts).length) continue;
      const resolved = {};
      Object.keys(counts).forEach((name) => { resolved[name] = topValues(counts[name], 1)[0]; });
      byTheme.blocks.push({ slot: slot, vars: resolved });
      const bucket = byTheme[slot];
      Object.keys(resolved).forEach((name) => {
        bucket[name] = bucket[name] || {};
        bucket[name][resolved[name]] = (bucket[name][resolved[name]] || 0) + 1;
      });
    }
    if (!byTheme.blocks.length) {
      /* 兜底：没有花括号结构的纯 CSS 片段，全文扫一遍丢进 shared */
      let mm2;
      varRe.lastIndex = 0;
      while ((mm2 = varRe.exec(src)) !== null) {
        const name = mm2[1].toLowerCase();
        const value = normHex(mm2[2]);
        byTheme.shared[name] = byTheme.shared[name] || {};
        byTheme.shared[name][value] = (byTheme.shared[name][value] || 0) + 1;
      }
    }
    return byTheme;
  }

  function topValues(bucket, max) {
    return Object.keys(bucket || {}).sort((a, b) => bucket[b] - bucket[a]).slice(0, max || 2);
  }

  /**
   * 把变量桶归一成日夜两套 9 键色板。
   * 每个键的「归属策略」不一样，这是关键：
   *  - bg / surface / border / bubble* ：暗色主题用暗的那支
   *  - text / muted / bubbleText     ：暗色主题用亮的那支
   *  - accent                        ：按「和该主题背景的对比度」挑，按明度排会挑反
   * 缺的键用明度阶梯 + 同批颜色的色相饱和度补齐。
   */
  const KEY_STRATEGY = {
    bg: 'lumAsc', surface: 'lumAsc', border: 'lumAsc', bubbleAi: 'lumAsc', bubbleUser: 'lumAsc',
    text: 'lumDesc', muted: 'lumDesc', bubbleText: 'lumDesc',
    accent: 'contrast',
  };

  function paletteFromVars(byTheme) {
    const dark = {};
    const light = {};
    const found = {};
    const shared = (byTheme && byTheme.shared) || {};
    const blocks = (byTheme && byTheme.blocks) || [];
    const varNameOf = (key) => Object.keys(CHAT_TO_KEY).filter((v) => CHAT_TO_KEY[v] === key)[0];
    /* 先到先得：越可信的来源越先写，后面的 put 不会覆盖它 */
    const put = (side, key, value) => {
      if (!key || !value || side[key]) return;
      side[key] = value;
      found[key] = 1;
    };

    /* 1) 选择器带 data-theme 的块 —— 最可信，直接落位 */
    blocks.forEach((b) => {
      if (b.slot !== 'dark' && b.slot !== 'light') return;
      const side = b.slot === 'dark' ? dark : light;
      Object.keys(b.vars).forEach((v) => put(side, CHAT_TO_KEY[v], b.vars[v]));
    });

    /* 2) 没主题标记的块 —— 用它自己的 --chat-bg 判断这套颜色是深是浅，整块归位 */
    blocks.forEach((b) => {
      if (b.slot !== 'shared') return;
      const bgVal = b.vars['chat-bg'];
      if (!bgVal) return;
      const side = relLum(bgVal) < 0.45 ? dark : light;
      Object.keys(b.vars).forEach((v) => put(side, CHAT_TO_KEY[v], b.vars[v]));
    });

    /* 3) 还没落位的键（碎片化 CSS、块里没 bg）：按每个键各自的策略分 */
    PAL_KEYS.forEach((k) => {
      if (dark[k] && light[k]) return;
      const bucket = shared[varNameOf(k)];
      if (!bucket) return;
      const list = topValues(bucket, 2);
      if (!list.length) return;
      const strategy = KEY_STRATEGY[k] || 'lumAsc';
      if (list.length >= 2) {
        if (strategy === 'contrast') {
          const dBest = dark.bg ? list.slice().sort((a, b) => contrast(b, dark.bg) - contrast(a, dark.bg))[0] : list[0];
          const lBest = light.bg ? list.slice().sort((a, b) => contrast(b, light.bg) - contrast(a, light.bg))[0] : list[list.length - 1];
          put(dark, k, dBest);
          put(light, k, lBest);
        } else {
          const sorted = list.slice().sort((a, b) => relLum(a) - relLum(b));
          if (strategy === 'lumDesc') { put(dark, k, sorted[sorted.length - 1]); put(light, k, sorted[0]); }
          else { put(dark, k, sorted[0]); put(light, k, sorted[sorted.length - 1]); }
        }
      } else {
        const one = list[0];
        if (strategy === 'contrast') { put(dark, k, one); put(light, k, one); }
        else {
          const darkSide = strategy === 'lumDesc' ? relLum(one) > 0.5 : relLum(one) < 0.45;
          if (darkSide) put(dark, k, one); else put(light, k, one);
        }
      }
    });

    /* seed：给缺的键提供色相与饱和度 */
    const seed = {};
    PAL_KEYS.forEach((k) => { seed[k] = dark[k] || light[k]; });
    return {
      dark: buildSide(seed, dark, LADDER_DARK),
      light: buildSide(seed, light, LADDER_LIGHT),
      found: Object.keys(found).length,
    };
  }

  /** 用 seed 的色相饱和度配阶梯打底，再让信得过的真实值覆盖上去 */
  function buildSide(seed, trusted, ladder) {
    const out = rebuildThemeFromLadder(seed, ladder);
    Object.keys(trusted || {}).forEach((k) => { if (trusted[k]) out[k] = normHex(trusted[k]); });
    return out;
  }

  /** 图片量化主色：4bit/通道分桶 + 频率排序 + 距离去重 */
  function dominantColors(imageData, want) {
    const px = imageData.data;
    const buckets = {};
    for (let i = 0; i < px.length; i += 4) {
      if (px[i + 3] < 128) continue;
      const r = px[i], g = px[i + 1], b = px[i + 2];
      const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
      if (lum < 0.05 || lum > 0.98) continue;
      const key = (r >> 4) + ',' + (g >> 4) + ',' + (b >> 4);
      const e = buckets[key] || (buckets[key] = { r: 0, g: 0, b: 0, n: 0 });
      e.r += r; e.g += g; e.b += b; e.n += 1;
    }
    const list = Object.keys(buckets).map((k) => {
      const e = buckets[k];
      return { r: e.r / e.n, g: e.g / e.n, b: e.b / e.n, n: e.n };
    }).sort((a, b) => b.n - a.n);
    const picked = [];
    list.forEach((c) => {
      if (picked.length >= (want || 8)) return;
      const far = picked.every((p) => Math.abs(p.r - c.r) + Math.abs(p.g - c.g) + Math.abs(p.b - c.b) > 54);
      if (far) picked.push(c);
    });
    return picked.map((c) => rgbToHex(c.r, c.g, c.b));
  }

  /** 用图片主色推日夜两套色板：最艳的当强调色，最暗/最亮的当背景 */
  function themeFromImage(colors) {
    if (!colors || !colors.length) return null;
    const scored = colors.map((hex) => {
      const h = hexToHsl(hex);
      return { hex: hex, h: h, score: h.s * 1.15 + (1 - Math.abs(h.l - 0.55)) * 0.35 };
    }).sort((a, b) => b.score - a.score);
    const accent = scored[0].hex;
    const byLum = colors.slice().sort((a, b) => relLum(a) - relLum(b));
    const darkest = byLum[0];
    const lightest = byLum[byLum.length - 1];
    const dark = completeTheme({ accent: accent, bg: darkest, surface: mix(darkest, accent, 0.14) }, LADDER_DARK);
    const light = completeTheme({ accent: accent, bg: lightest, surface: '#ffffff' }, LADDER_LIGHT);
    return { dark: dark, light: light, accent: accent, swatches: colors };
  }

  // ---------------------------------------------------------------- 皮肤医生
  function inspectPack(raw) {
    const out = {
      ok: false, parseError: '', meta: {}, rules: [], legacy: [], advice: [],
      checker: { errors: [], warns: [] }, palette: null, paletteFound: 0,
    };
    let pack = raw;
    if (typeof raw === 'string') {
      const text = raw.trim();
      if (!text) { out.parseError = '还没有内容'; return out; }
      try { pack = JSON.parse(text); }
      catch (e) {
        /* 也许是 JS 对象字面量，顺手救一下 */
        try { pack = (new Function('return (' + text + ')'))(); }
        catch (e2) { out.parseError = 'JSON 解析失败：' + e.message; return out; }
      }
    }
    if (!pack || typeof pack !== 'object' || Array.isArray(pack)) { out.parseError = '顶层不是一个对象'; return out; }
    out.ok = true;

    const rules = Array.isArray(pack.regex_scripts) ? pack.regex_scripts : [];
    out.meta.chatVersion = pack.chatVersion;
    out.meta.pageDepth = pack.pageDepth;
    out.meta.ruleCount = rules.length;
    out.meta.topKeys = Object.keys(pack);
    out.meta.unknownKeys = out.meta.topKeys.filter((k) => TOP_KEYS.indexOf(k) < 0);
    out.meta.hasPersonality = typeof pack.personality === 'string' && pack.personality.trim() !== '';
    out.meta.beginningLen = String(pack.beginning == null ? '' : pack.beginning).length;
    out.meta.statusbarLen = String(pack.statusbar == null ? '' : pack.statusbar).length;

    rules.forEach((r, i) => {
      if (!r || typeof r !== 'object' || Array.isArray(r)) {
        out.rules.push({ index: i + 1, name: '(不是对象)', bad: true });
        return;
      }
      const body = typeof r.replaceString === 'string' ? r.replaceString : '';
      const visible = stripStyleAndScript(body);
      const kind = classifyPattern(r.findRegex);
      out.rules.push({
        index: i + 1,
        name: String(r.scriptName == null ? '(无名)' : r.scriptName),
        id: r.id,
        find: String(r.findRegex == null ? '' : r.findRegex),
        findKind: kind.kind === 'regex' ? '正则' : (kind.kind === 'literal' ? '字面量' : (kind.kind === 'bad-regex' ? '⚠️编不过' : '空')),
        findLen: String(r.findRegex == null ? '' : r.findRegex).length,
        replaceLen: body.length,
        visibleLen: visible.trim().length,
        hasStyle: /<style[\s>]/i.test(body),
        hasScript: /<script[\s>]/i.test(body),
        visibleHtml: visible.replace(/\s+/g, ' ').trim().slice(0, 90),
      });
    });

    const allText = rules.map((r) => (r && typeof r.replaceString === 'string' ? r.replaceString : '') + '\n' + String((r && r.findRegex) || '')).join('\n')
      + '\n' + String(pack.statusbar == null ? '' : pack.statusbar) + '\n' + String(pack.beginning == null ? '' : pack.beginning);

    /* ---- 旧版特征 ---- */
    if (pack.chatVersion !== 1) out.legacy.push('chatVersion = ' + JSON.stringify(pack.chatVersion) + '：给新建卡导入会落到旧聊天页，SDK 与 [data-chat] 选择器全部失效');
    RAW_HOST_CLASSES.forEach((rc) => {
      if (allText.indexOf(rc) >= 0) out.legacy.push('出现裸父页面选择器 ' + rc + '：新版弹窗在父页面且跨源，这样写命不中，要改成 [data-host="…"] 或只用主题变量');
    });
    if (/(^|[\s,};])(\*|html|body|:root)\s*\{/m.test(allText)) out.legacy.push('拿 * / html / body / :root 当 CSS 根：平台明令禁止全局 CSS，新版要写 [data-chat="root"]');
    if (allText.indexOf('--chat-') < 0) out.legacy.push('完全没用到平台公开的 --chat-* 变量：颜色是写死的，日夜主题切换时会跟不上');
    [['[status]', '旧 status 标记'], ['〖骰=', 'teapot 骰子协议'], ['teapot', 'teapot 插件'], ['$#char#$', '旧 char 占位符'], ['{{char}}', '旧 char 占位符'], ['onerror', '图片 onerror 兜底（旧写法）']].forEach((pair) => {
      if (allText.indexOf(pair[0]) >= 0) out.legacy.push('含旧版特征：' + pair[1]);
    });
    if (/【[^】\n]{0,20}】/.test(allText)) out.legacy.push('用了【】旧版切片协议（例如【侧边栏1】）：新版不需要这种拆词标记，而且字面量匹配式很容易重复');
    if (/\burl\s*\(/i.test(allText)) out.legacy.push('用了 url() 外链资源（字体/图片）：平台不保证白名单与跨域，加载失败会空一块');
    if (allText.length > 400 && allText.indexOf('data-chat') < 0) {
      out.legacy.push('整份包看不到 [data-chat] 选择器：新版聊天页靠这套稳定属性定位，看不到基本可以判断不是新版写法');
    }

    /* ---- 校验（复用同一套判定） ---- */
    try { out.checker = runChecker(pack); }
    catch (e) { out.checker = { errors: [{ where: '医生', msg: '这份包结构太不规整，检查中断：' + e.message }], warns: [] }; }

    /* 说明：「id 全是 -1」是平台自己导出的常态（4 份真实文件逐条核对过），
     * 导入时会统一重编号，所以检查器**根本不再对「重复」报警** —— 那是设计，不是问题。
     * 这里什么都不用改。 */

    /* ---- 会覆盖哪些卡内字段 ---- */
    if (out.meta.statusbarLen) out.advice.push('这份包带 statusbar（' + out.meta.statusbarLen + ' 字）：导入会覆盖你卡里原有的功能栏内容');
    if (out.meta.beginningLen) out.advice.push('这份包带 beginning（' + out.meta.beginningLen + ' 字）：导入会覆盖你卡里原本的第一句话');
    if (out.meta.hasPersonality) out.advice.push('这份包带 personality：导入正则不会读它，要单独粘到创卡页的「角色人设」栏');
    if (out.meta.unknownKeys.length) out.advice.push('顶层有导入页不认的键：' + out.meta.unknownKeys.join('、') + '（世界书要走独立入口）');

    /* ---- 配色提取 ---- */
    const vars = extractPaletteVars(allText);
    out.paletteVars = vars;
    const pal = paletteFromVars(vars);
    out.paletteFound = pal.found;
    out.palette = pal.found ? pal : null;
    out.advice.push(out.paletteFound
      ? '已经扒到 ' + pal.found + ' 个公开颜色变量，可以下面「用这套配色重建一份合规皮肤」直接继承它的审美。'
      : '这份包没写平台公开的 --chat-* 变量，扒不出配色；换张参考图或挑一套预设更快。');

    const longRules = out.rules.filter((r) => r.replaceLen > 15000);
    longRules.forEach((r) => out.advice.push('规则 ' + r.index + '「' + r.name + '」替换内容 ' + r.replaceLen + ' 字，快贴着 20000 上限了，建议拆条'));
    if (!rules.some((r) => /<script[\s>]/i.test(String((r && r.replaceString) || ''))) && /<button/i.test(allText)) {
      out.advice.push('有按钮却没有配套脚本：那些按钮点下去不会动');
    }
    out.text = allText;
    return out;
  }

  const SHADOWS = ['none', '0 1px 3px rgba(0,0,0,.18)', '0 6px 18px rgba(0,0,0,.26)', '0 14px 34px rgba(0,0,0,.40)'];
  const BUBBLE_SHADOWS = ['none', '0 1px 2px rgba(0,0,0,.14)', '0 4px 12px rgba(0,0,0,.20)', '0 10px 24px rgba(0,0,0,.30)'];

  function fontStack(p) {
    switch (p.fontMode) {
      case 'hei': return '"Helvetica Neue",Helvetica,"Microsoft YaHei","PingFang SC",sans-serif';
      case 'song': return '"Songti SC","SimSun","Noto Serif SC",Georgia,serif';
      case 'round': return '"PingFang SC","Yuanti SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
      case 'mono': return 'ui-monospace,Menlo,Consolas,"Courier New",monospace';
      case 'custom': {
        const name = String(p.fontCustom || '').split(',')[0].trim().replace(/["']/g, '');
        if (!name) return 'system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
        return '"' + name + '",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      }
      default: return 'system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif';
    }
  }

  // ---------------------------------------------------------------- 作用域助手
  /**
   * 皮肤的「总闸」：一键开关就是给 [data-chat="root"] 加/去一个 .mmdskin-off 类。
   * 所有皮肤规则都挂在这个前缀下，所以关掉时整套样式（含伪元素粒子）自然失效，
   * 不需要 :has()，也不需要覆盖平台内部 class。
   */
  function P(s) {
    return s.toggle.on ? '[data-chat="root"]:not(.mmdskin-off)' : '[data-chat="root"]';
  }
  const ROOT = '[data-chat="root"]';

  /** 当前的日间/夜间色板 */
  function pickPalette(s) {
    if (s.palette.mode === 'unified') {
      const c = clone(s.palette[s.palette.base] || s.palette.dark);
      return { base: c, light: c, dark: c, unified: true };
    }
    return { base: clone(s.palette.dark), light: clone(s.palette.light), dark: clone(s.palette.dark), unified: false };
  }

  /** 面板使用的「主色板」：预览与对比度检查都用它 */
  function activePalette(s, theme) {
    const p = pickPalette(s);
    if (p.unified) return p.base;
    return theme === 'light' ? p.light : p.dark;
  }

  // ---------------------------------------------------------------- CSS：变量
  function themeSelector(s, theme) {
    const pre = P(s);
    if (s.palette.mode === 'unified') {
      if (theme !== s.palette.base) return null;
      return pre + '[data-theme="dark"],' + pre + '[data-theme="light"]';
    }
    return pre + '[data-theme="' + theme + '"]';
  }

  /** 18 个宿主变量：从同一套色板推导，保证 iframe 与父页面弹窗是同一套设计令牌 */
  function hostBridgeVars(c) {
    return [
      '--chat-composer-bg:' + mix(c.surface, c.bg, 0.25),
      '--chat-composer-text:' + c.text,
      '--chat-shortcut-bg:' + mix(c.surface, c.accent, 0.14),
      '--chat-shortcut-text:' + c.text,
      '--chat-input-bg:' + mix(c.surface, c.bg, 0.5),
      '--chat-input-text:' + c.text,
      '--chat-input-placeholder:' + c.muted,
      '--chat-input-border:' + c.border,
      '--chat-modal-bg:' + c.surface,
      '--chat-modal-surface:' + mix(c.surface, c.bg, 0.22),
      '--chat-modal-text:' + c.text,
      '--chat-modal-muted:' + c.muted,
      '--chat-modal-accent:' + c.accent,
      '--chat-modal-input-bg:' + mix(c.surface, c.bg, 0.5),
      '--chat-modal-input-text:' + c.text,
      '--chat-modal-cancel-bg:' + mix(c.surface, c.border, 0.6),
      '--chat-modal-btn-bg:' + mix(c.surface, c.accent, 0.24),
      '--chat-modal-btn-border:' + c.accent,
    ];
  }

  function colorVarBlock(s, c) {
    const lines = [
      '--chat-bg:' + c.bg,
      '--chat-surface:' + c.surface,
      '--chat-text:' + c.text,
      '--chat-text-muted:' + c.muted,
      '--chat-border:' + c.border,
      '--chat-accent:' + c.accent,
      '--chat-bubble-user-bg:' + c.bubbleUser,
      '--chat-bubble-ai-bg:' + c.bubbleAi,
      '--chat-bubble-text:' + c.bubbleText,
      /* 工具自己的派生令牌，全部由上面这套颜色算出来，不引入新颜色 */
      '--mmdskin-accent:' + c.accent,
      '--mmdskin-input-bg:' + mix(c.surface, c.bg, 0.5),
      '--mmdskin-panel-bg:' + mix(c.surface, c.bg, 0.22),
      '--mmdskin-on-accent:' + bestTextOn(c.accent),
      /* 组件用的主题令牌：必须放在「每个主题」的变量块里，
       * 否则顶栏/功能栏在日间模式下会顶着夜间算出来的深色底（深字压深底，糊一片）。
       * 这些一律按当前主题的色板推导，日夜切换时跟着平台走。 */
      '--mmdskin-header-bg:' + (s.palette.glass ? rgba(mix(c.surface, c.bg, 0.15), 0.78) : mix(c.surface, c.bg, 0.15)),
      '--mmdskin-header-image:linear-gradient(120deg,' + mix(c.surface, c.accent, 0.22) + ',' + mix(c.surface, c.bg, 0.2) + ' 62%,' + mix(c.surface, c.accent, 0.10) + ')',
      '--mmdskin-bar-bg:' + mix(c.surface, c.bg, 0.2),
      '--mmdskin-bar-image:linear-gradient(90deg,' + mix(c.surface, c.accent, 0.26) + ',' + mix(c.surface, c.bg, 0.25) + ' 70%,' + mix(c.surface, c.accent, 0.14) + ')',
      '--mmdskin-composer-bg:' + (s.palette.glass ? rgba(mix(c.surface, c.bg, 0.25), 0.82) : mix(c.surface, c.bg, 0.25)),
      '--mmdskin-composer-image:linear-gradient(90deg,' + mix(c.surface, c.accent, 0.12) + ',' + mix(c.surface, c.bg, 0.28) + ' 52%,' + mix(c.surface, c.accent, 0.12) + ')',
      '--mmdskin-bubble-border:' + rgba(c.accent, 0.45),
      '--mmdskin-ring:' + rgba(c.accent, 0.18),
      '--mmdskin-glow-soft:' + rgba(c.accent, 0.45),
      '--mmdskin-glow:' + rgba(c.accent, 0.55),
      '--mmdskin-glow-strong:' + rgba(c.accent, 0.40),
      '--mmdskin-glow-none:' + rgba(c.accent, 0),
    ];
    if (s.host.on && s.host.bridge) lines.push.apply(lines, hostBridgeVars(c));
    return '  ' + lines.join(';\n  ') + ';';
  }

  function buildVarsCss(s) {
    const p = pickPalette(s);
    const out = [];
    out.push('/* ===== 1/4 皮肤变量 =====');
    out.push(' * 颜色全部写在平台公开的 --chat-* 变量上，所以日夜主题切换、');
    out.push(' * 底栏与弹窗同步都靠平台自己完成，不需要脚本。 */');
    const geo = [
      '--mmdskin-bubble-radius:' + px(s.bubble.radius),
      '--mmdskin-bubble-maxw:' + s.bubble.maxWidth + '%',
      '--mmdskin-gap:' + px(s.bubble.gap),
      '--mmdskin-avatar:' + px(s.avatar.size),
      '--mmdskin-input-radius:' + px(s.composer.radius),
      '--mmdskin-shadow:' + SHADOWS[clamp(s.palette.shadow | 0, 0, 3)],
      '--mmdskin-bubble-shadow:' + BUBBLE_SHADOWS[clamp(s.bubble.shadow | 0, 0, 3)],
      '--mmdskin-font:' + fontStack(s.palette),
      '--mmdskin-fs:' + px(s.palette.fontSize),
      '--mmdskin-lh:' + s.palette.lineHeight,
    ];
    out.push(P(s) + '{');
    out.push('  ' + geo.join(';\n  ') + ';');
    out.push('  font-family:var(--mmdskin-font);');
    out.push('  font-size:var(--mmdskin-fs);');
    out.push('}');
    /* 兜底：万一目标页根上没有 data-theme，也有一套完整颜色 */
    out.push(P(s) + '{');
    out.push(colorVarBlock(s, p.base));
    out.push('}');
    ['dark', 'light'].forEach((theme) => {
      const sel = themeSelector(s, theme);
      if (!sel) return;
      out.push(sel + '{');
      out.push(colorVarBlock(s, theme === 'light' ? p.light : p.dark));
      out.push('}');
    });
    if (s.palette.bgStyle !== 'none') {
      const p2 = pickPalette(s);
      const selDark = themeSelector(s, 'dark');
      const selLight = themeSelector(s, 'light');
      out.push('/* 背景纹理（纯 CSS 渐变画的，不引外链图片） */');
      if (selDark) out.push(selDark + '{ background-image:' + bgTexture(s, p2.dark) + '; }');
      if (selLight) out.push(selLight + '{ background-image:' + bgTexture(s, p2.light) + '; }');
      /* 只加纹理，不再显式写 background-color：整页底色由平台读 --chat-bg 自己上，
       * 我多写一行反而会把「卡自己画的整页背景」盖掉 —— 这就是用户反馈的
       * 「美化有时会直接渲染整个界面」。 */
      out.push(P(s) + '{ background-attachment:fixed; }');
      if (!s.meta.safeLayout) out.push(P(s) + ' [data-chat="messages"]{ background-color:transparent; }');
    } else {
      /* 没选纹理就完全不碰根的背景；但旧皮肤可能写过底纹，所以显式还原一次，避免残留 */
      out.push(P(s) + '{ background-image:revert; }');
    }
    return out.join('\n');
  }

  function bgTexture(s, c) {
    switch (s.palette.bgStyle) {
      case 'glow':
        return 'radial-gradient(120% 78% at 8% -12%,' + rgba(c.accent, 0.22) + ',transparent 60%),'
          + 'radial-gradient(90% 62% at 102% 4%,' + rgba(c.accent, 0.12) + ',transparent 58%),'
          + 'radial-gradient(80% 60% at 50% 120%,' + rgba(c.accent, 0.10) + ',transparent 62%)';
      case 'diag':
        return 'linear-gradient(158deg,' + mix(c.bg, c.surface, 0.55) + ',' + c.bg + ' 46%,'
          + mix(c.bg, c.accent, 0.16) + ')';
      case 'grid':
        return 'linear-gradient(' + rgba(c.border, 0.75) + ' 1px,transparent 1px),'
          + 'linear-gradient(90deg,' + rgba(c.border, 0.75) + ' 1px,transparent 1px)';
      case 'dots':
        return 'radial-gradient(' + rgba(c.text, 0.12) + ' 1px,transparent 1.4px)';
      case 'stripe':
        return 'repeating-linear-gradient(115deg,' + rgba(c.accent, 0.07) + ' 0 10px,transparent 10px 24px)';
      default:
        return 'none';
    }
  }

  // ---------------------------------------------------------------- CSS：布局与组件
  function buildLayoutCss(s) {
    const c = activePalette(s, 'dark');
    const out = [];
    out.push('/* ===== 2/4 界面组件（顶栏 / 气泡 / 底栏 / 功能栏 / 头像 / 开关按钮） ===== */');

    /* --- 顶栏 --- */
    if (s.header.on) {
      out.push(P(s) + ' [data-chat="header"]{');
      /* 颜色一律走主题令牌：它们在每个 data-theme 的变量块里各算一份 */
      out.push('  background-color:var(--mmdskin-header-bg);');
      /* 关掉的项显式写 revert：把「平台原样」还回来。
       * 不写的话，旧皮肤的规则还在合并样式表里赖着不走 —— 那就是「再次导入有残留」。 */
      out.push(s.header.gradient ? '  background-image:var(--mmdskin-header-image);' : '  background-image:revert;');
      if (s.header.blur && s.palette.glass) {
        out.push('  -webkit-backdrop-filter:blur(14px);');
        out.push('  backdrop-filter:blur(14px);');
      } else {
        out.push('  -webkit-backdrop-filter:revert;');
        out.push('  backdrop-filter:revert;');
      }
      out.push(s.header.hairline ? '  border-bottom:1px solid var(--chat-border);' : '  border-bottom:revert;');
      out.push(s.header.radius ? '  border-radius:0 0 ' + px(s.header.radius) + ' ' + px(s.header.radius) + ';' : '  border-radius:revert;');
      out.push('  box-shadow:var(--mmdskin-shadow);');
      out.push('}');
      out.push(P(s) + ' [data-chat="header"] [data-chat="header-title"]{ color:var(--chat-text);font-weight:600;letter-spacing:.2px; }');
      out.push(P(s) + ' [data-chat="header"] [data-chat="header-back"],');
      out.push(P(s) + ' [data-chat="header"] [data-chat="header-actions"]{ color:var(--chat-accent); }');
    }

    /* --- 头像 --- */
    if (s.avatar.on) {
      const radius = s.avatar.shape === 'circle' ? '50%' : (s.avatar.shape === 'squircle' ? '32%' : px(Math.round(s.avatar.size * 0.28)));
      out.push(P(s) + ' [data-chat="header-title"] img,');
      out.push(P(s) + ' [data-chat="header-title"] > *:first-child{');
      out.push('  width:var(--mmdskin-avatar);height:var(--mmdskin-avatar);');
      out.push('  border-radius:' + radius + ';object-fit:cover;');
      out.push(s.avatar.ring ? '  border:1.5px solid var(--chat-accent);' : '  border:revert;');
      out.push(s.avatar.glow ? '  box-shadow:0 0 0 3px var(--mmdskin-ring),0 0 16px var(--mmdskin-glow-soft);' : '  box-shadow:revert;');
      out.push('}');
    }

    /* --- 气泡 --- */
    if (s.bubble.on) {
      out.push('/* 气泡：视觉写在 message 上，内边距写在 message-body 上，');
      out.push(' * 不去改平台结构性节点的 display / 宽高 / 外边距。 */');
      out.push(P(s) + ' [data-chat="message"]{');
      out.push('  border-radius:var(--mmdskin-bubble-radius);');
      /* 最大宽度受「保护自定义界面」管：开着写 revert，免得旧皮肤留下的宽度继续作用在卡自己的界面上 */
      out.push(s.meta.safeLayout ? '  max-width:revert;' : '  max-width:var(--mmdskin-bubble-maxw);');
      out.push('  box-shadow:var(--mmdskin-bubble-shadow);');
      out.push(s.bubble.border
        ? '  border:' + px(s.bubble.borderWidth) + ' solid ' + (s.bubble.tint ? 'var(--mmdskin-bubble-border)' : 'var(--chat-border)') + ';'
        : '  border:revert;');
      out.push('}');
      out.push(P(s) + ' [data-chat="message-body"]{');
      /* 内边距照常写：它只是让气泡呼吸，不会把卡的面板压变形（真正压坏的是最大宽度） */
      out.push('  padding:' + px(s.bubble.padY) + ' ' + px(s.bubble.padX) + ';');
      out.push('  color:var(--chat-bubble-text);');
      out.push('  font-size:var(--mmdskin-fs);line-height:var(--mmdskin-lh);');
      out.push('}');
      out.push(P(s) + ' [data-chat="message"][data-from="ai"]{ background-color:var(--chat-bubble-ai-bg); }');
      out.push(P(s) + ' [data-chat="message"][data-from="user"]{ background-color:var(--chat-bubble-user-bg); }');
      out.push(P(s) + ' [data-chat="list"]{ row-gap:var(--mmdskin-gap); }');
      /* 尖角感：开与关都写。关的时候写回统一圆角，免得旧皮肤的 4 值圆角赖着不走 */
      ['ai', 'user'].forEach((from) => {
        const small = s.bubble.point ? '5px' : 'var(--mmdskin-bubble-radius)';
        const radius = from === 'ai'
          ? 'var(--mmdskin-bubble-radius) var(--mmdskin-bubble-radius) var(--mmdskin-bubble-radius) ' + small
          : 'var(--mmdskin-bubble-radius) var(--mmdskin-bubble-radius) ' + small + ' var(--mmdskin-bubble-radius)';
        out.push(P(s) + ' [data-chat="message"][data-from="' + from + '"]{ border-radius:' + radius + '; }');
      });
    }

    /* --- 底栏输入区 --- */
    if (s.composer.on) {
      out.push(P(s) + ' [data-chat="composer"]{');
      /* 毛玻璃开着就用半透明底（真的看得见），关着就走平台的变量桥；两者都是主题自适应的 */
      if (s.palette.glass) out.push('  background-color:var(--mmdskin-composer-bg);');
      else out.push('  background-color:var(--chat-composer-bg,var(--mmdskin-composer-bg));');
      if (s.motion.on && s.motion.gradientFlow) out.push('  background-image:var(--mmdskin-composer-image);');
      if (s.composer.blur && s.palette.glass) {
        out.push('  -webkit-backdrop-filter:blur(14px);');
        out.push('  backdrop-filter:blur(14px);');
      } else {
        out.push('  -webkit-backdrop-filter:revert;');
        out.push('  backdrop-filter:revert;');
      }
      out.push(s.composer.border ? '  border-top:1px solid var(--chat-border);' : '  border-top:revert;');
      out.push('}');
      /* 新版里输入框的白底画在它的直接父容器上：公开配方用 :has() 定位 */
      out.push(P(s) + ' [data-chat="composer"] :where(div):has(>[data-chat="input"]){');
      out.push('  background-color:var(--mmdskin-input-bg);');
      out.push('  border:1px solid var(--chat-input-border,var(--chat-border));');
      out.push('  border-radius:var(--mmdskin-input-radius);');
      out.push('}');
      out.push(P(s) + ' [data-chat="input"]{ background-color:transparent;color:var(--chat-input-text,var(--chat-text));border:0; }');
      out.push(P(s) + ' [data-chat="input"]::placeholder{ color:var(--chat-input-placeholder,var(--chat-text-muted)); }');
      /* 发送按钮 */
      out.push(P(s) + ' [data-chat="send"]{ border-radius:' + (s.composer.send === 'glow' ? '50%' : px(Math.max(6, s.composer.radius - 2))) + '; }');
      if (s.composer.send === 'accent') {
        out.push(P(s) + ' [data-chat="send"]{ background-color:var(--chat-accent);color:var(--mmdskin-on-accent);border:0; }');
      } else if (s.composer.send === 'ghost') {
        out.push(P(s) + ' [data-chat="send"]{ background-color:transparent;color:var(--chat-accent);border:1.5px solid var(--chat-accent); }');
      } else {
        out.push(P(s) + ' [data-chat="send"]{ background-color:var(--chat-accent);color:var(--mmdskin-on-accent);border:0;');
        out.push('  box-shadow:0 0 16px var(--mmdskin-glow); }');
      }
      if (s.composer.sendText) {
        out.push(P(s) + ' [data-chat="send"]::after{ content:"' + escCssStr(s.composer.sendText) + '";font-size:12px;margin-left:2px; }');
      }
    }

    /* --- 功能栏 --- */
    if (s.statusbar.on || (s.toggle.on && s.toggle.place === 'statusbar')) {
      out.push(P(s) + ' [data-slot="statusbar"]{');
      out.push('  display:flex;align-items:center;gap:8px;flex-wrap:wrap;');
      /* 平台没给功能栏写任何样式，内边距得自己填 */
      out.push('  padding:8px 12px;');
      out.push('  background-color:var(--mmdskin-bar-bg);');
      out.push(s.statusbar.gradient ? '  background-image:var(--mmdskin-bar-image);' : '  background-image:revert;');
      out.push('  color:var(--chat-text);');
      out.push(s.statusbar.sticky ? '  position:sticky;top:0;z-index:1100;' : '  position:revert;');
      out.push(s.statusbar.radius ? '  border-radius:' + px(s.statusbar.radius) + ';' : '  border-radius:revert;');
      out.push(s.statusbar.hairline ? '  border-bottom:1px solid var(--chat-border);' : '  border-bottom:revert;');
      out.push('  box-shadow:var(--mmdskin-shadow);');
      out.push('}');
    }

    /* --- 一键开关按钮（永远不跟着 .mmdskin-off 一起消失，否则就再也开不回来了） --- */
    if (s.toggle.on) {
      const isIcon = s.toggle.style === 'icon';
      out.push('/* 开关按钮本体：不挂 .mmdskin-off 前缀，关掉美化后它依然在。 */');
      out.push(ROOT + ' .mmdskin-btn{');
      out.push('  display:inline-flex;align-items:center;justify-content:center;gap:4px;');
      out.push('  font-family:var(--mmdskin-font,system-ui,sans-serif);');
      out.push('  font-size:12px;line-height:1;');
      out.push('  padding:' + (isIcon ? '9px' : '8px 13px') + ';');
      out.push('  border-radius:' + (s.toggle.style === 'square' ? '8px' : '999px') + ';');
      out.push('  cursor:pointer;user-select:none;');
      out.push('  border:1px solid var(--mmdskin-accent,' + c.accent + ');');
      out.push('  background-color:var(--mmdskin-panel-bg,' + mix(c.surface, c.bg, 0.22) + ');');
      out.push('  color:var(--mmdskin-accent,' + c.accent + ');');
      out.push('  box-shadow:var(--mmdskin-shadow,0 6px 18px rgba(0,0,0,.32));');
      out.push('  transition:transform .15s ease,opacity .15s ease;');
      out.push('  z-index:1500;');
      out.push('}');
      out.push(ROOT + ' .mmdskin-btn:active{ transform:scale(.95); }');
      out.push(ROOT + ' .mmdskin-btn:focus-visible{ outline:2px solid var(--mmdskin-accent,' + c.accent + ');outline-offset:2px; }');
      if (s.toggle.place === 'float') {
        const pos = {
          'bottom-right': 'right:14px;bottom:96px;',
          'bottom-left': 'left:14px;bottom:96px;',
          'top-right': 'right:14px;top:64px;',
          'top-left': 'left:14px;top:64px;',
        }[s.toggle.position] || 'right:14px;bottom:96px;';
        out.push(ROOT + ' .mmdskin-float{ position:fixed;' + pos + 'margin:0; }');
      } else {
        out.push(ROOT + ' .mmdskin-btn{ flex:0 0 auto;margin-left:auto; }');
      }
      /* 关掉美化后主题变量就整块失效了，兜底样式按主题各写一份：
       * 否则浅色页面上会挂着一颗按夜间色板算出来的深色药丸，看着就像 bug。 */
      const lc = activePalette(s, 'light');
      out.push(ROOT + '[data-theme="light"] .mmdskin-btn{ border-color:' + lc.accent + ';color:' + lc.accent + ';background-color:' + mix(lc.surface, lc.bg, 0.22) + '; }');
    }
    return out.join('\n');
  }

  // ---------------------------------------------------------------- CSS：粒子与动效
  function particleLayer(s, layer) {
    const pt = s.particles;
    const rng = makeRng(layer === 1 ? 20260101 : 19700101);
    const n = Math.max(3, Math.round(pt.count * (layer === 1 ? 1 : 0.55)));
    const size = pt.size * (layer === 1 ? 1 : 0.6);
    const W = layer === 1 ? 260 : 170;
    const H = layer === 1 ? 380 : 250;
    const dots = [];
    for (let i = 0; i < n; i += 1) {
      const x = (4 + rng() * 92).toFixed(2);
      const y = (4 + rng() * 92).toFixed(2);
      const col = rng() > 0.62 ? pt.color2 : pt.color;
      const jitter = 0.75 + rng() * 0.6;
      dots.push(dotGradient(pt.shape, x, y, size * jitter, col));
    }
    return { W: W, H: H, css: dots.join(',') };
  }

  function dotGradient(shape, x, y, size, col) {
    const px1 = (size).toFixed(2);
    switch (shape) {
      case 'firefly':
        return 'radial-gradient(' + (size * 2.4).toFixed(2) + 'px ' + (size * 2.4).toFixed(2) + 'px at ' + x + '% ' + y + '%,'
          + rgba(col, 0.95) + ',' + rgba(col, 0.35) + ' 45%,transparent 76%)';
      case 'snow':
        return 'radial-gradient(' + px1 + 'px ' + px1 + 'px at ' + x + '% ' + y + '%,' + rgba(col, 0.95) + ',' + rgba(col, 0.25) + ' 70%,transparent 100%)';
      case 'petal':
        return 'radial-gradient(' + (size * 1.7).toFixed(2) + 'px ' + (size * 0.85).toFixed(2) + 'px at ' + x + '% ' + y + '%,'
          + rgba(col, 0.92) + ',' + rgba(col, 0.3) + ' 70%,transparent 100%)';
      case 'bubble':
        return 'radial-gradient(' + (size * 2.1).toFixed(2) + 'px ' + (size * 2.1).toFixed(2) + 'px at ' + x + '% ' + y + '%,'
          + 'transparent 0 52%,' + rgba(col, 0.85) + ' 60%,transparent 82%)';
      default: /* star */
        return 'radial-gradient(' + px1 + 'px ' + px1 + 'px at ' + x + '% ' + y + '%,' + rgba(col, 1) + ' 0%,'
          + rgba(col, 0.55) + ' 45%,transparent 72%)';
    }
  }

  function buildFxCss(s) {
    const out = [];
    const pt = s.particles;
    const anim = s.motion.on;                 /* 关掉动效 = 纯静态皮肤 */
    const animated = [];

    out.push('/* ===== 3/4 粒子与动效 ===== */');

    if (pt.on) {
      const L1 = particleLayer(s, 1);
      const L2 = pt.layer2 ? particleLayer(s, 2) : null;
      const op1 = (pt.opacity / 100).toFixed(2);
      const op2 = (pt.opacity / 100 * 0.7).toFixed(2);
      out.push('/* 粒子是伪元素 + 多层 radial-gradient 平铺出来的：不新增 DOM、不写脚本，');
      out.push(' * 脚本被平台抽走也照样在。动画走 transform，交合成层处理，不逐帧重绘。 */');
      out.push(P(s) + '::before{');
      out.push('  content:"";position:fixed;pointer-events:none;z-index:1000;');
      out.push('  background-image:' + L1.css + ';');
      out.push('  background-size:' + L1.W + 'px ' + L1.H + 'px;');
      out.push('  opacity:' + op1 + ';');
      out.push(particleBoxCss(s, L1));
      out.push('}');
      if (anim) {
        out.push(P(s) + '::before{');
        out.push('  animation:' + particleAnimList(s, 'mmdskin-mvA', L1, pt) + ';');
        out.push('  will-change:transform,opacity;');
        out.push('}');
        animated.push(P(s) + '::before');
      }
      if (L2) {
        out.push(P(s) + '::after{');
        out.push('  content:"";position:fixed;pointer-events:none;z-index:1000;');
        out.push('  background-image:' + L2.css + ';');
        out.push('  background-size:' + L2.W + 'px ' + L2.H + 'px;');
        out.push('  opacity:' + op2 + ';');
        out.push(particleBoxCss(s, L2));
        out.push('}');
        if (anim) {
          out.push(P(s) + '::after{');
          out.push('  animation:' + particleAnimList(s, 'mmdskin-mvB', L2, pt) + ';');
          out.push('  will-change:transform,opacity;');
          out.push('}');
          animated.push(P(s) + '::after');
        }
      }
      if (anim && pt.dir !== 'still') {
        out.push(moveKeyframes(s, 'mmdskin-mvA', L1));
        if (L2) out.push(moveKeyframes(s, 'mmdskin-mvB', L2));
      }
      if (anim && pt.twinkle) {
        out.push('@keyframes mmdskin-twA{ from{opacity:' + (pt.opacity / 100 * 0.38).toFixed(2) + ';} to{opacity:' + op1 + ';} }');
        if (L2) out.push('@keyframes mmdskin-twB{ from{opacity:' + (pt.opacity / 100 * 0.26).toFixed(2) + ';} to{opacity:' + op2 + ';} }');
      }
      /* 粒子开着但动效总开关关着：把旧皮肤可能留下的动画还原，粒子保持静止 */
      if (!anim) out.push(P(s) + '::before,' + P(s) + '::after{ animation:revert; }');
    } else {
      /* 粒子关掉时显式把伪元素还回去 —— 否则旧皮肤的粒子还会飘着（残留） */
      out.push(P(s) + '::before,' + P(s) + '::after{ content:revert;animation:revert; }');
    }

    if (s.motion.on) {
      /* 气泡入场 */
      /* 气泡入场会给消息加 transform —— 卡里若有固定定位的面板，动画期间会跟着错位，所以受保护开关管 */
      if (s.motion.bubbleIn && !s.meta.safeLayout) {
        const t = (0.34 / s.motion.speed).toFixed(2);
        out.push(P(s) + ' [data-chat="message"]{ animation:mmdskin-in ' + t + 's cubic-bezier(.2,.7,.3,1) both; }');
        out.push('@keyframes mmdskin-in{ from{opacity:0;transform:translateY(7px);} to{opacity:1;transform:none;} }');
        animated.push(P(s) + ' [data-chat="message"]');
      } else {
        out.push(P(s) + ' [data-chat="message"]{ animation:revert; }');
      }
      /* 呼吸辉光 */
      if (s.motion.breathe) {
        const t = (3.6 / s.motion.speed).toFixed(1);
        out.push(P(s) + ' [data-chat="send"]{ animation:mmdskin-breathe ' + t + 's ease-in-out infinite; }');
        out.push('@keyframes mmdskin-breathe{ 0%,100%{box-shadow:0 0 0 0 var(--mmdskin-glow-none);} 50%{box-shadow:0 0 14px 3px var(--mmdskin-glow-strong);} }');
        animated.push(P(s) + ' [data-chat="send"]');
      } else {
        out.push(P(s) + ' [data-chat="send"]{ animation:revert; }');
      }
      /* 渐变流动 */
      if (s.motion.gradientFlow) {
        const targets = [];
        if (s.header.on && s.header.gradient) targets.push(P(s) + ' [data-chat="header"]');
        if (s.composer.on) targets.push(P(s) + ' [data-chat="composer"]');
        if (s.statusbar.on) targets.push(P(s) + ' [data-slot="statusbar"]');
        if (targets.length) {
          const t = (9 / s.motion.speed).toFixed(1);
          out.push(targets.join(',\n') + '{ background-size:230% 100%;animation:mmdskin-flow ' + t + 's ease-in-out infinite alternate; }');
          out.push('@keyframes mmdskin-flow{ from{background-position:0% 50%;} to{background-position:100% 50%;} }');
          animated.push.apply(animated, targets);
        }
      } else {
        out.push(P(s) + ' [data-chat="header"],' + P(s) + ' [data-chat="composer"],' + P(s) + ' [data-slot="statusbar"]{ animation:revert;background-size:revert; }');
      }
      /* 发送键流光 */
      if (s.motion.borderFlow && s.composer.on) {
        const t = (2.6 / s.motion.speed).toFixed(1);
        out.push(P(s) + ' [data-chat="send"]{ position:relative;overflow:hidden; }');
        out.push(P(s) + ' [data-chat="send"]::before{ content:"";position:absolute;top:0;left:-60%;width:38%;height:100%;');
        out.push('  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);');
        out.push('  animation:mmdskin-sweep ' + t + 's linear infinite;pointer-events:none; }');
        out.push('@keyframes mmdskin-sweep{ from{left:-60%;} to{left:120%;} }');
        animated.push(P(s) + ' [data-chat="send"]::before');
      } else {
        out.push(P(s) + ' [data-chat="send"]::before{ content:revert; }');
        out.push(P(s) + ' [data-chat="send"]{ position:revert;overflow:revert; }');
      }
    } else {
      /* 动效总开关关着：把旧皮肤可能留下的动画与 transform 全部还原 */
      out.push(P(s) + ' [data-chat="message"],' + P(s) + ' [data-chat="send"],' + P(s) + ' [data-chat="header"],'
        + P(s) + ' [data-chat="composer"],' + P(s) + ' [data-slot="statusbar"]{ animation:revert;background-size:revert; }');
      out.push(P(s) + ' [data-chat="send"]::before{ content:revert; }');
      out.push(P(s) + ' [data-chat="send"]{ position:revert;overflow:revert; }');
    }

    /* 照顾晕动症：系统开了减少动态效果时，整套动画停掉 */
    if (s.motion.reduceMotion && animated.length) {
      out.push('@media (prefers-reduced-motion: reduce){');
      out.push('  ' + animated.join(',\n  ') + '{ animation:none; }');
      out.push('}');
    }
    if (!out.length) out.push('/* 粒子与动效都没开 */');
    return out.join('\n');
  }

  function particleBoxCss(s, L) {
    const dir = s.particles.dir;
    const top = -L.H;
    const height = 'calc(100% + ' + (L.H * 2) + 'px)';
    if (dir === 'drift') {
      return '  top:' + top + 'px;left:' + (-L.W) + 'px;width:calc(100% + ' + (L.W * 2) + 'px);height:' + height + ';';
    }
    return '  top:' + top + 'px;left:0;right:0;height:' + height + ';';
  }

  function animShorthand(s, keyframe, L, pt) {
    if (pt.dir === 'still') return null;
    const dur = (pt.speed / (s.motion.on ? s.motion.speed : 1)).toFixed(1);
    return keyframe + ' ' + dur + 's linear infinite';
  }

  /** 一层的 animation 列表：飘动（可选）+ 明暗呼吸（可选，跟着 twinkle 开关走） */
  function particleAnimList(s, mv, L, pt) {
    const parts = [];
    const move = animShorthand(s, mv, L, pt);
    if (move) parts.push(move);
    if (pt.twinkle) parts.push((mv === 'mmdskin-mvA' ? 'mmdskin-twA 6.5s' : 'mmdskin-twB 9s') + ' ease-in-out infinite alternate');
    return parts.join(',');
  }

  function moveKeyframes(s, name, L) {
    const dir = s.particles.dir;
    if (dir === 'still') return '';
    let from = 'translate3d(0,0,0)';
    let to = 'translate3d(0,' + L.H + 'px,0)';
    if (dir === 'rise') to = 'translate3d(0,-' + L.H + 'px,0)';
    if (dir === 'drift') to = 'translate3d(' + L.W + 'px,' + L.H + 'px,0)';
    return '@keyframes ' + name + '{ from{transform:' + from + ';} to{transform:' + to + ';} }';
  }

  // ---------------------------------------------------------------- CSS：宿主弹窗（受控通路）
  function buildHostCss(s) {
    const out = [];
    const radius = px(s.host.radius);
    const hair = s.host.popupHairline
      ? 'border:1px solid var(--chat-modal-btn-border,rgba(128,128,128,.35));'
      : '';
    out.push('/* ===== 4/4 宿主弹窗（平台抽取 + 过滤后注入父页面） =====');
    out.push(' * 每条规则都从精确的 [data-host="…"] 开放根开始、平铺书写；');
    out.push(' * 不用 :has() / url() / 原生嵌套，也不写 .model-setting-scope 这类裸父页面 class。');
    out.push(' * 这里只做「跟主题无关」的圆角与描边：父页面读不到 iframe 的 data-theme，');
    out.push(' * 写死颜色会在另一套主题下翻车，颜色统一交给上一条规则的 18 个主题变量桥。');
    out.push(' * 根里的内部 class 属于当前实现观察，换目标站点前请重新取证。 */');
    if (s.host.detailModels) out.push('[data-host="models"]{ border-radius:' + radius + '; }');
    if (s.host.detailModelSetting)
      out.push('[data-host="model-setting"] .mp-card{ border-radius:' + radius + ';' + hair + ' }');
    if (s.host.detailPersona)
      out.push('[data-host="persona"] .gender-item.active{ border-radius:' + px(Math.max(6, s.host.radius - 6)) + '; }');
    if (s.host.detailSummary) out.push('[data-host="summary"]{ border-radius:' + radius + '; }');
    if (!s.host.detailModels && !s.host.detailModelSetting && !s.host.detailPersona && !s.host.detailSummary)
      out.push('/* 没有勾任何弹窗细化项：配色全靠上一条规则里的 18 个主题变量桥 */');
    return out.join('\n');
  }

  // ---------------------------------------------------------------- 生成的 HTML / 脚本
  function buildToggleHtml(s) {
    const t = s.toggle;
    const first = t.defaultOn ? t.labelOn : t.labelOff;
    return '<button type="button" class="mmdskin-btn' + (t.place === 'float' ? ' mmdskin-float' : '') + '"'
      + ' aria-pressed="' + (t.defaultOn ? 'true' : 'false') + '">' + escapeHtml(first) + '</button>';
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function buildKitScript(s) {
    const t = s.toggle;
    /* 存档 key 只留安全字符，避免踩到平台存档名的怪脾气，也方便作者换前缀避冲突 */
    const key = String(t.saveKey || '').replace(/[^A-Za-z0-9_.-]/g, '').slice(0, 40) || 'mmdskin_off';
    const persist = t.persist === 'forever' ? 'forever' : 'session';
    const L = [
      '<script>',
      '/* MMD 美化积木工坊 · 一键开关',
      ' * 只做三件事：读取上次的选择、给根节点加/去 .mmdskin-off、更新按钮文字。',
      ' * 皮肤本体全在 <style> 里，脚本被抽走也只是「关不掉」，不会样崩。 */',
      '(function () {',
      '  if (window.__mmdSkin && window.__mmdSkin.ready) return;',
      '  var NS = window.__mmdSkin = window.__mmdSkin || {};',
      '  NS.ready = true;',
      '  var KEY = "' + key + '";',
      '  var PERSIST = "' + persist + '";',
      '  var PLACE = "' + (t.place === 'float' ? 'float' : 'statusbar') + '";',
      '  var DEFAULT_OFF = ' + (t.defaultOn ? 'false' : 'true') + ';',
      '  var LON = "' + escJs(t.labelOn) + '";',
      '  var LOFF = "' + escJs(t.labelOff) + '";',
      '  var off = DEFAULT_OFF;',
      '',
      '  function root() { return document.querySelector(\'[data-chat="root"]\'); }',
      '',
      '  function read() {',
      '    try {',
      '      var v = PERSIST === "forever" ? sdk.save.get(KEY) : sdk.cache.get(KEY);',
      '      if (v === null || v === undefined || v === "") return DEFAULT_OFF;',
      '      return v === 1 || v === "1" || v === true;',
      '    } catch (e) { return DEFAULT_OFF; }',
      '  }',
      '',
      '  function write(v) {',
      '    try {',
      '      if (PERSIST === "forever") sdk.save.set(KEY, v ? 1 : 0);',
      '      else sdk.cache.set(KEY, v ? 1 : 0);',
      '    } catch (e) {}',
      '  }',
      '',
      '  function paint() {',
      '    var r = root();',
      '    if (r) { if (off) r.classList.add("mmdskin-off"); else r.classList.remove("mmdskin-off"); }',
      '    var btns = document.querySelectorAll(".mmdskin-btn");',
      '    for (var i = 0; i < btns.length; i++) {',
      '      btns[i].textContent = off ? LOFF : LON;',
      '      btns[i].setAttribute("aria-pressed", off ? "false" : "true");',
      '    }',
      '  }',
      '',
      '  function ensureButton() {',
      '    if (PLACE !== "float") return;',
      '    if (document.querySelector(".mmdskin-float")) return;',
      '    var r = root();',
      '    if (!r) return;',
      '    var b = document.createElement("button");',
      '    b.type = "button";',
      '    b.className = "mmdskin-btn mmdskin-float";',
      '    b.textContent = off ? LOFF : LON;',
      '    b.setAttribute("aria-pressed", off ? "false" : "true");',
      '    r.appendChild(b);',
      '  }',
      '',
      '  function sync() { off = read(); ensureButton(); paint(); }',
      '',
      '  document.addEventListener("click", function (e) {',
      '    var el = e.target;',
      '    if (!el || !el.closest) return;',
      '    var btn = el.closest(".mmdskin-btn");',
      '    if (!btn) return;',
      '    e.preventDefault();',
      '    off = !off;',
      '    write(off);',
      '    paint();',
      '  });',
      '',
      '  sdk.on("ready", sync);',
      '  sdk.on("conversation:switch", sync);',
      '  sdk.on("theme:change", paint);',
      '})();',
      '<\/script>',
    ];
    return L.join('\n');
  }

  function escJs(str) {
    return String(str == null ? '' : str).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\r?\n/g, ' ');
  }

  // ========================================================================
  // 组装「导入正则」JSON
  // ========================================================================
  function buildRules(s) {
    const rules = [];
    /* id 一律写 -1，键顺序也照平台的来：{id, replaceString, scriptName, findRegex}。
     *
     * 为什么不是 -1 / -2 / -3：平台自己导出的正则数据文件里，**每条规则的 id 都是 -1**
     * （4 份真实文件逐条核对过）。-1 很可能是「新建一条」的哨兵值，而别的负数可能被当成
     * 「更新已存在的第 N 条」。既然目标是"导进去"，就用平台自己产出的那个值，别自作聪明。
     * 本地 skill 的校验脚本会把「id 重复」报成 error —— 那条规则比平台实际行为更严，
     * 工具自己的检查器干脆不报这条（重复是刻意的）。 */
    const styleRule = (name, marker, cssText) => {
      const body = s.meta.minify ? minifyCss(cssText) : cssText;
      const chunks = splitCss(body, 18500);
      chunks.forEach((chunk, i) => {
        const nm = i === 0 ? name : name + '-' + (i + 1);
        const mk = i === 0 ? marker : marker.replace('}}', '-' + (i + 1) + '}}');
        rules.push({ id: -1, replaceString: '<style>\n' + chunk + '\n</style>', scriptName: nm, findRegex: mk });
      });
    };
    styleRule('skin-vars', '{{skin-vars}}', buildVarsCss(s));
    styleRule('skin-layout', '{{skin-layout}}', buildLayoutCss(s));
    if (s.particles.on || s.motion.on) styleRule('skin-fx', '{{skin-fx}}', buildFxCss(s));
    if (s.host.on && (s.host.detailModels || s.host.detailModelSetting || s.host.detailPersona || s.host.detailSummary))
      styleRule('skin-host', '{{skin-host}}', buildHostCss(s));
    if (s.custom.extraCss.trim()) styleRule('skin-custom', '{{skin-custom}}', classifyCustomCss(s.custom.extraCss));
    if (s.toggle.on) {
      if (s.toggle.place === 'statusbar') {
        rules.push({ id: -1, replaceString: buildToggleHtml(s), scriptName: 'skin-btn', findRegex: '{{skin-toggle}}' });
      }
      rules.push({ id: -1, replaceString: buildKitScript(s), scriptName: 'skin-kit', findRegex: '{{skin-kit}}' });
    }
    return rules;
  }

  /** 自定义 CSS 原样并入；只有全局选择器会被改写成 [data-chat="root"] 前缀（平台明令禁止全局 CSS） */
  function classifyCustomCss(text) {
    return String(text).replace(/(^|[\n}])\s*(:root|html|body|\*)\s*\{/g, function (m, pre) {
      return pre + '\n[data-chat="root"]{';
    });
  }

  function buildPack(s) {
    /* 字段形态对齐平台自己导出的「正则数据」文件：
     * {"pageDepth":2,"statusbar":"…","beginning":"…","regex_scripts":[…]}
     * statusbar / beginning 必须带着（哪怕空串）—— 少字段会被导入页判成「格式错误」，
     * 这是真实踩过的坑：平台自己导出的 4 份文件里这两个键一个都没少。 */
    const pack = { chatVersion: 1, pageDepth: 2 };
    pack.statusbar = (s.toggle.on && s.toggle.place === 'statusbar') ? '{{skin-toggle}}' : String(s.meta.statusbar || '');
    pack.beginning = String(s.meta.beginning || '');
    pack.regex_scripts = buildRules(s);
    return pack;
  }

  /**
   * 导出文本：**缩进多行，不做单行紧凑**。
   *
   * 这条是实测出来的（用户拿真实导入页试了好几次）：
   *   - 单行紧凑的 JSON：导入页不报错，但规则**不生效**；
   *   - 缩进多行的 JSON：正常生效。
   * 同样内容、只差外层排版，效果却不同 —— 平台内部怎么处理的不清楚，
   * 但"能导进去"和"导进去有用"是两件事。所以这里只保留有效的那个形态，
   * 单行选项已经删掉（谁也别再加回来；自测里有一条断言专门守着这个）。
   */
  function stringifyPack(pack) {
    return JSON.stringify(pack, null, 2);
  }

  // ========================================================================
  // 自检器：复刻 skill 里 validate.mjs 的判定
  // ========================================================================
  const LIMITS = { rules: 130, scriptName: 20, findRegex: 1000, replaceString: 20000, statusbar: 200, beginning: 4000 };
  const TOP_KEYS = ['chatVersion', 'pageDepth', 'statusbar', 'beginning', 'personality', 'regex_scripts'];
  const RULE_KEYS = ['id', 'scriptName', 'findRegex', 'replaceString'];
  const BANNED_TAGS = ['iframe', 'link', 'meta', 'form', 'object', 'embed'];
  const RESERVED_IN_PATTERN = ['html', 'head', 'body', 'css'];
  const HOST_ROOTS = ['conversations', 'conv-delete', 'conv-rename', 'conv-limit', 'models', 'model-setting',
    'persona', 'persona-confirm', 'extra', 'style', 'instructions', 'reset', 'background', 'assistant-intro',
    'message-edit', 'message-delete', 'message-backtrack', 'share-role', 'share-records', 'summary'];
  const RAW_HOST_CLASSES = ['.sandbox-host', '.model-setting-scope', '.model-switch-scope', '.role-profile-modal',
    '.custom-instruction-scope', '.summary-sheet'];
  const SDK_CAPS = ['input.get', 'input.set', 'input.add', 'input.insert', 'input.clear', 'input.focus', 'input.blur',
    'input.getCursor', 'input.setCursor', 'composer.show', 'composer.hide', 'composer.visible', 'message.send',
    'message.edit', 'cache.get', 'cache.set', 'cache.remove', 'save.get', 'save.set', 'save.remove', 'save.keys',
    'stage.open', 'stage.close', 'stage.el', 'stage.visible', 'role.get', 'user.get', 'on', 'debug.log', 'version'];
  const SDK_EVENTS = ['ready', 'message:new', 'message:done', 'message:stream', 'message:mount', 'message:unmount',
    'input:change', 'conversation:switch', 'theme:change', 'back', 'stage:close', 'dispose'];

  function classifyPattern(raw) {
    const trimmed = String(raw == null ? '' : raw).trim().replace(/^`|`$/g, '');
    if (!trimmed) return { kind: 'empty' };
    const m = /^\/([\s\S]+)\/([gimsuy]*)$/.exec(trimmed);
    if (!m) return { kind: 'literal', literal: trimmed };
    let flags = m[2] || '';
    if (flags.indexOf('g') < 0) flags += 'g';
    try { new RegExp(m[1], flags); return { kind: 'regex' }; }
    catch (e) { return { kind: 'bad-regex', message: e.message }; }
  }
  function stripStyleAndScript(str) {
    return String(str).replace(/<style[\s\S]*?<\/style>/gi, '').replace(/<script[\s\S]*?<\/script>/gi, '');
  }
  function styleBlocks(text) {
    const out = []; const re = /<style\b[^>]*>([\s\S]*?)<\/style>/gi; let m;
    while ((m = re.exec(String(text))) !== null) out.push(m[1]);
    return out;
  }
  function hasWord(str, word) { return new RegExp('(^|[^A-Za-z])' + word + '([^A-Za-z]|$)', 'i').test(str); }

  function checkHostCss(err, warn, where, replaceString) {
    styleBlocks(replaceString).forEach((rawStyle) => {
      const style = rawStyle.replace(/\/\*[\s\S]*?\*\//g, '');
      const usesHostRoot = /\[data-host\b/i.test(style);
      const usesRawHostClass = RAW_HOST_CLASSES.some((rc) => new RegExp(rc.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![\\w-])').test(style));
      if (!usesHostRoot && !usesRawHostClass) return;
      if (/:has\s*\(/i.test(style)) err(where, '受控宿主 CSS 不能使用 :has()，平台会过滤掉');
      if (/\burl\s*\(/i.test(style)) err(where, '受控宿主 CSS 不能使用 url()，平台会过滤掉');
      const stack = []; let prelude = ''; let quote = ''; let escaped = false;
      for (let i = 0; i < style.length; i += 1) {
        const ch = style[i];
        if (quote) {
          prelude += ch;
          if (!escaped && ch === quote) quote = '';
          escaped = !escaped && ch === '\\';
          continue;
        }
        if (ch === '"' || ch === "'") { quote = ch; prelude += ch; continue; }
        if (ch === '{') {
          const selector = prelude.trim();
          const parentHostScope = stack.some((entry) => entry.hostScope);
          const hasHostRoot = /\[data-host\b/i.test(selector);
          if (parentHostScope) err(where, '受控宿主 CSS 必须平铺，不能在 [data-host] 规则里再嵌套');
          selector.split(',').forEach((part) => {
            const rawInPart = RAW_HOST_CLASSES.some((rc) => new RegExp(rc.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![\\w-])').test(part));
            const partHasHostRoot = /\[data-host\b/i.test(part);
            if (rawInPart && !partHasHostRoot) err(where, '宿主内部选择器必须由 [data-host="…"] 根限定，不能裸写：' + part.trim());
            if (partHasHostRoot) {
              const mm = /^\s*\[data-host\s*=\s*(?:"([^"]+)"|'([^']+)')\]/.exec(part);
              if (!mm) { err(where, '宿主选择器必须从精确 [data-host="…"] 根开始：' + part.trim()); return; }
              const root = mm[1] || mm[2];
              if (HOST_ROOTS.indexOf(root) < 0) err(where, '未知或未开放的 data-host 根 ' + root);
              if (root === 'summary' && /^\s*\[data-host\s*=\s*(?:"summary"|'summary')\]\s+\.summary-sheet\b/.test(part))
                err(where, 'summary 根本身就是 .summary-sheet，不要再加一层 .summary-sheet 后代');
            }
          });
          stack.push({ hostScope: parentHostScope || hasHostRoot });
          prelude = '';
          continue;
        }
        if (ch === '}') { stack.pop(); prelude = ''; continue; }
        prelude += ch;
      }
    });
  }

  function checkSdk(err, warn, where, code) {
    const re = /\bsdk\.([A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)?)/g; let m;
    while ((m = re.exec(code)) !== null) {
      const name = m[1];
      if (SDK_CAPS.indexOf(name) >= 0) continue;
      if (SDK_CAPS.indexOf(name.split('.')[0]) >= 0) continue;
      err(where, 'contract.json 里没有 sdk.' + name + ' 这个能力');
    }
    const reEv = /\bsdk\.on\(\s*['"]([^'"]+)['"]/g;
    while ((m = reEv.exec(code)) !== null) {
      if (SDK_EVENTS.indexOf(m[1]) < 0) err(where, 'contract.json 里没有「' + m[1] + '」这个事件名');
    }
  }

  function runChecker(pack) {
    const errors = []; const warns = [];
    const err = (w, m) => errors.push({ where: w, msg: m });
    const warn = (w, m) => warns.push({ where: w, msg: m });

    Object.keys(pack).forEach((key) => {
      if (TOP_KEYS.indexOf(key) < 0) err('顶层', '多了一个键 ' + key + '，导入页不认');
    });
    if (pack.chatVersion !== 1) err('顶层', 'chatVersion 必须是 1，否则新建卡会落到旧聊天页');
    if (pack.pageDepth !== 2) warn('顶层', 'pageDepth 建议固定 2');
    ['statusbar', 'beginning'].forEach((key) => {
      if (pack[key] === undefined) return;
      if (typeof pack[key] !== 'string') err('顶层', key + ' 必须是字符串');
      else if (pack[key].length > LIMITS[key]) err('顶层', key + ' ' + pack[key].length + ' 字，超上限 ' + LIMITS[key]);
    });
    const list = pack.regex_scripts || [];
    if (!Array.isArray(list)) return { errors: [{ where: '顶层', msg: 'regex_scripts 必须是数组' }], warns: warns };
    if (list.length > LIMITS.rules) err('顶层', list.length + ' 条规则，超上限 ' + LIMITS.rules);
    if (!list.length) err('顶层', '一条规则都没有');

    const soup = [pack.statusbar, pack.beginning].concat(list.map((r) => (r && typeof r.replaceString === 'string' ? r.replaceString : ''))).join('\n');
    const seenLiteral = {}; const seenName = {};

    list.forEach((rule, i) => {
      /* 粘贴进来的包可能很不规整，这里绝不能抛异常，把话说清楚就行 */
      if (!rule || typeof rule !== 'object' || Array.isArray(rule)) {
        err('规则 ' + (i + 1), '不是一个对象，平台会跳过这一条');
        return;
      }
      const where = '规则 ' + (i + 1) + '「' + (rule.scriptName || '无名') + '」';
      RULE_KEYS.forEach((k) => { if (!(k in rule)) err(where, '缺字段 ' + k); });
      Object.keys(rule).forEach((k) => { if (RULE_KEYS.indexOf(k) < 0) warn(where, '多了字段 ' + k); });
      /* id 一律 -1 是刻意的（与平台自身导出同形，平台导入时会重编号），
       * 所以这里只检查「是不是负整数」，不再对「重复」报警 —— 那是设计，不是问题。 */
      if (!Number.isInteger(rule.id) || rule.id >= 0) err(where, 'id 要用负整数（平台按这个值重编号；用 -1 就行）');

      const name = rule.scriptName;
      if (typeof name !== 'string' || !name.trim()) err(where, 'scriptName 不能为空');
      else {
        if (name.length > LIMITS.scriptName) err(where, 'scriptName ' + name.length + ' 字，超上限 ' + LIMITS.scriptName);
        if (seenName[name] !== undefined) warn(where, 'scriptName 与规则 ' + (seenName[name] + 1) + ' 重名');
        else seenName[name] = i;
      }

      const find = rule.findRegex;
      if (typeof find !== 'string' || !find.trim()) err(where, 'findRegex 不能为空');
      else {
        if (find.length > LIMITS.findRegex) err(where, 'findRegex ' + find.length + ' 字，超上限 ' + LIMITS.findRegex);
        if (/<[a-zA-Z/]/.test(find)) err(where, 'findRegex 里有 HTML 标签，平台不建议');
        RESERVED_IN_PATTERN.forEach((word) => {
          if (hasWord(find, word)) warn(where, 'findRegex 含保留字 ' + word + '，创卡页文案不建议');
        });
        const kind = classifyPattern(find);
        if (kind.kind === 'bad-regex') err(where, '写成 /…/ 但编不过：' + kind.message);
        if (kind.kind === 'literal') {
          if (seenLiteral[kind.literal] !== undefined) err(where, '字面量匹配式与规则 ' + (seenLiteral[kind.literal] + 1) + ' 重复，后一条永远匹配不到');
          else seenLiteral[kind.literal] = i;
        }
      }

      const body = rule.replaceString;
      if (typeof body !== 'string') { err(where, 'replaceString 必须是字符串'); return; }
      if (body.length > LIMITS.replaceString) err(where, 'replaceString ' + body.length + ' 字，超编辑器上限 ' + LIMITS.replaceString + '，要拆条');
      checkSdk(err, warn, where, body);

      const visible = stripStyleAndScript(body);
      if (/<[a-zA-Z][^>]*\sdata-[a-zA-Z-]+\s*=/.test(visible)) warn(where, '标签上自写了 data-*，净化会删掉；按钮用 class 或 id');
      BANNED_TAGS.forEach((tag) => {
        if (new RegExp('<\\s*' + tag + '(?![A-Za-z0-9_-])', 'i').test(visible)) warn(where, '<' + tag + '> 在白名单外，会被删掉');
      });
      if (/^ {4,}</m.test(body)) warn(where, '有行以 4 个空格 + < 开头，会被 Markdown 当代码块原样显示');
      if (/(^|[\s,};])(\*|html|body|:root)\s*\{/.test(body)) err(where, '出现全局 CSS（*{} / html{} / body{} / :root{}），平台禁止；改用 [data-chat="root"]');
      const mountRe = /sdk\.on\(\s*['"]message:mount['"]/g; let mountM;
      while ((mountM = mountRe.exec(body)) !== null) {
        const block = body.slice(mountM.index + mountM[0].length, mountM.index + mountM[0].length + 1200);
        if (/\bsdk\.on\(/.test(block)) warn(where, 'sdk.on 疑似写在 message:mount 回调里，每挂一条气泡会多订一份');
      }
      if (/message:done/.test(body) && /sdk\.message\.send\(/.test(body)) warn(where, '既订阅 message:done 又调 message.send，别做成自问自答死循环');
      checkHostCss(err, warn, where, body);

      const kind2 = classifyPattern(find);
      if (kind2.kind === 'literal' && visible.trim() !== '') {
        const count = soup.split(kind2.literal).length - 1;
        if (count === 0) warn(where, '会产出可见内容，但触发串 ' + kind2.literal + ' 不在 statusbar / beginning / 其它规则里，页面上永远不出现');
      }
    });
    return { errors: errors, warns: warns };
  }

  // ========================================================================
  // 对比度体检
  // ========================================================================
  function contrastReport(s) {
    const rows = [];
    ['dark', 'light'].forEach((theme) => {
      const c = activePalette(s, theme);
      const label = theme === 'dark' ? '🌙 夜间' : '☀️ 日间';
      rows.push({ group: label, name: '正文 / 背景', ratio: contrast(c.text, c.bg) });
      rows.push({ group: label, name: '次要文字 / 背景', ratio: contrast(c.muted, c.bg) });
      rows.push({ group: label, name: '气泡文字 / AI 气泡', ratio: contrast(c.bubbleText, c.bubbleAi) });
      rows.push({ group: label, name: '气泡文字 / 我的气泡', ratio: contrast(c.bubbleText, c.bubbleUser) });
      rows.push({ group: label, name: '强调色 / 背景', ratio: contrast(c.accent, c.bg) });
      if (s.composer && s.composer.on && s.composer.send === 'accent') {
        rows.push({ group: label, name: '发送键文字 / 强调色', ratio: contrast(bestTextOn(c.accent), c.accent), soft: true });
      }
    });
    return rows;
  }

  // ========================================================================
  // 积木面板渲染
  // ========================================================================
  const allCtl = [];

  function el(tag, cls, html) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (html !== undefined) node.innerHTML = html;
    return node;
  }

  function renderBlocks() {
    const host = $('#blocks');
    host.innerHTML = '';
    allCtl.length = 0;
    SECTIONS.forEach((sec) => {
      const box = el('details', 'group');
      if (sec.open) box.open = true;
      const sum = el('summary');
      sum.textContent = sec.icon + ' ' + sec.title;
      box.appendChild(sum);
      const body = el('div', 'group-body');
      if (sec.hint) body.appendChild(el('p', 'group-hint', sec.hint));
      sec.fields.forEach((f) => body.appendChild(renderField(f)));
      box.appendChild(body);
      host.appendChild(box);
    });
    syncInputs();
  }

  function renderField(f) {
    const wrap = el('div', 'row' + (f.type === 'area' || f.type === 'html' ? ' stack' : ''));
    if (f.path) wrap.dataset.path = f.path;
    if (f.label) { const lb = el('label'); lb.textContent = f.label; wrap.appendChild(lb); }
    const ctl = el('div', 'ctl');
    wrap.appendChild(ctl);

    if (f.type === 'html') {
      ctl.innerHTML = f.html || '';
      return wrap;
    }

    if (f.type === 'colors') {
      wrap.className = 'row stack';
      COLOR_KEYS.forEach((ck) => {
        const path = 'palette.' + f.theme + '.' + ck.key;
        const line = el('div', 'row');
        const lb = el('label'); lb.textContent = ck.label;
        const c = el('div', 'ctl');
        const color = el('input'); color.type = 'color'; color.dataset.path = path;
        const hex = el('input', 'input hex'); hex.type = 'text'; hex.dataset.hexFor = path; hex.spellcheck = false;
        c.appendChild(color); c.appendChild(hex);
        line.appendChild(lb); line.appendChild(c);
        ctl.appendChild(line);
        allCtl.push({ field: { type: 'color', path: path }, el: color });
      });
      attachWhen(wrap, f, ctl);
      return wrap;
    }

    if (f.type === 'colors2') {
      wrap.className = 'row stack';
      [['粒子主色', f.p1], ['粒子副色', f.p2]].forEach((pair) => {
        const line = el('div', 'row');
        const lb = el('label'); lb.textContent = pair[0];
        const c = el('div', 'ctl');
        const color = el('input'); color.type = 'color'; color.dataset.path = pair[1];
        const hex = el('input', 'input hex'); hex.type = 'text'; hex.dataset.hexFor = pair[1]; hex.spellcheck = false;
        c.appendChild(color); c.appendChild(hex);
        line.appendChild(lb); line.appendChild(c);
        ctl.appendChild(line);
        allCtl.push({ field: { type: 'color', path: pair[1] }, el: color });
      });
      attachWhen(wrap, f, ctl);
      return wrap;
    }

    if (f.type === 'check') {
      const lab = el('label', 'check');
      const cb = el('input'); cb.type = 'checkbox'; cb.dataset.path = f.path;
      lab.appendChild(cb);
      lab.appendChild(el('span', '', escapeHtml(f.text || f.label || '')));
      ctl.appendChild(lab);
      allCtl.push({ field: f, el: cb });
      attachWhen(wrap, f, ctl);
      return wrap;
    }

    if (f.type === 'select') {
      const sel = el('select', 'select'); sel.dataset.path = f.path;
      f.options.forEach((o) => {
        const op = el('option'); op.value = String(o.value); op.textContent = o.label;
        sel.appendChild(op);
      });
      ctl.appendChild(sel);
      allCtl.push({ field: f, el: sel });
      attachWhen(wrap, f, ctl);
      return wrap;
    }

    if (f.type === 'chips') {
      const row = el('div', 'pill-row');
      f.options.forEach((o) => {
        const chip = el('button', 'chip'); chip.type = 'button';
        chip.dataset.value = String(o.value);
        chip.textContent = o.label;
        row.appendChild(chip);
      });
      ctl.appendChild(row);
      allCtl.push({ field: f, el: ctl });
      attachWhen(wrap, f, ctl);
      return wrap;
    }

    if (f.type === 'range') {
      const inp = el('input'); inp.type = 'range';
      inp.min = f.min; inp.max = f.max; inp.step = f.step; inp.dataset.path = f.path;
      const val = el('span', 'val');
      ctl.appendChild(inp); ctl.appendChild(val);
      allCtl.push({ field: f, el: inp, val: val });
      attachWhen(wrap, f, ctl);
      return wrap;
    }

    if (f.type === 'area') {
      const ta = el('textarea', 'input'); ta.rows = f.rows || 5; ta.dataset.path = f.path;
      if (f.placeholder) ta.placeholder = f.placeholder;
      ta.spellcheck = false;
      ctl.appendChild(ta);
      allCtl.push({ field: f, el: ta });
      attachWhen(wrap, f, ctl);
      return wrap;
    }

    /* text */
    const inp = el('input', 'input'); inp.type = 'text'; inp.dataset.path = f.path;
    if (f.placeholder) inp.placeholder = f.placeholder;
    ctl.appendChild(inp);
    allCtl.push({ field: f, el: inp });
    attachWhen(wrap, f, ctl);
    return wrap;
  }

  const whenReg = [];
  function attachWhen(wrap, f, ctl) {
    if (f.hint) ctl.appendChild(el('div', 'mini-note', escapeHtml(f.hint)));
    if (f.when) whenReg.push({ f: f, el: wrap });
  }

  function chipEq(a, b) {
    if (typeof b === 'boolean') return a === String(b);
    if (typeof b === 'number') return Number(a) === b;
    return a === String(b);
  }

  function refreshConditions() {
    whenReg.forEach((entry) => {
      let show = true;
      try { show = !!entry.f.when(state); } catch (e) { show = true; }
      entry.el.style.display = show ? '' : 'none';
    });
  }

  /**
   * 把 state 刷到所有控件上。
   * 两个讲究：
   *  1) 值相同就别赋值 —— 否则正在输入的文本框光标会被顶到末尾；
   *  2) 正在焦点里的控件不碰它的 value，但胶囊高亮 / 勾选框照刷。
   */
  function syncInputs() {
    allCtl.forEach((entry) => {
      const f = entry.field;
      const v = getPath(state, f.path);
      if (f.type === 'range') {
        const next = String(v);
        if (entry.el.value !== next) entry.el.value = next;
        if (entry.val) entry.val.textContent = v + (f.unit || '');
      } else if (f.type === 'color') {
        const hexVal = normHex(v);
        if (entry.el.value !== hexVal) entry.el.value = hexVal;
        const hex = $('[data-hex-for="' + f.path + '"]');
        if (hex && document.activeElement !== hex && hex.value !== hexVal) hex.value = hexVal;
      } else if (f.type === 'check') {
        if (entry.el.checked !== !!v) entry.el.checked = !!v;
      } else if (f.type === 'chips') {
        $$('.chip', entry.el).forEach((chip) => chip.classList.toggle('active', chipEq(chip.dataset.value, v)));
      } else if (f.type === 'select') {
        const next = String(v);
        if (document.activeElement !== entry.el && entry.el.value !== next) entry.el.value = next;
      } else {
        const next = v == null ? '' : String(v);
        if (document.activeElement !== entry.el && entry.el.value !== next) entry.el.value = next;
      }
    });
    refreshConditions();
  }

  function renderPreview() {
    if (!shadow) return;

    root.setAttribute('data-theme', previewTheme);
    root.classList.toggle('mmdskin-off', previewToggleOff);

    const statusbar = root.querySelector('[data-slot="statusbar"]');
    const statusbarUsed = s.statusbar.on || (s.toggle.on && s.toggle.place === 'statusbar');
    statusbar.style.display = statusbarUsed ? '' : 'none';

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'mmdskin-btn' + (s.toggle.place === 'float' ? ' mmdskin-float' : '');
      btn.textContent = previewToggleOff ? s.toggle.labelOff : s.toggle.labelOn;

      + '另外：单行紧凑的 JSON 导入页收得下但规则不生效，所以只出缩进多行的（实测结论）。');
    if (s.toggle.on && s.toggle.place === 'statusbar') {
      notes.push('你选了「塞进功能栏」：statusbar 会被写成 {{skin-toggle}}，卡里原本的功能栏触发串会被替换掉。');
    } else if (!String(s.meta.statusbar || '').trim()) {

    }

      notes.push('beginning 现在是空字符串：导入时会把卡里原本的第一句话清空。新建卡无所谓；给已有卡导入，请先在「导出形态」里填回原内容。');
    }

        + '（前者会把卡的全宽面板挤成窄条，后者会让固定定位元素在动画期间错位），这两个显式写 revert。'
        + '内边距、消息间距、头像尺寸照常生效 —— 气泡不会因此变挤。');
    } else {
      notes.push('「保护自定义界面」关着：会写气泡最大宽度、并给消息加 transform。'
        + '卡里若有自己的界面（尤其是固定定位的面板），这些会把它一起改坏。');

      + '但如果平台是「追加规则」而不是替换，旧皮肤的规则仍在——看到残留就在卡的正则列表里删掉旧的皮肤规则；'
      + '或者用一键开关把整套关掉：新旧规则都带 .mmdskin-off 前缀，会一起失效。');

      notes.push('受控宿主弹窗 CSS 属于「平台抽取 + 过滤后注入父页面」的通路：静态检查只能证明写法合规，不能证明你的目标站点已经注入。必须在真实聊天页打开对应弹窗，看根有没有命中、计算样式对不对。');

      notes.push('18 个宿主主题变量能不能同步到父页面弹窗，取决于目标站点版本；记忆管理、模型等入口是逐个接入的，可能有的已接、有的还是原生色。');
    if (s.toggle.on)
      notes.push('一键开关只能控制 iframe 里的皮肤（包括粒子）。父页面那些 [data-host] 细化规则是另一份文档里的静态 CSS，iframe 里的类管不到它——关掉美化后弹窗细化可能还在。');
    if (s.composer.on)

      notes.push('动效总开关关着：粒子会是一张静止的星点底图，不飘不动。');
    if (s.particles.on)
      notes.push('粒子是伪元素 + 多层径向渐变，全屏合成层动画。手机低电量模式下系统可能自动降帧；嫌耗电就把密度和闪烁关掉。');

      notes.push('「导出压缩」开着：CSS 的注释、换行与行首缩进都被去掉了，字数更省，但输出不太好读。想照着学写法就把它关掉。');
    if (pack && (pack.regex_scripts || []).some((r) => /-\d+$/.test(String((r && r.scriptName) || ''))))
      notes.push('有规则被自动拆条了（名字带 -2 / -3）：单条替换内容超过编辑器 20000 字上限。拆点都落在 CSS 规则之间，不会切坏 @media 或某一条规则。');

    return notes;
  }

  function buildNotes2(s, pack) { return reviewNotes(s, pack); }

  function statHtml(label, value, bad, meter) {
    return '<div class="stat' + (bad ? ' bad' : '') + '">' + label + ' <b>' + value + '</b>'
      + (meter === undefined ? '' : '<div class="meter' + (bad ? ' bad' : '') + '"><i style="width:' + clamp(meter, 0, 100) + '%"></i></div>')
      + '</div>';
  }

  function renderStats(pack, css) {
    const rules = pack.regex_scripts || [];
    const maxReplace = Math.max.apply(null, [0].concat(rules.map((r) => (r.replaceString || '').length)));
    const maxFind = Math.max.apply(null, [0].concat(rules.map((r) => (r.findRegex || '').length)));
    $('#jsonStats').innerHTML = statHtml('规则条数', rules.length + ' / ' + LIMITS.rules, false)
      + statHtml('最长替换内容', maxReplace + ' / ' + LIMITS.replaceString + ' 字', maxReplace > LIMITS.replaceString * 0.9, maxReplace / LIMITS.replaceString * 100)
      + statHtml('最长匹配式', maxFind + ' / ' + LIMITS.findRegex + ' 字', maxFind > LIMITS.findRegex, maxFind / LIMITS.findRegex * 100)
      + statHtml('JSON 体积', (stringifyPack(pack).length / 1024).toFixed(1) + ' KB', false);
    $('#cssStats').innerHTML = statHtml('CSS 字符数', css.length, false)
      + statHtml('规则条数', rules.length, false);
  }

  function renderReport(rep, s, pack) {
    const box = $('#issues');
    box.innerHTML = '';
    const add = (kind, key, text) => {
      const d = el('div', 'issue ' + kind);
      d.innerHTML = '<span class="k">' + key + '</span>' + escapeHtml(text);
      box.appendChild(d);
    };
    const notes = buildNotes2(s, pack);
    $('#checkStats').innerHTML = statHtml('错误', rep.errors.length, rep.errors.length > 0)
      + statHtml('警告', rep.warns.length, false)
      + statHtml('提示', notes.length, false);
    if (!rep.errors.length) add('ok', '通过', '形状 / 上限 / 净化边界静态检查都过了：顶层字段、负数 id、脚本名长度、匹配式、替换内容、宿主 CSS 根，全部合规。');
    rep.errors.forEach((e) => add('err', '错误', e.where + '：' + e.msg));
    rep.warns.forEach((w) => add('warn', '警告', w.where + '：' + w.msg));

    /* 对比度体检 */
    const rows = contrastReport(s);
    const head = el('div', 'issue ok');
    head.innerHTML = '<span class="k">对比度</span>WCAG 对比度体检（≥4.5 适合正文，≥3 适合大字与非文本）';
    box.appendChild(head);
    rows.forEach((r) => {
      const level = r.ratio >= 4.5 ? 'ok' : (r.ratio >= 3 ? 'warn' : 'err');
      const tag = r.ratio >= 4.5 ? '合格' : (r.ratio >= 3 ? '偏低' : '太糊');
      const d = el('div', 'issue ' + level);
      d.innerHTML = '<span class="k">' + tag + '</span>' + escapeHtml(r.group + ' · ' + r.name + ' → ' + r.ratio.toFixed(2) + ':1');
      box.appendChild(d);
    });

    /* 刚做过对比度修正的话，把改了什么列出来 */
    if (lastFix && lastFix.items.length) {
      lastFix.items.forEach((it) => {
        const d = el('div', 'issue info');
        d.innerHTML = '<span class="k">已修正</span>' + escapeHtml((it.theme === 'dark' ? '🌙 ' : '☀️ ') + it.label + '：'
          + it.from + ' → ' + it.to + '（' + it.before.toFixed(2) + ':1 → ' + it.after.toFixed(2) + ':1）');
        box.appendChild(d);
      });
    }

    notes.forEach((n) => add('ok', '提示', n));
  }

  function update() {
    const s = state;
    const pack = buildPack(s);
    const json = stringifyPack(pack);
    const cssBody = [buildVarsCss(s), buildLayoutCss(s), buildFxCss(s)].join('\n\n');
    let cssOut = cssBody;
    if (s.host.on && (s.host.detailModels || s.host.detailModelSetting || s.host.detailPersona || s.host.detailSummary))
      cssOut += '\n\n/* ---- 单独一条规则：宿主弹窗（平台抽取后注入父页面） ---- */\n' + buildHostCss(s);
    if (s.custom.extraCss.trim())
      cssOut += '\n\n/* ---- 你在「高级」里追加的 CSS ---- */\n' + classifyCustomCss(s.custom.extraCss);

    $('#outJson').value = json;
    $('#outCss').value = cssOut;
    if ($('#fileBase').value !== s.meta.fileBase && s.meta.fileBase) $('#fileBase').value = s.meta.fileBase;

    renderPreview();
    renderStats(pack, cssOut);
    renderReport(runChecker(pack), s, pack);
    refreshConditions();
    syncQuickPreset();
    refreshRecipeBar();
    saveLocalState();
  }

  /** 顶栏那个「快速套用配色」下拉必须跟着状态走：
   * 随机配色 / 参考图取色 / 载入方案 / 医生套色 / 重置 都不经过控件层，漏同步就会显示成别的方案名。 */
  function syncQuickPreset() {
    const qp = $('#quickPreset');
    if (!qp || !qp.options || !qp.options.length) return;
    const want = String(state.palette.preset || 'custom');
    if (qp.value !== want) qp.value = want;
  }

  /** 配方条：高亮当前配方、标注有没有混搭、控制「取消」按钮的可用状态 */
  function refreshRecipeBar() {
    const active = recipeById(state.meta.recipe);
    const dirty = active ? recipeDirty(state, active) : false;
    $$('[data-recipe]').forEach((chip) => {
      const isActive = !!active && chip.dataset.recipe === active.id;
      chip.classList.toggle('active', isActive);
      chip.classList.toggle('dirty', isActive && dirty);
    });
    const status = $('#recipeStatus');
    if (status) {
      if (!active) status.textContent = '当前配方：无 —— 点上面任意一套试试，随时可以取消。';
      else status.textContent = '当前配方：' + active.name + (dirty ? '（已混搭，不会自动跟着配方走；取消会还原它动过的那些项）' : '（原样）');
    }
    const btn = $('#btnCancelRecipe');
    if (btn) btn.disabled = !active;
  }

  // ========================================================================
  // 本地保存 / 方案管理
  // ========================================================================
  const LS_STATE = 'mmdskin.state.v1';
  const LS_SCHEMES = 'mmdskin.schemes.v1';

  function lsGet(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  }
  function lsSet(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 隐私模式就算了 */ }
  }
  function saveLocalState() { lsSet(LS_STATE, state); }

  function deepMerge(base, over) {
    const out = clone(base);
    Object.keys(over || {}).forEach((k) => {
      const v = over[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && out[k] && typeof out[k] === 'object' && !Array.isArray(out[k]))
        out[k] = deepMerge(out[k], v);
      else out[k] = clone(v);
    });
    return out;
  }

  function applyPreset(id) {
    const p = presetById(id);
    if (!p || (id !== p.id)) return;
    state.palette.preset = id;
    state.palette.light = clone(p.light);
    state.palette.dark = clone(p.dark);
  }

  /* 随机配色：同一色相推出一整套协调的颜色，再交替冷暖 */
  function hslHex(h, sat, light) {
    h = ((h % 360) + 360) % 360;
    const s = clamp(sat, 0, 100) / 100;
    const l = clamp(light, 0, 100) / 100;
    const k = (n) => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = (n) => l - a * Math.max(-1, Math.min(Math.min(k(n) - 3, 9 - k(n)), 1));
    const to = (v) => ('0' + Math.round(v * 255).toString(16)).slice(-2);
    return '#' + to(f(0)) + to(f(8)) + to(f(4));
  }
  function randomPalette() {
    const h = Math.floor(Math.random() * 360);
    const h2 = h + 150 + Math.floor(Math.random() * 60);
    state.palette.dark = {
      bg: hslHex(h, 30, 8), surface: hslHex(h, 26, 15), text: hslHex(h, 20, 94), muted: hslHex(h, 16, 68),
      border: hslHex(h, 22, 25), accent: hslHex(h2, 76, 66), bubbleUser: hslHex(h2, 32, 26),
      bubbleAi: hslHex(h, 26, 15), bubbleText: hslHex(h, 18, 95),
    };
    state.palette.light = {
      bg: hslHex(h, 40, 97), surface: '#ffffff', text: hslHex(h, 30, 14), muted: hslHex(h, 18, 45),
      border: hslHex(h, 28, 88), accent: hslHex(h2, 62, 42), bubbleUser: hslHex(h2, 58, 91),
      bubbleAi: '#ffffff', bubbleText: hslHex(h, 30, 16),
    };
    state.palette.preset = 'custom';
    toast('换了一套随机配色 ✨');
  }

  function loadSchemes() {
    const schemes = lsGet(LS_SCHEMES, {});
    const sel = $('#schemeList');
    sel.innerHTML = '<option value="">— 我的方案 —</option>';
    Object.keys(schemes).forEach((name) => {
      const op = el('option'); op.value = name; op.textContent = name;
      sel.appendChild(op);
    });
    return schemes;
  }

  // ---------------------------------------------------------------- 分享链接
  /** 只编「和默认值不一样」的部分：一条链接能短非常多 */
  function diffState(s) {
    const out = {};
    /* 用的是现成预设（没手动改过色）时，18 个颜色值就不必编了：
     * 收链接的人按预设 id 自己推得出来 —— 链接更短，而且以后我调整预设色值他也不会拿到过期的颜色。
     * 这条不变式成立的原因：任何手动改色都会把 preset 置成 'custom'。 */
    const pid = s.palette.preset;
    const presetOnly = pid && pid !== 'custom' && presetById(pid).id === pid;
    (function walk(node, baseNode, prefix) {
      Object.keys(node).forEach((k) => {
        const path = prefix ? prefix + '.' + k : k;
        if (presetOnly && /^palette\.(light|dark)\./.test(path)) return;
        const v = node[k];
        const b = baseNode ? baseNode[k] : undefined;
        if (v && typeof v === 'object' && !Array.isArray(v)) walk(v, b, path);
        else if (JSON.stringify(v) !== JSON.stringify(b)) out[path] = v;
      });
    })(s, BASE_SNAPSHOT, '');
    return out;
  }

  /** 从 diff 还原出一份完整状态；不认识的键直接丢掉，不污染 state */
  function applySharedDiff(diff) {
    const s = baseDefaults();
    /* 颜色没编进链接的话，先按预设 id 把色板推回来 */
    const pid = diff && diff['palette.preset'];
    if (typeof pid === 'string' && pid !== 'custom' && presetById(pid).id === pid) {
      const p = presetById(pid);
      s.palette.preset = pid;
      s.palette.light = clone(p.light);
      s.palette.dark = clone(p.dark);
    }
    Object.keys(diff || {}).forEach((path) => {
      if (getPath(BASE_SNAPSHOT, path) === undefined) return;
      setPath(s, path, coerceControlValue(path, diff[path]));
    });
    return s;
  }

  function b64encodeUtf8(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 1) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function b64decodeUtf8(code) {
    const s = String(code).replace(/-/g, '+').replace(/_/g, '/');
    const pad = s.length % 4 ? '='.repeat(4 - (s.length % 4)) : '';
    const bin = atob(s + pad);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  /** 编成链接里那一段（纯函数，自测直接调） */
  function encodeShare(s) { return b64encodeUtf8(JSON.stringify(diffState(s))); }

  /** 解码；任何脏数据都只回 null，绝不抛异常 */
  function decodeShare(code) {
    try {
      const diff = JSON.parse(b64decodeUtf8(code));
      if (!diff || typeof diff !== 'object' || Array.isArray(diff)) return null;
      return diff;
    } catch (e) { return null; }
  }

  function buildShareLink() { return location.href.split('#')[0] + '#s1=' + encodeShare(state); }

  function copyShareLink() {
    const link = buildShareLink();
    const box = $('#shareOut');
    if (box) box.value = link;
    copyText(link, '分享链接已复制（' + link.length + ' 字符）');
  }

  /** 打开带 #s1=… 的地址时套用它；套完把 hash 清掉，免得每次刷新都覆盖你本地的工作 */
  function readShareHash() {
    const m = /[#&]s1=([A-Za-z0-9\-_]+)/.exec(location.hash || '');
    if (!m) return null;
    const diff = decodeShare(m[1]);
    if (!diff) { toast('链接里的方案读不出来（可能被截断了）'); return null; }
    toast('已套用分享链接里的方案 ✨');
    return applySharedDiff(diff);
  }

  // ========================================================================
  // 控件读写
  // ========================================================================
  function fieldByPath(path) {
    for (let i = 0; i < SECTIONS.length; i += 1) {
      const fs = SECTIONS[i].fields;
      for (let j = 0; j < fs.length; j += 1) if (fs[j].path === path) return fs[j];
    }
    return null;
  }
  function pathOf(node) {
    let n = node;
    while (n && n.nodeType === 1) {
      if (n.dataset && n.dataset.path) return n.dataset.path;
      n = n.parentNode;
    }
    return null;
  }
  function chipValue(field, raw) {
    const list = (field && field.options) || [];
    for (let i = 0; i < list.length; i += 1) if (String(list[i].value) === raw) return list[i].value;
    return raw;
  }

  /**
   * 把控件送来的值强制成「默认状态里那个值的类型」。
   *
   * 这个函数是为了一个真实 bug 生的：复选框在 Chrome 里会先触发 input、再触发 change，
   * 而 input 阶段 e.target.value 是字符串 "on" —— 写进 state 就是 truthy 的字符串，
   * syncInputs 一看 !!v 就把框重新勾上，于是「勾上以后再也取消不掉」。
   * 现在不管值从哪来，类型一律以 BASE_SNAPSHOT 为准。
   */
  function coerceControlValue(path, value) {
    const baseVal = getPath(BASE_SNAPSHOT, path);
    if (typeof baseVal === 'boolean') {
      if (typeof value === 'string') return !(value === '' || value === 'false' || value === '0' || value === 'off');
      return !!value;
    }
    if (typeof baseVal === 'number') {
      const n = Number(value);
      return isFinite(n) ? n : baseVal;
    }
    return value;
  }

  function applyControl(path, value) {
    value = coerceControlValue(path, value);
    setPath(state, path, value);
    lastFix = null;   /* 手动动过颜色，之前那份「已修正」清单就过期了 */
    /* 注意：这里刻意不碰 meta.recipe —— 改东西只是把配方变成「已混搭」，
     * 绝不能让它以为配方没了（那样用户就再也取消不掉了）。 */
    if (/^palette\.(light|dark)\./.test(path)) {
      state.palette.preset = 'custom';
      const ps = $('[data-path="palette.preset"]');
      if (ps) ps.value = 'custom';
      $('#quickPreset').value = 'custom';
    }
    if (path === 'palette.preset') applyPreset(value);
    if (path === 'meta.fileBase') { /* 只是文件名 */ }
    /* 关键：立刻把所有控件的视觉状态刷一遍。
     * 少了这一步，点胶囊（比如「阴影强度」）只改了状态、高亮还停在旧的那颗，
     * 得等刷新页面走一遍 init → syncInputs 才看着切过去 —— 就是这个 bug。 */
    syncInputs();
    update();
  }

  function validateHex(input) {
    const path = input.dataset.hexFor;
    const raw = String(input.value).trim();
    if (/^#?[0-9a-f]{3}$/i.test(raw) || /^#?[0-9a-f]{6}$/i.test(raw)) {
      const h = normHex(raw[0] === '#' ? raw : '#' + raw);
      input.value = h;
      applyControl(path, h);
    } else {
      input.value = normHex(getPath(state, path));
      toast('颜色要写成 #RRGGBB 或 #RGB');
    }
  }

  function bindBlocks() {
    const host = $('#blocks');
    host.addEventListener('click', (e) => {
      /* 风格配方按钮：点一下整套风格 + 推荐配色 */
      const rec = e.target.closest ? e.target.closest('[data-recipe]') : null;
      if (rec) { applyRecipe(rec.dataset.recipe); return; }
      const chip = e.target.closest ? e.target.closest('.chip') : null;
      if (!chip) return;
      const path = pathOf(chip);
      if (!path) return;
      applyControl(path, chipValue(fieldByPath(path), chip.dataset.value));
    });
    host.addEventListener('input', (e) => {
      const t = e.target;
      if (!t.dataset || t.dataset.hexFor || !t.dataset.path) return;
      /* 复选框只在 change 阶段处理，这里必须让路：
       * input 阶段它送来的是字符串 "on"，会把布尔值污染成 truthy 的字符串，
       * 结果就是「勾上以后再也取消不掉」。 */
      if (t.type === 'checkbox') return;
      if (t.type === 'range' || t.type === 'color') applyControl(t.dataset.path, t.type === 'range' ? Number(t.value) : t.value);
      else applyControl(t.dataset.path, t.value);
    });
    host.addEventListener('change', (e) => {
      const t = e.target;
      if (t.dataset && t.dataset.hexFor) { validateHex(t); return; }
      if (!t.dataset || !t.dataset.path) return;
      if (t.type === 'checkbox') applyControl(t.dataset.path, t.checked);
      else if (t.tagName === 'SELECT') applyControl(t.dataset.path, t.value);
      else if (t.type === 'color') applyControl(t.dataset.path, t.value);
    });
  }

  // ========================================================================

  // ========================================================================
  /* 撤销快照放在 localStorage 的独立键里（不进 state）：
   * 这样刷新后还能撤销，又不会把分享链接撑大。 */
  const LS_RECIPE_UNDO = 'mmdskin.recipeundo.v1';
  let recipeUndo = null;

  function saveRecipeUndo() { lsSet(LS_RECIPE_UNDO, recipeUndo); }
  function loadRecipeUndo() {
    const v = lsGet(LS_RECIPE_UNDO, null);
    return v && typeof v === 'object' && v.recipe && v.values && typeof v.values === 'object' ? v : null;
  }

  /** 取消当前配方：把它动过的那批键还原（有快照用快照，没有就回出厂默认） */
  function revertActiveRecipe() {
    const rec = recipeById(state.meta.recipe);
    if (!rec) return null;
    const undo = recipeUndo && recipeUndo.recipe === rec.id ? recipeUndo.values : null;
    restoreRecipeValues(state, rec, undo);
    recipeUndo = null;
    saveRecipeUndo();
    return rec;
  }

  function applyRecipe(id) {
    const rec = recipeById(id);
    if (!rec) return;
    /* 换配方先把上一套整个还原：配方是部分覆盖，不还原会留下上一套的残渣 */
    if (state.meta.recipe && state.meta.recipe !== id) revertActiveRecipe();
    const before = captureRecipeValues(state, rec);
    applyRecipeToState(state, rec);
    recipeUndo = { recipe: id, values: before };
    saveRecipeUndo();

  function applyContrastFix() {
    const items = [];
    ['dark', 'light'].forEach((theme) => {
      const res = fixThemeContrast(state.palette[theme]);
      if (!res.changes.length) return;
      state.palette[theme] = res.colors;
      res.changes.forEach((c) => items.push({ theme: theme, label: c.label, from: c.from, to: c.to, before: c.before, after: c.after }));
    });
    if (items.length) {
      state.palette.preset = 'custom';
      const ps = $('[data-path="palette.preset"]');
      if (ps) ps.value = 'custom';
      $('#quickPreset').value = 'custom';
    }
    lastFix = items.length ? { items: items } : null;
    syncInputs();
    update();
    toast(items.length ? '修正了 ' + items.length + ' 处对比度，色相没动' : '对比度本来就都达标，一个颜色都没动');
  }

  // ========================================================================
  // 参考图取色
  // ========================================================================
  function loadImagePalette(file) {
    if (!file) return;
    if (!/^image\//.test(file.type || '')) { toast('这不是图片文件'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 180;
        const scale = Math.min(1, max / Math.max(img.width || 1, img.height || 1));
        const w = Math.max(1, Math.round((img.width || 1) * scale));
        const h = Math.max(1, Math.round((img.height || 1) * scale));
        const cv = document.createElement('canvas');
        cv.width = w;
        cv.height = h;
        const ctx = cv.getContext('2d');
        if (!ctx) { toast('这台浏览器不支持 canvas 取色'); return; }
        ctx.drawImage(img, 0, 0, w, h);
        let data;
        try { data = ctx.getImageData(0, 0, w, h); }
        catch (e) { toast('这张图读不了像素（浏览器保护）'); return; }
        const colors = dominantColors(data, 8);
        const theme = themeFromImage(colors);
        if (!theme) { toast('这张图没抽出可用颜色，换一张试试'); return; }
        state.palette.dark = theme.dark;
        state.palette.light = theme.light;
        state.palette.preset = 'custom';
        lastFix = null;
        const sw = $('#imgSwatch');
        if (sw) sw.innerHTML = colors.map((c) => '<span class="swatch big" title="' + c + '" style="background:' + c + '"></span>').join('');
        syncInputs();
        update();
        toast('已按参考图生成日夜两套色板 ✨（不满意直接换图）');
      };
      img.onerror = () => toast('这张图解不开，换一张 PNG / JPG 试试');
      img.src = String(reader.result);
    };
    reader.onerror = () => toast('文件读不了');
    reader.readAsDataURL(file);
  }

  function bindUI() {

      const schemes = lsGet(LS_SCHEMES, {});

      state = deepMerge(baseDefaults(), schemes[name]);
      syncInputs();
      update();
      toast('已载入方案：' + name);
    });

    $('#btnReset').addEventListener('click', () => {
      state = baseDefaults();
      syncInputs();
      update();
      toast('已经回到出厂设置');
    });

    $('#fileBase').addEventListener('input', (e) => {
      state.meta.fileBase = e.target.value;
      saveLocalState();
    });

    /* 方案导出 / 导入 */
    $('#btnExportScheme').addEventListener('click', () => {

        try {
          const parsed = JSON.parse(String(reader.result));

        }

      const f = e.target.files && e.target.files[0];

    });
    $('#btnDocSample').addEventListener('click', () => {

    $('#btnDocClear').addEventListener('click', () => { $('#docInput').value = ''; renderDoctor(); });

    $('#docInput').addEventListener('input', () => {
      clearTimeout(docTimer);
      docTimer = setTimeout(renderDoctor, 260);
    });
    $('#docReport').addEventListener('click', (e) => {
      if (e.target && e.target.closest && e.target.closest('#docApplyPalette')) applyDoctorPalette();
    });

    /* ---- 对比度一键修正 ---- */
    $('#btnFixContrast').addEventListener('click', applyContrastFix);

    /* ---- 参考图取色 ---- */
    const dz = $('#imgDrop');
    if (dz) {
      dz.addEventListener('click', () => $('#imgFile').click());
      ['dragenter', 'dragover'].forEach((ev) => {
        dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add('over'); });
      });
      ['dragleave', 'drop'].forEach((ev) => {
        dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove('over'); });
      });
      dz.addEventListener('drop', (e) => {
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) loadImagePalette(f);
      });
    }
    $('#imgFile').addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0];

    });
    /* 别让拖歪的手势把浏览器直接带去打开那个文件 */
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => e.preventDefault());

    $('#helpPane').innerHTML = HELP_HTML;
  }

  function syncPvChips() {
    $('#pvDay').classList.toggle('active', previewTheme === 'light');
    $('#pvNight').classList.toggle('active', previewTheme === 'dark');
    $('#pvDesktop').classList.toggle('active', previewDevice === 'desktop');
    $('#pvPhone').classList.toggle('active', previewDevice === 'phone');
    $('#previewHost').classList.toggle('desktop', previewDevice === 'desktop');
  }

  function baseName() {
    return (state.meta.fileBase || 'my-mmd-skin').replace(/[\\/:*?"<>|]/g, '_').trim() || 'my-mmd-skin';
  }

  function copyText(text, okMsg) {
    const done = () => toast(okMsg);
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      if (ok) done(); else toast('复制被浏览器拦了，请手动全选复制');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else fallback();
  }

  function download(filename, text, mime) {
    const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('已下载 ' + filename);
  }

    '<p>平台的样式是<b>把所有规则的 <code>&lt;style&gt;</code> 合成一张表</b>。如果新皮肤对某个属性<b>不写</b>，旧皮肤写过的那个值就还留着 —— 于是你会看到"新配色 + 旧圆角"这种混搭。</p>',
    '<p>所以工具现在<b>每一个「关掉」的开关都显式写 <code>revert</code></b>，主动把平台原样还回来。自测里有 19 种"关掉某开关"的状态在守这条。</p>',
    '<div class="callout">如果还看到残留：说明平台是<b>追加</b>规则而不是替换。两个办法 —— 在卡的正则列表里把旧的皮肤规则删掉再导入；或者用一键开关把整套关掉（新旧规则都带 <code>.mmdskin-off</code> 前缀，会一起失效）。</div>',
    '<h4>导出前请自己过一遍</h4>',
    '<div class="callout bad"><b>导入报「格式错误」？</b>先看积木面板最后的「导出形态」：字段必须齐 —— '
    + '<code>pageDepth</code> + <code>statusbar</code> + <code>beginning</code> + <code>regex_scripts</code>，'
    + '缺 <code>statusbar</code> / <code>beginning</code> 会被导入页判成格式错误（哪怕值是空串也得带着）。'
    + '导出<b>一律缩进多行</b>：实测单行紧凑虽然能被导入页接受，但规则不生效，所以那个选项已经删掉了。</div>',
    '<ul>',
    '<li>右侧「自检报告」里不该有<b>错误</b>；警告逐条看一眼是不是误报。</li>',
    '<li>对比度体检：正文低于 4.5:1 的，建议把文字色或底色调一调。</li>',
    '<li>静态全过 ≠ 线上生效。宿主弹窗、头像、输入框落点这些必须在真实目标站开一遍。</li>',
    '</ul>',
    '<h4>手机上看效果</h4>',
    '<p>调试时给聊天页地址加 <code>?sdkDebug=1</code>，就能看到页内调试面板与 <code>sdk.debug.log</code> 的输出。</p>',
    '<div class="callout bad"><b>别指望工具替你做的事：</b>它不会改你卡里的人设、开场白、世界书和存档数据；也不会替你验证某个具体域名的弹窗是否已接入主题桥。这两件事只能你在真实页面上确认。</div>',
    '</div>',
  ].join('\n');

  // ========================================================================
  // 初始化
  // ========================================================================
  function init() {
    /* 带 #s1=… 的地址优先：那是别人分享过来的方案 */
    const shared = readShareHash();
    if (shared) {
      state = shared;
      /* 从分享链接来的方案：本地的旧撤销快照跟它没关系，清掉免得「取消」还原成别人机器上的值 */
      recipeUndo = null;
      lsSet(LS_RECIPE_UNDO, null);
      try { history.replaceState(null, '', location.href.split('#')[0]); }
      catch (e) { /* file:// 上万一不让改地址就算了，hash 留着也不影响 */ }
    } else {
      state = deepMerge(baseDefaults(), lsGet(LS_STATE, {}));
      recipeUndo = loadRecipeUndo();
    }
    syncPvChips();
    renderBlocks();
    initPreview();
    bindUI();
    bindBlocks();
    renderDoctor();
    update();
  }

  /* 给 node 自测用的出口：不依赖 DOM */
  window.__MMDSKIN__ = {
    baseDefaults: baseDefaults,
    presets: PRESETS,
    sections: SECTIONS,
    colorKeys: COLOR_KEYS,
    buildPack: buildPack,
    stringifyPack: stringifyPack,
    runChecker: runChecker,
    buildCss: function (s) { return [buildVarsCss(s), buildLayoutCss(s), buildFxCss(s)].join('\n\n'); },
    buildVarsCss: buildVarsCss,
    buildLayoutCss: buildLayoutCss,
    buildFxCss: buildFxCss,
    buildHostCss: buildHostCss,
    buildKitScript: buildKitScript,
    buildToggleHtml: buildToggleHtml,
    previewGuardCss: PV_GUARD_CSS,
    coerceControlValue: coerceControlValue,
    baseSnapshot: BASE_SNAPSHOT,
    /* 皮肤医生与颜色工具，供自测直接调用 */
    inspectPack: inspectPack,
    runDoctor: function (raw) { return inspectPack(raw); },
    fixThemeContrast: fixThemeContrast,
    pushContrast: pushContrast,
    contrastReport: contrastReport,
    minifyCss: minifyCss,
    splitCss: splitCss,
    paletteFromVars: paletteFromVars,
    extractPaletteVars: extractPaletteVars,
    paletteFromText: function (text) { return paletteFromVars(extractPaletteVars(text)); },
    completeTheme: completeTheme,
    themeFromImage: themeFromImage,
    dominantColors: dominantColors,
    hexToHsl: hexToHsl,
    contrast: contrast,
    palKeys: PAL_KEYS,
    doctorSample: DOCTOR_SAMPLE,
    /* 风格配方与分享链接 */
    recipes: RECIPES,
    applyRecipeToState: applyRecipeToState,
    recipeById: recipeById,
    recipePaths: recipePaths,
    canonicalRecipeState: canonicalRecipeState,
    captureRecipeValues: captureRecipeValues,
    restoreRecipeValues: restoreRecipeValues,
    recipeDirty: recipeDirty,
    diffState: diffState,
    applySharedDiff: applySharedDiff,
    encodeShare: encodeShare,
    decodeShare: decodeShare,
    b64encodeUtf8: b64encodeUtf8,
    b64decodeUtf8: b64decodeUtf8,
    makePack: function (mut) {
      const s = baseDefaults();
      if (mut) mut(s);
      return { pack: buildPack(s), state: s };
    },
  };

  if (typeof document !== 'undefined' && document.getElementById && document.getElementById('blocks')) init();
})();
</script>
</body>
</html>

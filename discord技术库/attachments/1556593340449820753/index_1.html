<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMD 美化积木工坊 · 新人作者 CSS 换肤生成器</title>
<style>
  /* ===== 工具自己的 UI 样式（与导出的皮肤 CSS 完全隔离：皮肤只作用于 Shadow DOM 预览区） ===== */
  :root{
    --ui-bg:#0b1220;
    --ui-bg2:#101a2c;
    --ui-panel:#121d31;
    --ui-panel2:#17253c;
    --ui-line:#22344f;
    --ui-line2:#2d4462;
    --ui-text:#e6eefb;
    --ui-muted:#93a8c4;
    --ui-accent:#5aa9ff;
    --ui-accent2:#8ad0ff;
    --ui-gold:#f0c674;
    --ui-ok:#5fd39a;
    --ui-warn:#ffcc66;
    --ui-err:#ff7b8a;
    --ui-radius:12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(1200px 600px at 15% -10%,#152742,transparent),var(--ui-bg);
    color:var(--ui-text);
    font:14px/1.55 "PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,select,input,textarea{font:inherit;color:inherit}
  a{color:var(--ui-accent2)}

  /* 顶栏 */
  .bar{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:12px 18px;border-bottom:1px solid var(--ui-line);
    background:linear-gradient(180deg,rgba(23,37,60,.95),rgba(16,26,44,.92));
    position:sticky;top:0;z-index:50;backdrop-filter:blur(8px);
  }
  .brand{font-size:17px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
  .brand .ver{font-size:11px;font-weight:500;color:var(--ui-muted);border:1px solid var(--ui-line2);border-radius:999px;padding:1px 8px}
  .bar-grow{flex:1 1 auto}
  .bar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  .btn{
    background:linear-gradient(180deg,#22406b,#1a3153);border:1px solid var(--ui-line2);
    color:var(--ui-text);border-radius:10px;padding:7px 12px;cursor:pointer;transition:.15s;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--ui-accent);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:linear-gradient(180deg,#2b6cc4,#1f4f96);border-color:#3f86e0;font-weight:600}
  .btn.ghost{background:transparent}
  .btn.danger{background:transparent;border-color:#5a2b34;color:#ffb3bc}
  .btn.tiny{padding:4px 9px;font-size:12px;border-radius:8px}

  .select,.input{
    background:var(--ui-panel2);border:1px solid var(--ui-line2);border-radius:9px;padding:6px 9px;
    color:var(--ui-text);outline:none;max-width:100%;
  }
  .select:focus,.input:focus{border-color:var(--ui-accent)}
  .input::placeholder{color:#6d84a3}

  /* 三栏布局 */
  .grid{
    display:grid;grid-template-columns:352px minmax(360px,1fr) 440px;
    gap:14px;padding:14px;align-items:start;
  }
  @media (max-width:1500px){ .grid{grid-template-columns:320px minmax(320px,1fr) 400px} }
  @media (max-width:1180px){ .grid{grid-template-columns:1fr} }

  .panel{
    background:linear-gradient(180deg,rgba(23,37,60,.75),rgba(18,29,49,.85));
    border:1px solid var(--ui-line);border-radius:var(--ui-radius);overflow:hidden;
  }
  .panel-h{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 14px;border-bottom:1px solid var(--ui-line);
    background:rgba(11,18,32,.5);font-weight:600;
  }
  .panel-h .sub{font-weight:400;color:var(--ui-muted);font-size:12px}
  .panel-b{padding:12px 14px}
  .blocks .panel-b{max-height:calc(100vh - 150px);overflow:auto;padding:10px 12px}
  .out-body{max-height:calc(100vh - 150px);overflow:auto}

  /* 积木分组 */
  details.group{border:1px solid var(--ui-line);border-radius:10px;margin-bottom:8px;background:rgba(11,18,32,.35);overflow:hidden}
  details.group>summary{
    cursor:pointer;list-style:none;padding:9px 11px;font-weight:600;font-size:13.5px;
    display:flex;align-items:center;gap:8px;user-select:none;
  }
  details.group>summary::-webkit-details-marker{display:none}
  details.group>summary::before{content:"▸";color:var(--ui-accent);transition:.15s;display:inline-block}
  details.group[open]>summary::before{transform:rotate(90deg)}
  details.group[open]>summary{border-bottom:1px solid var(--ui-line)}
  .group-body{padding:10px 11px 12px}
  .group-hint{color:var(--ui-muted);font-size:12px;margin:0 0 9px;line-height:1.5}

  .row{display:flex;align-items:center;gap:9px;margin-bottom:9px;min-height:28px}
  .row>label{flex:0 0 108px;color:var(--ui-muted);font-size:12.5px}
  .row .ctl{flex:1 1 auto;display:flex;align-items:center;gap:7px;min-width:0;flex-wrap:wrap}
  /* 提示文字必须自己占满一行：否则它会变成胶囊按钮旁边的一个 flex 项，被挤成一列一个字 */
  .row .ctl>.mini-note{flex:1 1 100%;margin-top:3px}
  .row .ctl .select,.row .ctl .input{flex:1 1 auto;min-width:0}
  .row.stack{display:block}
  .row.stack>label{display:block;margin-bottom:5px;flex:none}
  .row.stack .ctl{display:block}

  input[type=range]{
    -webkit-appearance:none;appearance:none;height:4px;border-radius:99px;
    background:linear-gradient(90deg,var(--ui-accent),#2b4a75);outline:none;flex:1 1 auto;min-width:80px;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:#eaf4ff;border:2px solid var(--ui-accent);cursor:pointer;
  }
  .val{flex:0 0 46px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ui-accent2);font-size:12.5px}
  input[type=color]{
    -webkit-appearance:none;appearance:none;width:38px;height:26px;padding:0;border:1px solid var(--ui-line2);
    border-radius:7px;background:transparent;cursor:pointer;flex:0 0 auto;
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:5px}
  .hex{flex:0 0 86px;font-family:ui-monospace,Consolas,monospace;font-size:12px;text-transform:uppercase}
  .check{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px}
  .check input{width:16px;height:16px;accent-color:var(--ui-accent);cursor:pointer}
  .mini-note{color:var(--ui-muted);font-size:11.5px;margin-top:4px;line-height:1.5}
  .pill-row{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    background:var(--ui-panel2);border:1px solid var(--ui-line2);border-radius:999px;
    padding:4px 11px;font-size:12.5px;cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .chip:hover{border-color:var(--ui-accent)}
  .chip.active{background:linear-gradient(180deg,#2b6cc4,#1f4f96);border-color:#4a90e8;color:#fff;font-weight:600}
  .chip.active.dirty{border-style:dashed}
  .chip:disabled{opacity:.45;cursor:not-allowed;border-style:dashed}
  .recipe-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 6px}

  /* 预览区 */
  .pv-wrap{padding:12px;display:flex;justify-content:center;background:
    repeating-conic-gradient(from 0deg,#0d1526 0% 25%,#0f1929 0% 50%) 0 0/22px 22px;}
  .preview-host{
    width:100%;max-width:430px;height:min(76vh,760px);border-radius:16px;overflow:hidden;
    position:relative;isolation:isolate;box-shadow:0 18px 50px rgba(0,0,0,.55);transition:max-width .2s;
    background:#0d1620;
  }
  .preview-host.desktop{max-width:100%}
  .pv-tip{color:var(--ui-muted);font-size:12px;text-align:center;padding:6px 10px 0}

  /* 导出区 */
  .tabs{display:flex;gap:6px;padding:10px 14px 0;flex-wrap:wrap}
  .tab{
    background:transparent;border:1px solid transparent;border-bottom:2px solid transparent;
    padding:6px 10px;border-radius:8px 8px 0 0;cursor:pointer;color:var(--ui-muted);font-size:13px;
  }
  .tab.active{color:var(--ui-text);background:rgba(11,18,32,.6);border-color:var(--ui-line);border-bottom-color:var(--ui-accent)}
  .tab-pane{display:none;padding:12px 14px}
  .tab-pane.active{display:block}
  textarea.code{
    width:100%;min-height:330px;resize:vertical;background:#0a1120;color:#cfe6ff;
    border:1px solid var(--ui-line2);border-radius:10px;padding:10px 12px;
    font:12.5px/1.6 ui-monospace,Consolas,"Courier New",monospace;white-space:pre;overflow:auto;
  }
  textarea.code.css{min-height:260px}
  .stat-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .stat{
    background:rgba(11,18,32,.55);border:1px solid var(--ui-line);border-radius:9px;
    padding:6px 10px;font-size:12px;color:var(--ui-muted);
  }
  .stat b{color:var(--ui-text);font-variant-numeric:tabular-nums}
  .stat.bad b{color:var(--ui-err)}
  .meter{height:5px;border-radius:99px;background:#1b2b45;overflow:hidden;margin-top:5px}
  .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--ui-ok),var(--ui-warn));width:0}
  .meter.bad i{background:linear-gradient(90deg,var(--ui-warn),var(--ui-err))}

  .issues{display:flex;flex-direction:column;gap:6px}
  .issue{
    border:1px solid var(--ui-line);border-left-width:3px;border-radius:8px;padding:7px 10px;
    font-size:12.5px;background:rgba(11,18,32,.5);line-height:1.55;word-break:break-word;
  }
  .issue.ok{border-left-color:var(--ui-ok)}
  .issue.err{border-left-color:var(--ui-err)}
  .issue.warn{border-left-color:var(--ui-warn)}
  .issue .k{font-weight:700;margin-right:6px}
  .issue.err .k{color:var(--ui-err)}
  .issue.warn .k{color:var(--ui-warn)}
  .issue.ok .k{color:var(--ui-ok)}
  .issue.info{border-left-color:var(--ui-accent)}
  .issue.info .k{color:var(--ui-accent2)}

  /* 拖放取色 */
  .dropzone{
    border:1.5px dashed var(--ui-line2);border-radius:10px;padding:15px 12px;text-align:center;
    color:var(--ui-muted);font-size:12.5px;cursor:pointer;transition:.15s;background:rgba(11,18,32,.35);
  }
  .dropzone:hover,.dropzone.over{border-color:var(--ui-accent);color:var(--ui-accent2);background:rgba(90,169,255,.08)}
  .swatch{width:26px;height:26px;border-radius:7px;border:1px solid var(--ui-line2);display:inline-block;cursor:default}
  .swatch.big{width:34px;height:34px}

  /* 医生报告里的小表格 */
  .doc-table{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}
  .doc-table th,.doc-table td{border:1px solid var(--ui-line);padding:4px 6px;text-align:left;vertical-align:top}
  .doc-table th{background:rgba(11,18,32,.5);color:var(--ui-muted);font-weight:600}
  .doc-table td.num{text-align:right;font-variant-numeric:tabular-nums}
  .doc-table td.bad{color:var(--ui-err)}

  .help{font-size:13px;line-height:1.8;color:#d6e4f7}
  .help h4{margin:14px 0 6px;font-size:14px;color:var(--ui-accent2)}
  .help h4:first-child{margin-top:0}
  .help ol,.help ul{margin:6px 0;padding-left:20px}
  .help code{background:rgba(90,169,255,.14);border:1px solid rgba(90,169,255,.25);border-radius:5px;padding:1px 5px;font-size:12px}
  .help .callout{border:1px solid var(--ui-line2);border-left:3px solid var(--ui-gold);border-radius:8px;padding:8px 11px;margin:8px 0;background:rgba(240,198,116,.06)}
  .help .callout.bad{border-left-color:var(--ui-err);background:rgba(255,123,138,.06)}
  .help table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12.5px}
  .help th,.help td{border:1px solid var(--ui-line);padding:5px 8px;text-align:left;vertical-align:top}
  .help th{background:rgba(11,18,32,.5);color:var(--ui-muted);font-weight:600}
  .help details{border:1px solid var(--ui-line);border-radius:8px;padding:6px 10px;margin:8px 0;background:rgba(11,18,32,.35)}
  .help summary{cursor:pointer;font-weight:600}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:linear-gradient(180deg,#22406b,#1a3153);border:1px solid var(--ui-accent);
    padding:9px 16px;border-radius:999px;font-size:13px;z-index:99;transition:.22s;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#26395a;border-radius:99px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:#33507c;background-clip:padding-box}
</style>
</head>
<body>

<header class="bar">
  <div class="brand">🐋 MMD 美化积木工坊 <span class="ver">v2.2</span></div>
  <div class="bar-grow"></div>
  <div class="bar-actions">
    <select class="select" id="quickPreset" title="快速套用配色方案"></select>
    <button class="btn tiny" id="btnRandom">🎲 随机配色</button>
    <button class="btn tiny" id="btnSaveScheme">💾 保存这套方案</button>
    <select class="select" id="schemeList" title="载入已保存的方案"><option value="">— 我的方案 —</option></select>
    <button class="btn tiny danger" id="btnReset">↺ 全部重置</button>
  </div>
</header>

<main class="grid">
  <!-- 左：积木面板 -->
  <aside class="panel blocks">
    <div class="panel-h">🧱 积木面板 <span class="sub">像搭积木一样勾选</span></div>
    <div class="panel-b" id="blocks"></div>
  </aside>

  <!-- 中：预览 -->
  <section class="panel">
    <div class="panel-h">
      👀 实时预览
      <span class="sub" id="pvModeLabel">夜间 · 桌面</span>
      <div class="bar-grow"></div>
      <button class="chip" id="pvDay">☀️ 日间</button>
      <button class="chip active" id="pvNight">🌙 夜间</button>
      <button class="chip active" id="pvDesktop">🖥️ 桌面</button>
      <button class="chip" id="pvPhone">📱 手机</button>
      <button class="chip active" id="pvToggleOn">开关按钮：开</button>
    </div>
    <div class="panel-b pv-wrap">
      <div>
        <div class="preview-host" id="previewHost"></div>
        <div class="pv-tip">预览是模拟的聊天界面，里面的名字、对话、功能栏（好感 / 体力）全是示例占位，<b>不会写进你导出的包</b>。<br>点一下右下角／功能栏里的开关按钮，就能看到「一键关美化」的效果。</div>
      </div>
    </div>
  </section>

  <!-- 右：导出 -->
  <aside class="panel">
    <div class="panel-h">📦 导出与检查</div>
    <div class="tabs">
      <button class="tab active" data-tab="json">导入正则 JSON</button>
      <button class="tab" data-tab="css">纯 CSS</button>
      <button class="tab" data-tab="check">自检报告</button>
      <button class="tab" data-tab="doctor">🩺 皮肤医生</button>
      <button class="tab" data-tab="help">怎么用</button>
    </div>
    <div class="out-body">
      <div class="tab-pane active" data-pane="json">
        <div class="stat-row" id="jsonStats"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
          <button class="btn primary" id="btnCopyJson">📋 复制 JSON</button>
          <button class="btn" id="btnDownloadJson">⬇️ 下载 .json</button>
          <input class="input" id="fileBase" style="flex:1 1 160px" value="my-mmd-skin" title="导出的文件名（不含后缀）">
        </div>
        <textarea class="code" id="outJson" spellcheck="false" readonly></textarea>
      </div>
      <div class="tab-pane" data-pane="css">
        <div class="stat-row" id="cssStats"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
          <button class="btn primary" id="btnCopyCss">📋 复制 CSS</button>
          <button class="btn" id="btnDownloadCss">⬇️ 下载 .css</button>
        </div>
        <textarea class="code css" id="outCss" spellcheck="false" readonly></textarea>
      </div>
      <div class="tab-pane" data-pane="check">
        <div class="stat-row" id="checkStats"></div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
          <button class="btn primary" id="btnFixContrast">🔧 一键修正对比度</button>
          <span class="mini-note" style="margin:0">保持色相，只推明度，把正文 / 次要文字 / 气泡字推到 ≥4.5:1，强调色 ≥3:1</span>
        </div>
        <div class="issues" id="issues"></div>
      </div>
      <div class="tab-pane" data-pane="doctor">
        <div class="stat-row" id="docStats"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
          <button class="btn primary" id="btnDocFile">📂 选择 JSON 文件</button>
          <button class="btn" id="btnDocSample">🧪 塞一个旧版示例</button>
          <button class="btn danger tiny" id="btnDocClear">清空</button>
          <input type="file" id="docFile" accept=".json,application/json,text/plain" style="display:none">
        </div>
        <textarea class="code" id="docInput" spellcheck="false" placeholder="把现成的「导入正则」JSON 粘到这里，或点上面的「选择 JSON 文件」……"></textarea>
        <div class="mini-note" style="margin-top:6px">纯只读分析：医生不会改动那份包的任何一个字节。工作目录里《角色卡【315513】正则数据.json》这类文件也可以直接选进来。</div>
        <div class="issues" id="docReport" style="margin-top:10px"></div>
      </div>
      <div class="tab-pane" data-pane="help" id="helpPane"></div>
    </div>
  </aside>
</main>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   MMD 美化积木工坊
   单文件、零外链、离线可用。
   左侧勾积木 → 中间实时预览 → 右侧导出「导入正则」JSON。
   导出的每条规则都按平台硬上限与净化边界生成。
   ========================================================================= */
(function () {
  'use strict';
  // ---------------------------------------------------------------- 小工具
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
  const px = (n) => Number(n) + 'px';

  let toastTimer = 0;
  function toast(msg) {
    const el = $('#toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  function getPath(obj, path) {
    return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj);
  }
  function setPath(obj, path, value) {
    const keys = path.split('.');
    const last = keys.pop();
    const target = keys.reduce((o, k) => (o[k] = o[k] || {}), obj);
    target[last] = value;
  }

  /* 确定性伪随机：拖动滑杆时粒子的位置不会乱跳（同一个种子永远得到同一串数） */
  function makeRng(seed) {
    let s = (seed >>> 0) || 20260101;
    return function () {
      s ^= s << 13; s >>>= 0;
      s ^= s >> 17;
      s ^= s << 5; s >>>= 0;
      return s / 4294967296;
    };
  }

  // ---------------------------------------------------------------- 配色预设
  /* 每套预设都带「日间 / 夜间」两套颜色，对应平台 [data-chat="root"][data-theme="light|dark"] */
  const PRESETS = [
    {
      id: 'moonwhale', name: '🐋 月光鲸歌（深蓝 + 天光蓝）',
      dark:  { bg:'#0c1522', surface:'#152233', text:'#e9f1fb', muted:'#9db2cc', border:'#24374e', accent:'#7cc0ff', bubbleUser:'#1e3c5e', bubbleAi:'#152233', bubbleText:'#e9f1fb' },
      light: { bg:'#f2f7fd', surface:'#ffffff', text:'#16233a', muted:'#5f7590', border:'#d8e4f2', accent:'#2f7fd6', bubbleUser:'#d6e8fb', bubbleAi:'#ffffff', bubbleText:'#16233a' },
    },
    {

  function recipeById(id) {
    for (let i = 0; i < RECIPES.length; i += 1) if (RECIPES[i].id === id) return RECIPES[i];
    return null;
  }

  /** 把配方写进 state（纯数据操作，自测直接调它） */
  function applyRecipeToState(s, rec) {
    const p = presetById(rec.pal);
    s.palette.preset = rec.pal;
    s.palette.light = clone(p.light);
    s.palette.dark = clone(p.dark);
    Object.keys(rec.patch).forEach((group) => {
      Object.keys(rec.patch[group]).forEach((key) => { s[group][key] = rec.patch[group][key]; });
    });
    s.meta.recipe = rec.id;
    return s;
  }

  /* ---------------- 配方的「可撤销」支持 ----------------
   * 配方是「部分覆盖」：它只动自己 patch 里那几个键（外加推荐配色的 18 个颜色）。
   * 所以撤销 = 把这批键还原成点它之前的值。为此在套用时先抓一份「改动前快照」。
   */
  const recipeCanonCache = {};
  const recipePathCache = {};

  /** 这套配方一共动了哪些路径（含推荐配色的 preset 与 18 个颜色） */
  function recipePaths(rec) {
    if (recipePathCache[rec.id]) return recipePathCache[rec.id];
    const paths = ['palette.preset'];
    PAL_KEYS.forEach((k) => { paths.push('palette.light.' + k); paths.push('palette.dark.' + k); });
    Object.keys(rec.patch).forEach((group) => {
      Object.keys(rec.patch[group]).forEach((key) => { paths.push(group + '.' + key); });
    });
    recipePathCache[rec.id] = paths;
    return paths;
  }

  /** 这套配方「标准形态」的状态：拿它跟当前状态比，就知道有没有被混搭过 */
  function canonicalRecipeState(rec) {
    if (!recipeCanonCache[rec.id]) recipeCanonCache[rec.id] = applyRecipeToState(baseDefaults(), rec);
    return recipeCanonCache[rec.id];
  }

  function captureRecipeValues(s, rec) {
    const before = {};
    recipePaths(rec).forEach((p) => { before[p] = clone(getPath(s, p)); });
    return before;
  }

  /** 还原：有快照就用快照，没有（比如重新打开页面、或从分享链接来的）就回出厂默认值 */
  function restoreRecipeValues(s, rec, values) {
    recipePaths(rec).forEach((p) => {
      const back = values && Object.prototype.hasOwnProperty.call(values, p) ? values[p] : getPath(BASE_SNAPSHOT, p);
      if (back !== undefined) setPath(s, p, clone(back));
    });
    s.meta.recipe = '';
    return s;
  }

  /** 当前这套配方有没有被混搭过（颜色换了预设、或动过它 patch 里的项，都算） */
  function recipeDirty(s, rec) {
    const canon = canonicalRecipeState(rec);
    return recipePaths(rec).some((p) => JSON.stringify(getPath(s, p)) !== JSON.stringify(getPath(canon, p)));
  }

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>乱马 · 图鉴编辑器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d0a06;color:#e0d5c0;min-height:100vh;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#1a1410;border-bottom:1px solid #3a3020;flex-shrink:0}
.topbar h1{font-family:'Ma Shan Zheng','ZCOOL KuaiLe',cursive;font-size:20px;background:linear-gradient(180deg,#ffccd5,#ff8fa3,#c9184a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:4px}
.topbar .stats{font-size:11px;color:#8b7355}

.main{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;display:none}
.page.active{display:flex;flex-direction:column}

.editor-page{background:#12100c}
.editor-body{padding:12px 12px 80px;flex:1;overflow-y:auto}

.section{margin-bottom:14px;background:#1a1610;border-radius:12px;border:1px solid #2a2218;overflow:hidden}
.section-header{padding:10px 14px;background:#1e1a14;border-bottom:1px solid #2a2218;display:flex;justify-content:space-between;align-items:center}
.section-header h3{font-size:14px;color:#ff8fa3;letter-spacing:2px}
.section-body{padding:10px 14px}
.section-body label{display:block;font-size:11px;color:#8b7355;margin-bottom:3px}
.section-body input,.section-body textarea,.section-body select{width:100%;padding:8px 10px;background:#0d0a06;border:1px solid #2a2218;border-radius:6px;color:#e0d5c0;font-size:13px;font-family:inherit;margin-bottom:8px;resize:vertical}
.section-body input:focus,.section-body textarea:focus,.section-body select:focus{outline:none;border-color:#ff8fa3}
.section-body input[type=range]{-webkit-appearance:none;appearance:none;height:6px;background:#2a2218;border-radius:3px;padding:0;margin:6px 0 12px;border:none;cursor:pointer}
.section-body input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;background:#ff8fa3;border-radius:50%;border:2px solid #c9184a;cursor:pointer}
.section-body .range-row{display:flex;align-items:center;gap:8px}
.section-body .range-row input[type=range]{flex:1;margin-bottom:0}
.section-body .range-val{font-size:12px;color:#ff8fa3;min-width:40px;text-align:right;font-weight:bold}

.card-item{background:#131008;border-radius:10px;padding:10px 12px;margin-bottom:8px;border:1px solid #2a2218}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card-name-display{font-size:14px;color:#ff8fa3;font-weight:bold;letter-spacing:1px;flex:1;margin:0 4px}
.card-actions{display:flex;gap:3px}
.btn{background:#1e1a14;border:1px solid #2a2218;color:#b4946a;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:11px;transition:all .15s;white-space:nowrap}
.btn:active{border-color:#ff8fa3;color:#ff8fa3;background:#2a1a1e}
.btn.danger{color:#d4726a}
.btn.danger:active{border-color:#d4726a;color:#ff8a80;background:#301a1a}
.btn.add{background:linear-gradient(135deg,#301a1e,#201012);border-color:#c9184a;color:#ff8fa3}
.btn.add:active{background:linear-gradient(135deg,#402a2e,#301a22)}
.btn.small{padding:3px 6px;font-size:10px}

.card-fields{display:flex;flex-direction:column;gap:4px}
.card-fields input,.card-fields textarea{padding:5px 6px;background:#0d0a06;border:1px solid #2a2218;border-radius:4px;color:#e0d5c0;font-size:11px;width:100%;font-family:inherit}
.card-fields input:focus,.card-fields textarea:focus{outline:none;border-color:#ff8fa3}
.card-fields .row{display:flex;gap:4px}
.card-fields .row input{flex:1}
.card-fields textarea{min-height:40px;resize:vertical}
.card-fields .flip-row{display:flex;gap:4px}
.card-fields .flip-item{flex:1;background:#0a0806;border-radius:6px;padding:6px;border:1px solid #1a1410}
.card-fields .flip-item .flip-label{font-size:9px;color:#6b5a3a;margin-bottom:3px;letter-spacing:1px}
.card-fields .flip-item input{padding:4px 5px;font-size:10px}
.drag-handle{color:#4a3828;font-size:12px;padding:2px;user-select:none;flex-shrink:0;touch-action:none}

/* 分栏样式 */
.realm-item{background:#0d0a06;border-radius:10px;padding:10px 12px;margin-bottom:8px;border:1px solid #2a2218}
.realm-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.realm-name{font-size:14px;color:#ff8fa3;font-weight:bold;letter-spacing:1px;flex:1;margin:0 4px}
.realm-actions{display:flex;gap:3px}
.cards-in-realm{margin-top:6px}

/* 弹窗样式 */
.dlg-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9998;display:flex;align-items:center;justify-content:center}
.dlg-box{background:#1e1812;border:1px solid #ff8fa3;border-radius:14px;padding:20px 24px;min-width:260px;max-width:320px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,0.7)}
.dlg-box p{color:#e0d5c0;font-size:14px;margin-bottom:16px}
.dlg-box input{width:100%;padding:8px 10px;background:#0d0a06;border:1px solid #ff8fa3;border-radius:6px;color:#e0d5c0;font-size:13px;margin-bottom:14px}
.dlg-box input:focus{outline:none;border-color:#ff8fa3}
.dlg-btns{display:flex;gap:8px;justify-content:center}
.dlg-btns .btn{padding:8px 20px;font-size:13px}
.dlg-btns .btn.confirm{background:linear-gradient(135deg,#ff8fa3,#c9184a);color:#fff;border-color:#ff8fa3;font-weight:bold}

.preview-page{background:#0a0804}
.preview-frame{width:100%;flex:1;border:none;background:#fff}

.tabbar{display:flex;border-top:1px solid #3a3020;background:#1a1410;flex-shrink:0}
.tab-btn{flex:1;padding:12px;text-align:center;color:#6b5a3a;font-size:13px;font-weight:600;letter-spacing:1px;border:none;background:none;cursor:pointer;transition:all .15s;position:relative}
.tab-btn.active{color:#ff8fa3}
.tab-btn.active::after{content:'';position:absolute;top:0;left:25%;right:25%;height:2px;background:#ff8fa3;border-radius:0 0 2px 2px}
.tab-btn .icon{display:block;font-size:20px;margin-bottom:2px}

.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#ff8fa3;color:#1a120b;padding:10px 24px;border-radius:20px;font-size:13px;font-weight:bold;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.toast.show{opacity:1}

@media(min-width:768px){
  .app{flex-direction:row}
  .topbar{display:none}
  .main{flex:1;display:flex;overflow:hidden}
  .page{position:relative;display:flex!important;flex-direction:column}
  .editor-page{width:420px;min-width:420px;border-right:1px solid #3a3020}
  .preview-page{flex:1}
  .tabbar{display:none}
}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <h1>乱马 · 图鉴</h1>
    <span class="stats" id="topStats"></span>
  </div>
  <div class="main">
    <div class="page editor-page active" id="editorPage">
      <div class="editor-body" id="editorBody"></div>
    </div>
    <div class="page preview-page" id="previewPage">
      <iframe class="preview-frame" id="previewFrame"></iframe>
    </div>
  </div>
  <div class="tabbar">
    <button class="tab-btn active" onclick="switchTab('editor')"><span class="icon">✏️</span>编辑</button>
    <button class="tab-btn" onclick="switchTab('preview')"><span class="icon">👁️</span>预览</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ 数据模型 ============
var DEFAULT_DATA = {
  title: 'Admire-Meow Journal',
  triggerText: '角色图鉴',
  themeColor: '#ff8fa3',
  bgColor: '#fff0f3',
  realms: [
    {name:'奶龙',cards:[
      {name:'许星榆',unlockKey:'xingyu',locked:false,sides:[
        {img:'https://meimoaiimg.com/user/101516/奶龙卡·星榆日常图.png?i=1129319', tag:'日常服'},
        {img:'https://meimoaiimg.com/user/101516/奶龙卡·星榆奶龙服.png?i=1129320', tag:'奶龙服'}
      ],relation:'你的青梅竹马/同学/邻居，从小一起生活到大，平时喜欢叫你为哥哥'},
      {name:'呢银',unlockKey:'niyin',locked:false,sides:[
        {img:'https://meimoaiimg.com/user/101516/奶龙卡·呢银日常服.jpg?i=1129326', tag:'日常'},
        {img:'https://meimoaiimg.com/user/101516/奶龙卡·呢银奶龙服.png?i=1129324', tag:'奶龙服'}
      ],relation:'许星榆的表妹，由于经常去表姐家蹭饭蹭住，因此和你频繁接触'},
      {name:'波奇',unlockKey:'boqi',locked:false,sides:[
        {img:'https://meimoaiimg.com/user/101516/奶龙卡·波奇日常服.jpg?i=1129321', tag:'日常'},
        {img:'https://meimoaiimg.com/user/101516/奶龙卡·波奇奶龙服.png?i=1129325', tag:'奶龙服'}
      ],relation:'同班但座位不相邻，在一次文化祭合作后主动接近你'},
      {name:'梦弥',unlockKey:'mengmi',locked:false,sides:[
        {img:'https://meimoaiimg.com/user/101516/奶龙卡·梦弥日常服.png?i=1129323', tag:'日常'},
        {img:'https://meimoaiimg.com/user/101516/奶龙卡·梦弥奶龙服.jpg?i=1129322', tag:'奶龙服'}
      ],relation:'你的打工同事（便利店夜班），夜班时独处三小时，从"同事"逐步模糊到"说不清"'}
    ]}
  ]
};

var data = JSON.parse(JSON.stringify(DEFAULT_DATA));
var currentTab = 'editor';

// ============ 外观设置 ============
var appearance = {
  btnTopPx: 280,
  btnTop: 28,
  btnRightPx: 0,
  panelWidth: 300,
  triggerColor: '#d4a373',
  triggerBg: '#fff9e1',
  themeColor: '#ff8fa3',
  bgColor: '#fff0f3',
  btnShape: 'round-right',
  btnRadius: 12,
  btnSide: 'right',
  gridRows: 1,
  gridCols: 1
};

// ============ 解锁设置 ============
var unlock = {
  enabled: false,        // 是否启用图鉴解锁功能
  storageKey: 'km_unlock',
  namespace: 'km_codex',
  lockText: '???',
  lockTip: '剧情推进后解锁',
  lockBrightness: 0.1,
  lockOverlayBg: 'rgba(0,0,0,0.85)',
  lockIcon: '🔒'
};

// ============ 自定义弹窗 ============
function showDialog(html, onOk) {
  var overlay = document.createElement('div');
  overlay.className = 'dlg-overlay';
  overlay.innerHTML = '<div class="dlg-box">'+html+'</div>';
  overlay.onclick = function(e) { if (e.target === overlay) { overlay.remove(); } };
  document.body.appendChild(overlay);
  var box = overlay.querySelector('.dlg-box');
  var okBtn = box.querySelector('.confirm');
  var cancelBtn = box.querySelector('.cancel');
  var input = box.querySelector('input');
  var sel = box.querySelector('select');
  if (okBtn) okBtn.onclick = function() {
    var val = input ? input.value : (sel ? sel.value : true);
    overlay.remove();
    if (onOk) onOk(val);
  };
  if (cancelBtn) cancelBtn.onclick = function() { overlay.remove(); };
  if (input) {
    input.focus();
    input.onkeydown = function(e) { if (e.key === 'Enter') { overlay.remove(); if (onOk) onOk(input.value); } };
  }
  overlay.onkeydown = function(e) { if (e.key === 'Escape') overlay.remove(); };
}

// ============ Tab 切换 ============
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('editorPage').classList.toggle('active', tab==='editor');
  document.getElementById('previewPage').classList.toggle('active', tab==='preview');
  var all = document.querySelectorAll('.tab-btn');
  for (var i=0;i<all.length;i++) {
    all[i].classList.toggle('active', all[i].textContent.indexOf(tab==='editor'?'编辑':'预览')>=0);
  }
  if (tab === 'preview') updatePreview();
}

// ============ 按钮圆角改变 ============
function onRadiusChange(el) {
  appearance.btnRadius = parseInt(el.value);
  appearance.btnShape = 'custom';
  var sel = document.querySelector('#editorBody select');
  if (sel) sel.value = 'custom';
  var span = document.getElementById('apv_btnRadius');
  if (span) span.textContent = el.value + 'px';
  updatePreview();
}
function onShapeChange(val) {
  appearance.btnShape = val;
  render();
}

// ============ 渲染编辑器 ============
function render() {
  var body = document.getElementById('editorBody');
  var h = '';

  // ===== 基本信息 =====
  h += '<div class="section"><div class="section-header"><h3>📌 图鉴名称</h3></div>';
  h += '<div class="section-body"><label>图鉴标题（面板顶部显示）</label>';
  h += '<input value="'+esc(data.title)+'" onchange="data.title=this.value.trim()||\'图鉴\';updatePreview()" placeholder="Admire-Meow Journal">';
  h += '<label>按钮文字（每行用 | 分隔，如：角|色|图|鉴）</label>';
  h += '<input value="'+esc(data.triggerText)+'" onchange="data.triggerText=this.value.trim()||\'图鉴\';updatePreview()" placeholder="角色图鉴">';
  h += '<label>关系标签文字（每张卡片中显示，如：与你的关系）</label>';
  h += '<input value="'+esc(data.relationLabel||'与你的关系')+'" onchange="data.relationLabel=this.value.trim()||\'与你的关系\';updatePreview()" placeholder="与你的关系"></div></div>';

  // ===== 批量导入图片模式 =====
  h += '<div class="section"><div class="section-header"><h3>📥 批量导入图片</h3><span style="font-size:11px;color:#8b7355">粘贴长串URL → 自动去乱码分组</span></div>';
  h += '<div class="section-body">';
  h += '<p style="font-size:10px;color:#8b7355;margin-bottom:8px">粘贴多条图片链接（每行一个URL），自动去 <b>?i=xxx</b> 乱码 + 提取角色名 + 每组最多<b>8张</b>填入卡片。</p>';
  h += '<label for="bulkTarget">放入分栏</label>';
  h += '<select id="bulkTarget" style="width:100%;padding:8px 10px;background:#0d0a06;border:1px solid #2a2218;border-radius:6px;color:#e0d5c0;font-size:13px;margin-bottom:8px">';
  for (var ri2=0; ri2<data.realms.length; ri2++) {
    h += '<option value="'+ri2+'">'+esc(data.realms[ri2].name)+' ('+data.realms[ri2].cards.length+'角色)</option>';
  }
  h += '</select>';
  h += '<textarea id="bulkInput" rows="8" onpaste="fixBulkPaste(event)" placeholder="粘贴图片链接，每行一个 URL（可混合 .webp/.png/.jpg/.jpeg）&#10;如：&#10;https://xxx.com/男主01.png?i=123&#10;https://xxx.com/男主02.png?i=124&#10;https://xxx.com/女主01.png?i=125&#10;..." style="width:100%;padding:8px 10px;background:#0d0a06;border:1px solid #2a2218;border-radius:6px;color:#e0d5c0;font-size:12px;font-family:monospace;resize:vertical;margin-bottom:8px"></textarea>';
  h += '<div style="display:flex;gap:8px;margin-bottom:8px">';
  h += '<button class="btn add" style="flex:1" onclick="bulkImport()">🔍 分析 & 导入</button>';
  h += '<button class="btn" style="flex:1" onclick="clearBulkInput()">🗑 清空</button>';
  h += '</div>';
  h += '</div></div>';

  // ===== 解锁设置（剧情口令解锁图鉴）=====
  h += '<div class="section"><div class="section-header"><h3>🔓 图鉴解锁</h3><span style="font-size:11px;color:#8b7355">'+(unlock.enabled?'已启用':'已禁用')+'</span></div>';
  h += '<div class="section-body">';
  h += '<label><input type="checkbox" onchange="unlock.enabled=this.checked;render()"'+(unlock.enabled?' checked':'')+'> 启用剧情口令解锁功能</label>';
  h += '<p style="font-size:10px;color:#8b7355;margin:4px 0 10px">启用后，勾选"需要解锁"的角色在剧情中默认隐藏，AI输出口令后才显示。</p>';
  if (unlock.enabled) {
    h += '<label>存储 key（正则和图鉴一致）</label>';
    h += '<input value="'+esc(unlock.storageKey)+'" onchange="unlock.storageKey=this.value.trim()||\'km_unlock\';updatePreview()">';
    h += '<label>命名空间（避免与其他脚本冲突）</label>';
    h += '<input value="'+esc(unlock.namespace)+'" onchange="unlock.namespace=this.value.replace(/[^a-zA-Z0-9_-]/g,\'_\')||\'km_codex\';updatePreview()">';
    h += '<label>锁定显示文字</label>';
    h += '<input value="'+esc(unlock.lockText)+'" onchange="unlock.lockText=this.value.trim()||\'???\';updatePreview()">';
    h += '<label>锁定提示文字（关系栏显示）</label>';
    h += '<input value="'+esc(unlock.lockTip)+'" onchange="unlock.lockTip=this.value.trim()||\'剧情推进后解锁\';updatePreview()">';
    h += '<label>锁定图标 emoji</label>';
    h += '<input value="'+esc(unlock.lockIcon)+'" onchange="unlock.lockIcon=this.value.trim()||\'🔒\';updatePreview()">';
    h += '<label>锁定图片亮度 (0~1)</label>';
    h += '<div class="range-row"><input type="range" min="0" max="1" step="0.05" value="'+unlock.lockBrightness+'" oninput="unlock.lockBrightness=parseFloat(this.value);document.getElementById(\'apv_lockBri\').textContent=this.value;updatePreview()"><span class="range-val" id="apv_lockBri">'+unlock.lockBrightness+'</span></div>';
    h += '<label>锁定遮罩背景</label>';
    h += '<div class="range-row"><input type="color" value="'+unlock.lockOverlayBg+'" oninput="unlock.lockOverlayBg=this.value;updatePreview()"><span class="range-val" style="font-family:monospace">'+unlock.lockOverlayBg+'</span></div>';
    // 剧情规则 + 正则 + 替换代码
    h += '<div style="margin-top:12px;padding-top:10px;border-top:1px dashed #3a3020">';
    h += '<label style="color:#ff8fa3">📋 剧情输出规则（复制到 AI 提示词）</label>';
    var lockedKeys=[];
    for(var ri=0;ri<data.realms.length;ri++)for(var ci=0;ci<data.realms[ri].cards.length;ci++){var c=data.realms[ri].cards[ci];if(c.locked)lockedKeys.push(c.unlockKey||('card_'+ri+'_'+ci))}
    var ruleText='当剧情中出现"明确见到了某个隐藏角色"的情节时，必须在该次回复的末尾输出一行解锁口令。\\n格式严格如下：\\n【⑧】角色键名【⑧】\\n说明：\\n角色键名必须和图鉴代码里的 data-unlock-key 完全一致。\\n当前可解锁的键名为：'+(lockedKeys.length?lockedKeys.join('、'):'暂无')+'\\n若本次剧情未触及任何解锁条件，则不输出此口令。\\n示例：若解锁 '+esc(lockedKeys[0]||'角色键名')+'，则输出：\\n【⑧】'+esc(lockedKeys[0]||'角色键名')+'【⑧】';
    h += '<textarea readonly rows="3" style="font-size:10px;color:#b4946a;margin-bottom:6px;width:100%;background:#0d0a06;border:1px solid #2a2218;border-radius:6px;padding:6px">'+ruleText+'</textarea>';
    h += '<label style="color:#ff8fa3">🔍 正则</label>';
    h += '<input readonly value="/【⑧】([a-zA-Z0-9_]+)【⑧】/g" style="font-size:10px;color:#b4946a;margin-bottom:6px;font-family:monospace">';
    var storageKeyEsc=unlock.storageKey.replace(/\\\\/g,'\\\\\\\\').replace(/'/g,"\\\\'");
    var repStr='<img src="x" style="display:none;" onerror="(function(){var k=\'$1\';var s={};try{s=JSON.parse(localStorage.getItem(\''+storageKeyEsc+'\')||\'{}\');}catch(e){s={};}s[k]=1;try{localStorage.setItem(\''+storageKeyEsc+'\',JSON.stringify(s));}catch(e){}})()">';
    h += '<label style="color:#ff8fa3">🔄 替换代码</label>';
    h += '<textarea readonly rows="2" style="font-size:10px;color:#b4946a;margin-bottom:4px;width:100%;background:#0d0a06;border:1px solid #2a2218;border-radius:6px;padding:6px;font-family:monospace">'+esc(repStr)+'</textarea>';
    h += '<p style="font-size:9px;color:#6b5a3a">使用方法：将正则和替换代码配成一对正则脚本，AI 输出解锁口令时自动匹配并将角色 key 写入 localStorage，图鉴侧检测后自动解锁。</p>';
    h += '</div>';
  }
  h += '</div></div>';

  // ===== 基础设置：分栏网格 =====  // ===== 基础设置：分栏网格 =====
  h += '<div class="section"><div class="section-header"><h3>📐 分栏展示布局</h3></div><div class="section-body">';
  h += '<p style="margin-bottom:10px;font-size:11px;color:#8b7355">设置每个分栏内卡片的行列布局。如 2×2 表示最多显示 2行2列，卡片不足时空位留空，超出时自动增加列数（如5张卡→2×3少一空位）。<br>设为 1×1 恢复默认竖排。</p>';

  h += '<label>行数</label>';

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ============ 数据操作 ============
function addRealm() {
  showDialog('<p>请输入新分栏名称</p><input value="新分栏"><div class="dlg-btns"><button class="btn cancel">取消</button><button class="btn confirm">确定</button></div>', function(val) {
    if (!val || !val.trim()) return;
    data.realms.push({name:val.trim(),cards:[]});
    render();
  });
}
function deleteRealm(ri) {
  showDialog('<p>确定删除分栏「'+data.realms[ri].name+'」及其所有角色？</p><div class="dlg-btns"><button class="btn cancel">取消</button><button class="btn confirm">确定删除</button></div>', function() {
    data.realms.splice(ri,1);
    render();
  });
}
function moveRealm(ri, dir) {
  var to = ri + dir;
  if (to < 0 || to >= data.realms.length) return;
  var tmp = data.realms[ri];
  data.realms[ri] = data.realms[to];
  data.realms[to] = tmp;
  render();
}
function addCard(ri) {
  data.realms[ri].cards.push({name:'新角色',unlockKey:'',locked:false,sides:[{img:'',tag:'日常'},{img:'',tag:'变身'}],relation:'描述与角色的关系'});
  render();
}
function addSide(ri, ci) {
  var card = data.realms[ri].cards[ci];
  if (!card.sides) card.sides = [];
  if (card.sides.length >= 8) return;
  card.sides.push({img:'',tag:'面'+(card.sides.length+1)});
  render();
}
function removeSide(ri, ci) {
  var card = data.realms[ri].cards[ci];
  if (!card.sides || card.sides.length <= 1) return;
  card.sides.pop();
  render();
}

// ============ 批量导入 ============
function fixBulkPaste(e) {
  var ta = e.target;
  var start = ta.selectionStart;
  var end = ta.selectionEnd;
  var before = ta.value.substring(0, start);
  var after = ta.value.substring(end);
  var pasted = (e.clipboardData || window.clipboardData).getData('text');
  if (!pasted) return;
  // Fix: merge "?\n" breaks, split at each http
  var fixed = pasted.replace(/\?\n\s*/g, '?');
  // Only insert line-break before http if it's a run-on block
  var urlCount = (fixed.match(/https?:\/\//g) || []).length;
  var lineCount = fixed.split('\n').length;
  if (lineCount < urlCount) {
    fixed = fixed.replace(/(?<!\n)(https?:\/\/)/g, '\n$1');
  }
  fixed = fixed.replace(/^\n+/, '');
  e.preventDefault();
  ta.value = before + fixed + after;
  var newPos = start + fixed.length;
  ta.setSelectionRange(newPos, newPos);
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}
function clearBulkInput() {
  var el = document.getElementById('bulkInput');
  if (el) el.value = '';
}
function bulkImport() {
  var raw = document.getElementById('bulkInput').value.trim();
  if (!raw) { showToast('请粘贴图片链接'); return; }
  // Fix: undo browser word-wrap breaks at "?", ensure each URL at "http"
  raw = raw.replace(/\?\n\s*/g, '?');
  raw = raw.replace(/(?<!\n)(https?:\/\/)/g, '\n$1');
  raw = raw.replace(/^\n+/, '');
  var lines = raw.split(/[\n]+/).map(function(l){return l.trim()}).filter(function(l){return l.length>0});
  if (lines.length === 0) { showToast('没有识别到有效链接'); return; }

  // --- 静默清洗：去掉 ?i=xxx + URL解码 ---
  lines = lines.map(function(l){return l.replace(/\?.*$/,'')});
  lines = lines.map(function(l){try{return decodeURIComponent(l)}catch(e){return l}});

  // Find common prefix
  var prefix = '', first = lines[0];
  for (var i=0; i<first.length; i++) {
    var ch = first.charAt(i), allMatch = true;
    for (var j=1; j<lines.length; j++) { if (i >= lines[j].length || lines[j].charAt(i) !== ch) { allMatch = false; break; } }
    if (!allMatch) break;
    prefix += ch;
  }

  // Find common suffix
  var suffix = '', lastLen = lines[0].length;
  for (var i=0; i<lastLen; i++) {
    var ch = lines[0].charAt(lastLen - 1 - i), allMatch = true;
    for (var j=1; j<lines.length; j++) { var jLen = lines[j].length; if (i >= jLen || lines[j].charAt(jLen - 1 - i) !== ch) { allMatch = false; break; } }
    if (!allMatch) break;
    suffix = ch + suffix;
  }

  // Extract variable names
  var vars = lines.map(function(l){
    var v = l;
    if (prefix) v = v.slice(prefix.length);
    if (suffix) v = v.slice(0, v.length - suffix.length);
    v = v.replace(/\.(webp|png|jpg|jpeg|gif)$/i, '');
    return v;
  });

  // Extract "text-only" (Chinese chars + letters only, strip everything else)
  // 杨颜💖3 → 杨颜, 男主01→ 男主, Alice_001 → Alice
  function textOnly(vn) {
    return vn.replace(/[^\u4e00-\u9fa5a-zA-Z]+/g,'');
  }

  // LCS similarity helper
  function lcsLen(a, b) {
    var m = a.length, n = b.length;
    var prev = new Array(n+1).fill(0), cur = new Array(n+1).fill(0);
    for (var ri2=1; ri2<=m; ri2++) {
      for (var cj=1; cj<=n; cj++) {
        if (a[ri2-1] === b[cj-1]) cur[cj] = prev[cj-1] + 1;
        else cur[cj] = Math.max(prev[cj], cur[cj-1]);
      }
      var tmp = prev; prev = cur; cur = tmp;
    }
    return prev[n];
  }
  function similarity(a, b) {
    return lcsLen(a, b) / Math.max(a.length, b.length);
  }

  // Group: first exact text-only match, then LCS >= 50% for remaining
  var groups = {}; // {baseName: [{url, varname, idx}]}
  var groupOrder = [];
  var used = new Array(vars.length).fill(false);

  // Pass 1: exact text-only match (emoji/symbols/digits ignored)
  for (var i3=0; i3<vars.length; i3++) {
    if (used[i3]) continue;
    var base = textOnly(vars[i3]);
    if (!base) continue; // pure emoji/symbol — handled in pass 2
    var items = [];
    for (var j3=i3; j3<vars.length; j3++) {
      if (used[j3]) continue;
      if (textOnly(vars[j3]) === base) { used[j3] = true; items.push({url: lines[j3], varname: vars[j3], idx: j3}); }
    }
    if (!groups[base]) { groups[base] = []; groupOrder.push(base); }
    groups[base] = groups[base].concat(items);
  }

  // Pass 2: LCS >= 50% for remaining orphans (pure-emoji, or names with no common text)
  for (var i4=0; i4<vars.length; i4++) {
    if (used[i4]) continue;
    used[i4] = true;
    var clusterItems = [{url: lines[i4], varname: vars[i4], idx: i4}];

    for (var j4=i4+1; j4<vars.length; j4++) {
      if (used[j4]) continue;
      if (similarity(vars[i4], vars[j4]) >= 0.5) {
        used[j4] = true;
        clusterItems.push({url: lines[j4], varname: vars[j4], idx: j4});
      }
    }

    // Pick best name for this cluster
    var cname = vars[i4];
    if (clusterItems.length > 1) {
      var cprefix = '';
      for (var ci=0; ci<clusterItems[0].varname.length; ci++) {
        var cch = clusterItems[0].varname[ci], allMatch = true;
        for (var cj=1; cj<clusterItems.length; cj++) {
          if (ci >= clusterItems[cj].varname.length || clusterItems[cj].varname[ci] !== cch) { allMatch = false; break; }
        }
        if (!allMatch) break;
        cprefix += cch;
      }
      cname = cprefix.replace(/[\d\-_\s]+$/,'');
      if (!cname) cname = cprefix;
    }

    if (!groups[cname]) { groups[cname] = []; groupOrder.push(cname); }
    groups[cname] = groups[cname].concat(clusterItems);
  }

  // Sort items within each group
  for (var g=0; g<groupOrder.length; g++) {
    groups[groupOrder[g]].sort(function(a,b){return a.varname.localeCompare(b.varname)});
  }

  // Import: each group → one card, up to 8 sides per card
  var targetRealmIdx = parseInt(document.getElementById('bulkTarget').value);
  if (isNaN(targetRealmIdx) || targetRealmIdx < 0 || targetRealmIdx >= data.realms.length) targetRealmIdx = 0;

  var addedCards = 0, addedImages = 0;
  for (var g=0; g<groupOrder.length; g++) {
    var base = groupOrder[g];
    var items = groups[base];
    // Split into chunks of 8 sides per card
    for (var ci4=0; ci4<items.length; ci4+=8) {
      var chunk = items.slice(ci4, Math.min(ci4+8, items.length));
      var cardName = '';
      var sides = chunk.map(function(it){return {img: it.url, tag: ''}});
      data.realms[targetRealmIdx].cards.push({name: cardName, unlockKey: '', locked: false, sides: sides, relation: ''});
      addedCards++; addedImages += sides.length;
    }
  }

  // 导入完自动清空输入框
  document.getElementById('bulkInput').value = '';
  render();
  updatePreview();
  updateStats();
  showToast('✅ 导入 ' + addedCards + ' 张卡片（' + addedImages + ' 面）到「' + data.realms[targetRealmIdx].name + '」');
}

// ============ 角色移到其他分栏 ============
function moveCardToRealm(ri, ci) {
  var cardName = data.realms[ri].cards[ci].name || '未命名';
  var opts = '';
  for (var i=0; i<data.realms.length; i++) {
    if (i === ri) continue;
    opts += '<option value="'+i+'">'+esc(data.realms[i].name)+' ('+data.realms[i].cards.length+'角色)</option>';
  }
  // Also allow creating a new realm
  opts += '<option value="-1">🆕 创建新分栏</option>';

  var dialogHTML = '<p>将「'+esc(cardName)+'」移到哪个分栏？</p>';
  dialogHTML += '<select id="moveTarget" style="width:100%;padding:8px;background:#0d0a06;border:1px solid #ff8fa3;border-radius:6px;color:#e0d5c0;font-size:13px;margin-bottom:14px">'+opts+'</select>';
  dialogHTML += '<div class="dlg-btns"><button class="btn cancel">取消</button><button class="btn confirm">移动</button></div>';

  showDialog(dialogHTML, function(val) {
    var targetIdx = parseInt(val);
    if (isNaN(targetIdx)) return;

    var card = data.realms[ri].cards[ci];
    data.realms[ri].cards.splice(ci, 1);

    if (targetIdx === -1) {
      // Create new realm
      var newRealm = {name: card.name || '新分栏', cards: [card]};
      data.realms.push(newRealm);
      showToast('📦 已创建新分栏「'+newRealm.name+'」并移入');
    } else {
      data.realms[targetIdx].cards.push(card);
      showToast('✅ 已移到「'+data.realms[targetIdx].name+'」');
    }

    render();
    updatePreview();
    updateStats();
  });
}
function deleteCard(ri, ci) {
  data.realms[ri].cards.splice(ci,1);
  render();
  showToast('已删除');
}
function moveCard(ri, ci, dir) {
  var cards = data.realms[ri].cards;
  var to = ci + dir;
  if (to < 0 || to >= cards.length) return;
  var tmp = cards[ci];
  cards[ci] = cards[to];
  cards[to] = tmp;
  render();
}
function updateCardPreview() { updatePreview(); updateStats(); }

function updateStats() {
  var totalR = data.realms.length;
  var totalC = 0;
  for (var i=0;i<data.realms.length;i++) totalC += data.realms[i].cards.length;
  var s = totalR+'分栏 · '+totalC+'角色';
  if (document.getElementById('topStats')) document.getElementById('topStats').textContent = s;
}

// ============ 导出 ============
function exportHTML() {
  var html = genHTML();
  var blob = new Blob([html],{type:'text/html;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = (data.title||'图鉴')+'.html';
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ 已下载');
}
function copyHTML() {
  var html = genHTML();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(html).then(function(){showToast('✅ 已复制到剪贴板');}).catch(fallbackCopy);
  } else { fallbackCopy(); }
  function fallbackCopy() {
    var ta = document.createElement('textarea');
    ta.value = html; ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);

  }
}
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},1800);

// ============ 持久化存储 ============
var STORAGE_KEY = 'km_editor_v5';

function saveState() {
  var state = { data: data, appearance: appearance };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  try { localStorage.setItem('km_editor_unlock_v1', JSON.stringify(unlock)); } catch(e) {}
}

function loadState() {
  try {
    var saved = localStorage.getItem(STORAGE_KEY);
    var savedUnlock = localStorage.getItem('km_editor_unlock_v1');
    if (savedUnlock) {
      try { var pu = JSON.parse(savedUnlock); if (pu && typeof pu === 'object') { for (var k in pu) { if (unlock.hasOwnProperty(k)) unlock[k] = pu[k]; } } } catch(e) {}
    }
    if (saved) {
      var state = JSON.parse(saved);
      if (state.data && state.data.realms && Array.isArray(state.data.realms)) {
        data = state.data;
      }
      if (state.appearance) {
        for (var k in state.appearance) {
          if (appearance.hasOwnProperty(k)) appearance[k] = state.appearance[k];
        }
      }
      return true;
    }
  } catch(e) {}
  return false;
}

// 包装 render，每次渲染后自动保存
var _origRender = render;
render = function() {
  _origRender();
  saveState();
};

// 包装 updatePreview，每次预览更新后也保存
var _origUpdatePreview = updatePreview;
updatePreview = function() {
  _origUpdatePreview();
  saveState();
};

      { id: -1, scriptName: '奶龙卡·CSS部署', findRegex: '<css>', replaceString: '<style>'+cssStr+'</style>' },
      { id: -1, scriptName: '奶龙卡·面板+JS注入', findRegex: '<km-body>', replaceString: bodyReplace }
    ]
  };
}

function exportMMDJson() {
  var json = genMMDJson();
  var jsonStr = JSON.stringify(json, null, 2);
  var blob = new Blob([jsonStr],{type:'application/json;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = (data.title||'图鉴').replace(/[\\/:*?"<>|]/g,'_')+'_mmd.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ MMD JSON 已下载');
}

function copyMMDJson() {
  var json = genMMDJson();
  var jsonStr = JSON.stringify(json, null, 2);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(jsonStr).then(function(){showToast('✅ JSON 已复制到剪贴板');}).catch(function(){
      var ta = document.createElement('textarea');
      ta.value = jsonStr; ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      showToast('✅ JSON 已复制到剪贴板');
    });
  } else {
    var ta = document.createElement('textarea');
    ta.value = jsonStr; ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('✅ JSON 已复制到剪贴板');
  }
}

// ============ 初始化 ============
var hasSaved = loadState();
render();
if (!hasSaved) saveState();
</script>
</body>
</html>

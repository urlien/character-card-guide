<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全局美化生成器</title>
<style>
  :root{
    --ui-bg:#141210; --ui-panel:#1c1a17; --ui-card:#242119;
    --ui-line:rgba(200,150,120,0.18); --ui-accent:#c89578; --ui-accent2:#d4a878;
    --ui-text:#e8ded2; --ui-sub:#8c7a6a; --ui-input:#100f0d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--ui-bg); color:var(--ui-text);
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
    min-height:100vh;
  }
  header{
    padding:22px 24px 16px; border-bottom:1px solid var(--ui-line);
    display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  }
  header h1{ font-size:19px; margin:0; letter-spacing:1px; color:var(--ui-accent2); }
  header p{ margin:0; font-size:12.5px; color:var(--ui-sub); }

  .layout{
    display:grid; grid-template-columns: 380px 1fr; gap:0;
    min-height:calc(100vh - 140px);
  }
  @media (max-width: 860px){ .layout{ grid-template-columns: 1fr; } }

  .controls{
    padding:20px; border-right:1px solid var(--ui-line);
    overflow-y:auto; max-height:calc(100vh - 140px);
  }
  @media (max-width: 860px){ .controls{ border-right:none; border-bottom:1px solid var(--ui-line); max-height:none; } }

  .section{ margin-bottom:22px; }
  .section-title{
    font-size:12px; color:var(--ui-accent); letter-spacing:2px; font-weight:bold;
    margin-bottom:10px; text-transform:uppercase; opacity:0.85;
  }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .row label{ font-size:12.5px; color:var(--ui-text); flex-shrink:0; }
  .row .hint{ font-size:10.5px; color:var(--ui-sub); display:block; margin-top:1px; }

  input[type=color]{
    width:34px; height:26px; border:1px solid var(--ui-line); border-radius:6px;
    background:none; padding:0; cursor:pointer;
  }
  input[type=range]{ width:140px; accent-color:var(--ui-accent); }
  input[type=text]{
    background:var(--ui-input); border:1px solid var(--ui-line); color:var(--ui-text);
    border-radius:6px; padding:6px 8px; font-size:12.5px; width:140px;
  }
  select{
    background:var(--ui-input); border:1px solid var(--ui-line); color:var(--ui-text);
    border-radius:6px; padding:6px 8px; font-size:12.5px; width:140px;
  }
  .toggle{
    width:38px; height:21px; background:rgba(200,150,120,0.15); border:1px solid var(--ui-line);
    border-radius:11px; position:relative; cursor:pointer; flex-shrink:0; transition:.2s;
  }
  .toggle.on{ background:rgba(200,150,120,0.4); border-color:var(--ui-accent); }
  .toggle .knob{
    width:15px; height:15px; background:var(--ui-sub); border-radius:50%;
    position:absolute; top:2px; left:2px; transition:.2s;
  }
  .toggle.on .knob{ left:19px; background:var(--ui-accent2); }

  .segmented{ display:flex; gap:6px; }
  .segmented button{
    flex:1; padding:6px 4px; font-size:11.5px; background:var(--ui-input);
    border:1px solid var(--ui-line); color:var(--ui-sub); border-radius:6px; cursor:pointer;
  }
  .segmented button.active{ background:rgba(200,150,120,0.25); color:var(--ui-accent2); border-color:var(--ui-accent); }

  .preview{
    padding:20px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .phone{
    width:320px; height:560px; border-radius:26px; border:6px solid #050403;
    background:#000; position:relative; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  .phone-top{
    height:40px; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:bold; letter-spacing:1px; border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .phone-body{ height:calc(100% - 90px); padding:14px; overflow:hidden; }
  .bubble-row{ display:flex; margin-bottom:12px; }
  .bubble-row.right{ justify-content:flex-end; }
  .bubble{
    max-width:78%; padding:10px 13px; font-size:12.5px; line-height:1.7; border-radius:6px 14px 14px 6px;
  }
  .bubble.user{ border-radius:14px 6px 6px 14px; }
  .phone-bottom{
    height:50px; display:flex; align-items:center; gap:8px; padding:0 12px;
    border-top:1px solid rgba(255,255,255,0.06);
  }
  .fake-input{ flex:1; height:30px; border-radius:8px; display:flex; align-items:center; padding:0 10px; font-size:11px; }
  .fake-send{ padding:6px 14px; border-radius:8px; font-size:11.5px; }
  .dock-btn{
    position:absolute; width:30px; height:70px; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:bold; letter-spacing:2px; writing-mode:vertical-rl; border-radius:8px 0 0 8px;
  }
  .dock-btn.left{ border-radius:0 8px 8px 0; }

  .generate-bar{
    padding:16px 24px; border-top:1px solid var(--ui-line); display:flex; align-items:center;
    justify-content:space-between; gap:16px; flex-wrap:wrap; background:var(--ui-panel);
  }
  .char-count{ font-size:12px; color:var(--ui-sub); }
  .char-count b{ color:var(--ui-accent2); }
  #genBtn{
    background:linear-gradient(145deg,#5a4035,#3a2520); color:#e8d8c8; border:1px solid var(--ui-accent);
    padding:12px 28px; border-radius:8px; font-size:14px; font-weight:bold; letter-spacing:1px;
    cursor:pointer; transition:.2s;
  }
  #genBtn:hover{ background:linear-gradient(145deg,#6a5040,#4a3530); }
  #genBtn:active{ transform:scale(0.97); }
  .footnote{ font-size:11px; color:var(--ui-sub); max-width:520px; }
</style>
</head>
<body>

<header>
  <h1>🎨 全局美化生成器</h1>
  <p>选好颜色、位置和功能，点底部按钮直接下载可导入的 JSON 文件</p>
</header>

<div class="layout">
  <div class="controls">

    <div class="section">
      <div class="section-title">悬浮球位置</div>
      <div class="row">
        <label>贴边方向</label>
        <div class="segmented" style="width:140px">
          <button id="sideLeft" data-side="left">左侧</button>
          <button id="sideRight" data-side="right" class="active">右侧</button>
        </div>
      </div>
      <div class="row">
        <label>垂直高度<span class="hint" id="topHintLabel">50%</span></label>
        <input type="range" id="dockTop" min="10" max="90" value="50">
      </div>
    </div>

    <div class="section">
      <div class="section-title">配色</div>
      <div class="row"><label>聊天背景</label><input type="color" id="c_bg" value="#1e1c1a"></div>
      <div class="row"><label>AI气泡背景</label><input type="color" id="c_aiBg" value="#2a2724"></div>
      <div class="row"><label>AI气泡强调边</label><input type="color" id="c_aiAccent" value="#c89578"></div>
      <div class="row"><label>AI气泡文字</label><input type="color" id="c_aiText" value="#c8c0b8"></div>
      <div class="row"><label>用户气泡渐变①</label><input type="color" id="c_userBg1" value="#4a3530"></div>
      <div class="row"><label>用户气泡渐变②</label><input type="color" id="c_userBg2" value="#3a2520"></div>
      <div class="row"><label>用户气泡文字</label><input type="color" id="c_userText" value="#e8d8c8"></div>
      <div class="row"><label>高亮/强调色</label><input type="color" id="c_highlight" value="#d4a878"></div>
      <div class="row"><label>次要文字</label><input type="color" id="c_sub" value="#8c7a6a"></div>
      <div class="row"><label>发送按钮底色</label><input type="color" id="c_sendBg" value="#5a4035"></div>
    </div>

    <div class="section">
      <div class="section-title">气泡花纹</div>
      <div class="segmented">
        <button data-pattern="none" class="active">无</button>
        <button data-pattern="stripes">斜纹</button>
        <button data-pattern="dots">圆点</button>
        <button data-pattern="grid">网格</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">字体</div>
      <select id="fontChoice">
        <option value="kai">楷体行书（微倾斜）</option>
        <option value="system">系统默认（不倾斜）</option>
      </select>
    </div>

    <div class="section">
      <div class="section-title">功能开关（给使用者看到的按钮）</div>
      <div class="row">
        <label>显示"全局美化"开关<span class="hint">可让使用者临时关闭配色</span></label>
        <div class="toggle on" id="toggleTheme"><div class="knob"></div></div>
      </div>
      <div class="row">
        <label>显示"字体切换"开关<span class="hint">可让使用者临时改回默认字体</span></label>
        <div class="toggle on" id="toggleFont"><div class="knob"></div></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">导入信息</div>
      <div class="row"><label>正则标记名</label><input type="text" id="markerName" value="MF_THEME"></div>
      <div class="row"><label>规则备注名</label><input type="text" id="scriptName" value="全局美化-自定义主题"></div>
    </div>

  </div>

  <div class="preview">
    <div class="phone" id="phone">
      <div class="phone-top" id="pTop">Meimodu</div>
      <div class="phone-body" id="pBody">
        <div class="bubble-row"><div class="bubble ai" id="bubbleAI">这是AI气泡的预览效果，颜色和花纹会跟着你左边的选择实时变化。</div></div>
        <div class="bubble-row right"><div class="bubble user" id="bubbleUser">这是我方气泡～</div></div>
      </div>
      <div class="phone-bottom" id="pBottom">
        <div class="fake-input" id="fakeInput">输入消息…</div>
        <div class="fake-send" id="fakeSend">发送</div>
      </div>
      <div class="dock-btn" id="dockBtn">美化</div>
    </div>
  </div>
</div>

<div class="generate-bar">
  <div class="footnote">生成的 JSON 是"正则替换"格式，导入方式：功能栏 → 正则脚本 → 导入。</div>
  <div class="char-count">代码长度约 <b id="charCount">0</b> 字符（上限 20000）</div>
  <button id="genBtn">✨ 生成并下载 JSON</button>
</div>

<script>
(function(){
  var state = { side:'right', pattern:'none' };

  function $(id){ return document.getElementById(id); }

  // ---- 分段按钮通用逻辑 ----
  function bindSegmented(container, onPick){
    container.querySelectorAll('button').forEach(function(btn){
      btn.addEventListener('click', function(){
        container.querySelectorAll('button').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        onPick(btn.dataset.side || btn.dataset.pattern);
      });
    });
  }
  bindSegmented(document.querySelector('.controls .segmented'), function(v){ state.side = v; updatePreview(); });
  document.querySelectorAll('.segmented')[1].querySelectorAll('button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.segmented')[1].querySelectorAll('button').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      state.pattern = btn.dataset.pattern;
      updatePreview();
    });
  });

  // ---- toggle 开关 ----
  [ 'toggleTheme','toggleFont' ].forEach(function(id){
    $(id).addEventListener('click', function(){ $(id).classList.toggle('on'); });
  });

  // ---- 滑块 ----
  $('dockTop').addEventListener('input', function(){
    $('topHintLabel').textContent = $('dockTop').value + '%';
    updatePreview();
  });

  // ---- 所有取色器/字体变化时刷新预览 ----
  ['c_bg','c_aiBg','c_aiAccent','c_aiText','c_userBg1','c_userBg2','c_userText','c_highlight','c_sub','c_sendBg'].forEach(function(id){
    $(id).addEventListener('input', updatePreview);
  });
  $('fontChoice').addEventListener('change', updatePreview);

  function patternCSS(p, alpha){
    if(p === 'stripes') return 'background-image:repeating-linear-gradient(135deg, rgba(255,255,255,'+alpha+') 0px, rgba(255,255,255,'+alpha+') 2px, transparent 2px, transparent 12px);';
    if(p === 'dots') return 'background-image:radial-gradient(rgba(255,255,255,'+alpha+') 1px, transparent 1px);background-size:14px 14px;';
    if(p === 'grid') return 'background-image:linear-gradient(rgba(255,255,255,'+alpha+') 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,'+alpha+') 1px, transparent 1px);background-size:16px 16px;';
    return '';
  }

  function updatePreview(){
    var bg = $('c_bg').value, aiBg = $('c_aiBg').value, aiAccent = $('c_aiAccent').value, aiText = $('c_aiText').value;
    var userBg1 = $('c_userBg1').value, userBg2 = $('c_userBg2').value, userText = $('c_userText').value;
    var highlight = $('c_highlight').value, sub = $('c_sub').value, sendBg = $('c_sendBg').value;
    var font = $('fontChoice').value === 'kai' ? "'STKaiti','KaiTi','楷体',sans-serif" : "-apple-system,sans-serif";
    var italic = $('fontChoice').value === 'kai' ? 'italic' : 'normal';

    $('phone').style.background = bg;
    $('pTop').style.background = bg;
    $('pTop').style.color = highlight;
    $('pBody').style.background = bg;
    $('pBottom').style.background = bg;

    $('bubbleAI').style.background = aiBg;
    $('bubbleAI').style.borderLeft = '4px solid ' + aiAccent;
    $('bubbleAI').style.color = aiText;
    $('bubbleAI').style.fontFamily = font;
    $('bubbleAI').style.fontStyle = italic;
    $('bubbleAI').style.cssText += patternCSS(state.pattern, '0.05');

    $('bubbleUser').style.background = 'linear-gradient(145deg,' + userBg1 + ',' + userBg2 + ')';
    $('bubbleUser').style.color = userText;
    $('bubbleUser').style.fontFamily = font;
    $('bubbleUser').style.fontStyle = italic;
    $('bubbleUser').style.cssText += patternCSS(state.pattern, '0.05');

    $('fakeInput').style.background = aiBg;
    $('fakeInput').style.color = sub;
    $('fakeSend').style.background = sendBg;
    $('fakeSend').style.color = highlight;

    var dock = $('dockBtn');
    dock.className = 'dock-btn' + (state.side === 'left' ? ' left' : '');
    dock.style[state.side] = '0';
    dock.style[state.side === 'left' ? 'right' : 'left'] = 'auto';
    dock.style.top = $('dockTop').value + '%';
    dock.style.transform = 'translateY(-50%)';
    dock.style.background = aiBg;
    dock.style.color = highlight;
    dock.style.border = '1.5px solid ' + aiAccent;

    updateCharCount();
  }

  // ---- 生成最终代码 ----
  function buildCode(){
    var bg = $('c_bg').value, aiBg = $('c_aiBg').value, aiAccent = $('c_aiAccent').value, aiText = $('c_aiText').value;
    var userBg1 = $('c_userBg1').value, userBg2 = $('c_userBg2').value, userText = $('c_userText').value;
    var highlight = $('c_highlight').value, sub = $('c_sub').value, sendBg = $('c_sendBg').value;
    var side = state.side, top = $('dockTop').value;
    var fontStack = $('fontChoice').value === 'kai' ? "'STXingkai','华文行楷','KaiTi','楷体','Hiragino Sans',sans-serif" : "'Hiragino Sans','Yu Gothic','Noto Sans SC',sans-serif";
    var italic = $('fontChoice').value === 'kai' ? 'italic' : 'normal';
    var pat = patternCSS(state.pattern, '0.05');
    var showThemeToggle = $('toggleTheme').classList.contains('on');
    var showFontToggle = $('toggleFont').classList.contains('on');
    var otherSide = side === 'left' ? 'right' : 'left';

    var css = ''
    + '<style id="gc-theme-style">\n'
    + ':root{--font-body:' + fontStack + ';--font-tilt:' + italic + ';}\n'
    + '.chat, .chat *{font-family:var(--font-body) !important;}\n'
    + '.chat .item .touch-scope .content.left, .chat .item .touch-scope .content.left *,\n'
    + '.chat .item .touch-scope .content.right, .chat .item .touch-scope .content.right *,\n'
    + '.chat .chat-bottom .chat-input-scope textarea, .msg-option-scope .option-item,\n'
    + '.prologue-scope .prologue-content, .shortcut-btn, .instruction-chip{font-style:var(--font-tilt) !important;}\n'
    + '.chat{background:' + bg + ' !important;}\n'
    + '.chat .item .touch-scope .content.left{background:' + aiBg + ' !important;border:1px solid ' + aiAccent + '4d !important;border-left:4px solid ' + aiAccent + ' !important;border-radius:6px 14px 14px 6px !important;color:' + aiText + ' !important;padding:14px 16px !important;font-size:14px !important;line-height:1.85 !important;' + pat + '}\n'
    + '.chat .item .touch-scope .content.left *{color:' + aiText + ' !important;}\n'
    + '.chat .item .touch-scope .content.right{background:linear-gradient(145deg,' + userBg1 + ',' + userBg2 + ') !important;border:0 !important;border-radius:14px 6px 6px 14px !important;color:' + userText + ' !important;padding:12px 16px !important;' + pat + '}\n'
    + '.chat .item .touch-scope .content.right *{color:' + userText + ' !important;}\n'
    + '.topTabbar{background:' + bg + ' !important;color:' + highlight + ' !important;border-color:' + aiAccent + '4d !important;}\n'
    + '.topTabbar [class*="title"], .topTabbar [class*="name"]{color:' + highlight + ' !important;font-weight:bold !important;}\n'
    + '.prologue-scope .prologue-content{background:' + aiBg + ' !important;border:1px solid ' + aiAccent + '4d !important;border-radius:10px !important;color:' + aiText + ' !important;padding:14px !important;}\n'
    + '.msg-option-scope .option-item{background:' + aiBg + ' !important;border:1px solid ' + aiAccent + '4d !important;border-radius:8px !important;color:' + aiText + ' !important;}\n'
    + '.msg-option-scope .option-item:hover{background:' + userBg1 + ' !important;border-color:' + aiAccent + ' !important;}\n'
    + '.chat .chat-bottom{background:' + bg + ' !important;border-top:1px solid ' + aiAccent + '40 !important;}\n'
    + '.chat .chat-bottom .chat-input-scope{background:' + aiBg + ' !important;border:1px solid ' + aiAccent + '4d !important;border-radius:8px !important;padding:6px 12px !important;}\n'
    + '.chat .chat-bottom .chat-input-scope textarea{background:transparent !important;color:' + aiText + ' !important;font-size:14px !important;}\n'
    + '.chat .chat-bottom .chat-input-scope textarea::placeholder{color:' + sub + ' !important;}\n'
    + '.chat .chat-bottom button[class*="send"], .chat .chat-bottom .send-msg, .chat .chat-bottom .send-btn{background:' + sendBg + ' !important;border:1px solid ' + aiAccent + '66 !important;border-radius:8px !important;color:' + highlight + ' !important;font-size:13px !important;padding:6px 18px !important;}\n'
    + '.shortcut-btn, .instruction-chip{background:' + aiBg + ' !important;border:1px solid ' + aiAccent + '4d !important;border-radius:6px !important;color:' + sub + ' !important;}\n'
    + '.shortcut-btn:hover, .instruction-chip:hover{background:' + userBg1 + ' !important;border-color:' + aiAccent + ' !important;}\n'
    + '[class*="model"]{background:' + aiBg + ' !important;border:1px solid ' + aiAccent + '4d !important;border-radius:6px !important;color:' + sub + ' !important;}\n'
    + '::-webkit-scrollbar{width:5px !important;}\n'
    + '::-webkit-scrollbar-thumb{background:' + sendBg + ' !important;border-radius:3px !important;}\n'
    + '::-webkit-scrollbar-track{background:' + bg + ' !important;}\n'
    + '</style>\n';

    var dockCss = ''
    + '<style>\n'
    + '.mf-switch-dock{position:fixed;' + side + ':16px;top:' + top + '%;transform:translateY(-50%);z-index:100002;display:flex;flex-direction:column;gap:8px;user-select:none;}\n'
    + '.mf-switch-btn{width:40px;height:40px;border-radius:50%;background:' + aiBg + ';border:1.5px solid ' + aiAccent + '66;color:' + aiAccent + ';font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;box-shadow:0 2px 10px rgba(0,0,0,.4);}\n'
    + '.mf-switch-btn:hover{background:' + sendBg + ';color:#fff;border-color:' + aiAccent + ';transform:scale(1.08);}\n'
    + '.mf-panel{position:fixed;' + side + ':70px;top:' + top + '%;transform:translateY(-50%);z-index:100001;background:' + aiBg + ';border:1px solid ' + aiAccent + '4d;border-radius:12px;padding:16px;width:220px;display:none;box-shadow:0 8px 32px rgba(0,0,0,.5);color:' + aiText + ';}\n'
    + '.mf-panel.open{display:block;}\n'
    + '.mf-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid ' + aiAccent + '26;}\n'
    + '.mf-row:last-child{border-bottom:none;}\n'
    + '.mf-label{font-size:12px;color:' + aiText + ';}\n'
    + '.mf-hint{font-size:9px;color:' + sub + ';margin-top:2px;}\n'
    + '.mf-toggle{width:40px;height:22px;background:' + aiAccent + '33;border:1px solid ' + aiAccent + '4d;border-radius:11px;position:relative;cursor:pointer;transition:all .25s;flex-shrink:0;}\n'
    + '.mf-toggle.active{background:' + aiAccent + '66;border-color:' + aiAccent + ';}\n'
    + '.mf-toggle-knob{width:16px;height:16px;background:' + sub + ';border-radius:50%;position:absolute;top:2px;left:2px;transition:all .25s;}\n'
    + '.mf-toggle.active .mf-toggle-knob{left:20px;background:' + highlight + ';}\n'
    + '@media (max-width:768px){.mf-panel{' + otherSide + ':0;bottom:0;top:auto;' + side + ':0;transform:none;width:auto;max-height:55vh;border-radius:16px 16px 0 0;overflow-y:auto;}.mf-switch-dock{' + side + ':10px;top:auto;bottom:80px;transform:none;}}\n'
    + '</style>\n';

    var panelRows = '';
    if(showThemeToggle){
      panelRows += '<div class="mf-row" onclick="event.stopPropagation();window.mfToggleTheme()"><div><div class="mf-label">全局美化</div><div class="mf-hint">自定义主题配色</div></div><div class="mf-toggle active" id="mf-toggle-theme"><div class="mf-toggle-knob"></div></div></div>\n';
    }
    if(showFontToggle){
      panelRows += '<div class="mf-row" onclick="event.stopPropagation();window.mfToggleFont()"><div><div class="mf-label">主题字体</div><div class="mf-hint">切换回系统默认</div></div><div class="mf-toggle active" id="mf-toggle-font"><div class="mf-toggle-knob"></div></div></div>\n';
    }

    var html = ''
    + '<div class="mf-switch-dock" id="mf-switch-dock" onclick="event.stopPropagation()">\n'
    + '<button class="mf-switch-btn" id="mf-drag-handle" title="美化设置（可拖拽）">🎨</button>\n'
    + '</div>\n'
    + '<div class="mf-panel" id="mf-panel" onclick="event.stopPropagation()">\n'
    + '<div style="font-size:13px;font-weight:bold;color:' + highlight + ';margin-bottom:10px;text-align:center;letter-spacing:2px;">⚙ 显示设置</div>\n'
    + panelRows
    + '</div>\n';

    var script = ''
    + '<script>\n'
    + '(function(){\n'
    + 'if(window.__mfInstalled) return; window.__mfInstalled = true;\n'
    + 'var dock=document.getElementById("mf-switch-dock");\n'
    + 'var handle=document.getElementById("mf-drag-handle");\n'
    + 'var isDragging=false,startX,startY,startLeft,startTop,hasMoved=false;\n'
    + 'function onStart(e){ if(e.target.closest("#mf-panel"))return; e.preventDefault(); isDragging=true; hasMoved=false; var p=e.touches?e.touches[0]:e; startX=p.clientX; startY=p.clientY; var r=dock.getBoundingClientRect(); startLeft=r.left; startTop=r.top; dock.style.transition="none"; }\n'
    + 'function onMove(e){ if(!isDragging)return; var p=e.touches?e.touches[0]:e; if(Math.abs(p.clientX-startX)>3||Math.abs(p.clientY-startY)>3)hasMoved=true; if(hasMoved){ var nl=Math.max(0,Math.min(window.innerWidth-dock.offsetWidth,startLeft+p.clientX-startX)); var nt=Math.max(0,Math.min(window.innerHeight-dock.offsetHeight,startTop+p.clientY-startY)); dock.style.left=nl+"px"; dock.style.top=nt+"px"; dock.style.right="auto"; dock.style.transform="none"; } }\n'
    + 'function onEnd(e){ if(!isDragging)return; isDragging=false; dock.style.transition=""; if(!hasMoved){ document.getElementById("mf-panel").classList.toggle("open"); } }\n'
    + 'handle.addEventListener("mousedown",onStart); handle.addEventListener("touchstart",onStart,{passive:false});\n'
    + 'document.addEventListener("mousemove",onMove); document.addEventListener("touchmove",onMove,{passive:false});\n'
    + 'document.addEventListener("mouseup",onEnd); document.addEventListener("touchend",onEnd);\n'
    + (showThemeToggle ? 'var themeEnabled=true; function applyTheme(){ var el=document.getElementById("gc-theme-style"); if(el)el.disabled=!themeEnabled; var t=document.getElementById("mf-toggle-theme"); if(t)t.classList.toggle("active",themeEnabled); } window.mfToggleTheme=function(){ themeEnabled=!themeEnabled; applyTheme(); }; applyTheme();\n' : '')
    + (showFontToggle ? 'var fontEnabled=true; function applyFont(){ var root=document.documentElement; if(fontEnabled){ root.style.setProperty("--font-body","' + fontStack + '"); root.style.setProperty("--font-tilt","' + italic + '"); } else { root.style.setProperty("--font-body","\'Hiragino Sans\',\'Yu Gothic\',\'Noto Sans SC\',sans-serif"); root.style.setProperty("--font-tilt","normal"); } var t=document.getElementById("mf-toggle-font"); if(t)t.classList.toggle("active",fontEnabled); } window.mfToggleFont=function(){ fontEnabled=!fontEnabled; applyFont(); }; applyFont();\n' : '')
    + 'document.addEventListener("click", function(e){ if(!e.target.closest("#mf-panel") && !e.target.closest("#mf-switch-dock")){ var p=document.getElementById("mf-panel"); if(p)p.classList.remove("open"); } });\n'
    + '})();\n'
    + '<\/script>\n';

    return css + dockCss + html + script;
  }

  function updateCharCount(){
    var code = buildCode();
    var el = $('charCount');
    el.textContent = code.length;
    el.style.color = code.length > 20000 ? '#ff6b6b' : '';
  }

  $('genBtn').addEventListener('click', function(){
    var code = buildCode();
    var marker = '<[' + ($('markerName').value.trim() || 'MF_THEME') + ']>';
    var scriptName = $('scriptName').value.trim() || '全局美化-自定义主题';
    var payload = {
      pageDepth: 2,
      statusbar: marker,
      beginning: "",
      regex_scripts: [
        { id: -1, scriptName: scriptName, findRegex: marker, replaceString: code }
      ]
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '美化主题_' + scriptName.replace(/[^\w\u4e00-\u9fa5]/g,'') + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  updatePreview();
})();
</script>
</body>
</html>

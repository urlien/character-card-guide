<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>状态栏生成器</title>
<style>
  :root{
    --ui-bg:#141210; --ui-panel:#1c1a17; --ui-card:#242119;
    --ui-line:rgba(200,150,120,0.18); --ui-accent:#c89578; --ui-accent2:#d4a878;
    --ui-text:#e8ded2; --ui-sub:#8c7a6a; --ui-input:#100f0d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--ui-bg); color:var(--ui-text);
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
    min-height:100vh;
  }
  header{
    padding:22px 24px 16px; border-bottom:1px solid var(--ui-line);
    display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  }
  header h1{ font-size:19px; margin:0; letter-spacing:1px; color:var(--ui-accent2); }
  header p{ margin:0; font-size:12.5px; color:var(--ui-sub); }

  .layout{ display:grid; grid-template-columns: 430px 1fr; }
  @media (max-width: 900px){ .layout{ grid-template-columns: 1fr; } }

  .controls{ padding:20px; border-right:1px solid var(--ui-line); overflow-y:auto; max-height:calc(100vh - 150px); }
  @media (max-width: 900px){ .controls{ border-right:none; border-bottom:1px solid var(--ui-line); max-height:none; } }

  .section{ margin-bottom:24px; }
  .section-title{
    font-size:12px; color:var(--ui-accent); letter-spacing:2px; font-weight:bold;
    margin-bottom:10px; text-transform:uppercase; opacity:.85; display:flex; justify-content:space-between; align-items:center;
  }
  .section-title small{ color:var(--ui-sub); letter-spacing:0; text-transform:none; font-weight:normal; font-size:10.5px; }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:9px; }
  .row label{ font-size:12.5px; color:var(--ui-text); flex-shrink:0; }
  .colorpair{ display:flex; gap:6px; align-items:center; }

  input[type=color]{ width:34px; height:26px; border:1px solid var(--ui-line); border-radius:6px; background:none; padding:0; cursor:pointer; }
  input[type=text], input[type=number]{
    background:var(--ui-input); border:1px solid var(--ui-line); color:var(--ui-text);
    border-radius:6px; padding:6px 8px; font-size:12.5px;
  }
  select{ background:var(--ui-input); border:1px solid var(--ui-line); color:var(--ui-text); border-radius:6px; padding:6px 8px; font-size:12.5px; }

  .segmented{ display:flex; gap:6px; }
  .segmented button{
    flex:1; padding:6px 4px; font-size:11px; background:var(--ui-input);
    border:1px solid var(--ui-line); color:var(--ui-sub); border-radius:6px; cursor:pointer; white-space:nowrap;
  }
  .segmented button.active{ background:rgba(200,150,120,0.25); color:var(--ui-accent2); border-color:var(--ui-accent); }

  .field-row{
    background:var(--ui-input); border:1px solid var(--ui-line); border-radius:8px; padding:6px; margin-bottom:8px;
  }
  .field-row .fr-line{ display:grid; grid-template-columns: 34px 1fr 24px; gap:6px; align-items:center; }
  .field-row .fr-line2{ display:grid; grid-template-columns: 1fr 1fr 52px; gap:6px; align-items:center; margin-top:6px; }
  .field-row input[type=text]{ width:100%; }
  .field-row select{ width:100%; padding:6px 4px; font-size:10.5px; }
  .field-row input[type=number]{ width:100%; }
  .field-row .rm{ background:none; border:none; color:#c96; cursor:pointer; font-size:15px; }
  .add-field-btn{
    width:100%; padding:8px; background:transparent; border:1px dashed var(--ui-line); color:var(--ui-sub);
    border-radius:8px; cursor:pointer; font-size:12px; margin-top:4px;
  }
  .add-field-btn:hover{ border-color:var(--ui-accent); color:var(--ui-accent2); }

  .preview{ padding:24px; display:flex; align-items:center; justify-content:center; }
  .phone{
    width:340px; border-radius:22px; border:6px solid #050403; background:#1a1815;
    padding:16px; box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  .p-root{ font-family:sans-serif; }
  .p-card{ border-radius:12px; padding:16px; box-shadow:0 4px 16px rgba(0,0,0,.5); }
  .p-title{ font-size:12px; font-weight:bold; margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid rgba(200,150,120,.25); }
  .p-summary{ font-size:11px; line-height:1.6; margin-bottom:10px; opacity:.85; }
  .p-grid{ display:grid; gap:8px 14px; margin-bottom:6px; }
  .p-field{ font-size:10.5px; }
  .p-field-label{ display:flex; justify-content:space-between; margin-bottom:3px; }
  .p-bar{ width:100%; height:8px; border-radius:4px; overflow:hidden; }
  .p-fill{ height:100%; border-radius:4px; }
  .p-text-line{ display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dotted rgba(200,150,120,.12); }
  .p-chip{ display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:20px; font-size:10px; margin:2px 4px 2px 0; }
  .p-options{ display:grid; gap:8px; margin-top:10px; }
  .p-opt{ padding:11px 10px; border-radius:10px; font-size:11px; text-align:center; line-height:1.5; }

  .generate-bar{
    padding:16px 24px; border-top:1px solid var(--ui-line); display:flex; align-items:center;
    justify-content:space-between; gap:14px; flex-wrap:wrap; background:var(--ui-panel);
  }
  .char-count{ font-size:12px; color:var(--ui-sub); }
  .char-count b{ color:var(--ui-accent2); }
  .btns{ display:flex; gap:10px; flex-wrap:wrap; }
  button.main{
    background:linear-gradient(145deg,#5a4035,#3a2520); color:#e8d8c8; border:1px solid var(--ui-accent);
    padding:11px 22px; border-radius:8px; font-size:13.5px; font-weight:bold; letter-spacing:.5px; cursor:pointer;
  }
  button.main:hover{ background:linear-gradient(145deg,#6a5040,#4a3530); }
  button.secondary{
    background:transparent; color:var(--ui-accent2); border:1px solid var(--ui-line);
    padding:11px 18px; border-radius:8px; font-size:13px; cursor:pointer;
  }
  button.secondary:hover{ border-color:var(--ui-accent); }
  .footnote{ font-size:11px; color:var(--ui-sub); max-width:440px; }

  /* ---- 弹窗（AI输出规则文本 / 复制） ---- */
  .modal-mask{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:9999;
  }
  .modal-mask.open{ display:flex; }
  .modal-box{
    width:min(640px, 92vw); max-height:80vh; background:var(--ui-panel); border:1px solid var(--ui-line);
    border-radius:12px; padding:18px; display:flex; flex-direction:column; gap:10px;
  }
  .modal-box h3{ margin:0; font-size:15px; color:var(--ui-accent2); }
  .modal-box textarea{
    flex:1; min-height:340px; background:var(--ui-input); border:1px solid var(--ui-line); color:var(--ui-text);
    border-radius:8px; padding:12px; font-size:12px; line-height:1.7; resize:vertical; font-family:inherit;
  }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; }
  .copy-tip{ font-size:11.5px; color:var(--ui-sub); }
</style>
</head>
<body>

<header>
  <h1>📊 状态栏生成器</h1>
  <p>配置数据字段、配色和布局，生成三段正则 JSON，AI 输出规则可直接复制粘贴</p>
</header>

<div class="layout">
  <div class="controls">

    <div class="section">
      <div class="section-title">卡片配色</div>
      <div class="row">
        <label>卡片背景</label>
        <div class="colorpair">
          <input type="color" id="c_cardBg" value="#2a2724">
          <input type="color" id="c_cardBg2" value="#1c1815" style="display:none">
          <div class="segmented" style="width:96px">
            <button data-target="cardBg" data-mode="solid" class="active">纯色</button>
            <button data-target="cardBg" data-mode="gradient">渐变</button>
          </div>
        </div>
      </div>
      <div class="row"><label>卡片边框</label><input type="color" id="c_cardBorder" value="#c89578"></div>
      <div class="row"><label>标题/图标色</label><input type="color" id="c_title" value="#c89578"></div>
      <div class="row"><label>正文文字色</label><input type="color" id="c_text" value="#c8c0b8"></div>
      <div class="row"><label>次要文字色</label><input type="color" id="c_sub" value="#8c7a6a"></div>
      <div class="row"><label>进度条底色</label><input type="color" id="c_barBg" value="#3c281e"></div>
      <div class="row"><label>进度条渐变①</label><input type="color" id="c_fill1" value="#5a4035"></div>
      <div class="row"><label>进度条渐变②</label><input type="color" id="c_fill2" value="#c89578"></div>
      <div class="row"><label>标签徽章底色</label><input type="color" id="c_chipBg" value="#5a4035"></div>
      <div class="row"><label>标签徽章文字</label><input type="color" id="c_chipText" value="#e8d8c8"></div>
    </div>

    <div class="section">
      <div class="section-title">选项按钮配色 & 布局</div>
      <div class="row">
        <label>按钮背景</label>
        <div class="colorpair">
          <input type="color" id="c_optBg" value="#332a22">
          <input type="color" id="c_optBg2" value="#241d17" style="display:none">
          <div class="segmented" style="width:96px">
            <button data-target="optBg" data-mode="solid" class="active">纯色</button>
            <button data-target="optBg" data-mode="gradient">渐变</button>
          </div>
        </div>
      </div>
      <div class="row"><label>按钮文字色</label><input type="color" id="c_optText" value="#c8c0b8"></div>
      <div class="row">
        <label>按钮布局<span style="display:block;font-size:10px;color:var(--ui-sub)">选项文字较长时建议选1列</span></label>
        <div class="segmented" style="width:120px">
          <button data-optcols="1">1列（宽）</button>
          <button data-optcols="2" class="active">2列</button>
        </div>
      </div>
      <div class="row">
        <label>选项数量</label>
        <div class="segmented" style="width:140px">
          <button data-optn="2">2个</button>
          <button data-optn="4" class="active">4个</button>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">数据网格布局</div>
      <div class="row">
        <label>数据字段每行列数</label>
        <div class="segmented" style="width:120px">
          <button data-cols="1">1列</button>
          <button data-cols="2" class="active">2列</button>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">数据字段 <small>决定卡片里显示哪些数值</small></div>
      <div id="fieldsList"></div>
      <button class="add-field-btn" id="addFieldBtn">+ 添加字段</button>
    </div>

    <div class="section">
      <div class="section-title">固定内容 <small>始终支持，不用配置</small></div>
      <div class="row"><label>标题字段名</label><input type="text" id="nameKey" value="姓名" style="width:110px"></div>
      <div class="row"><label>标题图标</label><input type="text" id="nameIcon" value="👤" style="width:110px"></div>
      <div class="row"><label>剧情概括字段名</label><input type="text" id="summaryKey" value="本段概括" style="width:110px"></div>
    </div>

  </div>

  <div class="preview">
    <div class="phone">
      <div class="p-root">
        <div class="p-card" id="pvCard">
          <div class="p-title" id="pvTitle">👤 小明</div>
          <div class="p-grid" id="pvGrid"></div>
          <div id="pvChips"></div>
          <div class="p-summary" id="pvSummary">小明来到异世界的第一天，在镇外遭遇了史莱姆，剧情概括会显示在这里。</div>
          <div class="p-options" id="pvOptions"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="generate-bar">
  <div class="footnote">导入方式：功能栏 → 正则脚本 → 依次导入三条（正则1数据隐藏 / 正则2触发 / 正则3引擎）。AI 输出规则点"查看/复制"后直接粘贴进角色人设或世界书。</div>
  <div class="char-count">正则3长度约 <b id="charCount">0</b> 字符（上限 20000）</div>
  <div class="btns">
    <button class="secondary" id="genRuleBtn">📋 查看 / 复制 AI 输出规则</button>
    <button class="main" id="genBtn">✨ 生成正则 JSON</button>
  </div>
</div>

<div class="modal-mask" id="ruleModal">
  <div class="modal-box">
    <h3>AI 输出规则（直接全选复制，粘贴进角色人设或世界书）</h3>
    <textarea id="ruleTextarea" readonly></textarea>
    <div class="modal-actions">
      <span class="copy-tip" id="copyTip"></span>
      <button class="secondary" id="closeModalBtn">关闭</button>
      <button class="main" id="copyBtn">📋 一键复制</button>
    </div>
  </div>
</div>

<script>
(function(){
  var cols = 2;
  var optCols = 2;
  var optN = 4;
  var cardBgMode = 'solid';
  var optBgMode = 'solid';
  var fields = [
    { key:'当前位置', icon:'📍', type:'text', category:'basic' },
    { key:'阵营', icon:'🏳️', type:'chip', category:'basic' },
    { key:'生命值', icon:'❤️', type:'progress', max:100, category:'core' },
    { key:'金币', icon:'💰', type:'text', category:'core' },
    { key:'生命值变化', icon:'💥', type:'text', category:'change' }
  ];

  function $(id){ return document.getElementById(id); }

  // ---------- 字段管理 UI ----------
  function renderFieldsList(){
    var list = $('fieldsList');
    list.innerHTML = '';
    fields.forEach(function(f, idx){
      var row = document.createElement('div');
      row.className = 'field-row';
      row.innerHTML =
        '<div class="fr-line">' +
          '<input type="text" data-idx="'+idx+'" data-role="icon" value="'+f.icon+'" placeholder="🔥">' +
          '<input type="text" data-idx="'+idx+'" data-role="key" value="'+f.key+'" placeholder="字段名">' +
          '<button class="rm" data-idx="'+idx+'">×</button>' +
        '</div>' +
        '<div class="fr-line2">' +
          '<select data-idx="'+idx+'" data-role="type">' +
            '<option value="progress"'+(f.type==='progress'?' selected':'')+'>进度条</option>' +
            '<option value="text"'+(f.type==='text'?' selected':'')+'>纯文本</option>' +
            '<option value="chip"'+(f.type==='chip'?' selected':'')+'>标签徽章</option>' +
          '</select>' +
          '<select data-idx="'+idx+'" data-role="category">' +
            '<option value="basic"'+(f.category==='basic'?' selected':'')+'>基本信息</option>' +
            '<option value="core"'+(f.category==='core'||!f.category?' selected':'')+'>核心数值</option>' +
            '<option value="change"'+(f.category==='change'?' selected':'')+'>变化类</option>' +
          '</select>' +
          '<input type="number" data-idx="'+idx+'" data-role="max" value="'+(f.max||100)+'" style="display:'+(f.type==='progress'?'block':'none')+'">' +
        '</div>';
      list.appendChild(row);
    });

    list.querySelectorAll('input,select').forEach(function(el){
      el.addEventListener('input', function(){
        var idx = +el.dataset.idx, role = el.dataset.role;
        if(role==='icon') fields[idx].icon = el.value;
        if(role==='key') fields[idx].key = el.value;
        if(role==='max') fields[idx].max = +el.value || 100;
        if(role==='category') fields[idx].category = el.value;
        if(role==='type'){
          fields[idx].type = el.value;
          renderFieldsList();
        }
        updatePreview();
      });
    });
    list.querySelectorAll('.rm').forEach(function(btn){
      btn.addEventListener('click', function(){
        fields.splice(+btn.dataset.idx, 1);
        renderFieldsList();
        updatePreview();
      });
    });
  }

  $('addFieldBtn').addEventListener('click', function(){
    fields.push({ key:'新字段'+(fields.length+1), icon:'✨', type:'text' });
    renderFieldsList();
    updatePreview();
  });

  // ---------- 分段按钮（列数 / 选项数 / 渐变开关） ----------
  document.querySelectorAll('.segmented').forEach(function(seg){
    seg.querySelectorAll('button').forEach(function(btn){
      btn.addEventListener('click', function(){
        seg.querySelectorAll('button').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        if(btn.dataset.cols) cols = +btn.dataset.cols;
        if(btn.dataset.optn) optN = +btn.dataset.optn;
        if(btn.dataset.optcols) optCols = +btn.dataset.optcols;
        if(btn.dataset.target){
          var target = btn.dataset.target, mode = btn.dataset.mode;
          if(target === 'cardBg'){ cardBgMode = mode; $('c_cardBg2').style.display = mode==='gradient' ? 'inline-block' : 'none'; }
          if(target === 'optBg'){ optBgMode = mode; $('c_optBg2').style.display = mode==='gradient' ? 'inline-block' : 'none'; }
        }
        updatePreview();
      });
    });
  });

  // ---------- 颜色/文本 变化实时预览 ----------
  ['c_cardBg','c_cardBg2','c_cardBorder','c_title','c_text','c_sub','c_barBg','c_fill1','c_fill2',
   'c_optBg','c_optBg2','c_optText','c_chipBg','c_chipText','nameKey','nameIcon','summaryKey']
    .forEach(function(id){ $(id).addEventListener('input', updatePreview); });

  function bgCSS(mode, c1, c2){
    return mode === 'gradient' ? 'linear-gradient(135deg,' + c1 + ',' + c2 + ')' : c1;
  }

  // ---------- 实时预览渲染 ----------
  function updatePreview(){
    var cardBg=$('c_cardBg').value, cardBg2=$('c_cardBg2').value, cardBorder=$('c_cardBorder').value, title=$('c_title').value;
    var text=$('c_text').value, sub=$('c_sub').value, barBg=$('c_barBg').value;
    var fill1=$('c_fill1').value, fill2=$('c_fill2').value;
    var optBg=$('c_optBg').value, optBg2=$('c_optBg2').value, optText=$('c_optText').value;
    var chipBg=$('c_chipBg').value, chipText=$('c_chipText').value;

    var card = $('pvCard');
    card.style.background = bgCSS(cardBgMode, cardBg, cardBg2);
    card.style.border = '1px solid ' + cardBorder + '66';
    card.style.color = text;

    $('pvTitle').textContent = ($('nameIcon').value || '👤') + ' 小明';
    $('pvTitle').style.color = title;
    $('pvTitle').style.borderBottomColor = cardBorder + '40';

    $('pvSummary').style.color = text;

    var grid = $('pvGrid');
    grid.style.gridTemplateColumns = cols === 1 ? '1fr' : '1fr 1fr';
    grid.innerHTML = '';
    var chipsWrap = $('pvChips');
    chipsWrap.innerHTML = '';

    fields.forEach(function(f){
      if(f.type === 'progress'){
        var wrap = document.createElement('div'); wrap.className = 'p-field';
        var val = Math.round((f.max||100) * 0.7);
        wrap.innerHTML =
          '<div class="p-field-label" style="color:'+sub+'"><span>'+f.icon+' '+f.key+'</span><span>'+val+'/'+(f.max||100)+'</span></div>' +
          '<div class="p-bar" style="background:'+barBg+'"><div class="p-fill" style="width:70%;background:linear-gradient(90deg,'+fill1+','+fill2+')"></div></div>';
        grid.appendChild(wrap);
      } else if(f.type === 'chip'){
        var chip = document.createElement('span'); chip.className = 'p-chip';
        chip.style.background = chipBg; chip.style.color = chipText;
        chip.textContent = f.icon + ' ' + f.key + '：示例';
        chipsWrap.appendChild(chip);
      } else {
        var line = document.createElement('div'); line.className = 'p-text-line'; line.style.color = text;
        line.innerHTML = '<span style="color:'+sub+'">'+f.icon+' '+f.key+'</span><span>示例值</span>';
        grid.appendChild(line);
      }
    });

    var opts = $('pvOptions');
    opts.innerHTML = '';
    opts.style.gridTemplateColumns = optCols === 1 ? '1fr' : '1fr 1fr';
    var sampleTexts = ['讨伐史莱姆','回镇休息','查看地图','与同伴交谈'];
    for(var i=1;i<=optN;i++){
      var b = document.createElement('div'); b.className = 'p-opt';
      b.style.background = bgCSS(optBgMode, optBg, optBg2);
      b.style.color = optText; b.style.border = '1px solid ' + cardBorder + '4d';
      b.textContent = sampleTexts[i-1] || ('选项'+i);
      opts.appendChild(b);
    }

    updateCharCount();
  }

  // ---------- 生成正则3引擎代码 ----------
  function buildEngineCode(){
    var cardBg=$('c_cardBg').value, cardBg2=$('c_cardBg2').value, cardBorder=$('c_cardBorder').value, title=$('c_title').value;
    var text=$('c_text').value, sub=$('c_sub').value, barBg=$('c_barBg').value;
    var fill1=$('c_fill1').value, fill2=$('c_fill2').value;
    var optBg=$('c_optBg').value, optBg2=$('c_optBg2').value, optText=$('c_optText').value;
    var chipBg=$('c_chipBg').value, chipText=$('c_chipText').value;
    var nameKey = $('nameKey').value.trim() || '姓名';
    var summaryKey = $('summaryKey').value.trim() || '本段概括';
    var gridCols = cols === 1 ? '1fr' : '1fr 1fr';
    var optGridCols = optCols === 1 ? '1fr' : '1fr 1fr';
    var cardBgCSS = bgCSS(cardBgMode, cardBg, cardBg2);
    var optBgCSS = bgCSS(optBgMode, optBg, optBg2);

    var fieldsJS = JSON.stringify(fields.map(function(f){
      return { key:f.key, icon:f.icon, type:f.type, max: f.type==='progress' ? (f.max||100) : undefined };
    }));

    var style = ''
    + '<style>\n'
    + 'gc-live-widget{display:block;width:100%;margin:0;padding:0}\n'
    + '.content:has(gc-live-widget){height:auto!important;min-height:0!important;max-height:none!important}\n'
    + '</style>\n';

    var script = ''
    + '<script>\n'
    + 'if(!window.__GCLiveDefined){\n'
    + 'window.__GCLiveDefined=true;\n'
    + 'const GC_FIELDS=' + fieldsJS + ';\n'
    + 'const GC_NAME_KEY=' + JSON.stringify(nameKey) + ';\n'
    + 'const GC_SUMMARY_KEY=' + JSON.stringify(summaryKey) + ';\n'
    + 'const GC_STYLE=`<style>\n'
    + '.root{color:' + text + ';font-family:sans-serif;box-sizing:border-box;padding:4px;background:transparent}\n'
    + '.gc-card{background:' + cardBgCSS + ';border:1px solid ' + cardBorder + '66;border-radius:12px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,0.5)}\n'
    + '.gc-section-title{font-size:12px;color:' + title + ';font-weight:bold;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid ' + cardBorder + '40}\n'
    + '.gc-summary{font-size:11px;line-height:1.6;margin-bottom:10px;opacity:.85;color:' + text + '}\n'
    + '.gc-data-grid{display:grid;grid-template-columns:' + gridCols + ';gap:8px 14px;margin-bottom:6px}\n'
    + '.gc-data-item{display:flex;justify-content:space-between;font-size:10.5px;padding:3px 0;border-bottom:1px dotted ' + cardBorder + '20;color:' + text + '}\n'
    + '.gc-progress-wrap{margin:0}\n'
    + '.gc-progress-label{display:flex;justify-content:space-between;font-size:10px;color:' + sub + ';margin-bottom:3px}\n'
    + '.gc-progress-bar{width:100%;height:8px;background:' + barBg + ';border-radius:4px;overflow:hidden}\n'
    + '.gc-progress-fill{height:100%;background:linear-gradient(90deg,' + fill1 + ',' + fill2 + ');border-radius:4px;transition:width 0.5s ease}\n'
    + '.gc-chips{margin-bottom:8px}\n'
    + '.gc-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:10px;margin:2px 4px 2px 0;background:' + chipBg + ';color:' + chipText + '}\n'
    + '.gc-options{display:grid;grid-template-columns:' + optGridCols + ';gap:8px;margin-top:10px}\n'
    + '.gc-opt-btn{padding:12px 10px;background:' + optBgCSS + ';border:1px solid ' + cardBorder + '4d;border-radius:10px;font-size:11px;line-height:1.5;color:' + optText + ';cursor:pointer;text-align:center;min-height:42px;display:flex;align-items:center;justify-content:center;word-break:break-word;white-space:normal}\n'
    + '.gc-opt-btn:hover{background:' + cardBorder + '33;border-color:' + cardBorder + ';color:' + title + '}\n'
    + '</style>`;\n'
    + 'class GCLiveWidget extends HTMLElement{\n'
    + 'constructor(){super();this.attachShadow({mode:"open"});this.timers=[];}\n'
    + 'connectedCallback(){if(this.rendered)return;this.rendered=true;const kv=this.extractData();this.renderUI(kv);this.cleanResidual();}\n'
    + 'disconnectedCallback(){this.timers.forEach(t=>clearInterval(t));}\n'
    + 'extractData(){const kv={};const re=/\\[#([^=\\[\\]#]+)=([^\\[\\]#]+)#\\]\\s*/g;const container=this.closest(".item,.content,uni-view.content")||this.parentElement;if(container){container.querySelectorAll(".z-live-data").forEach(n=>{re.lastIndex=0;const m=re.exec(n.textContent);if(m)kv[m[1].trim()]=m[2].trim();});}return kv;}\n'
    + 'cleanResidual(){const container=this.closest(".item,.content,uni-view.content")||this.parentElement;if(!container)return;const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(var i=0;i<nodes.length;i++){var n=nodes[i];if(n.textContent.match(/\\[#[^\\]]+#\\]/)){n.textContent=n.textContent.replace(/\\[#[^\\]]+#\\]/g,"");}}}\n'
    + 'renderUI(kv){\n'
    + 'const s=document.createElement("style");s.textContent=GC_STYLE.replace(/<style>|<\\/style>/g,"");this.shadowRoot.appendChild(s);\n'
    + 'const root=document.createElement("div");root.className="root";\n'
    + 'const card=document.createElement("div");card.className="gc-card";\n'
    + 'if(kv[GC_NAME_KEY]){const nameEl=document.createElement("div");nameEl.className="gc-section-title";nameEl.textContent="👤 "+kv[GC_NAME_KEY];card.appendChild(nameEl);}\n'
    + 'const grid=document.createElement("div");grid.className="gc-data-grid";\n'
    + 'const chips=document.createElement("div");chips.className="gc-chips";\n'
    + 'GC_FIELDS.forEach(f=>{\n'
    + 'if(kv[f.key]===undefined)return;\n'
    + 'if(f.type==="progress"){\n'
    + 'const wrap=document.createElement("div");wrap.className="gc-progress-wrap";\n'
    + 'const label=document.createElement("div");label.className="gc-progress-label";\n'
    + 'const val=parseInt(kv[f.key])||0;const max=f.max||100;\n'
    + 'label.innerHTML="<span>"+f.icon+" "+f.key+"</span><span>"+val+"/"+max+"</span>";wrap.appendChild(label);\n'
    + 'const bar=document.createElement("div");bar.className="gc-progress-bar";\n'
    + 'const fill=document.createElement("div");fill.className="gc-progress-fill";\n'
    + 'fill.style.width=Math.max(0,Math.min(val/max*100,100))+"%";\n'
    + 'bar.appendChild(fill);wrap.appendChild(bar);grid.appendChild(wrap);\n'
    + '}else if(f.type==="chip"){\n'
    + 'const chip=document.createElement("span");chip.className="gc-chip";\n'
    + 'chip.textContent=f.icon+" "+kv[f.key];\n'
    + 'chips.appendChild(chip);\n'
    + '}else{\n'
    + 'const item=document.createElement("div");item.className="gc-data-item";\n'
    + 'item.innerHTML="<span>"+f.icon+" "+f.key+"</span><span>"+kv[f.key]+"</span>";\n'
    + 'grid.appendChild(item);\n'
    + '}\n'
    + '});\n'
    + 'if(chips.children.length)card.appendChild(chips);\n'
    + 'if(grid.children.length)card.appendChild(grid);\n'
    + 'if(kv[GC_SUMMARY_KEY]){const sm=document.createElement("div");sm.className="gc-summary";sm.textContent="📖 "+kv[GC_SUMMARY_KEY];card.appendChild(sm);}\n'
    + 'var opts=[];for(var i=1;i<=4;i++){if(kv["选项"+i])opts.push(kv["选项"+i]);}\n'
    + 'if(opts.length){\n'
    + 'const optGrid=document.createElement("div");optGrid.className="gc-options";\n'
    + 'opts.forEach(opt=>{\n'
    + 'var parts=opt.split("|");var btnText=parts[0]?parts[0].trim():opt;var btnValue=parts[1]?parts[1].trim():opt;\n'
    + 'const btn=document.createElement("button");btn.className="gc-opt-btn";btn.textContent=btnText;\n'
    + 'btn.onclick=function(ev){ev.stopPropagation();var ta=document.querySelector(".chatMsgTextarea textarea")||document.querySelector(".chat-input-scope textarea")||document.querySelector("textarea");if(ta){if(ta.value.trim()===""){ta.value=btnValue;}else{ta.value=ta.value+"\\n"+btnValue;}ta.dispatchEvent(new Event("input",{bubbles:true}));}};\n'
    + 'optGrid.appendChild(btn);\n'
    + '});\n'
    + 'card.appendChild(optGrid);\n'
    + '}\n'
    + 'root.appendChild(card);this.shadowRoot.appendChild(root);window.__GC_DATA=kv;\n'
    + '}\n'
    + '}\n'
    + 'customElements.define("gc-live-widget",GCLiveWidget);\n'
    + '}\n'
    + '<\/script>\n';

    return style + script;
  }

  function updateCharCount(){
    var code = buildEngineCode();
    var el = $('charCount');
    el.textContent = code.length;
    el.style.color = code.length > 20000 ? '#ff6b6b' : '';
  }

  // ---------- 生成 AI 输出规则文本（分类表格版，按你给的模板结构，自动填入真实字段） ----------
  function sampleValueFor(f){
    if(f.type === 'progress') return Math.round((f.max||100)*0.85);
    if(f.type === 'chip') return '昭和派';
    if(f.category === 'change') return '被史莱姆撞了一下，-15';
    return '示例值';
  }
  function descFor(f){
    if(f.type === 'progress') return '进度条展示，范围 0-' + (f.max||100) + '，只写纯数字';
    if(f.type === 'chip') return '标签徽章展示，控制在6个字以内';
    if(f.category === 'change') return '简述原因和具体数值变化，无变化可省略整行';
    return '纯文本展示';
  }
  function buildRuleText(){
    var nameKey = $('nameKey').value.trim() || '姓名';
    var summaryKey = $('summaryKey').value.trim() || '本段概括';
    var basicFields = fields.filter(function(f){ return f.category === 'basic'; });
    var coreFields = fields.filter(function(f){ return f.category !== 'basic' && f.category !== 'change'; });
    var changeFields = fields.filter(function(f){ return f.category === 'change'; });

    var lines = [];
    lines.push('AI 输出规则 · 状态栏');
    lines.push('');
    lines.push('一、总则');
    lines.push('');
    lines.push('每轮回复正文结束后，另起一行，先输出锚点 `<GC_UI>`，再逐行输出状态栏数据。');
    lines.push('');
    lines.push('状态栏数据使用 `[#键=值#]` 格式，每行一条。');
    lines.push('');
    lines.push('严禁在 `<GC_UI>` 前后添加任何额外文字、说明、空行。`<GC_UI>` 单独一行，后面紧跟数据行，数据行之间不要空行。');
    lines.push('');
    lines.push('二、字段定义');
    lines.push('');
    lines.push('2.1 基本信息');
    lines.push('');
    lines.push('| 字段 | 格式示例 | 说明 |');
    lines.push('|------|----------|------|');
    lines.push('| ' + nameKey + ' | `[#' + nameKey + '={{user}}#]` | 固定写法 |');
    basicFields.forEach(function(f){
      lines.push('| ' + f.key + ' | `[#' + f.key + '=' + sampleValueFor(f) + '#]` | ' + descFor(f) + ' |');
    });
    lines.push('');
    lines.push('2.2 核心数值');
    lines.push('');
    lines.push('| 字段 | 格式示例 | 说明 |');
    lines.push('|------|----------|------|');
    if(coreFields.length === 0){
      lines.push('| （暂无，可在生成器里添加"核心数值"分类的字段） | | |');
    }
    coreFields.forEach(function(f){
      lines.push('| ' + f.key + ' | `[#' + f.key + '=' + sampleValueFor(f) + '#]` | ' + descFor(f) + ' |');
    });
    lines.push('');
    lines.push('2.3 变化类字段（无变化可省略整行）');
    lines.push('');
    lines.push('| 字段 | 格式示例 | 说明 |');
    lines.push('|------|----------|------|');
    if(changeFields.length === 0){
      lines.push('| （暂无，可在生成器里添加"变化类"分类的字段） | | |');
    }
    changeFields.forEach(function(f){
      lines.push('| ' + f.key + ' | `[#' + f.key + '=做了什么，±数值#]` | ' + descFor(f) + ' |');
    });
    lines.push('');
    lines.push('2.4 概括与选项');
    lines.push('');
    lines.push('| 字段 | 格式示例 | 说明 |');
    lines.push('|------|----------|------|');
    lines.push('| ' + summaryKey + ' | `[#' + summaryKey + '=当前剧情摘要，30-60字#]` | 每轮必出 |');
    lines.push('| 选项{n} | `[#选项1=按钮文字\\|追加到输入框的内容#]` | `\\|` 前简短（≤12字），`\\|` 后详细；共' + optN + '个 |');
    lines.push('');
    lines.push('三、完整范例');
    lines.push('');
    lines.push('```');
    lines.push('正文内容……');
    lines.push('');
    lines.push('<GC_UI>');
    lines.push('[#' + nameKey + '=小明#]');
    basicFields.forEach(function(f){ lines.push('[#' + f.key + '=' + sampleValueFor(f) + '#]'); });
    coreFields.forEach(function(f){ lines.push('[#' + f.key + '=' + sampleValueFor(f) + '#]'); });
    changeFields.forEach(function(f){ lines.push('[#' + f.key + '=' + sampleValueFor(f) + '#]'); });
    lines.push('[#' + summaryKey + '=小明来到异世界的第一天，在镇外遭遇了史莱姆。#]');
    var sampleOpts = [
      '[#选项1=讨伐史莱姆|拔出木剑，冲向那只散发着粘液光泽的史莱姆，展开殊死搏斗#]',
      '[#选项2=回镇休息|掉头跑回镇子，先找个旅店休息一下，顺便打听打听最近的消息#]',
      '[#选项3=查看地图|停下脚步，展开随身携带的地图，仔细研究接下来的路线#]',
      '[#选项4=与同伴交谈|转身找到身旁的同伴，想听听他对眼前局势的看法#]'
    ];
    for(var j=0;j<optN;j++){ lines.push(sampleOpts[j]); }
    lines.push('```');
    lines.push('');
    lines.push('四、关键提醒');
    lines.push('');
    lines.push('1. 键值内禁止出现方括号 [ ]，否则正则匹配断裂，状态栏渲染失败');
    lines.push('2. <GC_UI> 必须单独一行，前后不能有任何其他文字');
    lines.push('3. 数据行之间不能有空行，必须紧密相连');
    lines.push('4. 每个变化字段必须简述原因和具体数值变化，不能只写数字');
    lines.push('5. 百分比数值只写数字不带百分号');
    lines.push('6. 选项使用竖杠 | 分隔：左边按钮文字≤12字，右边是追加内容；这是最容易出错的地方，按钮文字绝不能写成长句');
    lines.push('7. 本段概括每轮必出，30-60字');
    lines.push('8. 数值字段每轮根据剧情重新计算');
    lines.push('9. 变化类字段在数据无变化时可省略整行，不必输出"无变化"');
    lines.push('10. 字段顺序建议按"基本信息→核心数值→变化→概括→选项"排列，但非强制');
    lines.push('11. 引擎只关心 [#键=值#] 的格式是否规范，不关心键名和值的内容是什么');
    return lines.join('\n');
  }

  function download(filename, content, mime){
    var blob = new Blob([content], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------- AI 输出规则：改为弹窗展示 + 一键复制，不再下载txt ----------
  $('genRuleBtn').addEventListener('click', function(){
    $('ruleTextarea').value = buildRuleText();
    $('ruleModal').classList.add('open');
    $('copyTip').textContent = '';
  });
  $('closeModalBtn').addEventListener('click', function(){
    $('ruleModal').classList.remove('open');
  });
  $('ruleModal').addEventListener('click', function(e){
    if(e.target === $('ruleModal')) $('ruleModal').classList.remove('open');
  });
  $('copyBtn').addEventListener('click', function(){
    var ta = $('ruleTextarea');
    ta.select();
    ta.setSelectionRange(0, 999999);
    var ok = false;
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value);
        ok = true;
      } else {
        ok = document.execCommand('copy');
      }
    }catch(e){
      try{ ok = document.execCommand('copy'); }catch(e2){ ok = false; }
    }
    $('copyTip').textContent = ok ? '✅ 已复制到剪贴板' : '复制失败，请手动全选（Ctrl/Cmd+A）后复制';
  });

  $('genBtn').addEventListener('click', function(){
    var engineCode = buildEngineCode();
    var payload = {
      pageDepth: 2,
      statusbar: "<GC_SCRIPT>",
      beginning: "",
      regex_scripts: [
        {
          id: -1,
          scriptName: "状态栏-数据隐藏层",
          findRegex: "/\\[#([^=\\[\\]#]+)=([^\\[\\]#]+)#\\](?:\\s|<br\\s*\\/?>)*/gi",
          replaceString: "<span class=\"z-live-data\" style=\"display:none\">[#$1=$2#]</span>"
        },
        {
          id: -1,
          scriptName: "状态栏-UI触发层",
          findRegex: "<GC_UI>",
          replaceString: "<style>\ngc-live-widget{display:block;width:100%;margin:0;padding:0}\n.content:has(gc-live-widget){height:auto!important;min-height:0!important;max-height:none!important}\n</style>\n<gc-live-widget></gc-live-widget>"
        },
        {
          id: -1,
          scriptName: "状态栏-核心引擎",
          findRegex: "<GC_SCRIPT>",
          replaceString: engineCode
        }
      ]
    };
    download('状态栏_正则三件套.json', JSON.stringify(payload, null, 2), 'application/json');
  });

  renderFieldsList();
  updatePreview();
})();
</script>

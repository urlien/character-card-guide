<div id="app">
  <header class="topbar">
    <div class="brand-wrap">
      <button class="icon-btn mobile-nav-btn" id="mobileNavBtn" aria-label="打开模块导航">☰</button>
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="brand-copy">
        <strong>MMD UI 编排台</strong>
        <small>新版聊天页 · chatVersion 1</small>
      </div>
    </div>
    <div class="top-status" id="saveStatus"><i></i><span>本地就绪</span></div>
    <div class="top-actions">
      <button class="btn ghost" data-global-action="help">使用说明</button>
      <button class="btn ghost" data-global-action="import">导入项目</button>
      <button class="btn ghost desktop-only" data-global-action="project-export">备份项目</button>
      <button class="btn primary" data-global-action="pack-export"><span>导出正则包</span><b>↓</b></button>
      <button class="icon-btn inspector-toggle" data-global-action="inspector" aria-label="打开预览与检查">◫</button>
    </div>
  </header>

  <div class="workbench">
    <aside class="sidebar" id="sidebar">
      <div class="project-mini">
        <div class="project-badge">NEW PAGE</div>
        <div class="project-name" id="sideProjectName">未命名项目</div>
        <div class="project-meta"><span id="sideRuleCount">15 条规则</span><span id="sideHealth">正在检查</span></div>
      </div>
      <nav class="module-nav" id="moduleNav" aria-label="编辑模块"></nav>
      <div class="sidebar-foot">
        <div class="safe-note"><span>✓</span><p>固定导出新版格式<br>锚点与版本字段受保护</p></div>
        <button class="text-btn" data-global-action="reset">恢复中性示例</button>
      </div>
    </aside>

    <main class="editor" id="editorMain" tabindex="-1"></main>

    <aside class="inspector" id="inspector">
      <div class="inspector-head">
        <div class="inspector-tabs" role="tablist">
          <button class="active" data-inspector-tab="preview">结构预览</button>
          <button data-inspector-tab="check">检查</button>
          <button data-inspector-tab="data">数据</button>
        </div>
        <button class="icon-btn inspector-close" data-global-action="inspector-close" aria-label="关闭预览">×</button>
      </div>
      <div class="inspector-body" id="inspectorBody"></div>
    </aside>
  </div>

  <div class="drawer-shade" id="drawerShade"></div>
  <input type="file" id="projectFile" accept=".json,application/json" hidden>
  <input type="file" id="imageFile" accept="image/*" hidden>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <div class="modal-layer" id="modalLayer" hidden></div>
</div>

function navigate(id){if(!SECTIONS.some(x=>x.id===id))return;state.active=id;state.sidebarOpen=false;syncDrawers();renderNav();renderEditor();renderInspector();}
function applySearchFilters(){Object.entries(state.search).forEach(([kind,q])=>{if(!q)return;const low=q.toLowerCase();if(kind==='bestiary'){editor.querySelectorAll('.repeat-card').forEach(card=>{card.style.display=card.textContent.toLowerCase().includes(low)?'':'none'})}if(kind==='map'){editor.querySelectorAll('[data-filter-text]').forEach(card=>{card.style.display=(card.dataset.filterText||'').includes(low)?'':'none'})}});}
function themePreviewStyle(){const v=state.config.data.theme.vars||{};const m={'--pv-text':'--uix-text','--pv-dim':'--uix-text-dim','--pv-deep':'--uix-bg-deep','--pv-accent':'--uix-accent','--pv-panel':'--uix-panel','--pv-bright':'--uix-text-bright','--pv-muted':'--uix-muted','--pv-panel2':'--uix-panel-2','--pv-bg':'--uix-bg','--pv-panel3':'--uix-panel-3'};return Object.entries(m).map(([a,b])=>a+':'+String(v[b]||'')).join(';');}
function previewOverlay(){const d=state.config.data,active=state.active;if(active==='bestiary'){const cs=(d.bestiary.items||[]).slice(0,6).map(it=>'<div class="pv-card"><div class="pv-card-top"><div class="pv-card-av" style="background:'+attr(it.c||'var(--pv-panel2)')+'">'+h(it.e||String(it.n||'?').slice(0,1))+'</div><div><b>'+h(it.n||'未命名')+'</b><small>'+h(it.t||'')+'</small></div></div><p>'+h(it.d||'暂无介绍')+'</p></div>').join('');return '<div class="pv-overlay"><div class="pv-overlay-hd"><b>人物图鉴</b><small>'+h(d.bestiary.title||'')+' · 关闭 ×</small></div><div class="pv-cards">'+cs+'</div></div>'}
 if(active==='map'){const img=safeUrl(d.map.img);const pins=Object.entries(d.map.areas||{}).map(([k,a])=>'<i class="pv-pin" title="'+attr(a.name||k)+'" style="left:'+Number(a.x||0)+'%;top:'+Number(a.y||0)+'%"></i>').join('');return '<div class="pv-overlay"><div class="pv-overlay-hd"><b>⌖ '+h(d.map.city||'地图')+'地图</b><small>点击光点查看区域 · 关闭 ×</small></div><div class="pv-map">'+(img?'<img src="'+attr(img)+'" alt="">':'')+pins+'</div></div>'}
 if(active==='profile'){const p=d.profile||{},img=safeUrl(p.img),infos=Object.entries(p.info||{}).slice(0,5).map(([k,v])=>'<div><b>'+h(k)+'：</b>'+h(v)+'</div>').join('');return '<div class="pv-overlay"><div class="pv-overlay-hd"><b>主角档案</b><small>关闭 ×</small></div><div class="pv-profile"><div class="pv-profile-img">'+(img?'<img src="'+attr(img)+'" alt="">':'')+'</div><div class="pv-profile-copy"><h4>'+h(p.name||'【你】')+'</h4><small>'+h(p.title||'')+'</small><div class="pv-info">'+infos+'</div></div></div><p style="font-size:7px;line-height:1.6;color:var(--pv-dim)">'+h(p.desc||'')+'</p></div>'}
 if(active==='status'){const s=d.status||{},bars=(s.barFields||[]).map((x,i)=>'<div><div class="pv-bar-head"><span>'+h(x)+'</span><b>'+(i?54:72)+'</b></div><div class="pv-bar"><i style="width:'+(i?54:72)+'%;background:'+attr((s.numColors||{})[x]||'var(--pv-accent)')+'"></i></div></div>').join('');return '<div class="pv-overlay"><div class="pv-overlay-hd"><b>角色状态</b><small>'+h(s.capLoc||'')+' · 关闭 ×</small></div><div class="pv-bars">'+bars+'</div><div class="pv-info" style="margin-top:12px">'+(s.metaFields||[]).slice(0,4).map(x=>'<div><b>'+h(x)+'：</b>—</div>').join('')+'</div></div>'}
 if(active==='helper'){return '<div class="pv-overlay"><div class="pv-overlay-hd"><b>游玩助手</b><small>关闭 ×</small></div><div class="pv-helper-tabs"><span>通用特化</span><span>玩法</span><span>事件</span></div><div class="pv-info">'+(d.helper.spec.general||[]).slice(0,7).map(x=>'<div>'+h(x)+'</div>').join('')+'</div></div>'}
 if(active==='guide'){const s=(d.guide.steps||[])[0]||{};return '<div class="pv-guide"><b>'+h(s.title||'功能向导')+'</b><p>'+h(s.desc||'暂无引导说明')+'</p><div class="pv-guide-foot"><button>跳过引导</button><button>下一步</button></div></div>'}
 if(active==='who'){return '<div class="pv-overlay"><div class="pv-overlay-hd"><b>你是谁</b><small>关闭 ×</small></div><div class="pv-info">'+(d.who.fields||[]).map(f=>'<div><b>'+h(f.k||'字段')+'</b><br><span style="color:var(--pv-muted)">'+h(f.ph||'请输入…')+'</span></div>').join('')+'</div></div>'}
 return '';
}
function renderPreview(){const d=state.config.data,buttons=(d.hud.buttons||[]).filter(b=>!b.module||d.modules[b.module]!==false).map(b=>'<button>'+h(b.label)+'</button>').join('');const intro=stripAnchors(state.config.meta.beginning).replace(/\s+/g,' ').slice(0,150);const choices=['查看门外的来客','调低收音机音量','继续等待下一通电话'];return '<div class="inspector-block"><div class="inspector-label">当前结构 · '+h(sec(state.active).label)+'</div><div class="device-preview" style="'+attr(themePreviewStyle())+'"><div class="pv-screen"><div class="pv-header"><span class="pv-back">‹</span><div class="pv-avatar">M</div><div class="pv-header-copy"><b>'+h(state.config.meta.name||'MMD 角色卡')+'</b><small>新版聊天页</small></div><span class="pv-dots">•••</span></div><div class="pv-toolbar"><strong>'+h(d.hud.title||'功能栏')+'</strong>'+buttons+'</div><div class="pv-messages"><div class="pv-date">今天 · 开场</div><div class="pv-msg"><p>'+h(intro||'开场白会显示在这里。')+'</p></div><div class="pv-status">角色状态 · '+h((d.status&&d.status.capLoc)||'')+'</div><div class="pv-choice">'+(state.active==='choice'?choices.map(x=>'<button>'+h(x)+'</button>').join(''):'')+'</div></div><div class="pv-composer"><div class="pv-input">输入你的行动…</div><div class="pv-send">↑</div></div>'+previewOverlay()+'</div></div><p class="preview-note">结构示意，不执行规则脚本，也不等同于 MMD 真机渲染。</p></div>';
}
function renderInspector(){if(!inspectorBody)return;document.querySelectorAll('[data-inspector-tab]').forEach(x=>x.classList.toggle('active',x.dataset.inspectorTab===state.inspectorTab));const b=getBuild();if(state.inspectorTab==='preview')inspectorBody.innerHTML=renderPreview();else if(state.inspectorTab==='check')inspectorBody.innerHTML='<div class="inspector-stat-grid"><div class="inspector-stat"><small>错误</small><b>'+b.errors.length+'</b></div><div class="inspector-stat"><small>提示</small><b>'+b.warns.length+'</b></div><div class="inspector-stat"><small>规则</small><b>'+b.lengths.length+'</b></div><div class="inspector-stat"><small>总字符</small><b>'+b.total.toLocaleString()+'</b></div></div>'+issueHtml(b)+'<div class="inspector-block" style="margin-top:14px"><div class="inspector-label">规则体积</div><div style="overflow:auto;background:#fff;border:1px solid var(--line);border-radius:9px">'+ruleTable(b)+'</div></div>';else inspectorBody.innerHTML='<div class="row" style="justify-content:space-between;margin-bottom:9px"><div class="inspector-label" style="margin:0">项目配置</div><button class="btn ghost small" data-action="copy-config">复制</button></div><textarea class="inspector-json" readonly>'+h(JSON.stringify(state.config,null,2))+'</textarea>';
}
function syncDrawers(){const sb=$('#sidebar'),ins=$('#inspector'),shade=$('#drawerShade');sb.classList.toggle('open',state.sidebarOpen);ins.classList.toggle('open',state.inspectorOpen);shade.classList.toggle('show',state.sidebarOpen||state.inspectorOpen);}
function listForKind(kind){return getPath(state.config,'data.'+kind);}
const NEW_ITEMS={
 'hud.buttons':()=>({label:'新按钮',fn:'protOpen',module:'profile'}),
 'bestiary.items':()=>({n:'新人物',g:0,t:'身份 · 副标题',e:'新',i:'',c:'linear-gradient(135deg,#315f75,#6cbccc)',d:'人物介绍。'}),
 'status.alias':()=>({std:'新字段',words:['新字段']}),
 'guide.steps':()=>({title:'新引导步骤',desc:'说明这一处功能。'}),
 'who.fields':()=>({k:'新字段',ph:'请输入…',multi:0})
};
function structural(fn,msg){fn();markChanged();renderEditor();refreshChrome();renderInspector();if(msg)toast(msg,'good');}
function doAction(btn){const a=btn.dataset.action;if(a==='collapse'){const k=btn.dataset.key;state.collapsed.has(k)?state.collapsed.delete(k):state.collapsed.add(k);renderEditor();return}
 if(a==='add'){const kind=btn.dataset.kind,arr=listForKind(kind);if(Array.isArray(arr)&&NEW_ITEMS[kind])structural(()=>arr.push(NEW_ITEMS[kind]()),'已添加');return}
 if(a==='delete'||a==='duplicate'||a==='move'){const kind=btn.dataset.kind,arr=listForKind(kind),i=Number(btn.dataset.index);if(!Array.isArray(arr)||!arr[i])return;if(a==='delete')structural(()=>arr.splice(i,1),'已删除');if(a==='duplicate')structural(()=>arr.splice(i+1,0,clone(arr[i])),'已复制');if(a==='move'){const ni=i+Number(btn.dataset.dir);if(ni<0||ni>=arr.length)return;structural(()=>{const x=arr.splice(i,1)[0];arr.splice(ni,0,x)},'已调整顺序')}return}
 if(a==='add-area'){const areas=state.config.data.map.areas||{},base='area';let n=Object.keys(areas).length+1,key=base+n;while(areas[key])key=base+(++n);structural(()=>areas[key]={name:'新区域',x:50,y:50,sub:'区域副标题',lore:'地点说明。',nodes:['节点一']},'已添加地图区域');return}
 if(a==='delete-area'){const key=dec(btn.dataset.key);structural(()=>delete state.config.data.map.areas[key],'已删除地图区域');return}
 if(a==='duplicate-area'){const key=dec(btn.dataset.key),areas=state.config.data.map.areas;let nk=key+'Copy',n=2;while(areas[nk])nk=key+'Copy'+n++;structural(()=>areas[nk]=clone(areas[key]),'已复制地图区域');return}
 if(a==='add-dict'){const path=btn.dataset.path,obj=getPath(state.config,path)||{};let base=btn.dataset.prefix||'新字段',key=base,n=2;while(Object.prototype.hasOwnProperty.call(obj,key))key=base+n++;structural(()=>obj[key]=btn.dataset.value||'','已添加字段');return}
 if(a==='delete-dict'){const obj=getPath(state.config,btn.dataset.path),key=dec(btn.dataset.key);structural(()=>delete obj[key],'已删除字段');return}
 if(a==='theme-preset'){const p=PRESETS[btn.dataset.key];if(p)structural(()=>state.config.data.theme.vars=clone(p.vars),'已套用「'+p.name+'」');return}
 if(a==='theme-reset'){structural(()=>state.config.data.theme=clone(EMBED.defaultConfig.data.theme),'已恢复示例主题');return}
 if(a==='copy-text'){copyText(btn.dataset.text||'');return}
 if(a==='copy-config'){copyText(JSON.stringify(state.config,null,2));return}
}
function inputChanged(el,isChange){
 if(el.dataset.search){state.search[el.dataset.search]=el.value;applySearchFilters();return}
 if(el.dataset.mapKey){let key=dec(el.dataset.mapKey),field=el.dataset.mapField,areas=state.config.data.map.areas||{},area=areas[key];if(!area)return;if(field==='__key'){if(!isChange)return;let nk=String(el.value||'').trim();if(!nk||nk===key)return;if(areas[nk]){toast('区域键已存在','bad');el.value=key;return}const out={};Object.keys(areas).forEach(k=>out[k===key?nk:k]=areas[k]);state.config.data.map.areas=out;markChanged();renderEditor();renderInspector();return}let v=el.dataset.kind==='number'?Number(el.value):el.dataset.kind==='arraylines'?parseLines(el.value):el.value;area[field]=v;if(field==='x'||field==='y')editor.querySelectorAll('[data-map-key="'+el.dataset.mapKey+'"][data-map-field="'+field+'"]').forEach(x=>{if(x!==el)x.value=el.value});markChanged();return}
 if(el.dataset.dictPath){const obj=getPath(state.config,el.dataset.dictPath),key=dec(el.dataset.dictKey);if(!obj)return;if(el.dataset.dictMode==='key'){if(!isChange)return;const nk=String(el.value||'').trim();if(!nk||nk===key)return;if(Object.prototype.hasOwnProperty.call(obj,nk)){toast('字段名已存在','bad');el.value=key;return}const out={};Object.keys(obj).forEach(k=>out[k===key?nk:k]=obj[k]);setPath(state.config,el.dataset.dictPath,out);markChanged();renderEditor();return}else{obj[key]=el.value;markChanged();return}}
 if(!el.dataset.path)return;let v;if(el.dataset.kind==='boolean')v=!!el.checked;else if(el.dataset.kind==='number')v=Number(el.value);else if(el.dataset.kind==='arraylines')v=parseLines(el.value);else if(el.dataset.kind==='intro')v=composeBeginning(el.value);else if(el.dataset.path.endsWith('.multi')&&el.type==='checkbox')v=el.checked?1:0;else v=el.value;setPath(state.config,el.dataset.path,v);
 if(el.dataset.kind==='color'||el.dataset.kind==='color-text')editor.querySelectorAll('[data-path="'+el.dataset.path.replace(/"/g,'\\"')+'"]').forEach(x=>{if(x!==el&&(/^#[0-9a-f]{6}$/i.test(v)||x.type!=='color'))x.value=v});
 markChanged();
}
function download(name,text,type){const blob=new Blob([text],{type:type||'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function filenameBase(){return String(state.config.meta.name||'mmd-ui').trim().replace(/[\\/:*?"<>|\s]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)||'mmd-ui';}
function exportPack(){const b=getBuild(true);if(b.errors.length){navigate('export');toast('有 '+b.errors.length+' 个错误，修复后才能导出','bad');return}download(filenameBase()+'-regex.json',JSON.stringify(b.pack,null,2));toast('已生成新版导入正则包','good');}
function exportProject(){const box={_uixEditor:{format:'mmd-ui-web-project',version:1,appVersion:VERSION,exportedAt:new Date().toISOString()},config:state.config};download(filenameBase()+'-project.json',JSON.stringify(box,null,2));toast('项目备份已下载','good');}
function copyText(text){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast('已复制','good')).catch(()=>fallbackCopy(text));else fallbackCopy(text);}
function fallbackCopy(text){const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('已复制','good')}catch(e){toast('复制失败，请手动选择','bad')}t.remove();}
function toast(title,type,detail){const el=document.createElement('div');el.className='toast '+(type||'');el.innerHTML='<span>'+(type==='bad'?'×':type==='warn'?'!':'✓')+'</span><div><b>'+h(title)+'</b>'+(detail?'<p>'+h(detail)+'</p>':'')+'</div>';$('#toastStack').appendChild(el);setTimeout(()=>el.remove(),3200);}
function openModal(title,body,buttons){modalLayer.hidden=false;modalLayer.innerHTML='<div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>'+h(title)+'</h2><button class="icon-btn" data-modal-action="close">×</button></div><div class="modal-body">'+body+'</div><div class="modal-foot">'+(buttons||'<button class="btn primary" data-modal-action="close">知道了</button>')+'</div></div>';}
function closeModal(){modalLayer.hidden=true;modalLayer.innerHTML='';}
function showHelp(){openModal('使用说明','<h3>最短流程</h3><ol><li>从左侧选择模块，编辑结构化字段。</li><li>在“检查与导出”确认没有错误。</li><li>下载“导入正则包”，到 MMD 创卡页导入。</li><li>同时下载“项目备份”，以后用本页继续修改。</li></ol><h3>两个 JSON 不一样</h3><p><strong>*-regex.json</strong> 是给 MMD 导入的完整 15 条规则包；<strong>*-project.json</strong> 是给本编辑器回读的结构化配置。</p><h3>新版注意</h3><p>必须走新建卡，并在首次保存前选择“使用新版聊天页”。创卡页预览缺少完整 SDK，请回聊天页验收。</p><h3>隐私</h3><p>编辑、构建与检查都在当前浏览器本地完成，不会上传配置或图片地址。</p>');}
function handleGlobal(a){if(a==='help')showHelp();else if(a==='import'){projectFile.value='';projectFile.click()}else if(a==='project-export')exportProject();else if(a==='pack-export')exportPack();else if(a==='reset')openModal('恢复中性示例','<p>这会覆盖当前编辑内容。若要保留，请先下载项目备份。</p>','<button class="btn ghost" data-modal-action="close">取消</button><button class="btn danger" data-modal-action="reset-confirm">确认恢复</button>');else if(a==='inspector'){state.inspectorOpen=!state.inspectorOpen;state.sidebarOpen=false;syncDrawers()}else if(a==='inspector-close'){state.inspectorOpen=false;syncDrawers()}}
function importProject(file){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(String(r.result||''));let c;if(x&&x._uixEditor&&x.config)c=x.config;else if(x&&x.meta&&x.data)c=x;else if(x&&x.regex_scripts)throw new Error('这是导入正则包，不是项目备份。请导入 *-project.json 或 config/*.json。');else throw new Error('无法识别项目结构');state.config=hydrate(c);state.build=null;saveLocal();navigate('overview');toast('项目已导入','good')}catch(e){openModal('导入失败','<div class="notice bad"><span class="notice-icon">×</span><div>'+h(e.message||'JSON 无法读取')+'</div></div><p>支持本编辑器导出的 <span class="mono">*-project.json</span>，也支持工具包的 <span class="mono">config/*.json</span>。</p>')}};r.onerror=()=>toast('文件读取失败','bad');r.readAsText(file,'utf-8');}
nav.addEventListener('click',e=>{const b=e.target.closest('[data-section]');if(b)navigate(b.dataset.section)});
editor.addEventListener('click',e=>{const s=e.target.closest('[data-section]');if(s){navigate(s.dataset.section);return}const g=e.target.closest('[data-global-action]');if(g){handleGlobal(g.dataset.globalAction);return}const b=e.target.closest('[data-action]');if(b)doAction(b)});
editor.addEventListener('input',e=>inputChanged(e.target,false));editor.addEventListener('change',e=>inputChanged(e.target,true));
document.addEventListener('click',e=>{const g=e.target.closest('[data-global-action]');if(g&&!editor.contains(g)){handleGlobal(g.dataset.globalAction);return}const t=e.target.closest('[data-inspector-tab]');if(t){state.inspectorTab=t.dataset.inspectorTab;renderInspector();return}const ma=e.target.closest('[data-modal-action]');if(ma){if(ma.dataset.modalAction==='close')closeModal();if(ma.dataset.modalAction==='reset-confirm'){state.config=hydrate(EMBED.defaultConfig);state.build=null;clearLocal();saveLocal();closeModal();navigate('overview');toast('已恢复中性示例','good')}return}if(e.target===modalLayer)closeModal()});
inspectorBody.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)doAction(b)});
$('#mobileNavBtn').addEventListener('click',()=>{state.sidebarOpen=!state.sidebarOpen;state.inspectorOpen=false;syncDrawers()});$('#drawerShade').addEventListener('click',()=>{state.sidebarOpen=false;state.inspectorOpen=false;syncDrawers()});
projectFile.addEventListener('change',()=>{if(projectFile.files&&projectFile.files[0])importProject(projectFile.files[0])});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!modalLayer.hidden)closeModal();else{state.sidebarOpen=false;state.inspectorOpen=false;syncDrawers()}}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();exportProject()}});
state.config=loadInitial();state.build=compilePack();renderNav();renderEditor();refreshChrome();renderInspector();syncDrawers();
window.UIX={version:VERSION,getConfig:()=>clone(state.config),build:()=>clone(getBuild(true)),reset:()=>{state.config=hydrate(EMBED.defaultConfig);state.build=null;renderEditor();refreshChrome();renderInspector()}};
})();
</script>
</body>
</html>

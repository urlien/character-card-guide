<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI 设计风格提示词库 — 73种现代UI设计风格</title>
<style>
:root {
  --bg: #f8fafc;
  --card-bg: #ffffff;
  --text: #1e293b;
  --text-secondary: #64748b;
  --border: #e2e8f0;
  --accent: #6366f1;
  --accent-light: #eef2ff;
  --tag-bg: #f1f5f9;
  --tag-text: #475569;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
  --shadow-hover: 0 4px 20px rgba(0,0,0,.12);
  --modal-bg: rgba(0,0,0,.6);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100dvh;
}
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(248,250,252,.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px;
}
.header-inner {
  max-width: 1200px; margin: 0 auto;
}
.header h1 {
  font-size: 1.5rem; font-weight: 700;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 4px;
}
.header p { color: var(--text-secondary); font-size: .875rem; }

.search-bar {
  display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap;
}
.search-bar input {
  flex: 1; min-width: 200px;
  padding: 10px 16px; border: 1px solid var(--border);
  border-radius: 10px; font-size: .9rem; outline: none;
  background: var(--card-bg); color: var(--text);
}
.search-bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }

.filter-tags {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
}
.filter-tag {
  padding: 5px 12px; border-radius: 20px;
  font-size: .75rem; cursor: pointer; border: 1px solid var(--border);
  background: var(--card-bg); color: var(--text-secondary);
  transition: all .2s; user-select: none;
}
.filter-tag:hover { border-color: var(--accent); color: var(--accent); }
.filter-tag.active {
  background: var(--accent); color: white; border-color: var(--accent);
}

.stats-bar {
  max-width: 1200px; margin: 0 auto; padding: 12px 20px;
  color: var(--text-secondary); font-size: .8rem;
}

.grid {
  max-width: 1200px; margin: 0 auto; padding: 0 20px 40px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}

.card {
  background: var(--card-bg); border-radius: 14px; padding: 20px 22px;
  border: 1px solid var(--border); box-shadow: var(--shadow);
  cursor: pointer; transition: all .25s;
  display: flex; flex-direction: column; gap: 10px;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
  border-color: #c7d2fe;
}
.card-name {
  font-size: 1.05rem; font-weight: 700; color: var(--text);
  display: flex; align-items: center; gap: 8px;
}
.card-name .index { font-size: .7rem; color: var(--accent); font-weight: 500; }
.card-desc {
  font-size: .85rem; color: var(--text-secondary);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden; line-height: 1.55;
}
.card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.card-tags span {
  padding: 3px 9px; border-radius: 6px;
  font-size: .7rem; background: var(--tag-bg); color: var(--tag-text);
  font-weight: 500;
}

/* Detail Modal */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: var(--modal-bg);
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn .2s;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.modal-sheet {
  background: var(--card-bg); border-radius: 16px;
  width: 94%; max-width: 560px; max-height: 92dvh;
  overflow-y: auto; padding: 24px 20px 32px; margin: auto;
  animation: fadeIn .25s ease;
  position: relative;
}
.modal-handle {
  display: none;
}
.modal-close {
  position: absolute; top: 12px; right: 16px;
  width: 32px; height: 32px; border-radius: 50%;
  border: none; background: #f1f5f9; font-size: 1.2rem;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
}
.modal-name {
  font-size: 1.4rem; font-weight: 800; margin-bottom: 6px;
}
.modal-desc {
  font-size: .92rem; color: var(--text-secondary);
  line-height: 1.7; margin-bottom: 18px;
}
.modal-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
.modal-tags span {
  padding: 5px 12px; border-radius: 8px;
  font-size: .78rem; background: var(--accent-light); color: var(--accent);
  font-weight: 600;
}
.modal-section { margin-top: 16px; }
.modal-section h4 {
  font-size: .8rem; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px;
}
.modal-prompt {
  background: #f8fafc; border-radius: 10px; padding: 14px 16px;
  font-size: .82rem; color: var(--text-secondary);
  font-family: "SF Mono", "Fira Code", monospace; line-height: 1.5;
  white-space: pre-wrap; word-break: break-word;
  max-height: 200px; overflow-y: auto;
}
/* Copy button */
.copy-btn {
  margin-top: 8px; padding: 6px 14px; border-radius: 8px;
  border: 1px solid var(--accent); background: transparent;
  color: var(--accent); cursor: pointer; font-size: .78rem;
  font-weight: 600; transition: all .2s;
}
.copy-btn:hover { background: var(--accent); color: white; }
.copy-btn.copied { background: #10b981; border-color: #10b981; color: white; }

/* External link button */
.ext-link {
  margin-top: 8px; margin-left: 8px; padding: 6px 14px; border-radius: 8px;
  border: 1px solid #10b981; background: transparent;
  color: #10b981; cursor: pointer; font-size: .78rem;
  font-weight: 600; transition: all .2s; text-decoration: none;
  display: inline-block;
}
.ext-link:hover { background: #10b981; color: white; }

/* Preview button */
.preview-btn {
  margin-top: 8px; margin-left: 8px; padding: 6px 14px; border-radius: 8px;
  border: 1px solid #f59e0b; background: transparent;
  color: #f59e0b; cursor: pointer; font-size: .78rem;
  font-weight: 600; transition: all .2s;
}
.preview-btn:hover { background: #f59e0b; color: white; }
.preview-btn.active { background: #f59e0b; color: white; }

/* Preview iframe container */
.preview-container {
  margin-top: 16px;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: #fff;
  display: none;
  position: relative;
}
.preview-container.open { display: block; }
.preview-iframe-scaler {
  width: 1200px;
  transform-origin: top left;
  overflow: hidden;
}
.preview-container iframe {
  width: 1200px;
  height: 900px;
  border: none;
  display: block;
}
.preview-loading {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: #f8fafc; font-size: .85rem; color: var(--text-secondary);
  z-index: 1; pointer-events: none;
}
.preview-container.loaded .preview-loading { display: none; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.no-results {
  text-align: center; padding: 60px 20px; color: var(--text-secondary);
  grid-column: 1 / -1;
}
.no-results .icon { font-size: 3rem; margin-bottom: 12px; }

@media (max-width: 480px) {
  .grid { grid-template-columns: 1fr; padding: 0 12px 40px; }
  .card { padding: 16px; }
  .header { padding: 14px 12px; }
  .header h1 { font-size: 1.25rem; }
}
</style>
</head>

<div class="header">
  <div class="header-inner">

    <p>探索 73 种现代 UI 设计风格 · 源自 uiprompt.site</p>

    </div>
  </div>
</div>

// Build category tags from all tags
function buildFilterTags() {
  const count = {};
  STYLES_DATA.forEach(s => {
    s.tags.forEach(t => {
      if (t.match(/^[a-z]/)) return; // skip English tags for filter
      count[t] = (count[t] || 0) + 1;
    });
  });
  // Sort by count descending, take top 20
  const sorted = Object.entries(count).sort((a,b) => b[1]-a[1]).slice(0, 18);
  const html = sorted.map(([tag, cnt]) =>
    `<span class="filter-tag" data-tag="${tag}" onclick="toggleFilter('${tag}', this)">${tag} (${cnt})</span>`
  ).join('');
  document.getElementById('filterTags').innerHTML =
    `<span class="filter-tag active" onclick="clearFilter(this)">全部 (${STYLES_DATA.length})</span>` + html;
}

function toggleFilter(tag, el) {
  document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
  if (activeFilter === tag) {
    activeFilter = null;
    document.querySelector('.filter-tag:first-child').classList.add('active');
  } else {
    activeFilter = tag;
    el.classList.add('active');
  }
  render();
}

function clearFilter(el) {
  activeFilter = null;
  document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}

function render() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  let filtered = STYLES_DATA;

  if (activeFilter) {
    filtered = filtered.filter(s => s.tags.includes(activeFilter));
  }
  if (query) {
    filtered = filtered.filter(s =>
      s.name.toLowerCase().includes(query) ||
      s.desc.toLowerCase().includes(query) ||
      s.tags.some(t => t.toLowerCase().includes(query))
    );
  }

  document.getElementById('statsBar').textContent =
    query || activeFilter
      ? `找到 ${filtered.length} 个风格` + (query ? `（搜索"${query}"）` : '') + (activeFilter ? `（筛选：${activeFilter}）` : '')
      : `显示全部 ${STYLES_DATA.length} 个风格`;

  const grid = document.getElementById('grid');
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="no-results"><div class="icon">🔍</div><p>没有找到匹配的风格</p><p style="font-size:.8rem">试试其他关键词或清除筛选条件</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map((s, i) => `
    <div class="card" onclick="openDetail(${STYLES_DATA.indexOf(s)})">
      <div class="card-name">
        <span class="index">#${STYLES_DATA.indexOf(s)+1}</span>${s.name}
      </div>
      <div class="card-desc">${s.desc}</div>
      <div class="card-tags">
        ${s.tags.map(t => {
          const color = catColors[t] || null;
          const style = color ? `style="background:${color}15;color:${color}"` : '';
          return `<span ${style}>${t}</span>`;
        }).join('')}
      </div>
    </div>
  `).join('');
}

function generatePrompt(style) {
  const name = style.name;
  const desc = style.desc;
  const tags = style.tags.filter(t => !t.match(/^[a-z]/)).join('、');
  return `请设计一个采用「${name}」风格的UI界面。

风格特征：${desc}

关键元素：${tags}

设计要点：
- 整体调性应符合 ${name} 的核心视觉语言
- 使用合适的配色方案、排版和间距
- 注重用户体验和视觉层次
- 可参考该风格的经典设计模式和元素

请生成一个完整的UI界面设计，包含布局说明、色彩方案和关键组件。`;
}

function openDetail(idx) {
  const s = STYLES_DATA[idx];
  selectedStyle = s;
  document.getElementById('modalName').textContent = `#${idx+1} ${s.name}`;
  document.getElementById('modalDesc').textContent = s.desc;
  document.getElementById('modalTags').innerHTML = s.tags.map(t => {
    const color = catColors[t] || null;
    const style = color ? `style="background:${color}15;color:${color}"` : '';
    return `<span ${style}>${t}</span>`;
  }).join('');

  const prompt = generatePrompt(s);
  document.getElementById('modalPrompt').textContent = prompt;
  document.getElementById('copyBtn').textContent = '📋 复制提示词';
  document.getElementById('copyBtn').classList.remove('copied');
  // Update external link
  const extUrl = getPreviewUrl(s.name);
  const extLink = document.getElementById('extLink');
  if (extUrl) {
    extLink.href = extUrl;
    extLink.style.display = 'inline-block';
  } else {
    extLink.style.display = 'none';
  }
  document.getElementById('modal').style.display = 'flex';
  document.body.style.overflow = 'hidden';
  // Scroll modal into view
  document.querySelector('.modal-sheet').scrollIntoView({block:'center'});
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('modal').style.display = 'none';
  document.body.style.overflow = '';
  selectedStyle = null;
  previewOpen = false;
  var pc = document.getElementById('previewContainer');
  var pb = document.getElementById('previewBtn');
  if (pc) { pc.classList.remove('open','loaded'); }
  if (pb) { pb.classList.remove('active'); pb.textContent = '🔍 预览'; }
  var ifr = document.getElementById('previewIframe');
  if (ifr) ifr.src = '';
}

async function copyPrompt() {
  const prompt = document.getElementById('modalPrompt').textContent;
  try {
    await navigator.clipboard.writeText(prompt);
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✅ 已复制！';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📋 复制提示词';
      btn.classList.remove('copied');
    }, 2000);
  } catch {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = prompt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✅ 已复制！';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📋 复制提示词';
      btn.classList.remove('copied');
    }, 2000);
  }
}

const FAMILY_CATEGORY = {
  flatDesign:"core",fluent2:"core",materialDesign:"core",minimalism:"core",
  scrollNarrative:"core",skeuomorphism:"core",typography:"core",
  arcadeCRT:"retro",artDeco:"retro",bauhaus:"retro",darkAcademia:"retro",
  digitalRetro:"retro",filmNoir:"retro",frutigerAero:"retro",midCenturyModern:"retro",
  newspaper:"retro",retroFuturism:"retro",retroOS:"retro",steampunk:"retro",
  swissDesign:"retro",synthwave:"retro",vhsAesthetic:"retro",
  magazine:"layout",mouseTracking:"interaction",
  _default:"visual"
};

function getCategory(fid) {
  return FAMILY_CATEGORY[fid] || FAMILY_CATEGORY._default;
}

function getPreviewUrl(styleName) {
  const fid = FAMILY_ID_MAP[styleName];
  if (!fid) return null;
  const cat = getCategory(fid);
  return `https://www.uiprompt.site/zh/styles/preview/${cat}-${fid}`;
}

function openExternal(e) {
  e.preventDefault();
  const url = getPreviewUrl(selectedStyle?.name);
  if (url) window.open(url, '_blank');
}

let previewOpen = false;

function togglePreview() {
  previewOpen = !previewOpen;
  var pc = document.getElementById('previewContainer');
  var pb = document.getElementById('previewBtn');
  var ifr = document.getElementById('previewIframe');

  if (previewOpen) {
    var url = getPreviewUrl(selectedStyle?.name);
    if (!url) { alert('该风格暂无预览链接'); previewOpen = false; return; }
    pc.classList.add('open');
    pc.classList.remove('loaded');
    pb.classList.add('active');
    pb.textContent = '🔍 收起预览';
    if (ifr.src !== url) ifr.src = url;
    var scaler = document.getElementById('previewScaler');
    var cw = pc.clientWidth;
    var s = Math.min(1, cw / 1200);
    scaler.style.transform = 'scale(' + s + ')';
    pc.style.height = (900 * s) + 'px';
    ifr.onload = function() { pc.classList.add('loaded'); };
  } else {
    pc.classList.remove('open','loaded');
    pb.classList.remove('active');
    pb.textContent = '🔍 预览';
  }
}

// Init
buildFilterTags();
render();
